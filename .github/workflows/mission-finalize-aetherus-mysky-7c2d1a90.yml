name: Aetherus My Sky finalize 7c2d1a90

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify mission source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5687e21259efba11ee5b1577da134da2385f4521'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'

      - name: Connect My Sky controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('prototype/js/space/cosmic3d.js')
          source = path.read_text()
          import_line = "import { installMySkyController } from './my-sky-controller.js';"
          if import_line not in source:
              anchor = "import {\n  solarOrbitDisplayRadius,\n} from './scale-bridge.js';"
              if anchor not in source:
                  raise SystemExit('MY_SKY_IMPORT_ANCHOR_MISSING')
              source = source.replace(anchor, anchor + '\n' + import_line, 1)
          install_line = 'installMySkyController(cosmic3d, { astronomyTargets, ko });'
          if install_line not in source:
              anchor = '\nexport { cosmic3d };\n'
              if anchor not in source:
                  raise SystemExit('MY_SKY_INSTALL_ANCHOR_MISSING')
              source = source.replace(anchor, '\n' + install_line + '\n' + anchor, 1)
          path.write_text(source)
          PY
          rm -f .github/workflows/mission-finalize-aetherus-mysky-7c2d1a90.yml

      - name: Verify Aetherus screen integration
        shell: bash
        run: |
          set -euo pipefail
          node --check prototype/js/space/cosmic3d.js
          node --check prototype/js/space/my-sky-controller.js
          node --check prototype/js/space/sky-journey.js
          node --experimental-default-type=module tools/test_aetherus_coordinate_core.mjs
          node --experimental-default-type=module tools/test_aetherus_v3_public_ui.mjs
          node --experimental-default-type=module tools/test_aetherus_astronomy.mjs
          node --experimental-default-type=module tools/test_aetherus_observation_planner.mjs
          node --experimental-default-type=module tools/test_aetherus_sky_ar.mjs
          node --experimental-default-type=module tools/test_aetherus_foundation.mjs
          git diff --check

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'earthus-aetherus-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '내 하늘 컨트롤러가 실제 Aetherus 화면에 연결되지 않았던 문제를 수정'
          git push origin HEAD:codex/aetherus-coordinate-core-v1
