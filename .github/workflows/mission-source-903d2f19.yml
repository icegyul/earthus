name: Aetherus source supply 903d2f19

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify mission source identity
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='41ca45bb5d5361acc75506ab49a2e29f90506b1f'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          printf '%s\n' "$(git rev-parse HEAD)" > SOURCE_SHA.txt

      - name: Build exact source transports
        shell: bash
        run: |
          set -euo pipefail
          git bundle create earthus-source.bundle HEAD
          git archive --format=tar HEAD | gzip -9 > earthus-source.tar.gz
          sha256sum earthus-source.bundle earthus-source.tar.gz SOURCE_SHA.txt > SHA256SUMS.txt

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: earthus-source-903d2f19
          path: |
            earthus-source.bundle
            earthus-source.tar.gz
            SOURCE_SHA.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
