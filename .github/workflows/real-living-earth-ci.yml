name: EARTHUS V2 Real Living Earth CI

on:
  push:
    branches:
      - earthus-v2/real-living-earth-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            aws/gk2a-clouds/cth_pipeline.py \
            aws/gk2a-clouds/cth_pipeline_lcc.py \
            aws/gk2a-clouds/combined_handler.py \
            aws/gfs-cloud-volume/handler.py

      - name: JavaScript syntax
        run: |
          node --check prototype/v2/js/gk2a-cth-relief.js
          node --check prototype/v2/js/gfs-cloud-volume.js
          node --check prototype/v2/js/ocean-water-surface.js
          node --check prototype/v2/js/real-living-earth.js

      - name: Truth-first V2 bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'new Cesium.EllipsoidTerrainProvider' prototype/v2/index.html
          ! grep -F 'NaturalEarthII' prototype/v2/index.html
          grep -F "./js/real-living-earth.js" prototype/v2/index.html
          grep -F 'Bathymetry / Trench' prototype/v2/index.html
          grep -F 'Underwater' prototype/v2/index.html

      - name: Cloud truth contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OBSERVED_DERIVED_OFFICIAL_L2' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'CTH_flag' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'https://apihub.kma.go.kr/api/typ05/api/GK2A/LE2/CTPS' aws/gk2a-clouds/cth_pipeline.py
          grep -F "KMA_HUB_KEY = os.environ.get('KMA_HUB_KEY'" aws/gk2a-clouds/cth_pipeline.py
          grep -F "'transport': 'KMA_API_HUB'" aws/gk2a-clouds/cth_pipeline.py
          grep -F "'transport': 'NOAA_NODD'" aws/gk2a-clouds/cth_pipeline.py
          grep -F 'MODELLED_NWP' aws/gfs-cloud-volume/handler.py
          grep -F 'GFS pressure-level TCDC' aws/gfs-cloud-volume/handler.py
          grep -F "cloudFidelity='SHELL'" prototype/v2/js/real-living-earth.js
          grep -F "return 'VOLUME'" prototype/v2/js/real-living-earth.js
          grep -F "return 'CTH_RELIEF'" prototype/v2/js/real-living-earth.js
          grep -F "return 'SHELL'" prototype/v2/js/real-living-earth.js
          ! grep -R -nE 'SYNTHETIC_(TERRAIN|TRENCH|BATHYMETRY)' prototype/v2/js aws/gk2a-clouds/cth_pipeline.py aws/gfs-cloud-volume/handler.py

      - name: Visual fidelity cloud contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'PerInstanceColorAppearance' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'MaterialAppearance' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'MaterialSupport.TEXTURED' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'OBSERVED_2D_GMGSI_DRAPED_ON_OBSERVED_CTH' prototype/v2/js/gk2a-cth-relief.js
          grep -F "observedBaseUrl='/clouds'" prototype/v2/js/gk2a-cth-relief.js
          grep -F 'fsInput.voxel.travelDistance' prototype/v2/js/gfs-cloud-volume.js
          grep -F '1.0-exp(-extinction*travel)' prototype/v2/js/gfs-cloud-volume.js
          grep -F "renderModel:'STEP_AWARE_OPTICAL_ALPHA_FROM_GFS_TCDC'" prototype/v2/js/gfs-cloud-volume.js
          grep -F 'this.primitive.stepSize=.72' prototype/v2/js/gfs-cloud-volume.js
          ! grep -Ei 'fbm|proceduralNoise|noise3d|simplex|perlin' prototype/v2/js/gfs-cloud-volume.js

      - name: Physical surface fidelity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "terrainProvider?.hasWaterMask===true" prototype/v2/js/real-living-earth.js
          grep -F 'scene.globe.showWaterEffect=supported' prototype/v2/js/real-living-earth.js
          grep -F 'setObservedShadow(.13,true)' prototype/v2/js/real-living-earth.js
          grep -F 'setObservedShadow(.16,true)' prototype/v2/js/real-living-earth.js
          grep -F 'scene.highDynamicRange=true' prototype/v2/js/real-living-earth.js
          grep -F "import { OceanWaterSurfaceRuntime }" prototype/v2/js/real-living-earth.js
          grep -F "C.Material.fromType('Water'" prototype/v2/js/ocean-water-surface.js
          grep -F 'waterNormalsSmall.jpg' prototype/v2/js/ocean-water-surface.js
          grep -F 'MaterialSupport.ALL.vertexFormat' prototype/v2/js/ocean-water-surface.js
          grep -F 'OCEAN_WATER_RADIUS_GATE' prototype/v2/js/ocean-water-surface.js
          ! grep -F "id:'earthus-v2-zero-meter-ocean-surface'" prototype/v2/js/real-living-earth.js

      - name: Official GK2A EA LCC contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '_PHI1 = np.deg2rad(30.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F '_PHI2 = np.deg2rad(60.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F '_PHI0 = np.deg2rad(38.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F '_LAM0 = np.deg2rad(126.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F "tuple(shape) == (2600, 3000)" aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F -- '-2_999_000.0, 2_999_000.0, 3000' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F -- '2_599_000.0, -2_599_000.0, 2600' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F 'kma-nmsc-ea-lcc-wgs84-official-2km' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F 'from cth_pipeline_lcc import run as run_cth' aws/gk2a-clouds/combined_handler.py

      - name: GFS ecCodes field alias contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'TCC': 'TCDC'" aws/gfs-cloud-volume/handler.py
          grep -F "'GH': 'HGT'" aws/gfs-cloud-volume/handler.py
          grep -F "level_type == 'isobaricInhPa'" aws/gfs-cloud-volume/handler.py
          grep -F "level_type == 'isobaricInPa'" aws/gfs-cloud-volume/handler.py
          grep -F "'aliasContract': {'tcc': 'TCDC', 'gh': 'HGT'}" aws/gfs-cloud-volume/handler.py
          grep -F 'GFS_CLOUD_TOO_FEW_VERTICAL_LEVELS:' aws/gfs-cloud-volume/handler.py

      - name: Deployment helper syntax and AWS CLI v2 payload contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n aws/gk2a-clouds/deploy_cth_into_existing.sh
          bash -n aws/gfs-cloud-volume/deploy.sh
          bash -n tools/deploy-real-living-earth-data.sh
          grep -F -- '--cli-binary-format raw-in-base64-out' aws/gk2a-clouds/deploy_cth_into_existing.sh
          grep -F -- '--cli-binary-format raw-in-base64-out' aws/gfs-cloud-volume/deploy.sh
          grep -F 'KMA_HUB_KEY' aws/gk2a-clouds/deploy_cth_into_existing.sh
          grep -F 'kma-fcst' aws/gk2a-clouds/deploy_cth_into_existing.sh
          grep -F 'cth_pipeline_lcc.py' aws/gk2a-clouds/deploy_cth_into_existing.sh

      - name: GFS Lambda cross-host packaging contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PYTHON_VERSION="${PYTHON_VERSION:-3.12}"' aws/gfs-cloud-volume/deploy.sh
          grep -F 'PYTHON_ABI="cp${PYTHON_VERSION/./}"' aws/gfs-cloud-volume/deploy.sh
          grep -F -- '--abi "$PYTHON_ABI"' aws/gfs-cloud-volume/deploy.sh
          grep -F -- '--ignore-requires-python' aws/gfs-cloud-volume/deploy.sh
          grep -F -- '--platform manylinux_2_28_x86_64' aws/gfs-cloud-volume/deploy.sh
          grep -Fx 'numpy==2.5.2' aws/gfs-cloud-volume/requirements.txt
          grep -Fx 'eccodes==2.48.0' aws/gfs-cloud-volume/requirements.txt

      - name: Isolated V2 deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/deploy-real-living-earth-v2.sh
          grep -F 'V2="$ROOT/prototype/v2"' tools/deploy-real-living-earth-v2.sh
          grep -F 's3://$BUCKET/$PREFIX/v2/' tools/deploy-real-living-earth-v2.sh
          grep -F 'EARTHUS_V2_ENTRY_REDIRECT' tools/deploy-real-living-earth-v2.sh
          grep -F -- '--key "$PREFIX/v2/"' tools/deploy-real-living-earth-v2.sh || grep -F '"$PREFIX/v2/"' tools/deploy-real-living-earth-v2.sh
          grep -F "E193CZEBLWEB56" tools/deploy-real-living-earth-v2.sh
          grep -F -- "--paths '/v2' '/v2/' '/v2/index.html' '/v2/*'" tools/deploy-real-living-earth-v2.sh
          grep -F 'PASS public truth manifests' tools/deploy-real-living-earth-v2.sh
          grep -F 'EARTHUS V2 NETWORK ENTRY + STATIC + PUBLIC DATA: READY FOR BROWSER RENDER ACCEPTANCE' tools/deploy-real-living-earth-v2.sh
          ! grep -F 'cloudfront wait invalidation-completed' tools/deploy-real-living-earth-v2.sh
          ! grep -F 's3://$BUCKET/$PREFIX/js/' tools/deploy-real-living-earth-v2.sh
          ! grep -E '^[[:space:]]*--delete([[:space:]]|$)' tools/deploy-real-living-earth-v2.sh

      - name: No second viewer in new runtime
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'new[[:space:]]+(Cesium\.)?Viewer\(' prototype/v2/js
