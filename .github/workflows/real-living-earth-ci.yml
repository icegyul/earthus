name: EARTHUS V2 Real Living Earth CI

on:
  push:
    branches:
      - earthus-v2/real-living-earth-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            aws/gk2a-clouds/cth_pipeline.py \
            aws/gk2a-clouds/cth_pipeline_lcc.py \
            aws/gk2a-clouds/combined_handler.py \
            aws/gfs-cloud-volume/handler.py

      - name: JavaScript syntax
        run: |
          node --check prototype/js/sky-panorama.js
          node --check prototype/v2/js/gk2a-cth-relief.js
          node --check prototype/v2/js/gfs-cloud-volume.js
          node --check prototype/v2/js/polar-geographic-cap.js
          node --check prototype/v2/js/trench-bathymetry-mesh.js
          node --check prototype/v2/js/real-living-earth.js
          node --check tools/test_v2_real_living_earth_visual_readpixels.mjs

      - name: Truth-first V2 bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'new Cesium.EllipsoidTerrainProvider' prototype/v2/index.html
          ! grep -F 'NaturalEarthII' prototype/v2/index.html
          grep -F './js/real-living-earth.js' prototype/v2/index.html
          grep -F 'Bathymetry / Trench' prototype/v2/index.html
          grep -F 'Underwater' prototype/v2/index.html
          ! grep -R -nE 'new[[:space:]]+(Cesium\.)?Viewer\(' prototype/v2/js

      - name: Cloud data truth contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OBSERVED_DERIVED_OFFICIAL_L2' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'CTH_flag' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'https://apihub.kma.go.kr/api/typ05/api/GK2A/LE2/CTPS' aws/gk2a-clouds/cth_pipeline.py
          grep -F "KMA_HUB_KEY = os.environ.get('KMA_HUB_KEY'" aws/gk2a-clouds/cth_pipeline.py
          grep -F 'MODELLED_NWP' aws/gfs-cloud-volume/handler.py
          grep -F 'GFS pressure-level TCDC' aws/gfs-cloud-volume/handler.py
          ! grep -R -nE 'SYNTHETIC_(TERRAIN|TRENCH|BATHYMETRY)' prototype/v2/js aws/gk2a-clouds/cth_pipeline.py aws/gfs-cloud-volume/handler.py

      - name: Continuous actual CTH mesh visual contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OBSERVED_GMGSI_ALPHA_MASKED_BY_VALID_GK2A_CTH_ON_CONTINUOUS_SUPPORT_MESH' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'ACTUAL_CTH_VERTICES_WITH_TRANSPARENT_NEIGHBOUR_SUPPORT_NO_VERTICAL_EXAGGERATION' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'function validMask' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'function supportHeights' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'actualCthVertexCount:support.sourceValidCount' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'validMaskRadiusPx' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'primitiveType:C.PrimitiveType.TRIANGLES' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'transparent:true' prototype/v2/js/gk2a-cth-relief.js
          ! grep -F 'SOURCE_CTH_ALTITUDE_BANDS' prototype/v2/js/gk2a-cth-relief.js
          ! grep -Ei 'fbm|proceduralNoise|noise3d|simplex|perlin' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'fsInput.voxel.travelDistance' prototype/v2/js/gfs-cloud-volume.js
          grep -F '1.0-exp(-extinction*travel)' prototype/v2/js/gfs-cloud-volume.js
          grep -F 'GFS_VOLUME_DEVICE_POLICY' prototype/v2/js/gfs-cloud-volume.js
          grep -F 'SwiftShader' prototype/v2/js/gfs-cloud-volume.js
          grep -F 'cloudDiagnostics:()=>Object.freeze' prototype/v2/js/real-living-earth.js

      - name: Surface and bathymetry provider separation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "LAND_TERRAIN_URL='https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'" prototype/v2/js/real-living-earth.js
          grep -F "TOPO_BATHY_URL='https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/TopoBathy3D/ImageServer'" prototype/v2/js/real-living-earth.js
          grep -F 'surfaceTerrainProvider=null,bathyTerrainProvider=null' prototype/v2/js/real-living-earth.js
          grep -F "function useSurfaceTerrain(){if(surfaceTerrainProvider)return setTerrain(surfaceTerrainProvider,'ESRI_TERRAIN3D')" prototype/v2/js/real-living-earth.js
          grep -F "function useBathymetryTerrain(){return bathyTerrainProvider?setTerrain(bathyTerrainProvider,'ESRI_TOPOBATHY3D'):false}" prototype/v2/js/real-living-earth.js
          grep -F 'Promise.allSettled([surfacePromise,bathyPromise])' prototype/v2/js/real-living-earth.js
          grep -F 'if(!bathyTerrainProvider)return null' prototype/v2/js/real-living-earth.js
          grep -F 'useBathymetryTerrain()' prototype/v2/js/real-living-earth.js
          grep -F 'useSurfaceTerrain();activeMode=' prototype/v2/js/real-living-earth.js
          grep -F 'terrainProvider?.hasWaterMask===true' prototype/v2/js/real-living-earth.js
          grep -F 'scene.globe.showWaterEffect=supported' prototype/v2/js/real-living-earth.js

      - name: Polar stereographic UV and seam contract
        shell: bash
        run: |
          set -euo pipefail
          ! test -e prototype/v2/js/polar-imagery-cap.js
          grep -F "endpoint:'https://gibs.earthdata.nasa.gov/wms/epsg3413/best/wms.cgi'" prototype/v2/js/polar-geographic-cap.js
          grep -F "endpoint:'https://gibs.earthdata.nasa.gov/wms/epsg3031/best/wms.cgi'" prototype/v2/js/polar-geographic-cap.js
          grep -F "id:'EPSG:3413'" prototype/v2/js/polar-geographic-cap.js
          grep -F "id:'EPSG:3031'" prototype/v2/js/polar-geographic-cap.js
          grep -F 'latTs:70,lon0:-45' prototype/v2/js/polar-geographic-cap.js
          grep -F 'latTs:-71,lon0:0' prototype/v2/js/polar-geographic-cap.js
          grep -F 'function project(config,lonDeg,latDeg)' prototype/v2/js/polar-geographic-cap.js
          grep -F 'function featherTexture' prototype/v2/js/polar-geographic-cap.js
          grep -F "seamClass:'RADIAL_ALPHA_FEATHER'" prototype/v2/js/polar-geographic-cap.js
          grep -F 'GEODETIC_MESH_WITH_POLAR_STEREOGRAPHIC_UV' prototype/v2/js/polar-geographic-cap.js
          grep -F 'NASA_GIBS_POLAR_STEREOGRAPHIC_HOLE_FILL_IMAGERY_ONLY' prototype/v2/js/polar-geographic-cap.js
          grep -F 'primitiveType:C.PrimitiveType.TRIANGLES' prototype/v2/js/polar-geographic-cap.js
          ! grep -F 'C.CircleGeometry' prototype/v2/js/polar-geographic-cap.js
          ! grep -F 'new C.RectangleGeometry' prototype/v2/js/polar-geographic-cap.js
          grep -F "new Set(['EPSG:3413','EPSG:3031'])" tools/test_v2_real_living_earth_visual_readpixels.mjs
          grep -F 'gl.readPixels' tools/test_v2_real_living_earth_visual_readpixels.mjs

      - name: Sampled trench mesh visual fidelity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "import { TrenchBathymetryMeshRuntime } from './trench-bathymetry-mesh.js'" prototype/v2/js/real-living-earth.js
          grep -F 'ESRI_TOPOBATHY3D_SAMPLED_SEAFLOOR_MESH' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F "sourceId:'ESRI_WORLDELEVATION3D_TOPOBATHY3D'" prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'synthetic:false' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'verticalExaggeration:1' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F "colorModel:'ACTUAL_DEPTH_RAMP_PLUS_ACTUAL_SLOPE_HILLSHADE_GEOMETRY_UNCHANGED'" prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'function bathyTexture' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'meanSlopeDeg' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'maxSlopeDeg' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'lonSpan=3.0,latSpan=2.4,nx=55,ny=45' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'sampleTerrain(terrainProvider,samplingLevel,points)' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'sampleTerrainMostDetailed' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'new C.MaterialAppearance' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'function prepareTrenchReveal' prototype/v2/js/real-living-earth.js
          grep -F 'async function ensureTrenchMesh' prototype/v2/js/real-living-earth.js
          grep -F 'g.depthTestAgainstTerrain=false' prototype/v2/js/real-living-earth.js
          grep -F 'trenchMeshTruth:()=>trenchMeshMeta' prototype/v2/js/real-living-earth.js
          grep -F "truthClass==='ESRI_TOPOBATHY3D_SAMPLED_SEAFLOOR_MESH'" tools/test_v2_real_living_earth_visual_readpixels.mjs
          grep -F "states.trench.trenchMesh?.truthClass,'ESRI_TOPOBATHY3D_SAMPLED_SEAFLOOR_MESH'" tools/test_v2_real_living_earth_visual_readpixels.mjs

      - name: Underwater restoration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'function restoreTrenchReveal' prototype/v2/js/real-living-earth.js
          grep -F 'function restoreUnderwater' prototype/v2/js/real-living-earth.js
          grep -F 'function prepareUnderwater' prototype/v2/js/real-living-earth.js
          grep -F 't.enabled=true' prototype/v2/js/real-living-earth.js
          grep -F 't.frontFaceAlpha=1' prototype/v2/js/real-living-earth.js
          grep -F 't.backFaceAlpha=1' prototype/v2/js/real-living-earth.js
          grep -F 'g.backFaceCulling=false' prototype/v2/js/real-living-earth.js
          grep -F 'globalThis.__earthusSkyPanorama?.hide?.()' prototype/v2/js/real-living-earth.js
          grep -F 'trenchMesh?.setVisible(true)' prototype/v2/js/real-living-earth.js
          grep -F 'trenchMesh?.hide()' prototype/v2/js/real-living-earth.js

      - name: Official GK2A EA LCC contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '_PHI1 = np.deg2rad(30.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F '_PHI2 = np.deg2rad(60.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F '_PHI0 = np.deg2rad(38.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F '_LAM0 = np.deg2rad(126.0)' aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F "tuple(shape) == (2600, 3000)" aws/gk2a-clouds/cth_pipeline_lcc.py
          grep -F 'kma-nmsc-ea-lcc-wgs84-official-2km' aws/gk2a-clouds/cth_pipeline_lcc.py

      - name: GFS decode and Lambda packaging contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'TCC': 'TCDC'" aws/gfs-cloud-volume/handler.py
          grep -F "'GH': 'HGT'" aws/gfs-cloud-volume/handler.py
          grep -F "level_type == 'isobaricInhPa'" aws/gfs-cloud-volume/handler.py
          bash -n aws/gk2a-clouds/deploy_cth_into_existing.sh
          bash -n aws/gfs-cloud-volume/deploy.sh
          bash -n tools/deploy-real-living-earth-data.sh
          grep -F -- '--cli-binary-format raw-in-base64-out' aws/gk2a-clouds/deploy_cth_into_existing.sh
          grep -F -- '--cli-binary-format raw-in-base64-out' aws/gfs-cloud-volume/deploy.sh
          grep -F -- '--ignore-requires-python' aws/gfs-cloud-volume/deploy.sh
          grep -Fx 'numpy==2.5.2' aws/gfs-cloud-volume/requirements.txt
          grep -Fx 'eccodes==2.48.0' aws/gfs-cloud-volume/requirements.txt

      - name: Isolated V2 deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/deploy-real-living-earth-v2.sh
          grep -F 'V2="$ROOT/prototype/v2"' tools/deploy-real-living-earth-v2.sh
          grep -F 's3://$BUCKET/$PREFIX/v2/' tools/deploy-real-living-earth-v2.sh
          grep -F 'EARTHUS_V2_ENTRY_REDIRECT' tools/deploy-real-living-earth-v2.sh
          grep -F 'E193CZEBLWEB56' tools/deploy-real-living-earth-v2.sh
          grep -F 'PASS public truth manifests' tools/deploy-real-living-earth-v2.sh
          ! grep -F 'cloudfront wait invalidation-completed' tools/deploy-real-living-earth-v2.sh
          ! grep -F 's3://$BUCKET/$PREFIX/js/' tools/deploy-real-living-earth-v2.sh
          ! grep -E '^[[:space:]]*--delete([[:space:]]|$)' tools/deploy-real-living-earth-v2.sh
