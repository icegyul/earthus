name: EARTHUS V2 Real Living Earth CI

on:
  push:
    branches:
      - earthus-v2/real-living-earth-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            aws/gk2a-clouds/cth_pipeline.py \
            aws/gk2a-clouds/cth_pipeline_lcc.py \
            aws/gk2a-clouds/combined_handler.py \
            aws/gfs-cloud-volume/handler.py

      - name: JavaScript syntax
        run: |
          node --check prototype/js/sky-panorama.js
          node --check prototype/v2/js/gk2a-cth-relief.js
          node --check prototype/v2/js/gfs-cloud-volume.js
          node --check prototype/v2/js/polar-geographic-cap.js
          node --check prototype/v2/js/trench-bathymetry-mesh.js
          node --check prototype/v2/js/visual-fidelity-controller.js
          node --check prototype/v2/js/loading-ui.js
          node --check prototype/v2/js/real-living-earth.js
          node --check tools/test_v2_real_living_earth_visual_readpixels.mjs
          node --check tools/test_v2_mountain_terrain_browser.mjs
          node --check tools/test_v2_trench_mesh_browser.mjs
          node --check tools/test_v2_underwater_terrain_browser.mjs

      - name: Single-viewer truth-first bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'new Cesium.EllipsoidTerrainProvider' prototype/v2/index.html
          ! grep -F 'NaturalEarthII' prototype/v2/index.html
          ! grep -R -nE 'new[[:space:]]+(Cesium\.)?Viewer\(' prototype/v2/js
          grep -F './js/real-living-earth.js' prototype/v2/index.html
          grep -F 'Bathymetry / Trench' prototype/v2/index.html
          grep -F 'Underwater' prototype/v2/index.html

      - name: Cloud data and render truth
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OBSERVED_DERIVED_OFFICIAL_L2' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'CTH_flag' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'KMA_GK2A_AMI_L2_CTPS_CTH_API_HUB' aws/gk2a-clouds/cth_pipeline.py
          grep -F 'MODELLED_NWP' aws/gfs-cloud-volume/handler.py
          grep -F 'NOAA_NCEP_GFS_0P50_NOMADS' aws/gfs-cloud-volume/handler.py
          grep -F 'ACTUAL_CTH_VERTICES_WITH_TRANSPARENT_NEIGHBOUR_SUPPORT_NO_VERTICAL_EXAGGERATION' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'actualCthVertexCount:support.sourceValidCount' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'primitiveType:C.PrimitiveType.TRIANGLES' prototype/v2/js/gk2a-cth-relief.js
          grep -F 'fsInput.voxel.travelDistance' prototype/v2/js/gfs-cloud-volume.js
          grep -F '1.0-exp(-extinction*travel)' prototype/v2/js/gfs-cloud-volume.js
          grep -F 'GFS_VOLUME_DEVICE_POLICY' prototype/v2/js/gfs-cloud-volume.js
          ! grep -R -nE 'SYNTHETIC_(TERRAIN|TRENCH|BATHYMETRY)' prototype/v2/js aws/gk2a-clouds/cth_pipeline.py aws/gfs-cloud-volume/handler.py
          ! grep -Ei 'fbm|proceduralNoise|noise3d|simplex|perlin' prototype/v2/js/gk2a-cth-relief.js prototype/v2/js/gfs-cloud-volume.js

      - name: Surface and bathymetry separation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WorldElevation3D/Terrain3D/ImageServer" prototype/v2/js/real-living-earth.js
          grep -F "WorldElevation3D/TopoBathy3D/ImageServer" prototype/v2/js/real-living-earth.js
          grep -F "function useSurfaceTerrain()" prototype/v2/js/real-living-earth.js
          grep -F "function useBathymetryTerrain()" prototype/v2/js/real-living-earth.js
          grep -F 'Promise.allSettled([surfacePromise,bathyPromise])' prototype/v2/js/real-living-earth.js
          grep -F 'terrainProvider?.hasWaterMask===true' prototype/v2/js/real-living-earth.js
          grep -F 'scene.globe.showWaterEffect=supported' prototype/v2/js/real-living-earth.js

      - name: Polar real-imagery seam contract
        shell: bash
        run: |
          set -euo pipefail
          ! test -e prototype/v2/js/polar-imagery-cap.js
          grep -F 'wms/epsg3413/best/wms.cgi' prototype/v2/js/polar-geographic-cap.js
          grep -F 'wms/epsg3031/best/wms.cgi' prototype/v2/js/polar-geographic-cap.js
          grep -F "id:'EPSG:3413'" prototype/v2/js/polar-geographic-cap.js
          grep -F "id:'EPSG:3031'" prototype/v2/js/polar-geographic-cap.js
          grep -F 'function project(config,lonDeg,latDeg)' prototype/v2/js/polar-geographic-cap.js
          grep -F 'function repairCenterNoData(image)' prototype/v2/js/polar-geographic-cap.js
          grep -F 'SOURCE_ANNULUS_INTERPOLATION_ONLY_IF_NODATA' prototype/v2/js/polar-geographic-cap.js
          grep -F 'GEODETIC_MESH_WITH_POLAR_STEREOGRAPHIC_UV' prototype/v2/js/polar-geographic-cap.js
          grep -F "seamClass:'RADIAL_ALPHA_FEATHER'" prototype/v2/js/polar-geographic-cap.js
          ! grep -F 'C.CircleGeometry' prototype/v2/js/polar-geographic-cap.js

      - name: Refined actual trench contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'ESRI_TOPOBATHY3D_SAMPLED_SEAFLOOR_MESH' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F "sourceId:'ESRI_WORLDELEVATION3D_TOPOBATHY3D'" prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'synthetic:false' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'verticalExaggeration:1' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'nx=81,ny=65,samplingLevel=11' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F "role='overview'" prototype/v2/js/trench-bathymetry-mesh.js
          grep -F "role==='underwater-detail'" prototype/v2/js/trench-bathymetry-mesh.js
          grep -F '__earthusV2UnderwaterBathymetryPrimitive' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'SOURCE_LUMINANCE_AND_SATURATION_GRADE_ONLY' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'NASA_GIBS_REFERENCE_BATHYMETRY_DRAPED_ON_ACTUAL_SAMPLED_GEOMETRY' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'GeometryPipeline.computeNormal' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'flat:false' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'cull:false' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'deepestCoordinate' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'sampleTerrain(terrainProvider,samplingLevel,points)' prototype/v2/js/trench-bathymetry-mesh.js
          grep -F 'sampleTerrainMostDetailed' prototype/v2/js/trench-bathymetry-mesh.js

      - name: Camera-aware visual fidelity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "new URL('./js/visual-fidelity-controller.js', location.href)" prototype/v2/js/loading-ui.js
          grep -F 'installWhenReady({ timeoutMs: 45000 })' prototype/v2/js/loading-ui.js
          grep -F "import { TrenchBathymetryMeshRuntime }" prototype/v2/js/visual-fidelity-controller.js
          grep -F 'function shellAlpha' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'function shadowAlpha' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'maximumScreenSpaceError=1.25' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'function aimAtTrench' prototype/v2/js/visual-fidelity-controller.js
          grep -F '78_000' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'function aimAtActualDeepest' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'function ensureUnderwaterDetail' prototype/v2/js/visual-fidelity-controller.js
          grep -F "role:'underwater-detail'" prototype/v2/js/visual-fidelity-controller.js
          grep -F 'lonSpan:1.25,latSpan:1.0,nx:97,ny:79,samplingLevel:12' prototype/v2/js/visual-fidelity-controller.js
          grep -F '__earthusV2UnderwaterDetailMeta' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'scene.globe.show=false' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'detailPrimitive.show=true' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'trenchPrimitive.show=false' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'applyUnderwaterLight' prototype/v2/js/visual-fidelity-controller.js
          grep -F 'new C.DirectionalLight' prototype/v2/js/visual-fidelity-controller.js

      - name: Browser evidence contracts are strict
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'gl.readPixels' tools/test_v2_real_living_earth_visual_readpixels.mjs
          grep -F "SOURCE_LUMINANCE_AND_SATURATION_GRADE_ONLY" tools/test_v2_real_living_earth_visual_readpixels.mjs
          grep -F 'grid?.nx>=81' tools/test_v2_real_living_earth_visual_readpixels.mjs
          grep -F 'triangleCount>9000' tools/test_v2_real_living_earth_visual_readpixels.mjs
          grep -F 'maximumScreenSpaceError' tools/test_v2_mountain_terrain_browser.mjs
          grep -F 'visualReady' tools/test_v2_mountain_terrain_browser.mjs
          grep -F 'visuallyStable' tools/test_v2_mountain_terrain_browser.mjs
          ! grep -F 'assert.equal(state.runtime.tilesLoaded,true' tools/test_v2_mountain_terrain_browser.mjs
          grep -F 'underwaterDetail?.grid?.nx>=97' tools/test_v2_underwater_terrain_browser.mjs
          grep -F 'underwaterDetail?.grid?.ny>=79' tools/test_v2_underwater_terrain_browser.mjs
          grep -F 'underwaterDetail?.spacing?.eastWestM<1800' tools/test_v2_underwater_terrain_browser.mjs
          grep -F 'underwaterDetail?.triangleCount>14000' tools/test_v2_underwater_terrain_browser.mjs
          grep -F 'localEdgeMean' tools/test_v2_underwater_terrain_browser.mjs

      - name: Lambda packaging and deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n aws/gk2a-clouds/deploy_cth_into_existing.sh
          bash -n aws/gfs-cloud-volume/deploy.sh
          bash -n tools/deploy-real-living-earth-data.sh
          bash -n tools/deploy-real-living-earth-v2.sh
          grep -F -- '--cli-binary-format raw-in-base64-out' aws/gk2a-clouds/deploy_cth_into_existing.sh
          grep -F -- '--cli-binary-format raw-in-base64-out' aws/gfs-cloud-volume/deploy.sh
          grep -F -- '--ignore-requires-python' aws/gfs-cloud-volume/deploy.sh
          grep -F 'V2="$ROOT/prototype/v2"' tools/deploy-real-living-earth-v2.sh
          grep -F 's3://$BUCKET/$PREFIX/v2/' tools/deploy-real-living-earth-v2.sh
          grep -F 'E193CZEBLWEB56' tools/deploy-real-living-earth-v2.sh
          ! grep -F 's3://$BUCKET/$PREFIX/js/' tools/deploy-real-living-earth-v2.sh
          ! grep -E '^[[:space:]]*--delete([[:space:]]|$)' tools/deploy-real-living-earth-v2.sh
