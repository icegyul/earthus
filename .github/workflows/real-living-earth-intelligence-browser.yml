name: EARTHUS V2 Intelligence Runtime Browser

on:
  push:
    branches:
      - earthus-v2/real-living-earth-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check prototype/js/earthus2/v04/core/planet-intelligence-orchestrator.js
          node --check prototype/js/earthus2/v04/core/device-network-governor.js
          node --check prototype/v2/js/progressive-planet-intelligence.js
          node --check prototype/v2/js/intelligence-runtime-bootstrap.js
          node --check tools/test_v2_intelligence_runtime_browser.mjs
          node --check tools/test_v2_canonical_imagery_ownership.mjs
          node --check tools/earthus-v52/materialized-earth-browser.mjs
          node --check tools/earthus-v52/mobile-acceptance.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify FND-017 live runtime
        env:
          EARTHUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
          EARTHUS_V2_INTELLIGENCE_OUTPUT: ${{ github.workspace }}/output/v2-intelligence-runtime
        run: |
          if ! node tools/test_v2_intelligence_runtime_browser.mjs; then
            echo "::warning::Intelligence browser bootstrap failed once; retrying once for transient external browser resources"
            node tools/test_v2_intelligence_runtime_browser.mjs
          fi
      - name: Verify canonical provider ownership
        if: ${{ !cancelled() }}
        env:
          EARTHUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node tools/test_v2_canonical_imagery_ownership.mjs
      - name: Verify Materialized Earth first load
        if: ${{ !cancelled() }}
        env:
          EARTHUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          if ! node tools/earthus-v52/materialized-earth-browser.mjs; then
            echo "::warning::Materialized Earth browser check failed once; retrying once for transient external browser resources"
            node tools/earthus-v52/materialized-earth-browser.mjs
          fi
      - name: Verify mobile touch and Materialized Earth acceptance
        if: ${{ !cancelled() }}
        env:
          EARTHUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
          EARTHUS_V52_MOBILE_SCREENSHOT: ${{ github.workspace }}/output/v2-intelligence-runtime/mobile-390x844.png
        run: node tools/earthus-v52/mobile-acceptance.mjs
      - name: Upload intelligence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-intelligence-runtime-${{ github.sha }}
          path: output/v2-intelligence-runtime
          if-no-files-found: error
          retention-days: 7
