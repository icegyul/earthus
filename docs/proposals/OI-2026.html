<style>
@page { size: A4; margin: 18mm 16mm 16mm; }
:root{ --ink:#12161c; --mut:#5b6472; --line:#dfe4ea; --key:#0f5f8f; --warn:#a8500f; }
*{ box-sizing:border-box }
body{ margin:0; padding:0 4pt;

h3{ font-size:11.4pt; font-weight:700; color:var(--key);
    margin:17pt 0 6pt; page-break-after:avoid; }
h4{ font-size:10.4pt; font-weight:700; margin:12pt 0 4pt; page-break-after:avoid }
p{ margin:0 0 7pt; }
strong{ font-weight:650 }
em{ color:var(--mut); font-style:normal; font-size:9.4pt }

/* ⚠️ markdown 의 --- 와 h2 윗선이 겹쳐 두 줄로 보였다 */
hr:has(+ h2){ display:none }
.head + hr{ display:none }
h2:first-of-type{ border-top:0; padding-top:0 }
ul,ol{ margin:0 0 8pt; padding-left:16pt }
li{ margin-bottom:4pt }
table{ border-collapse:collapse; width:100%; margin:6pt 0 12pt;
       font-size:9.4pt; page-break-inside:avoid }
th{ text-align:left; font-weight:650; background:#f2f5f8;
    border-bottom:1.4pt solid var(--ink); padding:5pt 8pt; }
td{ border-bottom:1px solid var(--line); padding:5pt 8pt; vertical-align:top }

a{ color:var(--key); text-decoration:none }
blockquote{ margin:10pt 0; padding:8pt 12pt; background:#f2f5f8;
            border-left:3pt solid var(--key); font-weight:600; }

/* ⚠️ 로 시작하는 문단 — 이 제안서의 태도가 여기 있다 */
p.warn{ background:#fdf6ee; border-left:2.5pt solid var(--warn);
        padding:6pt 9pt; margin:8pt 0 10pt; }
/* 화면캡처 — 실제 서비스에서 찍은 것이다. 설명(이탤릭)이 바로 밑에 붙는다. */
img{ display:block; width:100%; height:auto; margin:10pt 0 3pt;
     border:1px solid var(--line); border-radius:3pt; page-break-inside:avoid }
img + em, p > img + em{ display:block }
p:has(img){ page-break-inside:avoid; margin-bottom:4pt }
p:has(img) + p em{ font-size:8.8pt; line-height:1.55; color:var(--mut) }
.head{ border-bottom:2.4pt solid var(--ink); padding-bottom:10pt; margin-bottom:6pt }
.sub{ color:var(--mut); font-size:9.6pt; line-height:1.6 }
</style>

<script>
const MD = "# earthus 협업제안서\n\n**서울창조경제혁신센터 오픈 이노베이션 2026**\n지원분야 — SK텔레콤 · LS ELECTRIC · 두산에너빌리티\n\n달루어 (earthus.net) · 2026년 8월\n\n---\n\n## 한 줄\n\n**2026년 8월 4일 정식 오픈**했습니다.\n\n**한국 · 일본 · 영국 · 미국** 네 나라 기상청을 포함한 18개 기관의 자료를 매시간 모아,\n**3D 지구본 위에 얹고 차트로 풀어** 보여줍니다.\n\n그리고 남들이 안 하는 일을 하나 더 하고 있습니다 —\n**예보가 실제로 맞았는지를 시간 단위로 박제하고 있습니다.**\n\n![태풍 DOLPHIN — 천리안2A 전면 위성영상 위에 기관 예상경로를 겹쳐 놓은 실제 화면](img/globe-cyclone.png)\n*earthus.net 실제 화면 · 2026-08-06 · 천리안2A 적외 영상 위에 태풍 DOLPHIN·KUJIRA와 예상경로*\n\n---\n\n## 1. 가진 것\n\n숫자는 전부 2026년 8월 6일 실측입니다.\n\n| 항목 | 값 |\n|---|---|\n| 정식 오픈 | **2026년 8월 4일** · [earthus.net](https://earthus.net) 운영 중 |\n| 자료 수집 파이프라인 | **54개** (AWS Lambda, 자동 실행) |\n| 자료 출처 | **18개 기관·체계 · 4개국** |\n| 지구본 표현 | **58개 레이어 · 7가지 표현 방식** |\n| 누적 자료 | 184 MB / 3,098 파일 · 하루 10.2 MB 축적 |\n\n### 나라별 수집 현황\n\n| 나라 | 수집기 | 무엇을 받는가 |\n|---|---|---|\n| **한국** | 15개 | 기상청 ASOS·AWS·동네예보·특보·낙뢰·해양·고층, 해양수산부 조위, 산림청 산불 |\n| **일본** | 3개 | 일본 기상청 AMeDAS 실황, 기상경보, 지명 |\n| **영국** | 1개 | 영국 기상청(Met Office) DataHub 지점예보 48시간 |\n| **미국** | 7개 | NOAA(구름합성·부이·우주기상·METAR·쓰나미), NASA(위성타일·화재), USGS 지진 |\n| 국제 | 나머지 | ECMWF, Copernicus CAMS, GDACS, GDELT, Celestrak, Open-Meteo |\n\n⚠️ **영국 자료는 지금 수집만 하고 화면에 올리지 않았습니다.**\nMet Office 무료 플랜의 재배포 조항을 아직 확정하지 못했습니다.\n확인이 끝나기 전에는 쓰지 않는 것이 저희 규칙입니다. 문의는 보내 둔 상태입니다.\n\n---\n\n## 2. 우리가 할 수 있는 것 — \"보여준다\"가 무슨 뜻인가\n\n이 제안의 핵심입니다. 저희가 파는 것은 자료가 아니라 **자료를 보이게 만드는 방법**입니다.\n\n### 2-1. 지구본 위에 얹는 7가지 방식 (58개 레이어가 이미 이걸 씁니다)\n\n| 방식 | 개수 | 무엇을 그리나 | 지금 쓰는 예 |\n|---|---|---|---|\n| 격자(grid) | 19 | 값을 색으로 칠한 면 | 기온, 풍속, 파고, 대기질, 기압 |\n| 위성영상(imagery) | 13 | 영상을 지구 표면에 입힘 | 천리안2A, 히마와리, 수오미, NOAA 합성 |\n| 지점(point) | 12 | 관측소를 점으로 | ASOS, AMeDAS, 부이, 조위 |\n| 사건(event) | 8 | 일어난 일을 표시 | 지진, 산불, 낙뢰, 재난경보 |\n| 경로(line) | 3 | 움직인 자취 | 태풍 진로, 철새, 바다거북 |\n| 바람(wind) | 1 | 입자 애니메이션 | 전지구 바람 흐름 |\n| 관측범위(coverage) | 2 | 어디까지 봤나 | 위성 관측 영역 |\n\n**즉 위경도와 시각만 있으면 무엇이든 지구 위에 올릴 수 있습니다.**\n새 자료를 붙이는 일은 새로 만드는 일이 아니라 **이미 있는 틀에 꽂는 일**입니다.\n\n![천리안2A 전면 적외 영상](img/globe-gk2a.png)\n*위성영상 — 천리안2A 적외 11.2µm, 70~190°E / −60~60°N. 밤에도 구름이 보입니다*\n\n![파고 격자](img/globe-wave.png)\n*격자 — 파고. 태풍 주변에서 파고가 올라가고 너울이 퍼져 나가는 모습이 그대로 보입니다*\n\n![지진·산불·쓰나미](img/globe-hazard.png)\n*사건 — 산불(주황 점)·지진·쓰나미 정보를 한 화면에. 오늘 시베리아 산불이 잡혀 있습니다*\n\n### 2-2. 차트와 분석 화면\n\n지구본만으로는 부족한 것이 있어 별도 화면 세 개를 이미 운영합니다.\n\n- **`/verify`** — 예보와 실측을 겹쳐 그려 **어느 모델이 언제 틀렸는지** 보여줌\n- **`/research`** — 지점·기간·변수를 골라 시계열과 분포를 뽑는 분석 화면\n- **`/station`** — 관측소 하나를 깊게 파는 화면\n\n![예보 검증 화면](img/page-verify.png)\n*`/verify` — GFS와 ECMWF가 24시간 전에 내놓은 값을 기상청 ASOS 97지점 관측과 대조.\n⚠️ 화면의 집계는 현재 1일치입니다 (2026-08-06). 원본 아카이브는 7월 26일부터 쌓고 있습니다*\n\n![분석 화면](img/page-research.png)\n*`/research` — 지점·기간·변수를 골라 시계열과 분포를 뽑는 화면*\n\n![관측소 화면](img/page-station.png)\n*`/station` — 관측소 한 곳을 깊게 보는 화면*\n\n### 2-3. 시간을 되감고 재생\n\n예보 타임라인이 있습니다. 손으로 시간을 끌면 그 시각의 상태가 지구 위에 나타나고,\n재생 버튼을 누르면 앞으로 흘러갑니다. 5일치까지 봅니다.\n\n**표로 보면 \"숫자가 바뀌었다\"이고, 지구 위에서 재생하면 \"무엇이 어디로 가고 있다\"입니다.**\n\n---\n\n## 3. 핵심 자료 자산 — 예보 검증 아카이브\n\n2026년 7월 26일부터 **매시간** 저장하고 있습니다.\n\n| | |\n|---|---|\n| 관측지점 | 기상청 **97곳** |\n| 모델 | **GFS**(미국) · **ECMWF**(유럽) 2종 |\n| 변수 | 기온(2m) · 풍속(10m) |\n| 예보 길이 | **72시간** |\n| 저장 주기 | 매시간 |\n\n예보는 발표되고 **사라집니다.** 새 예보가 나오면 이전 예보는 덮어써집니다.\n지나고 나서 \"그때 뭐라고 했었나\"를 되찾을 방법이 없습니다.\n\n그래서 모델 정확도를 지역별·계절별·조건별로 따지려면 **그 순간에 박제해 두는 수밖에 없습니다.**\n이 자산은 돈으로 살 수 없고 **시간으로만 만들어집니다.**\n\n⚠️ 솔직히 적습니다. 현재 **11일치**입니다. 얇습니다.\n다만 하루 10 MB씩 쌓이고 있고, 오늘 똑같이 시작하는 곳은 오늘부터 0일입니다.\n\n---\n\n## 4. 없는 것 — 먼저 밝힙니다\n\n⚠️ 밋업에서 드러날 것을 제안서에서 먼저 말하는 편이 서로의 시간을 아낍니다.\nearthus는 서비스 화면에서도 같은 원칙을 씁니다 — **없는 기능을 있다고 쓰지 않습니다.**\n\n- **학습된 AI 모델이 없습니다.** 코드 전수 확인 결과 TensorFlow·PyTorch·scikit-learn 사용 **0건**입니다.\n- **자체 위성·레이더가 없습니다.** 공개 자료를 받아 처리합니다.\n- **전력·발전 도메인 지식이 없습니다.**\n- **예보를 직접 생산하지 않습니다.** 기관 예보를 모으고, 맞았는지 검증합니다.\n\n**저희가 내놓는 것은 모델이 아니라, 모델을 만들고 채점하고 눈으로 확인하는 바탕입니다.**\n\n---\n\n## 5. 협력사별 제안\n\n### 5-1. SK텔레콤 — AI 기반기술 연계 · 빅데이터\n\n**문제.** AI 모델은 학습 데이터보다 **평가와 설명**에서 먼저 막힙니다.\n날씨·환경·에너지에 AI를 붙이면 반드시 두 질문이 나옵니다 —\n*\"이게 기존 수치예보보다 정말 나은가?\"* 그리고 *\"왜 그렇게 판단했는가?\"*\n\n**저희가 화면으로 만들어 드릴 수 있는 것**\n\n| 무엇 | 지구본 위 | 차트로 |\n|---|---|---|\n| 모델 채점판 | 지점별 오차를 색으로 칠한 지도 — 어디서 잘 맞고 어디서 틀리는지 한눈에 | 모델별·예보시간별 오차 곡선 |\n| SKT 모델 vs 수치예보 | 같은 시각·같은 지점을 나란히 | 승패 누적, 조건별 우열 |\n| 오차의 지리적 패턴 | 해안·산지·도심을 따라 오차가 몰리는 모습 | 지형·시간대별 분해 |\n\n**그래서 무엇이 달라지나.**\n표에서 \"RMSE 1.8\"은 숫자입니다. 지구 위에서는 \"**동해안을 따라 붉게 몰려 있다**\"가 됩니다.\n사람이 그걸 보는 순간 원인 가설이 생기고, 가설이 규칙이 되고, 규칙이 알고리즘이 됩니다.\n**보이면 판단이 빨라지고, 빨라진 판단이 코드가 됩니다.**\n\n---\n\n### 5-2. LS ELECTRIC — 기후대응/신재생에너지 · VPP\n\n**문제.** VPP는 태양광·풍력 발전량을 예측해 전력시장에 입찰합니다.\n**예측이 틀리면 정산에서 그대로 손실**입니다.\n그런데 정작 *\"우리가 쓰는 기상 예보가 어디서 얼마나 틀리는가\"*를\n발전소별·시간대별로 아는 사업자는 드뭅니다.\n\n**저희가 화면으로 만들어 드릴 수 있는 것**\n\n| 무엇 | 지구본 위 | 차트로 |\n|---|---|---|\n| 발전소 지도 | 발전소 위치에 **예보 신뢰도**를 색으로 | 사이트별 오차 이력 |\n| 오늘의 위험 | 오차가 커질 조건(전선·안개·태풍)이 다가오는 모습 | 시간대별 신뢰구간 |\n| 모델 가중치 | 지역별로 어느 모델을 믿어야 하는지 | GFS vs ECMWF 조건별 승률 |\n| 일사·바람 흐름 | 구름이 발전소 위를 지나가는 실제 영상 | 발전량 예측 대비 실적 |\n\n**그래서 무엇이 달라지나.**\n입찰 담당자는 지금 예보 숫자 하나를 봅니다.\n**이 화면은 그 숫자에 \"이 지점 이 시간대에는 평소 이만큼 틀린다\"를 붙여 줍니다.**\n그 폭을 아는 순간 입찰 전략이 달라지고, 그 규칙을 자동화하면 사람 손이 빠집니다.\n\n---\n\n### 5-3. 두산에너빌리티 — 해상풍력 (+ AI·빅데이터)\n\n**문제.** 해상풍력은 **O&M 출항 판단이 곧 비용**입니다.\n파고·풍속 예보가 틀리면 배를 띄웠다 돌아오거나, 띄울 수 있었던 날을 놓칩니다.\n하루 놓치면 그날의 정비가 통째로 밀립니다.\n\n**저희가 화면으로 만들어 드릴 수 있는 것**\n\n| 무엇 | 지구본 위 | 차트로 |\n|---|---|---|\n| 출항 창 | 단지 주변 파고·풍속을 시간축으로 재생 | 앞으로 5일 중 나갈 수 있는 시간대 |\n| 태풍 판단 | **기관 4곳 경로를 겹쳐서** 그대로 표시 | 기관별 강도·도달시각 차이 |\n| 예보 신뢰도 | 해상 지점별 과거 오차폭 | 파고 예보가 언제 빗나가는가 |\n| 실측 대조 | 인근 부이 실측을 예보 위에 겹침 | 예보-실측 편차 이력 |\n\n⚠️ 태풍 경로는 **하나로 합치지 않습니다.**\n기상청·일본 기상청·미국 합동태풍경보센터·GDACS 네 개를 그대로 겹쳐 놓습니다.\n**기관이 갈릴 때가 정확히 판단이 어려운 때이고, 그 갈림 자체가 정보이기 때문입니다.**\n이 화면은 이미 서비스에 있습니다.\n\n---\n\n## 6. 지구를 쓰면 여기서 더 갈 수 있습니다\n\n지금까지는 \"지금 되는 것\"이었습니다. 이 항목은 함께 하면 열리는 쪽입니다.\n\n**표는 값을 보여주고, 지구는 관계를 보여줍니다.**\n\n- 엑셀에서 오차 1.8은 그냥 1.8입니다.\n  지구 위에서는 \"**산맥을 넘는 순간 커진다**\"가 보입니다.\n- 발전소 200곳의 실적표는 200줄입니다.\n  지구 위에서는 \"**이 구름대가 지나간 곳만 떨어졌다**\"가 됩니다.\n- 태풍 경로 4개는 표에서 좌표 목록입니다.\n  지구 위에서는 \"**어느 시점부터 갈라지는지**\"가 그 자리에서 보입니다.\n\n이 차이가 실무에서 뜻하는 것은 하나입니다 — **원인 가설이 빨리 생깁니다.**\n그리고 원인을 알면 규칙을 쓸 수 있고, 규칙을 쓰면 자동화할 수 있습니다.\n\n> **보이게 만든다 → 사람이 빨리 판단한다 → 그 판단을 규칙으로 옮긴다 → 알고리즘이 된다**\n\n저희가 잘하는 것은 첫 칸입니다. 협력사가 잘하는 것은 뒤 칸입니다.\n**첫 칸이 없으면 뒤 칸은 감으로 시작합니다.**\n\n### 함께라면 이런 것도 가능합니다\n\n- **디지털 트윈의 바깥쪽** — 설비 안쪽은 협력사가 이미 잘 봅니다.\n  저희는 그 설비를 둘러싼 **하늘과 바다**를 같은 화면에 붙일 수 있습니다.\n- **경영진 상황판** — 전국 자산과 실시간 기상을 한 지구본 위에. 회의 자료가 아니라 **살아 있는 화면**으로.\n- **현장용 판단 화면** — \"지금 나가도 되는가\"에 숫자가 아니라 **그림으로** 답하는 화면.\n- **대외 신뢰 자산** — 예보 검증을 공개하는 곳은 드뭅니다.\n  \"**우리는 틀린 것도 공개한다**\"는 화면 자체가 브랜드가 됩니다.\n\n---\n\n## 7. PoC 제안 — 3개월\n\n| | 할 일 |\n|---|---|\n| 1개월 | 대상 지점·자산 확정, **검증 지표 합의** (무엇을 '맞았다'고 볼 것인가) |\n| 2개월 | 해당 지점 아카이브 확장 + **지구본 시연 화면 1차** |\n| 3개월 | 차트·리포트 완성 + **실제 의사결정 1건에 적용해 결과 보고** |\n\n⚠️ **정직하게 적습니다.** 3개월 뒤 아카이브는 약 100일치입니다. 계절 하나를 겨우 넘깁니다.\n1년 단위 분석이 필요한 과제라면 그 시점에 착수하는 것이 맞고, 지금 된다고 말하지 않겠습니다.\n\n지금 확실히 할 수 있는 것은 **\"이 지점에서 이 모델이 이만큼 틀린다\"를 실제 숫자와 화면으로 보여드리는 것**까지입니다.\n\n---\n\n## 8. 저희가 일하는 방식\n\n협업 상대를 고르실 때 도움이 될 것 같아 적습니다.\n\n- **없는 것을 있다고 쓰지 않습니다.** 서비스 화면에도 그대로 적혀 있습니다 —\n  *\"항공기·선박 실시간 위치 … 지금은 아직 없습니다\"*\n- **출처·표본수·기준을 값과 함께 보여줍니다.** 숫자만 크게 띄우지 않습니다.\n- **예보하지 않습니다.** 기관 예보를 옮기고, 맞았는지 확인해 드립니다.\n- **라이선스가 확인되지 않은 자료는 쓰지 않습니다.** 영국 자료를 수집만 하고 있는 이유입니다.\n- **안전 정보에는 값을 매기지 않습니다.** 태풍·지진·쓰나미는 유료화 대상에서 제외했습니다.\n\n---\n\n## 9. 마지막으로 — 저희가 가려는 곳\n\nearthus 는 **기상정보만 보여주는 서비스로 남을 생각이 없습니다.**\n\n지금 하고 있는 일은 바탕을 쌓는 일입니다.\n네 나라 기상청의 자료를 매시간 모으고, 사라지는 예보를 박제하고,\n그것을 지구 위에 얹어 사람이 볼 수 있게 만드는 일입니다.\n\n**그 위에 기상 AI 를 올리는 것을 고민하고 있습니다.**\n지금은 모델이 없습니다 — 4장에 적은 그대로입니다.\n다만 순서를 그렇게 잡았습니다. 자료와 정답지 없이 만든 모델은\n맞았는지 틀렸는지조차 말할 수 없기 때문입니다.\n**먼저 채점표를 만들고, 그 다음에 선수를 키웁니다.**\n\n그리고 이 지구본이 저희만 쓰는 화면으로 끝나지 않기를 바랍니다.\n\n- **산업** — 발전·해운·건설·농업처럼 하늘과 바다에 매출이 걸린 곳에서,\n  숫자가 아니라 화면으로 판단할 수 있게\n- **교육** — 아이가 태풍이 왜 생기는지, 왜 기관마다 다르게 말하는지를\n  글이 아니라 **돌려 보면서** 알게\n\n**각 산업과 교육이 함께 쓰는 한국형 3D 지구 서비스.**\n그게 저희가 가려는 곳이고, 이번 협업이 그 방향의 첫 걸음이 되기를 바랍니다.\n\n---\n\n## 10. 회사 정보\n\n| | |\n|---|---|\n| 상호 | *(작성 필요)* |\n| 대표자 | *(작성 필요)* |\n| 사업자등록번호 | *(작성 필요)* |\n| 주소 | *(작성 필요)* |\n| 서비스 | https://earthus.net (2026년 8월 4일 오픈) |\n| 연락처 | *(작성 필요)* |\n\n---\n\n*본 제안서의 모든 수치는 2026년 8월 6일 기준 실측값입니다.\n추정치나 목표치는 포함하지 않았으며, 확인되지 않은 항목은 「없는 것」에 적었습니다.*\n";
