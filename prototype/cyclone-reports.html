<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EARTHUS 태풍 결과보고서</title><style>
:root{--bg:#071018;--p:#101c27;--line:rgba(255,255,255,.1);--txt:#edf7ff;--dim:rgba(237,247,255,.58);--mint:#42f5c8;--orange:#f2a65a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:24px 18px 70px}.wrap{max-width:980px;margin:auto}h1{font-size:22px;margin:0}h2{font-size:15px}.note,small{color:var(--dim)}nav{display:flex;gap:8px;margin:18px 0;overflow:auto}nav a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:17px 19px;margin-top:13px}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:1.2fr .8fr .7fr auto;gap:10px;align-items:center;padding:12px;background:rgba(255,255,255,.035);border-radius:10px}.status{color:var(--mint)}button{font:inherit;color:var(--txt);background:rgba(66,245,200,.1);border:1px solid rgba(66,245,200,.35);border-radius:8px;padding:8px 11px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,.06)}th{color:var(--dim)}@media(max-width:650px){.item{grid-template-columns:1fr 1fr}.item button{grid-column:1/-1}}</style></head><body><main class="wrap"><h1>태풍 결과보고서</h1><p class="note">활동 중 계산 회차를 그대로 보존하고, 종료 뒤 최종 best track이 확인되면 당시 발표 좌표와 대조합니다.</p><nav><a href="./">EARTHUS</a><a href="./admin.html" id="admin" hidden>관리자</a><a href="./members.html" id="members" hidden>회원관리</a></nav><section class="card" id="gate">로그인과 구독 상태를 확인하고 있습니다.</section><section class="card" id="content" hidden><div class="list" id="list"></div></section><section class="card" id="detail" hidden></section></main><script type="module">
import { auth } from './js/auth.js';import { CONFIG } from './js/config.local.js';
const $=s=>document.querySelector(s);const label={DETECTED:'최초 탐지',ACTIVE:'계산 중',VERIFYING:'종료 확인 중',PRELIMINARY_REPORT:'잠정 보고서',FINAL_REPORT:'최종 보고서'};let reports=[];
function allowed(){return auth.isPaid()||((CONFIG.ADMIN_UIDS||[]).includes(auth.user?.id))}
function render(){const admin=(CONFIG.ADMIN_UIDS||[]).includes(auth.user?.id);$('#admin').hidden=!admin;$('#members').hidden=!admin;if(!auth.user){$('#gate').innerHTML='결과보고서는 구독 회원과 관리자에게 제공됩니다. <a href="./">EARTHUS에서 로그인</a>해 주세요.';return}if(!allowed()){$('#gate').textContent='현재 일반회원입니다. 공식 태풍 경로와 안전 정보는 EARTHUS에서 계속 무료로 볼 수 있습니다.';return}$('#gate').textContent='구독·관리자 권한이 확인됐습니다.';$('#content').hidden=false;const wanted=new URLSearchParams(location.search).get('storm');$('#list').innerHTML=reports.map(r=>`<div class="item"><b>${r.name||r.id}</b><span class="status">${label[r.status]||r.status}</span><span>회차 ${r.snapshotCount||0}</span><button data-id="${r.id}">보기</button></div>`).join('')||'<p class="note">아직 생성된 태풍 분석 세션이 없습니다.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));if(wanted)show(wanted)}
function show(id){const r=reports.find(x=>String(x.id)===String(id));if(!r)return;$('#detail').hidden=false;const scores=r.scores||[];$('#detail').innerHTML=`<h2>${r.name||r.id} · ${label[r.status]||r.status}</h2><p>최초 탐지 ${r.detectedAt||'—'}<br>마지막 관측 ${r.lastSeen||'—'}<br>저장 계산 회차 ${r.snapshotCount||0}개</p>${r.status!=='FINAL_REPORT'?'<p class="note">아직 IBTrACS 최종 경로가 확인되지 않아 기관·EARTHUS 오차를 확정하지 않습니다.</p>':`<table><thead><tr><th>자료</th><th>검증점</th><th>평균 위치오차</th></tr></thead><tbody>${scores.map(s=>`<tr><td>${s.agency}</td><td>${s.n}</td><td>${s.meanErrorKm}km</td></tr>`).join('')}</tbody></table>`}<p class="note">PRELIMINARY는 잠정 상태이며 FINAL만 IBTrACS best track 대조 결과입니다. 기관 우열을 일반화하지 않습니다.</p>`}
await auth.init();try{const r=await fetch('./ocean/cyclone-reports.json',{cache:'no-cache'});const j=await r.json();reports=j.reports||[]}catch(e){$('#gate').textContent='보고서 목록을 받지 못했습니다: '+e.message}auth.onChange(render);render();
</script></body></html>
