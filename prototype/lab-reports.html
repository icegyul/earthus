<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EARTHUS LAB 분석 보고서</title>
  <link rel="stylesheet" href="./css/lab-reports.css">
</head>
<body>
  <main class="wrap">
    <header>
      <a class="brand" href="./">EARTHUS / LAB</a>
      <h1>분석 보고서</h1>
      <p>사건 당시의 입력과 계산 회차를 보존하고, 종료 뒤 확인된 관측과 대조합니다. 독립 예보나 기관 순위가 아닙니다.</p>
    </header>
    <nav aria-label="보고서 종류" id="filters"></nav>
    <section class="notice" id="gate">로그인과 구독 상태를 확인하고 있습니다.</section>
    <section class="layout">
      <div>
        <div class="section-head"><h2>실제 생성된 보고서</h2><span id="count">0</span></div>
        <div class="list" id="list"><p class="empty">목록을 불러오는 중입니다.</p></div>
      </div>
      <aside id="detail"><p class="empty">보고서를 선택하면 자료 시각과 검증 상태를 확인할 수 있습니다.</p></aside>
    </section>
    <footer>현재 관측·기관 발표·출처·방법론과 안전 정보는 무료입니다. 저장 계산 회차와 종료 검증 결과는 구독·관리자에게 제공합니다.</footer>
  </main>
  <script type="module" src="./js/lab-reports-page.js"></script>
</body>
</html>
