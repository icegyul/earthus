<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>EARTHUS — 오프라인 · Offline</title>
<!-- (2026-09-24) 오프라인 안내 화면 — 지시서 §3-2 오프라인 · §3-8-2.
     v1 sw.js 가 **화면 이동이 네트워크 오류로 실패할 때만** 이 문서를 준다(/v2/·/Intelligence/ 포함).
     ⚠️ 이 문서는 /v2/… 같은 다른 주소로도 나간다 — 자산 주소는 모두 '/' 로 시작하는 절대 경로여야 한다.
     ⚠️ 지어내지 않는다: 날씨·지진 같은 값은 하나도 싣지 않는다(오프라인이라 지금 값이 없다).
        '마지막으로 연 시각'은 이 기기가 적어 둔 값(localStorage earthus.lastOpen, app-context.js)이 있을 때만 보인다.
     ⚠️ 애니메이션·자동 반복 없음(HANDOVER §5 발열). 다시 연결되면(online 이벤트) 한 번 새로 읽는다. -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  .brand { width: 168px; height: auto; margin-bottom: 28px; opacity: .92; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 6px; line-height: 1.55; color: #b8c2cd; font-size: 15px; }
  .en { color: #7f8b98; font-size: 13px; }
  .meta { margin: 18px 0 22px; padding: 12px 14px; border: 1px solid #1f2a36; border-radius: 10px; background: #070b10; }
  .meta p { font-size: 13px; }
  .meta b { color: #e8edf3; font-weight: 600; }
  button { appearance: none; border: 1px solid #3b5a7a; background: #0e1a27; color: #e8edf3; font: inherit;
    font-size: 15px; padding: 12px 18px; border-radius: 10px; min-height: 48px; cursor: pointer; align-self: flex-start; }
  button:focus-visible { outline: 2px solid #7fb7f5; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="brand" src="/logo/earthus-wordmark-white.svg" alt="EARTHUS" width="168" height="19">
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>지금 지구의 자료를 받으려면 연결이 필요합니다. 연결되면 다시 불러오세요.</p>
  <p class="en">You're offline. EARTHUS needs a connection to load live Earth data.</p>
  <div class="meta" id="meta" hidden>
    <p id="place"></p>
    <p id="last"></p>
  </div>
  <button type="button" id="retry">다시 불러오기 · Retry</button>
</main>
<script>
(function () {
  var retry = document.getElementById('retry');
  retry.addEventListener('click', function () { location.reload(); });
  // 다시 연결되면 한 번 새로 읽는다 — 타이머로 계속 두드리지 않는다.
  window.addEventListener('online', function () { location.reload(); }, { once: true });

  var meta = document.getElementById('meta');
  var path = location.pathname || '/';
  var intel = /^\/(v2|intelligence)(\/|$)/i.test(path);
  var placeEl = document.getElementById('place');
  placeEl.textContent = '열려던 화면 · ' + (intel ? 'EARTHUS Intelligence' : 'EARTHUS') + ' (' + path + ')';
  meta.hidden = false;

  // 이 기기가 적어 둔 '마지막으로 연 시각'. 없으면 줄을 빼고, 값을 지어내지 않는다.
  var rec = null;
  try { rec = JSON.parse(localStorage.getItem('earthus.lastOpen') || 'null'); } catch (e) { rec = null; }
  var at = rec && Number(rec.at);
  var lastEl = document.getElementById('last');
  if (at && isFinite(at) && at > 0) {
    var d = new Date(at + 9 * 3600 * 1000);   // KST = UTC+9 (서머타임 없음)
    var two = function (n) { return (n < 10 ? '0' : '') + n; };
    var kst = d.getUTCFullYear() + '-' + two(d.getUTCMonth() + 1) + '-' + two(d.getUTCDate())
      + ' ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes()) + ' KST';
    lastEl.textContent = '이 기기에서 마지막으로 연 시각 · ' + kst + ' (이 기기 기록)';
  } else {
    lastEl.remove();
  }
})();
</script>
</body>
</html>
