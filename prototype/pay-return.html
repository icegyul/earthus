<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ⚠️ 결제 결과 페이지는 검색에 걸리면 안 된다. 남의 주문번호가 인덱싱될 수 있다. -->
<meta name="robots" content="noindex, nofollow">
<!-- ⚠️ referrer 를 끊는다. 주소창에 주문번호·결제키가 들어 있어
     외부로 새어 나가면 안 된다. -->
<meta name="referrer" content="no-referrer">
<title>결제 확인 · earthus</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{--bg:#080c14;--fg:#e8eef7;--dim:#8b98ad;--ok:#4ade80;--no:#f87171;--line:#1d2635}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--fg);
       font:15px/1.65 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',
            'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:420px;background:#0d1420;border:1px solid var(--line);
        border-radius:16px;padding:28px 24px}
  .mark{font-size:38px;line-height:1;margin-bottom:14px}
  h1{font-size:19px;margin:0 0 10px;font-weight:650;letter-spacing:-.01em}
  p{margin:0 0 12px;color:var(--dim)}
  p.on{color:var(--fg)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
       border-top:1px solid var(--line);font-size:13px}
  .row b{font-weight:550;color:var(--fg);font-variant-numeric:tabular-nums;
         word-break:break-all;text-align:right}
  .row span{color:var(--dim);white-space:nowrap}
  a.btn{display:block;margin-top:20px;padding:13px;border-radius:11px;text-align:center;
        text-decoration:none;font-weight:600;background:#2f6df6;color:#fff}
  a.btn.sec{background:transparent;border:1px solid var(--line);color:var(--fg);margin-top:9px}
  .warn{margin-top:16px;padding:12px 13px;border-radius:10px;font-size:13px;
        background:#2a1a12;border:1px solid #4a2c1a;color:#f2c9a8}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:#2f6df6;
        border-radius:50%;animation:r .8s linear infinite;margin-bottom:14px}
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f8fb;--fg:#111823;--dim:#5c6979;--line:#dde3ec}
    .card{background:#fff}
    .warn{background:#fff5ec;border-color:#f0d8c0;color:#8a4b18}
  }
</style>
</head>
<body>
<main class="card" id="c">
  <div class="spin"></div>
  <h1>결제를 확인하는 중입니다</h1>
  <p>창을 닫지 마세요.</p>
</main>

<script type="module">
/* 결제창에서 돌아온 자리.
 *
 * ⚠️⚠️ **여기서 "결제 완료"라고 먼저 쓰면 안 된다.**
 *    토스가 successUrl 로 보냈다는 것은 "사용자가 결제창을 통과했다"는 뜻이지
 *    **승인이 끝났다는 뜻이 아니다.** 승인은 우리 서버가 시크릿 키로 해야 완료된다.
 *    승인 전에 완료라고 쓰면, 승인이 실패한 사람도 유료라고 믿게 된다.
 *
 * ⚠️ 금액(amount)이 주소창에 실려 오지만 **쓰지 않는다.**
 *    사용자가 고칠 수 있다. 서버가 DB 에서 찾은 금액으로 승인한다.
 *
 * ⚠️ 새로고침해도 안전하다 — 서버가 멱등이라 두 번 승인되지 않는다.
 */
const q = new URLSearchParams(location.search);
const c = document.getElementById('c');
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (m) =>
  ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[m]));

function show(mark, title, lines, rows, warn) {
  c.innerHTML =
    `<div class="mark">${mark}</div><h1>${esc(title)}</h1>` +
    lines.map((t, i) => `<p class="${i === 0 ? 'on' : ''}">${esc(t)}</p>`).join('') +
    (rows || []).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('') +
    (warn ? `<div class="warn">${esc(warn)}</div>` : '') +
    `<a class="btn" href="./">지구로 돌아가기</a>`;
}

const fail = q.get('r') === 'fail' || q.get('code');
if (fail) {
  // 결제창에서 취소·실패한 경우. ⚠️ 사유를 감추지 않는다.
  show('✕', '결제가 완료되지 않았습니다',
    ['카드사나 결제창에서 중단되었습니다. 요금은 청구되지 않습니다.'],
    [['사유', q.get('message') || q.get('code') || '알 수 없음']]);
} else {
  const paymentKey = q.get('paymentKey');
  const orderId = q.get('orderId');
  if (!paymentKey || !orderId) {
    show('?', '결제 정보가 없습니다',
      ['이 주소로 직접 들어오신 것 같습니다. 결제하신 적이 있다면 계정 화면에서 상태를 확인해 주세요.'], []);
  } else {
    try {
      const { billing } = await import('./js/billing.js');
      const { auth } = await import('./js/auth.js');
      await auth.init();
      const r = await billing.confirm({ paymentKey, orderId });
      const ends = r.ends ? new Date(r.ends).toLocaleDateString('ko-KR') : null;
      show('✓', r.already ? '이미 처리된 결제입니다' : '결제가 완료되었습니다',
        [r.already
          ? '이 주문은 이미 반영되어 있습니다. 중복 청구되지 않았습니다.'
          : '이용권이 계정에 적용되었습니다.'],
        [['주문번호', orderId], ...(ends ? [['이용 기간', `${ends}까지`]] : [])]);
    } catch (e) {
      const code = e.message || 'UNKNOWN';
      if (code === 'NOT_SIGNED_IN') {
        show('!', '로그인이 풀렸습니다',
          ['결제는 진행되었을 수 있습니다. 다시 로그인하시면 이용권이 자동으로 확인됩니다.'],
          [['주문번호', orderId]],
          '중복 결제하지 마세요. 로그인 후에도 적용되지 않으면 주문번호와 함께 문의해 주세요.');
      } else if (code === 'APPLY_FAILED') {
        // ⚠️ 돈은 나갔는데 권한이 안 붙은 경우. 가장 정직하게 말해야 하는 자리다.
        show('!', '결제는 됐지만 적용이 늦어지고 있습니다',
          ['요금은 정상 결제되었습니다. 이용권 적용만 실패했습니다.'],
          [['주문번호', orderId]],
          '다시 결제하지 마세요. 아래 주문번호를 고객센터로 보내주시면 바로 처리해 드립니다.');
      } else {
        show('✕', '승인에 실패했습니다',
          ['결제가 승인되지 않았습니다. 카드사 승인 내역이 있으면 자동으로 취소됩니다.'],
          [['사유', (e.detail && (e.detail.message || e.detail.code)) || code],
           ['주문번호', orderId]]);
      }
    }
  }
}
</script>
</body>
</html>
