# Supabase CLI 프로젝트 설정
#
# ⚠️ CLI 는 **이 파일이 있는 폴더의 부모**를 프로젝트 루트로 본다.
#    즉 명령은 `prototype/` 에서 실행해야 supabase/functions/* 를 찾는다:
#
#      cd prototype
#      supabase functions deploy push-tick --no-verify-jwt
#
#    저장소 루트에서 치면 "functions 폴더가 없다"고 한다.
#
# ⚠️ project_id 는 Supabase 대시보드 URL 의 그 문자열이다
#    (https://supabase.com/dashboard/project/<이 값>).
#    비밀이 아니다 — SUPABASE_URL 에 이미 들어 있고 브라우저로 내려간다.

project_id = "ltpupicvdijxkrxxsfky"

[functions.checkout]
verify_jwt = true

[functions.payment-confirm]
verify_jwt = true

[functions.payment-refund]
verify_jwt = true

[functions.push-tick]
# 사용자 대신 우리 주기 실행기가 호출한다. 함수 내부 PUSH_TICK_TOKEN 검증 필수.
verify_jwt = false

[functions.social-admin]
# 플랫폼 JWT + 함수 내부 staff RBAC를 모두 통과해야 한다.
verify_jwt = true

[functions.member-admin]
# 회원/초대/직원 역할을 다룬다. 함수 내부 staff_roles capability가 실제 변경 경계다.
verify_jwt = true

[functions.provider-admin]
# API/provider 자격증명을 다룬다. 원문 secret은 Edge Function 밖으로 다시 반환하지 않는다.
verify_jwt = true

[functions.forecast-v8]
# Earthus 자체 예보 payload는 유료 전용이다. 게이트웨이 JWT + 함수 내부 entitlement를 통과해야 한다.
verify_jwt = true
