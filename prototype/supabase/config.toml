# Supabase CLI 프로젝트 설정
#
# ⚠️ CLI 는 **이 파일이 있는 폴더의 부모**를 프로젝트 루트로 본다.
#    즉 명령은 `prototype/` 에서 실행해야 supabase/functions/* 를 찾는다:
#
#      cd prototype
#      supabase functions deploy push-tick --no-verify-jwt
#
#    저장소 루트에서 치면 "functions 폴더가 없다"고 한다.
#
# ⚠️ project_id 는 Supabase 대시보드 URL 의 그 문자열이다
#    (https://supabase.com/dashboard/project/<이 값>).
#    비밀이 아니다 — SUPABASE_URL 에 이미 들어 있고 브라우저로 내려간다.

project_id = "ltpupicvdijxkrxxsfky"

[functions.checkout]
verify_jwt = true

[functions.payment-confirm]
verify_jwt = true

[functions.payment-refund]
verify_jwt = true

[functions.push-tick]
# 사용자 대신 우리 주기 실행기가 호출한다. 함수 내부 PUSH_TICK_TOKEN 검증 필수.
verify_jwt = false

[functions.social-admin]
# 플랫폼 JWT + 서버 관리자 검증을 모두 통과해야 한다. Earthus 2.0 staff_roles 통합은 pre-device P0에서 완료한다.
verify_jwt = true

[functions.member-admin]
# 회원/초대/직원 역할을 다룬다. 함수 내부 staff_roles capability가 실제 변경 경계다.
verify_jwt = true

[functions.provider-admin]
# API/provider 자격증명을 다룬다. 원문 secret은 Edge Function 밖으로 다시 반환하지 않는다.
verify_jwt = true

[functions.provider-validate]
# KMA/KTO/AirKorea 등 allow-list 공식 endpoint에만 최소 read-only 검증 요청을 보낸다.
verify_jwt = true

[functions.forecast-v8]
# Earthus 자체 예보 payload는 유료 전용이다. 게이트웨이 JWT + 함수 내부 entitlement를 통과해야 한다.
verify_jwt = true

[functions.play-verify]
# (2026-09-24) 앱 안 Play 구매 검증. 사용자 JWT 필수 + 함수 안 SALES_ENABLED 문 + Google API 재확인.
verify_jwt = true

[functions.play-rtdn]
# (2026-09-24) Play RTDN(Pub/Sub push). Pub/Sub 는 Supabase JWT 를 못 붙인다 → 함수 안 PLAY_RTDN_TOKEN 공유 비밀 대조 필수.
#   알림 본문은 믿지 않고 Google API 로 다시 확인한 결과로만 권한을 거둔다(_shared/play-billing-core.js handleRtdn).
verify_jwt = false

[functions.entitlement]
# (2026-09-24) v2 등급 서버 판정 — 본인 것만 읽는다(earthus_my_entitlement). 판정 실패는 FREE.
verify_jwt = true
