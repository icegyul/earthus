<!DOCTYPE html>
<html lang="ko">
<head>

<meta property="og:description" content="실데이터로 살아 있는 3D 지구. 25년치 지진 18만 건이 그린 판 경계, 실시간 관측 레이어, 인구 데이터 조각." />

<meta name="twitter:image" content="https://earthus.net/v2/assets/brand/og-earthus-v2.jpg" />

<link rel="icon" type="image/svg+xml" href="./assets/brand/earthus-appicon.svg" />
<style>
  :root {
    --panel-bg: rgba(10, 16, 24, 0.82);
    --panel-line: rgba(120, 160, 200, 0.25);
    --text: #cfe0ee;
    --text-dim: #7f95a8;
    --accent: #7FB7F5; /* 브랜드 다크 모드 액센트 (lockup-white 호라이즌 컬러) */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 모바일: 창이 밀리지 않게. overscroll-behavior가 당겨서 새로고침·고무줄 튕김을 막는다 */
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #030608;
    overscroll-behavior: none;
  }
  body { font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: var(--text); }
  /* 조작면(3D 캔버스·위성지도)은 브라우저에게 제스처를 넘기지 않는다.
     touch-action이 auto면 한 손가락 드래그를 브라우저가 페이지 팬으로 가져가고,
     앱에는 남는 포인터 이벤트만 들어와 지구가 조금만 돌다 만다.
     끈 대신 회전·핀치 줌·틸트는 전부 OrbitCam이 직접 처리한다. */
  canvas, #mapview, #map-tiles {
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #scene { position: fixed; inset: 0; display: block; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 252px;
    font-size: 12px; user-select: none;
  }
  #chrome {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px);
  }
  #chrome .brand { display: block; width: 108px; margin-right: auto; }
  #chrome button {
    width: 30px; height: 28px; font-size: 15px; line-height: 1;
    background: rgba(74,144,217,0.10); border: 1px solid var(--panel-line);
    color: var(--text); border-radius: 7px; cursor: pointer; font-family: inherit;
  }
  #chrome button:hover, #chrome button.on { border-color: var(--accent); color: var(--accent); }
  .drawer {
    display: none; margin-top: 8px;
    background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px);
    max-height: 72vh; overflow-y: auto; overscroll-behavior: contain;
  }
  .drawer.open { display: block; }

  /* 지구에 묻기 (§17C) — 답과 함께 '무엇을 근거로 썼는지'와 '장면에서 무엇을 했는지'를
     같은 크기로 보여준다. 답만 크게 보이면 근거 없는 문장이 사실처럼 읽힌다. */
  .ask-head { font-weight: 600; margin-bottom: 3px; }
  .ask-hint { color: var(--text-dim); font-size: 11px; line-height: 1.55; margin-bottom: 9px; }
  .ask-row { display: flex; gap: 6px; }
  .ask-row input { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 7px;
    background: rgba(0,0,0,0.28); border: 1px solid var(--panel-line); color: var(--text);
    font-family: inherit; font-size: 12px; }
  .ask-row input:focus { outline: none; border-color: var(--accent); }
  .ask-row button { padding: 0 12px; border-radius: 7px; cursor: pointer; font-family: inherit;
    background: rgba(74,144,217,0.16); border: 1px solid var(--panel-line); color: var(--text); }
  .ask-row button:hover { border-color: var(--accent); color: var(--accent); }
  #ask-out:not(:empty) { margin-top: 10px; }
  .ask-wait, .ask-err { color: var(--text-dim); font-size: 11.5px; }
  .ask-a { font-size: 12.5px; line-height: 1.72; white-space: pre-wrap; }
  .ask-a.thin { color: var(--text-dim); }
  .ask-flag { display: inline-block; margin-top: 6px; padding: 1px 7px; border-radius: 5px;
    font-size: 10px; background: rgba(200,140,60,0.18); border: 1px solid rgba(200,140,60,0.42); }
  .ask-meta { margin-top: 8px; font-size: 11px; line-height: 1.6; color: var(--text-dim); }
  .ask-meta b { color: var(--text); font-weight: 600; }
  .ask-meta.drop { color: rgba(200,140,60,0.92); }
  .ask-meta button { margin-left: 6px; padding: 1px 8px; border-radius: 5px; cursor: pointer;
    font-family: inherit; font-size: 10.5px; background: transparent;
    border: 1px solid var(--panel-line); color: var(--text-dim); }
  .ask-meta button:disabled { opacity: 0.4; cursor: default; }
  .ask-foot { margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--panel-line);
    font-size: 10px; line-height: 1.55; color: var(--text-dim); }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--text); }
  .row label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type="range"] { width: 100%; accent-color: var(--accent); height: 18px; }
  .row input[type="range"]:disabled { opacity: 0.35; }
  .row.toggle { display: flex; align-items: center; gap: 8px; }
  .row.toggle input { accent-color: var(--accent); }
  .row.info { color: var(--text-dim); font-size: 11px; line-height: 1.6;
    padding: 7px 9px; background: rgba(74,144,217,0.08); border-radius: 6px;
    font-variant-numeric: tabular-nums; }
  .row.info b { color: var(--text); font-weight: 600; }

  #sim-toggle {
    width: 100%; padding: 7px 0; margin-bottom: 4px;
    background: rgba(74,144,217,0.12); color: var(--text);
    border: 1px solid var(--panel-line); border-radius: 6px;
    font-size: 11.5px; font-family: inherit; cursor: pointer;
  }
  #sim-toggle:hover { background: rgba(74,144,217,0.22); }
  #sim { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--panel-line); }
  #sim.open { display: block; }
  #sim .sim-head { color: var(--text-dim); font-size: 10.5px; margin-bottom: 8px; letter-spacing: 0.5px; }

  #panel .credit { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--panel-line);
    color: var(--text-dim); font-size: 10px; line-height: 1.5; }
  #panel .credit a { color: var(--text-dim); }

  #mapview {
    position: fixed; inset: 0; display: block; background: #0a0f14;
    opacity: 0; pointer-events: none; transition: opacity 0.35s;
    overflow: hidden; cursor: grab; z-index: 5;
  }
  #mapview.active { opacity: 1; pointer-events: auto; }
  #mapview.dragging { cursor: grabbing; }
  #map-tiles { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #map-tiles img { position: absolute; width: 256px; height: 256px; user-select: none; -webkit-user-drag: none; }
  #map-exit {
    position: absolute; top: 14px; left: 14px; z-index: 6;
    padding: 8px 14px; background: var(--panel-bg); color: var(--text);
    border: 1px solid var(--panel-line); border-radius: 8px;
    font-size: 12px; font-family: inherit; cursor: pointer;
  }
  #map-exit:hover { background: rgba(74,144,217,0.22); }
  #map-3d {
    position: absolute; top: 14px; left: 132px; z-index: 6;
    padding: 8px 14px; background: var(--panel-bg); color: var(--text);
    border: 1px solid var(--panel-line); border-radius: 8px;
    font-size: 12px; font-family: inherit; cursor: pointer;
  }
  #map-3d:hover { background: rgba(74,144,217,0.22); }
  #map-attrib {
    position: absolute; right: 8px; bottom: 6px; z-index: 6;
    font-size: 10px; color: #9db0c0; background: rgba(10,16,24,0.6);
    padding: 2px 8px; border-radius: 4px;
  }
  #map-attrib a { color: #9db0c0; }

  #share-toast {
    position: fixed; left: 50%; top: 68px; transform: translateX(-50%) translateY(-6px);
    z-index: 9; padding: 9px 16px; border-radius: 10px; font-size: 12px;
    background: var(--panel-bg); border: 1px solid var(--panel-line); color: var(--text);
    backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    max-width: 86vw; text-align: center;
  }
  #share-toast.show { opacity: 1; transform: translateX(-50%); }
  #share-toast b { color: var(--accent); font-weight: 600; }
  #share-menu {
    position: fixed; top: 52px; right: 14px; z-index: 9; display: none;
    background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 10px;
    backdrop-filter: blur(8px); padding: 6px; min-width: 190px;
  }
  #share-menu.open { display: block; }
  #share-menu button {
    display: block; width: 100%; text-align: left; padding: 8px 10px; font-size: 12px;
    font-family: inherit; background: none; border: 0; color: var(--text); cursor: pointer;
    border-radius: 6px;
  }
  #share-menu button:hover { background: rgba(74,144,217,0.18); }
  #share-menu .sm-note { padding: 4px 10px 6px; font-size: 10px; color: var(--text-dim); line-height: 1.5; }
  #hud {
    position: fixed; left: 14px; bottom: 12px; font-size: 11px; color: var(--text-dim);
    background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 6px 12px; font-variant-numeric: tabular-nums; z-index: 7;
    display: flex; align-items: center; gap: 8px;
  }
  #hud-more {
    background: none; border: 0; color: var(--text-dim); cursor: pointer;
    font-family: inherit; font-size: 10px; padding: 0 2px; line-height: 1;
  }
  #hud-more:hover, #hud.open #hud-more { color: var(--accent); }
  #hud-detail { display: none; }
  #hud.open #hud-detail {
    display: block; position: absolute; left: 0; bottom: calc(100% + 6px);
    width: min(430px, calc(100vw - 28px));
    background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 10px 12px 8px; backdrop-filter: blur(8px);
  }
  #hud-text {
    margin: 0 0 8px; font: 10.5px/1.65 ui-monospace, Consolas, monospace;
    color: var(--text); white-space: pre-wrap; word-break: break-all;
    max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
  }
  #hud-copy {
    padding: 4px 10px; font-size: 10.5px; font-family: inherit; cursor: pointer;
    background: rgba(74,144,217,0.12); border: 1px solid var(--panel-line);
    color: var(--text); border-radius: 6px;
  }
  #hud-copy:hover { background: rgba(74,144,217,0.26); }

  .seg { display: flex; gap: 4px; margin-top: 4px; }
  .seg button {
    flex: 1; padding: 5px 0; font-size: 11px; font-family: inherit;
    background: rgba(74,144,217,0.10); border: 1px solid var(--panel-line);
    color: var(--text); border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  .cloud-note { color: var(--text-dim); font-size: 10px; margin-top: 5px; line-height: 1.5; min-height: 13px; }

  #focus-chip {
    position: fixed; top: 14px; left: 14px; z-index: 7;
    padding: 8px 14px; background: var(--panel-bg);
    border: 1px solid var(--panel-line); border-radius: 8px;
    font-size: 12px; color: var(--text); display: none;
  }
  #focus-chip.show { display: block; }
  .ui-x, .chip-x {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 12px; font-family: inherit; padding: 2px 6px; line-height: 1;
  }
  .ui-x:hover, .chip-x:hover { color: var(--text); }
  .fly-head .ui-x { margin-left: auto; }
  .intel-tabs .ui-x { flex: 0 0 auto; }
  .chip-x { margin-left: 6px; }

  #c-search {
    width: 100%; padding: 6px 9px; font-size: 12px; font-family: inherit;
    background: rgba(74,144,217,0.08); border: 1px solid var(--panel-line);
    border-radius: 6px; color: var(--text);
  }
  #c-search::placeholder { color: var(--text-dim); }
  #c-search:focus { outline: none; border-color: var(--accent); }
  .search-hit { padding: 5px 9px; font-size: 11.5px; cursor: pointer; border-radius: 4px; color: var(--text); }
  .search-hit:hover { background: rgba(74,144,217,0.22); }

  /* ---------- 브랜드 메뉴 (1.0 문법 이식): 좌측 세로 손잡이 + 슬라이드 패널 ---------- */
  .edge-tab {
    position: fixed; left: 0; z-index: 6; width: 42px; height: 118px;
    border-radius: 0 13px 13px 0; border: 1px solid var(--panel-line); border-left: 0;
    background: rgba(12,16,22,0.55); backdrop-filter: blur(16px); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: transform 0.42s cubic-bezier(0.22,1,0.36,1), background 0.2s ease;
  }
  #brand-tab-e { top: calc(50% - 128px); }
  #brand-tab-a { top: calc(50% + 10px); }
  .edge-tab span {
    writing-mode: vertical-rl; text-orientation: upright; color: #eef5fb;
    font: 600 10px/1 ui-monospace, Consolas, monospace; letter-spacing: 0.3em;
    text-shadow: 0 1px 8px #000;
  }
  .edge-tab.aeth span { color: #c9b3f0; }
  .edge-tab:hover { background: rgba(24,30,40,0.8); }
  .edge-tab.open, .edge-tab.beside { transform: translateX(286px); }
  .edge-tab.open { background: rgba(22,30,42,0.88); }

  /* ---------- 첫 방문 안내 ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 12; display: none;
    background: rgba(3,6,8,0.62); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 20px;
  }
  #intro.show { display: flex; }
  .intro-card {
    width: min(460px, 100%); max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 16px;
    backdrop-filter: blur(16px); padding: 22px 22px 18px;
  }
  .intro-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .intro-head b { font-size: 17px; font-weight: 300; letter-spacing: 0.26em; color: #f4eee9; }
  .intro-head span { font-size: 11px; color: var(--text-dim); }
  .intro-x { margin-left: auto; background: none; border: 0; color: var(--text-dim);
    font-size: 14px; cursor: pointer; font-family: inherit; padding: 2px 4px; }
  .intro-x:hover { color: var(--text); }
  .intro-step { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(120,160,200,0.14); }
  .intro-step:first-child { border-top: 0; }
  .intro-step i { font-style: normal; font-size: 19px; line-height: 1.3; width: 24px; flex: 0 0 24px; text-align: center; }
  .intro-step b { display: block; font-size: 13px; color: var(--text); margin-bottom: 3px; font-weight: 600; }
  .intro-step p { font-size: 11.5px; line-height: 1.65; color: var(--text-dim); }
  .intro-foot {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: rgba(74,144,217,0.10); font-size: 11px; line-height: 1.65; color: var(--text-dim);
  }
  .intro-foot b { color: var(--text); font-weight: 600; }
  .intro-go {
    width: 100%; margin-top: 14px; padding: 11px 0; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #06121f; border: 0; font-family: inherit;
    font-size: 13px; font-weight: 600;
  }
  #menu-scrim {
    position: fixed; inset: 0; z-index: 4; display: none;
    background: rgba(3,6,8,0.35); opacity: 0; transition: opacity .3s;
    pointer-events: none;   /* 열려 있지 않을 땐 절대 터치를 가로채지 않는다 */
  }
  #menu-scrim.on { opacity: 1; pointer-events: auto; }
  #menu-panel {
    position: fixed; left: 0; top: 50%; z-index: 5; width: 286px;
    transform: translateY(-50%) translateX(-102%);
    max-height: calc(100vh - 96px); display: flex; flex-direction: column;
    background: rgba(10,14,20,0.78); backdrop-filter: blur(26px);
    border: 1px solid var(--panel-line); border-left: 0; border-radius: 0 14px 14px 0;
    transition: transform 0.42s cubic-bezier(0.22,1,0.36,1);
  }
  #menu-panel.open { transform: translateY(-50%) translateX(0); }
  .mp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 10px 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  .mp-head-copy b {
    display: block; font: 650 11.5px/1 ui-monospace, Consolas, monospace;
    letter-spacing: 0.18em; color: #9fe6f5;
  }
  #menu-panel.aeth .mp-head-copy b { color: #c9b3f0; }
  .mp-head-copy small { display: block; margin-top: 5px; font-size: 10px; color: rgba(242,245,248,0.5); }
  .mp-body {
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding-bottom: 6px; scrollbar-width: none;
  }
  .mp-body::-webkit-scrollbar { display: none; }
  .mp-sec { padding: 4px 0 7px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .mp-sec:last-of-type { border-bottom: 0; }
  .mp-title {
    margin: 0; padding: 9px 18px 5px; display: flex; align-items: center; gap: 8px;
    font: 650 9px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 0.16em;
    color: rgba(242,245,248,0.48);
  }
  .mp-title i {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--sc, var(--accent)); box-shadow: 0 0 9px var(--sc, var(--accent));
  }
  .mp-title em {
    margin-left: auto; font-style: normal; font-size: 8.5px; opacity: 0.55;
    font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
  }
  /* ---------- 지진 25년 (PTWC 하단 바 문법을 브랜드로 옮김) ---------- */
  #quake-ui { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #quake-cap {
    position: absolute; left: 96px; bottom: 58px; max-width: 380px;
    opacity: 0; transform: translateY(6px); transition: opacity 0.5s, transform 0.5s;
  }
  #quake-cap.show { opacity: 1; transform: none; }
  #quake-cap > b {
    display: block; font-size: 26px; font-weight: 300; letter-spacing: 0.2em;
    color: #f4eee9; text-shadow: 0 2px 24px rgba(0,0,0,0.85);
  }
  #quake-cap .qk-date {
    display: block; margin-top: 10px; font: 300 34px/1 ui-monospace, Consolas, monospace;
    letter-spacing: 0.06em; color: #ffd9c2; text-shadow: 0 2px 20px rgba(0,0,0,0.9);
    font-variant-numeric: tabular-nums;
  }
  #quake-cap .qk-count {
    display: block; margin-top: 7px; font: 500 10px/1.5 ui-monospace, Consolas, monospace;
    letter-spacing: 0.16em; color: rgba(244,238,233,0.72);
  }
  #quake-cap .qk-date i {
    font-style: normal; font-size: 11px; letter-spacing: 0.2em;
    color: rgba(244,238,233,0.5); margin-left: 8px; vertical-align: middle;
  }
  #quake-cap .qk-date, #quake-cap .qk-bar { pointer-events: auto; cursor: pointer; touch-action: none; }
  /* 레이어를 끄면 opacity만 0이라 투명한 조작 타깃이 화면 좌하단에 남는다 —

  #sk-exit:hover { background: rgba(183,154,236,0.22); }
  #sk-crumb {
    position: absolute; top: 21px; left: 112px; z-index: 9;
    font-size: 11.5px; color: rgba(210,196,240,0.75); letter-spacing: 0.05em;
  }
  #sk-crumb i { color: rgba(150,140,180,0.6); font-style: normal; margin: 0 4px; }
  #sk-crumb b { color: #d9c9f5; }
  #sk-title { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9; text-align: center; pointer-events: none; }
  #sk-title b { display: block; font-size: 18px; letter-spacing: 0.5em; font-weight: 600; color: #e8e2f8; text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
  #sk-title span { font-size: 10.5px; color: rgba(214,204,238,0.65); }
  #sk-filters {
    position: absolute; top: 74px; left: 50%; transform: translateX(-50%); z-index: 9;
    display: flex; gap: 6px; background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 5px 6px; backdrop-filter: blur(8px);
  }
  #sk-filters button {
    padding: 5px 13px; font-size: 11px; font-family: inherit; cursor: pointer;
    background: none; border: 1px solid transparent; color: var(--text-dim); border-radius: 7px;
  }
  #sk-filters button:hover { color: var(--text); }
  #sk-filters button.on { background: rgba(183,154,236,0.18); border-color: rgba(183,154,236,0.5); color: #e2d8f8; }
  #sk-card {
    position: absolute; right: 20px; top: 74px; z-index: 9; width: 286px;
    max-height: calc(100vh - 150px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 14px;
    padding: 13px 15px; backdrop-filter: blur(8px);
  }
  .sk-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .sk-h b { font-size: 14px; color: #e8e2f8; line-height: 1.35; }
  .sk-h span { font-size: 10px; color: #c9b3f0; white-space: nowrap; }
  .sk-img { width: 100%; border-radius: 9px; display: block; margin-bottom: 9px; }
  .sk-r { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; padding: 4px 0; border-top: 1px solid rgba(150,130,200,0.12); }
  .sk-r span { color: var(--text-dim); white-space: nowrap; }
  .sk-r b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .sk-note { margin-top: 9px; padding-top: 8px; border-top: 1px dashed rgba(150,130,200,0.2); font-size: 9.5px; color: var(--text-dim); line-height: 1.6; }
  .sk-note a { color: #c9b3f0; }
  #sk-hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9; font-size: 10px; color: rgba(160,150,190,0.65); }
  #sk-loading {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9;
    font-size: 13px; color: var(--text-dim); background: var(--panel-bg);
    border: 1px solid var(--panel-line); border-radius: 10px; padding: 12px 20px;
  }

  /* ---------- 지역 3D 지형 뷰 ---------- */
  #localview { position: fixed; inset: 0; z-index: 8; display: none; background: #0a0f14; }
  #localview.active { display: block; }
  #lt-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #lt-exit, #lt-map {
    position: absolute; top: 14px; z-index: 9;
    padding: 8px 14px; background: var(--panel-bg); color: var(--text);
    border: 1px solid var(--panel-line); border-radius: 8px;
    font-size: 12px; font-family: inherit; cursor: pointer;
  }
  #lt-exit { left: 14px; }
  #lt-map { left: 110px; }
  #lt-exit:hover, #lt-map:hover { background: rgba(74,144,217,0.22); }
  #lt-info {
    position: absolute; top: 14px; right: 14px; z-index: 9; max-width: 300px;
    background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px);
    font-size: 11px; color: var(--text-dim); line-height: 1.6;
  }
  #lt-info b { color: var(--text); }
  #lt-bar {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 9; display: flex; align-items: center; gap: 18px;
    background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 8px 16px; backdrop-filter: blur(6px);
  }
  #lt-bar label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
  #lt-bar input[type="range"] { width: 120px; accent-color: var(--accent); }
  #lt-bar b { color: var(--accent); font-variant-numeric: tabular-nums; }
  #lt-attrib { font-size: 9.5px; color: var(--text-dim); }
  #lt-loading {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 9; font-size: 12px; color: var(--text);
    background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 10px 18px;
  }

  /* ---------- Earth Intelligence Feed ---------- */
  .feed-head { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 8px; }
  .feed-head .feed-cnt { color: var(--accent); }
  .feed-item {
    display: flex; gap: 10px; align-items: center; padding: 8px 10px;
    border: 1px solid rgba(120,160,200,0.14); border-radius: 8px;
    margin-bottom: 6px; cursor: pointer;
  }
  .feed-item:hover { background: rgba(74,144,217,0.12); }
  .feed-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .feed-dot.tc { background: #ffb36a; }
  .feed-dot.eq { background: #d98a6a; }
  .feed-dot.a-red { background: #ff5540; box-shadow: 0 0 8px rgba(255,85,64,0.7); }
  .feed-main { flex: 1; min-width: 0; }
  .feed-title { font-size: 12px; color: var(--text); }
  .feed-sub { font-size: 10px; color: var(--text-dim); }
  .feed-note { font-size: 9.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
  .feed-back {
    background: none; border: none; color: var(--accent); font-size: 11px;
    cursor: pointer; margin-bottom: 8px; font-family: inherit; padding: 0;
  }
  /* ---------- 사건 방: 기관 스택 + 현재→다음→행동 ---------- */
  .card.room { border-color: rgba(255,179,106,0.28); }
  .room-src {
    display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: start;
    padding: 7px 0; border-top: 1px solid rgba(120,160,200,0.10); color: var(--text);
  }
  .room-src.none { opacity: 0.62; }
  .room-agency { font-size: 11px; font-weight: 600; line-height: 1.35; }
  .room-what { font-size: 9.5px; color: var(--text-dim); font-weight: 400; margin-top: 2px; line-height: 1.4; }
  .room-val { font-size: 11px; line-height: 1.45; min-width: 0; }
  .room-sub { font-size: 9.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }
  .room-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .room-right .badge { white-space: nowrap; }
  .room-on {
    background: rgba(74,144,217,0.10); border: 1px solid rgba(120,160,200,0.22); color: var(--text);
    font-size: 9.5px; font-family: inherit; padding: 2px 7px; border-radius: 5px; cursor: pointer; white-space: nowrap;
  }
  .room-on:hover { background: rgba(74,144,217,0.22); }
  .room-fusion { margin-top: 8px; font-size: 9.5px; color: var(--text-dim); line-height: 1.5; }
  .room-fusion code { font-size: 9px; }
  .room-tl { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .room-tl > div { border-top: 2px solid rgba(120,160,200,0.18); padding-top: 6px; color: var(--text); font-size: 11px; line-height: 1.45; }
  .room-tl > div.act { border-top-color: #ffb36a; }
  .room-tlk { font-size: 9.5px; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 4px; }
  .room-tl > div.act .room-tlk { color: #ffb36a; }
  .room-tl a { color: var(--accent); }
  /* ---------- 여행 씬 카드: 왜 지금 5줄 ---------- */
  .tv-score { font-size: 12px; color: var(--text); margin-bottom: 8px; }
  .tv-score b { font-size: 18px; color: #F2A2C4; }
  .tv-score span { font-size: 10px; color: var(--text-dim); }
  .tv-why { font-size: 9.5px; letter-spacing: 1px; color: var(--text-dim); margin: 4px 0 2px; }
  .tv-line { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid rgba(120,160,200,0.10); color: var(--text); font-size: 11px; line-height: 1.45; }
  .tv-line .badge { margin-top: 1px; white-space: nowrap; }
  .tv-src { font-size: 9.5px; color: var(--text-dim); margin-top: 2px; }
  #feedmarks { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .feed-mark {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; touch-action: none;
    border: 1.5px solid rgba(255,255,255,0.75);
  }
  .feed-mark.tc { background: rgba(255,179,106,0.9); }
  .feed-mark.eq { background: rgba(217,138,106,0.9); }
  .feed-mark.a-red { background: #ff5540; animation: feedpulse 1.6s infinite; }
  .feed-mark.sel { width: 15px; height: 15px; border-color: var(--accent); }
  @keyframes feedpulse {
    0%, 100% { box-shadow: 0 0 5px rgba(255,85,64,0.5); }
    50% { box-shadow: 0 0 16px rgba(255,85,64,0.95); }
  }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  /* 항로 기착지 — 순항 셸 높이에 찍히므로 지표 라벨(.geo-label)과 구분되게 테두리를 준다 */
  #route-labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .route-label {
    position: absolute; transform: translate(-50%, -150%); display: none;
    padding: 2px 7px; border-radius: 10px; white-space: nowrap;
    font: 600 10px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 0.08em;
    color: #dfeeff; background: rgba(10,16,24,0.72);
    border: 1px solid rgba(127,183,245,0.5); backdrop-filter: blur(4px);
  }
  .geo-label {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 11px; color: rgba(220,232,244,0.85); letter-spacing: 0.4px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
  .geo-label.dim { color: rgba(160,175,190,0.28); }
  .geo-label.sel { color: var(--accent); font-weight: 600; }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, #071018 0%, #030608 70%);
    z-index: 10; transition: opacity 0.5s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .lockup { width: 320px; max-width: 70vw; }
  #loading .bar { width: 260px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.15s; }
  #loading .msg { font-size: 11px; color: var(--text-dim); }
  #loading .err { color: #e08a7a; font-size: 12px; max-width: 320px; text-align: center; line-height: 1.6; display: none; }
  /* ---------- 좁은 화면 정리 (기본 규칙보다 뒤에 와야 이긴다) ---------- */
  @media (max-width: 720px) {
    /* 메뉴가 286px 고정이라 360px 폰에서 지구가 74px만 남았다. 화면에 맞춰 줄이고
       뒤를 눌러 닫을 수 있게 스크림을 깐다. */
    #menu-panel { width: min(286px, 82vw); }
    .edge-tab.open, .edge-tab.beside { transform: translateX(min(286px, 82vw)); }
    /* ⚠️ 여기서 그냥 display:block 을 주면 메뉴가 닫혀 있어도 투명한 전면 요소가 남아
       모바일에서 지구 터치가 통째로 죽는다(실측 2026-09-02). 열렸을 때만 깐다. */
    #menu-scrim.on { display: block; }
    /* 오른쪽 설정·검색 패널도 화면을 넘지 않게 */
    #panel { width: min(252px, 74vw); }
    #intel.open #intel-body { width: calc(100vw - 16px); max-height: 52vh; }
    /* 아이폰 홈 인디케이터·노치 — viewport-fit=cover와 함께 써야 의미가 있다 */
    #timestrip {
      left: 8px; right: 8px; transform: none;
      bottom: calc(10px + env(safe-area-inset-bottom));
      justify-content: center; gap: 8px; padding: 7px 10px;
    }
    #hud { bottom: calc(66px + env(safe-area-inset-bottom)); }
    #intel { bottom: calc(66px + env(safe-area-inset-bottom)); }
    #quake-cap { bottom: calc(148px + env(safe-area-inset-bottom)); }
    #chrome { padding-top: calc(8px + env(safe-area-inset-top)); }
    #timestrip input[type="range"] { width: auto; flex: 1 1 auto; min-width: 0; }
    /* 인텔 손잡이는 타임스트립 위로 — 아니면 재생 버튼 옆을 덮는다 */
    #intel { right: 8px; bottom: 66px; }
    #intel-tab { padding: 7px 12px; font-size: 11px; }
    #intel.open #intel-body { width: calc(100vw - 16px); max-height: 52vh; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="panel">
  <div id="chrome">
    <img class="brand" src="./assets/brand/earthus-wordmark-white.svg" alt="EARTHUS" />
    <button id="btn-search" data-i18n-title="search" title="검색 (나라·시군구·도시·공항)">⌕</button>
    <button id="btn-ask" data-i18n-title="ask" title="지구에 묻기 — 지금 켜 놓은 자료만 근거로 답합니다">✦</button>
    <button id="btn-share" data-i18n-title="share" title="이 화면 공유 (링크 복사 · 그림 저장)">⤴</button>
    <button id="btn-help" data-i18n-title="help" title="사용법 다시 보기">?</button>
    <button id="btn-settings" data-i18n-title="settings" title="설정">⚙</button>
  </div>

  <div id="menu-scrim"></div>
  <div id="share-menu">
    <button data-share="link">🔗 이 화면 링크 복사</button>
    <button data-share="image">🖼 지구 그림 저장 (JPG)</button>
    <div class="sm-note" data-i18n="shareNote">링크에는 카메라 위치·켜 놓은 레이어·선택한 나라가 담깁니다</div>
  </div>
  <div id="share-toast"></div>

  <div id="ask-drawer" class="drawer"></div>

  <div id="search-drawer" class="drawer">
    <input type="text" id="c-search" data-i18n-ph="searchPh" placeholder="검색 — 나라·시군구·도시·공항" autocomplete="off" />
    <div id="search-results"></div>
  </div>

  <div id="settings-drawer" class="drawer">
  <div class="row info" id="sun-info" data-i18n="sunCalc">태양 위치 계산 중…</div>

  <div class="row">
    <label data-i18n="cloudAdv">구름 (고급 — 기본 조작은 좌측 날씨 메뉴)</label>
    <div class="seg" id="cloud-seg">
      <button data-cloud="off" class="on" data-i18n="cloudNone">없음</button>
      <button data-cloud="obs" data-i18n="cloudObs">관측</button>
      <button data-cloud="gk2a" data-i18n="cloudGk2a">천리안</button>
      <button data-cloud="gfs" data-i18n="cloudModel">모델</button>
      <button data-cloud="static" data-i18n="cloudStatic">정적</button>
    </div>
    <div class="cloud-note" id="cloud-note">구름 끔</div>
  </div>

  <div class="row toggle">
    <input type="checkbox" id="c-snow" /><label for="c-snow" data-i18n="snowChk">눈·얼음 (관측)</label>
  </div>
  <div class="cloud-note" id="snow-note"></div>

  <div class="row toggle">
    <input type="checkbox" id="c-rotate" checked /><label for="c-rotate" data-i18n="rotate">자동 회전</label>
  </div>

  <button id="sim-toggle" data-i18n="simOpen">시뮬레이션 설정 열기 ▾</button>
  <div id="sim">
    <div class="sim-head" data-i18n="simHead">시뮬레이션 · 표현 튜닝</div>
    <div class="row">
      <label><span data-i18n="exaggerL">지형 과장</span> <span class="val" id="v-exagger">50×</span></label>
      <input type="range" id="c-exagger" min="1" max="80" step="1" value="50" />
    </div>
    <div class="row">
      <label><span data-i18n="isobathGap">등심선 간격</span> <span class="val" id="v-isobath">500 m</span></label>
      <input type="range" id="c-isobath" min="200" max="2000" step="100" value="500" disabled />
    </div>
    <div class="row">
      <label><span data-i18n="shadeStr">음영 강도</span> <span class="val" id="v-shade">1.9</span></label>
      <input type="range" id="c-shade" min="0" max="2.5" step="0.1" value="1.9" />
    </div>
    <div class="row">
      <label><span data-i18n="photoMix">위성 색 혼합</span> <span class="val" id="v-photo">65%</span></label>
      <input type="range" id="c-photo" min="0" max="100" step="5" value="65" />
    </div>
    <div class="row toggle">
      <input type="checkbox" id="c-manual" /><label for="c-manual" data-i18n="manualLight">수동 조명 (화면 기준)</label>
    </div>
    <div class="row">
      <label><span data-i18n="sunAzL">태양 방위각</span> <span class="val" id="v-sunaz">245°</span></label>
      <input type="range" id="c-sunaz" min="0" max="360" step="5" value="245" disabled />
    </div>
    <div class="row">
      <label><span data-i18n="sunElL">태양 고도각</span> <span class="val" id="v-sunel">64°</span></label>
      <input type="range" id="c-sunel" min="5" max="80" step="1" value="64" disabled />
    </div>
  </div>

  <div class="credit">
    지형: AWS Terrain Tiles (Terrarium)<br/>
    기본색: Natural Earth II<br/>
    비교: <a href="../v2/index.html">Cesium v2 지구 열기</a>
  </div>
  </div><!-- /settings-drawer -->
</div>

<div id="focus-chip"></div>

<div id="mapview">
  <div id="map-tiles"></div>
  <button id="map-exit" data-i18n="mapExit">◀ 3D 지구로</button>
  <button id="map-3d" data-i18n="map3d">⛰ 3D 지형</button>
  <div id="map-attrib">위성영상 © Esri · Maxar · Earthstar Geographics</div>
</div>

<div id="hud"><span id="hud-line" data-i18n="hudAlt">고도 —</span><button id="hud-more" data-i18n-title="hudMore" title="진단 정보 (상태를 텍스트로 복사)">▾</button>
  <div id="hud-detail"><pre id="hud-text"></pre><button id="hud-copy">📋 복사</button></div></div>

<div id="loading">
  <img class="lockup" src="./assets/brand/earthus-lockup-white.svg" alt="EARTHUS — WHERE EARTH BECOMES ONE" />
  <div class="bar"><i id="load-fill"></i></div>
  <div class="msg" id="load-msg">지형 데이터 로딩 준비…</div>
  <div class="err" id="load-err"></div>
</div>

<script type="module" src="./js/main.js?v=163"></script>
<script src="/js/earth-switch.js" defer></script>
</body>
</html>
