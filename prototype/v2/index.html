const M=[['EARTH','◎'],['WEATHER','☁'],['OCEAN','≈'],['HAZARD','△'],['HUMAN','◌'],['PULSE','⌁'],['SPACE','✦']],F={WEATHER:['Clouds','Temperature','Humidity','Rain','Pressure','TPW','Wind','PM2.5','Air quality'],OCEAN:['Sea surface temperature','SST anomaly','Wave','Swell','Current speed'],HAZARD:['Typhoon','Earthquake','Tsunami','Wildfire','Lightning'],HUMAN:['Tourism / Crowd','Places'],PULSE:['News','Actions','Events'],SPACE:['Aurora','Satellites']};let menu='EARTH',feature=null,v=null,tt=0;const ui=document.getElementById('ui');
function clock(){return new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function toast(x){let n=document.getElementById('toast');n.textContent=x;n.hidden=false;clearTimeout(tt);tt=setTimeout(()=>n.hidden=true,2200)}
function mount(){ui.innerHTML=`<header class="head"><button class="brand" id="home"><span class="mark"></span><span><b>EARTHUS</b> <small>2.0</small></span></button><div><span class="state"><i></i><b id="state">QUIET EARTH</b></span><span class="clock">UTC&nbsp; <b id="clock"></b></span></div></header><button class="search" id="search">⌕ &nbsp; 장소·국가·데이터 검색</button><section id="features" hidden><div class="fh"><b id="ft"></b><span>레이어를 선택하세요</span></div><div class="chips" id="chips"></div></section><nav class="dock" id="dock"></nav><button id="tab"><span>EARTH INTELLIGENCE</span></button><aside id="intel" hidden><header><div><small>EARTH INTELLIGENCE</small><b id="it">QUIET EARTH</b></div><button id="close">×</button></header><nav><button class="on">NOW</button><button disabled>WHY</button><button disabled>NEXT</button><button disabled>FOR ME</button></nav><div id="body" class="empty"><b>지구를 탐색하세요.</b><p>실제 데이터가 연결되면 출처·관측시각·상태를 바탕으로 정보가 표시됩니다.</p></div></aside><div class="now"><i></i><b>NOW</b> &nbsp;<span id="now">LIVE EARTH · 동적 레이어 0</span></div><div class="cam"><span id="coord">—</span><br><b id="alt">—</b></div><div id="toast" hidden></div>`;M.forEach(([id,ic])=>{let b=document.createElement('button');b.dataset.menu=id;b.innerHTML=`<span>${ic}</span><b>${id}</b>`;dock.append(b)});dock.onclick=e=>{let b=e.target.closest('[data-menu]');if(b)select(b.dataset.menu)};home.onclick=()=>select('EARTH');search.onclick=()=>toast('검색은 VS-01에서 기존 Search Runtime과 연결합니다.');tab.onclick=()=>{intel.hidden=false;tab.hidden=true};close.onclick=()=>{intel.hidden=true;tab.hidden=false};tick();render()}
function tick(){clock.textContent=clockFn();setTimeout(tick,1000)}function clockFn(){return new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function select(x){menu=x;feature=null;if(x==='PULSE')toast('PULSE · News / Action / Event Orchestrator');if(x==='SPACE')toast('SPACE · exclusive AETHERUS handoff gate');render()}function choose(x){feature=x;toast(`${menu} · ${x} 선택됨`);render()}
function render(){document.querySelectorAll('[data-menu]').forEach(b=>b.classList.toggle('on',b.dataset.menu===menu));state.textContent=feature?feature.toUpperCase():(menu==='EARTH'?'QUIET EARTH':menu);it.textContent=state.textContent;now.textContent=feature?`${menu} · ${feature}`:(menu==='EARTH'?'LIVE EARTH · 동적 레이어 0':`${menu} · 레이어 선택 대기`);features.hidden=menu==='EARTH';ft.textContent=menu;chips.replaceChildren();(F[menu]||[]).forEach(x=>{let b=document.createElement('button');b.textContent=x;b.className=x===feature?'on':'';b.onclick=()=>choose(x);chips.append(b)});body.className=feature?'grid':'empty';body.innerHTML=feature?`<div><span>MENU</span><b>${menu}</b></div><div><span>PRIMARY</span><b>${feature}</b></div><div><span>CONTEXT</span><b>—</b></div><div><span>TIME</span><b>NOW</b></div><div><span>STATE</span><b>PREVIEW</b></div>`:`<b>지구를 탐색하세요.</b><p>실제 데이터가 연결되면 출처·관측시각·상태를 바탕으로 정보가 표시됩니다.</p>`}
async function cesium(){if(!window.Cesium)return;try{v=new Cesium.Viewer('g',{baseLayer:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,vrButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider()});v.useBrowserRecommendedResolution=false;v.resolutionScale=1;v.scene.globe.baseColor=Cesium.Color.fromCssColorString('#07131c');v.scene.globe.enableLighting=true;v.scene.globe.showGroundAtmosphere=true;v.scene.fog.enabled=false;v.scene.moon.show=false;v.scene.screenSpaceCameraController.enableTilt=false;v.scene.screenSpaceCameraController.enableLook=false;v.clock.shouldAnimate=false;try{let p=await Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII'));let l=v.imageryLayers.addImageryProvider(p);l.brightness=.88;l.contrast=1.04;l.saturation=.92}catch(e){console.warn(e)}v.camera.setView({destination:Cesium.Cartesian3.fromDegrees(127,25,21000000)});v.scene.postRender.addEventListener(()=>{let p=v.camera.positionCartographic;if(!p)return,0;let la=Cesium.Math.toDegrees(p.latitude),lo=Cesium.Math.toDegrees(p.longitude);coord.textContent=`${Math.abs(la).toFixed(1)}°${la>=0?'N':'S'} · ${Math.abs(lo).toFixed(1)}°${lo>=0?'E':'W'}`;alt.textContent=`ALT ${Math.round(p.height/1000).toLocaleString()} km`});document.documentElement.dataset.c=1;v.scene.requestRender()}catch(e){console.error(e)}}mount();cesium();
