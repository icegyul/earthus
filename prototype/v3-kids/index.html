/* ══════════════════════════════════════════════════════════════
   바람 — 윈디식 흐름선
   격자에서 u·v 를 읽어 입자를 떠내려 보내고, 지나간 자리를 천천히 지워
   꼬리를 남긴다. 방향과 상대 세기는 실측 그대로다.

   ⚠️ 흐르는 속도만 과장한다. 실제 10m/s 는 1초에 0.0001도라 눈에 안 보인다.
      화면에 그렇다고 적는다 — 위치와 방향은 사실, 흐름 속도는 보이라고 키운 값.

   ⚠️ 격자 방향을 물리로 확인했다(2026-09-03): y=0 이 lat0(-80°)이고 북쪽으로
      올라간다. 소말리 제트(10N 60E, 9월 남서풍)가 이 해석에서만 u>0·v>0 로
      맞았다. 뒤집으면 바람이 통째로 거꾸로 흐른다.
   ══════════════════════════════════════════════════════════════ */
let WIND = null;
const windCv = $('#windcv'), windCtx = windCv.getContext('2d');
let particles = [], windOn = false;
const PARTICLES = 2600;
// 한 프레임의 이동은 픽셀 이하다. 꼬리는 그 점들이 여러 프레임 쌓여 생긴다 —
// 지우는 속도를 늦춰야 선으로 보인다. 크면 점만 찍히고 작으면 화면이 뿌옇게 찬다.
const TRAIL_FADE = 0.034;
// 흐름 속도 과장. 실제 10m/s 는 1초에 0.0001도라 프레임당 1픽셀도 못 간다.
// 물리 단위 대신 '초당 각도'로 잡는다 — 10m/s 가 초당 약 6도를 가게.
const DEG_PER_MS = 2.2;        // (도/초) / (m/s) — 10m/s 가 초당 22도

async function loadWind(){
  WIND = await fetch('https://earthus-cache-kr.s3.us-east-2.amazonaws.com/wind/global.json')
    .then(r => { if(!r.ok) throw new Error(`wind ${r.status}`); return r.json(); });
  bridgeLoaded();
  seedParticles();
}

function seedParticles(){
  particles = [];
  for(let i = 0; i < PARTICLES; i++) particles.push(newParticle());
}
function newParticle(){
  // 면적에 고르게 뿌린다 — 위도로 균등하게 뿌리면 극에 몰린다
  return { lat: Math.asin(Math.random()*2 - 1) * 180/Math.PI,
           lon: Math.random()*360 - 180,
           age: Math.random()*90 | 0 };
}

/* 격자 겹선형 보간. 경도는 감아 돌고, 위도는 격자 밖이면 바람이 없다. */
function sampleWind(lat, lon){
  if(!WIND) return null;
  const { nx, ny, res, lat0, lon0, u, v } = WIND;
  const fy = (lat - lat0)/res, fx = (((lon - lon0) % 360) + 360) % 360 / res;
  if(fy < 0 || fy > ny-1) return null;
  const y0 = Math.floor(fy), x0 = Math.floor(fx);
  const ty = fy - y0, tx = fx - x0;
  const y1 = Math.min(y0+1, ny-1), x1 = (x0+1) % nx;
  const i00 = y0*nx + (x0 % nx), i10 = y0*nx + x1, i01 = y1*nx + (x0 % nx), i11 = y1*nx + x1;
  const lerp = (a,b,t) => a + (b-a)*t;
  return {
    u: lerp(lerp(u[i00], u[i10], tx), lerp(u[i01], u[i11], tx), ty),
    v: lerp(lerp(v[i00], v[i10], tx), lerp(v[i01], v[i11], tx), ty),
  };
}

/* 바람 색 — 느리면 연하고 빠르면 진하다. 색으로 세기를 읽게 한다. */
function windColor(sp){
  if(sp < 4)  return 'rgba(190,225,255,';
  if(sp < 9)  return 'rgba(150,240,220,';
  if(sp < 15) return 'rgba(255,236,150,';
  if(sp < 22) return 'rgba(255,178,110,';
  return            'rgba(255,140,170,';
}

const _wv = new THREE.Vector3();
let lastCam = null;

/* ⚠️ 꼬리는 화면 좌표에 쌓인다. 지구가 돌면 옛 꼬리가 옛 자리에 그대로 남아
   선이 눌어붙은 것처럼 보인다. 그래서 카메라가 움직인 프레임은 부드럽게
   지우지 않고 통째로 지운다 — 지구가 멈추면 다시 꼬리가 자란다. */
function camMoved(){
  const now = [yaw, pitch, dist];
  const moved = !lastCam ||
    Math.abs(now[0]-lastCam[0]) > 1e-4 ||
    Math.abs(now[1]-lastCam[1]) > 1e-4 ||
    Math.abs(now[2]-lastCam[2]) > 1e-4;
  lastCam = now;
  return moved;
}

function drawWind(dt, w, h){
  if(!windOn || !WIND) return;
  if(camMoved()){
    windCtx.clearRect(0, 0, w, h);          // 돌리는 동안에는 잔상을 남기지 않는다
  } else {
    // 지나간 자리를 조금씩 지워 꼬리를 남긴다 (배경을 덮지 않고 지운다)
    windCtx.globalCompositeOperation = 'destination-out';
    windCtx.fillStyle = `rgba(0,0,0,${TRAIL_FADE})`;
    windCtx.fillRect(0, 0, w, h);
    windCtx.globalCompositeOperation = 'source-over';
  }
  windCtx.lineWidth = 1.5;
  windCtx.lineCap = 'round';

  camera.getWorldPosition(_c);
  const step = Math.min(0.05, dt);

  for(const p of particles){
    const s = sampleWind(p.lat, p.lon);
    if(!s){ Object.assign(p, newParticle()); continue; }

    const lat0 = p.lat, lon0 = p.lon;
    const cosLat = Math.max(0.15, Math.cos(p.lat*Math.PI/180));
    p.lat += s.v * DEG_PER_MS * step;
    p.lon += s.u * DEG_PER_MS / cosLat * step;
    if(p.lon > 180) p.lon -= 360; else if(p.lon < -180) p.lon += 360;

    // 수명이 다하면 다시 뿌린다 — 안 그러면 수렴대에 다 모여 뭉친다
    if(++p.age > 170 || p.lat > 88 || p.lat < -88){ Object.assign(p, newParticle()); continue; }

    _wv.copy(llToVec(lat0, lon0, R*1.004)).applyMatrix4(earthGroup.matrixWorld);
    const face0 = _wv.clone().normalize().dot(_c.clone().sub(_wv).normalize());
    if(face0 <= 0.02) continue;                     // 지구 뒤는 그리지 않는다
    const a = _wv.clone().project(camera);
    _wv.copy(llToVec(p.lat, p.lon, R*1.004)).applyMatrix4(earthGroup.matrixWorld);
    const b = _wv.clone().project(camera);

    const x0 = (a.x*0.5+0.5)*w, y0v = (-a.y*0.5+0.5)*h;
    const x1 = (b.x*0.5+0.5)*w, y1v = (-b.y*0.5+0.5)*h;
    if(Math.abs(x1-x0) > w*0.3) continue;           // 경도 이음매를 건너뛴 선분

    const sp = Math.hypot(s.u, s.v);
    windCtx.strokeStyle = windColor(sp) + Math.min(1, 0.45 + face0*0.55).toFixed(2) + ')';
    windCtx.beginPath(); windCtx.moveTo(x0, y0v); windCtx.lineTo(x1, y1v); windCtx.stroke();
  }
}

$('#b-wind').addEventListener('click', e => {
  windOn = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(windOn));
  windCv.style.display = windOn ? '' : 'none';
  if(windOn) seedParticles();
  else windCtx.clearRect(0, 0, windCv.width, windCv.height);
});

/* ══════════════════════════════════════════════════════════════
   땅 — 세계 산맥
   손으로 그리지 않는다. Natural Earth 에 산맥 222개가 폴리곤으로 있고
   222개 전부 한국어 이름이 붙어 있다. 화면에 몇 개를 띄울지는 원본이 정한
   라벨 우선순위(pri)를 따른다 — 우리가 임의로 고르지 않는다.
   ══════════════════════════════════════════════════════════════ */
let MOUNTAINS = [];
let mtnLine = null;
const mtnMarks = [];
const peakMarks = [];   // 이름 있는 산봉우리

async function loadMountains(){
  const j = await fetch('../data/mountains.json').then(r=>r.json());
  // 산맥 en 은 자료에 대문자로 들어 있다(ALPS). 화면에는 첫 글자만 대문자로 낸다.
  if(window.KIDS_I18N) window.KIDS_I18N.add(Object.fromEntries((j.ranges||[]).map(r=>[r.ko,
    String(r.en||'').toLowerCase().replace(/(^|[\s-])([a-z])/g, (_,a,b)=>a+b.toUpperCase())])));
  MOUNTAINS = j.ranges;

  let segs = 0;
  for(const m of MOUNTAINS) for(const r of m.rings) segs += (r.length - 1);
  const pos = new Float32Array(segs * 2 * 3);
  let i = 0;
  for(const m of MOUNTAINS){
    for(const ring of m.rings){
      for(let k = 0; k < ring.length - 1; k++){
        // 경도 이음매를 건너뛰는 선분은 그리지 않는다 (지구를 가로지르는 줄이 생긴다)
        if(Math.abs(ring[k][0] - ring[k+1][0]) > 180){ i += 6; continue; }
        const a = llToVec(ring[k][1],   ring[k][0],   R*1.016);
        const b = llToVec(ring[k+1][1], ring[k+1][0], R*1.016);
        pos[i++]=a.x; pos[i++]=a.y; pos[i++]=a.z;
        pos[i++]=b.x; pos[i++]=b.y; pos[i++]=b.z;
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  mtnLine = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0xE0A25C, transparent: true, opacity: 0.95, depthWrite: false }));
  mtnLine.renderOrder = 4;
  mtnLine.visible = false;
  earthGroup.add(mtnLine);

  /* 산맥은 덩어리의 테두리라 "저기가 히말라야" 까지만 말한다. 아이가 찾는 것은
     그 안의 한 봉우리다 — 에베레스트가 몇 미터인지, 백두산이 어디 있는지.
     z(원본의 min_zoom)가 작을수록 이름난 산이다. 우리가 고르지 않고 그 값을 쓴다. */
  try {
    const pk = await fetch('../data/peaks.json').then(r=>r.json());
    if(window.KIDS_I18N) window.KIDS_I18N.add(Object.fromEntries((pk.items||[]).map(x=>[x.ko, x.en||x.ko])));
    for(const q of (pk.items||[]).slice()
                    .sort((a,b)=> (a.z-b.z) || (b.m-a.m))){
      const el = document.createElement('div');
      el.className = 'pk';
      el.innerHTML = `<b>▲</b>${q.ko}<i>${q.m.toLocaleString('ko-KR')}m</i>`;
      el.style.visibility = 'hidden';
      stage.appendChild(el);
      // 폭은 지금 한 번만 잰다. 글이 바뀌지 않으므로 매 프레임 재면 배치만 느려진다.
      peakMarks.push({ q, el, w: el.offsetWidth, pos: llToVec(q.at[1], q.at[0], R*1.02) });
    }
  } catch(e){ console.warn('산봉우리 로드 실패', e); }

  /* 이름표는 전부 만들어 두고 화면에는 자리가 되는 만큼만 띄운다.
     pri 는 원본의 MIN_LABEL — 작을수록 이름난 산맥이다. 스물다섯 개만 만들어 두니
     화면을 어디로 돌리든 늘 같은 산맥만 떴다. */
  for(const m of MOUNTAINS.slice().sort((a,b)=> (a.pri-b.pri) || 0)){
    const el = document.createElement('div');
    el.className = 'mt'; el.textContent = m.ko;
    el.style.visibility = 'hidden';
    stage.appendChild(el);
    mtnMarks.push({ m, el, w: el.offsetWidth, pos: llToVec(m.at[1], m.at[0], R*1.02) });
  }
}

/* ══════════════════════════════════════════════════════════════
   살아 있는 것들 — 바다거북이 간 길, 철새가 간 곳

   둘 다 우리 서비스(aws/sea-turtle, aws/migbird)가 기관 자료로 만들어 둔 것이다.
   여기서는 화면에 올리기만 한다.

   ■⚠️⚠️⚠️ 바다거북은 **공공누리 제4유형**이다 — 출처표시·상업적 이용금지·변경금지.
      · 좌표를 **가공 없이 그대로** 찍는다. 솎아내지도 부드럽게 하지도 않는다.
      · 이 자료로 **분석 문장을 만들지 않는다**. 그게 곧 '변경'이다.
        화면에 적는 말은 기관이 준 것과 우리가 센 개수뿐이다.
      · v3 는 언제나 무료이므로 상업적 이용 금지에 걸리지 않는다.
      · 출처를 화면에 분명히 적는다 — 카드와 좌하단 출처 두 곳 모두.

   ■⚠️⚠️ 바다거북은 **실시간이 아니다.** 기관이 "추적이 종료된 수신기에 대해서만"
      공개한다. 지나간 길이다. 그 문장을 자료가 들고 오므로 그대로 화면에 낸다.

   ■⚠️⚠️ 철새는 **경로가 아니다.** 떠난 곳과 도착한 곳 두 점뿐이다.
      그래서 도착지는 점이 아니라 **원**으로 그린다 — 원이 곧 '이 안 어딘가'다.
      '중국 지린성'은 남한의 두 배다. 가운데에 점을 찍으면 거기 갔다는 거짓말이 된다.
   ══════════════════════════════════════════════════════════════ */
let TURTLES = null, MIGBIRD = null;
let turtleLine = null, turtleOn = false;
let birdArc = null, birdRing = null, birdOn = false;
const turtleMarks = [], birdMarks = [];

// 종마다 다른 색. 등껍질 색이 아니라 서로 구분하려고 고른 색이다.
const TURTLE_COLOR = {
  '푸른바다거북':   [0.38, 0.86, 0.65],
  '붉은바다거북':   [1.00, 0.58, 0.40],
  '매부리바다거북': [1.00, 0.83, 0.39],
};
const md = t => String(t || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

async function loadTurtles(){
  TURTLES = await fetch('../data/sea-turtle.json').then(r => r.json());
  const list = TURTLES.turtles || [];
  let segs = 0;
  for(const t of list) segs += Math.max(0, (t.track || []).length - 1);
  const pos = new Float32Array(segs*2*3), col = new Float32Array(segs*2*3);
  let i = 0, c = 0;
  for(const t of list){
    const rgb = TURTLE_COLOR[t.nameKo] || [0.8, 0.9, 1.0];
    const tr = t.track || [];
    for(let k = 0; k < tr.length-1; k++){
      const a = llToVec(tr[k].lat,   tr[k].lon,   R*1.008);
      const b = llToVec(tr[k+1].lat, tr[k+1].lon, R*1.008);
      pos[i++]=a.x; pos[i++]=a.y; pos[i++]=a.z;
      pos[i++]=b.x; pos[i++]=b.y; pos[i++]=b.z;
      for(let q = 0; q < 2; q++){ col[c++]=rgb[0]; col[c++]=rgb[1]; col[c++]=rgb[2]; }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  turtleLine = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.92, depthWrite: false }));
  turtleLine.renderOrder = 4;
  turtleLine.visible = false;
  earthGroup.add(turtleLine);

  // 추적이 끝난 자리에 거북을 놓는다. 거기서 멈춘 것이지 거기 사는 게 아니다.
  for(const t of list){
    const tr = t.track || [];
    if(!tr.length) continue;
    const p = tr[tr.length-1];
    const el = document.createElement('div');
    el.className = 'tt';
    el.innerHTML = '<b>🐢</b>' + t.nameKo;
    el.style.visibility = 'hidden';
    stage.appendChild(el);
    turtleMarks.push({ t, el, w: el.offsetWidth, pos: llToVec(p.lat, p.lon, R*1.02) });
  }
}

async function loadMigbird(){
  MIGBIRD = await fetch('../data/migbird.json').then(r => r.json());
  const places = new Map((MIGBIRD.places || []).map(p => [p.name, p]));

  /* 떠난 곳에서 도착한 곳으로 이은 선. **날아간 길이 아니다** — 두 점뿐인 자료라
     사이를 잇는 선은 우리가 그은 것이다. 그래서 땅에서 띄워 호(弧)로 그린다.
     지면에 붙은 선으로 그리면 "이 길로 갔다"로 읽힌다. */
  const A = [];
  for(const tp of (MIGBIRD.trips || [])){
    const a = places.get(tp.from), b = places.get(tp.to);
    if(!a || !b) continue;
    const va = llToVec(a.lat, a.lon, 1).normalize();
    const vb = llToVec(b.lat, b.lon, 1).normalize();
    const lift = 0.06 + 0.22 * Math.min(1, va.angleTo(vb) / 0.9);   // 멀수록 높이 뜬다
    const N = 40, prev = new THREE.Vector3();
    for(let k = 0; k <= N; k++){
      const u = k/N;
      const v = va.clone().lerp(vb, u).normalize()
                  .multiplyScalar(R * (1.01 + lift * Math.sin(Math.PI*u)));
      if(k) A.push(prev.x, prev.y, prev.z, v.x, v.y, v.z);
      prev.copy(v);
    }
  }
  const g1 = new THREE.BufferGeometry();
  g1.setAttribute('position', new THREE.BufferAttribute(new Float32Array(A), 3));
  birdArc = new THREE.LineSegments(g1, new THREE.LineBasicMaterial({
    color: 0x9FE0FF, transparent: true, opacity: 0.5, depthWrite: false }));
  birdArc.renderOrder = 4;
  birdArc.visible = false;
  earthGroup.add(birdArc);

  /* 도착지는 **원**이다. 반경 r 이 곧 "이 안 어딘가"라는 뜻이고, 그게 이 자료가
     가진 정밀도의 전부다. 점을 찍으면 없는 정밀도를 지어내는 것이다. */
  const C = [];
  for(const pl of (MIGBIRD.places || [])){
    if(pl.home) continue;                       // 떠난 곳은 시·군 단위라 점으로 찍는다
    const rad = (pl.r || 50) / 6371;            // km → 라디안
    const cen = llToVec(pl.lat, pl.lon, 1).normalize();
    let ax = new THREE.Vector3(0, 1, 0).cross(cen);
    if(ax.lengthSq() < 1e-6) ax = new THREE.Vector3(1, 0, 0).cross(cen);
    ax.normalize();
    const ay = cen.clone().cross(ax).normalize();
    const N = 64, prev = new THREE.Vector3();
    for(let k = 0; k <= N; k++){
      const th = k/N*Math.PI*2;
      const v = cen.clone().multiplyScalar(Math.cos(rad))
        .addScaledVector(ax, Math.sin(rad)*Math.cos(th))
        .addScaledVector(ay, Math.sin(rad)*Math.sin(th))
        .multiplyScalar(R*1.012);
      if(k) C.push(prev.x, prev.y, prev.z, v.x, v.y, v.z);
      prev.copy(v);
    }
  }
  const g2 = new THREE.BufferGeometry();
  g2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(C), 3));
  birdRing = new THREE.LineSegments(g2, new THREE.LineBasicMaterial({
    color: 0x7FD6FF, transparent: true, opacity: 0.85, depthWrite: false }));
  birdRing.renderOrder = 4;
  birdRing.visible = false;
  earthGroup.add(birdRing);

  // 이름표 — 오간 횟수가 많은 곳부터
  for(const pl of (MIGBIRD.places || []).slice().sort((a, b) => (b.n||0) - (a.n||0))){
    const el = document.createElement('div');
    el.className = 'bd' + (pl.home ? ' home' : '');
    el.innerHTML = '<b>' + (pl.home ? '🪶' : '◎') + '</b>' + pl.name + '<i>' + pl.n + '건</i>';
    el.style.visibility = 'hidden';
    stage.appendChild(el);
    birdMarks.push({ pl, el, w: el.offsetWidth, pos: llToVec(pl.lat, pl.lon, R*1.02) });
  }
}

/* ══════════════════════════════════════════════════════════════
   과거 축 — 한국 공룡 화석지와 판 회전
   화석은 지금 좌표에서 나오지만, 그 공룡이 살던 시절엔 다른 자리였다.
   한반도(판 601)는 강체로 움직이므로 회전 행렬 하나면 전부 옮겨진다.
   ══════════════════════════════════════════════════════════════ */
let FOSSILS = [], PALEO = null, timeIdx = 0;

/* ── 시간을 이어서 흐르게 ──────────────────────────────────────
   판 회전은 26 장의 정지 화면으로 들어온다. 그것만 갈아 끼우면 땅이 순간이동한다.
   실제로 그렇게 보였다 — '땅이 부딪히는 장면'이 아니라 슬라이드 일곱 장이었다.

   두 장 사이를 사원수 구면보간으로 잇는다. 판 운동은 강체 회전이라 두 자세 사이의
   최단 경로가 곧 그 사이의 자세다 — GPlates 가 유한회전을 사이 시각으로 옮길 때
   하는 것과 같은 연산이고, 우리가 지어내는 중간 그림이 아니다.

   ⚠️ 다만 우리 26 장은 모델이 가진 시각의 부분집합이다. 촘촘한 구간(0~200Ma)에서는
      GPlates 가 주는 답과 거의 같지만, 사이가 벌어진 구간에서는 벌어질 수 있다.

   ⚠️ 시간 축은 프레임 번호가 아니라 백만 년(Ma)이다. 프레임 간격이 5Ma 도 있고
      60Ma 도 있어서 번호를 고르게 훑으면 땅이 들쭉날쭉 움직인다.
      화면에서 빨라 보이면 실제로 빨랐던 것이어야 한다. */
let maNow = 0, maTarget = 0;
let PALEO_XYZ = null, PALEO_BRK = null, PLATE_IDS = [];
const PLATE_Q = new Map();      // 판번호 → 프레임별 자세(사원수)
const PLATE_NOW = new Map();    // 판번호 → 지금 이 순간의 3×3 (없으면 null)
const _m4 = new THREE.Matrix4(), _qa = new THREE.Quaternion();
let paleoLine = null, paleoFill = null, paleoOn = false;   // 전지구 옛 해안선과 그 안의 땅
let PALEO_POS = null;                    // 선과 면이 함께 쓰는 정점 한 벌
const contMarks = [];                    // 대륙 이름표

/* 이름을 붙일 판. 판 번호는 GPlates 관례를 그대로 쓴다.
   해안선 점이 많고 오래 살아 있는 것만 고른다 — 잘게 나뉜 미소판은 이름이 없다. */
const PLATE_NAMES = {
  101:'북아메리카', 102:'그린란드', 201:'남아메리카', 301:'유라시아',
  302:'유럽', 401:'시베리아', 501:'인도', 601:'한반도',
  701:'아프리카', 714:'서아프리카', 801:'오스트레일리아', 8011:'오스트레일리아',
};

/* 시대 이름. 겹치는 구간이 있는 것이 사실이라 그대로 적는다 —
   곤드와나는 판게아의 재료이자 파편이라 두 번 나온다.
   판노티아는 존재 자체가 논쟁 중이라 단정하지 않는다. */
const ERAS = [
  { from: 541, to: 601, ko: '판노티아',        note: '있었는지 자체가 아직 논쟁 중인 초대륙' },
  { from: 336, to: 540, ko: '곤드와나',        note: '남쪽 대륙들이 이미 하나로 모여 있던 때' },
  { from: 176, to: 335, ko: '판게아',          note: '모든 땅이 하나 — 북쪽은 로라시아, 남쪽은 곤드와나' },
  { from:  67, to: 175, ko: '판게아가 갈라진다', note: '로라시아와 곤드와나로 나뉘는 중' },
  { from:   1, to:  66, ko: '지금 모양으로',     note: '대륙이 오늘 자리를 찾아간다' },
];
function eraAt(ma){ return ERAS.find(e => ma >= e.from && ma <= e.to) || null; }

/* 현재 해안선 한 벌 + 판별 회전 행렬. GPlates 가 하는 계산과 같은 것이라
   근사가 아니다 — 66·100·200·400 Ma 를 원본과 대조해 오차 0.02km 미만을 확인했다.
   시대별로 해안선을 통째로 구우면 9MB, 이 방식은 gzip 355KB 다. */
async function loadPaleoEarth(){
  PALEO = await fetch('../data/paleo-earth.json').then(r=>r.json());
  $('#timeslider').max = String(PALEO.frames.length - 1);
  $('#tb-far').textContent = whenKo(PALEO.frames[PALEO.frames.length-1].t);

  /* 점을 미리 지오센트릭 단위벡터로 굽는다. 매 프레임 6만 5천 점에 삼각함수를
     다시 부르지 않기 위해서다 — 회전은 강체라 곱셈 아홉 번이면 끝난다. */
  let N = 0;
  for(const l of PALEO.lines) N += l.c.length;
  PALEO_XYZ = new Float32Array(N*3);
  PALEO_BRK = new Uint8Array(N);
  let o = 0;
  for(const l of PALEO.lines){
    l.o = o; l.n = l.c.length;
    for(let k = 0; k < l.n; k++){
      const la = l.c[k][1]*Math.PI/180, lo = l.c[k][0]*Math.PI/180, b = (o+k)*3;
      PALEO_XYZ[b]   = Math.cos(la)*Math.cos(lo);
      PALEO_XYZ[b+1] = Math.cos(la)*Math.sin(lo);
      PALEO_XYZ[b+2] = Math.sin(la);
    }
    /* 회전은 거리를 바꾸지 않는다 — 끊을 선분은 지금 한 번만 가려내면 된다.
       예전에는 매 프레임 경도 차이(>180도)로 걸렀는데, 3차원에서는 날짜변경선을
       지나는 선분도 그냥 이웃한 두 점이라 멀쩡한 해안선을 끊고 있었다. */
    for(let k = 0; k < l.n-1; k++){
      const a = (o+k)*3, c = (o+k+1)*3;
      const dx = PALEO_XYZ[a]-PALEO_XYZ[c], dy = PALEO_XYZ[a+1]-PALEO_XYZ[c+1], dz = PALEO_XYZ[a+2]-PALEO_XYZ[c+2];
      if(dx*dx + dy*dy + dz*dz > 0.12) PALEO_BRK[o+k] = 1;   // 현 길이 0.35 ≈ 20도
    }
    o += l.n;
  }

  // 판마다 프레임별 자세를 사원수로. 보간은 여기서만 일어난다.
  for(let i = 0; i < PALEO.frames.length; i++){
    const fm = PALEO.frames[i].m;
    for(const pid in fm){
      const m = fm[pid];
      let A = PLATE_Q.get(pid);
      if(!A){ A = new Array(PALEO.frames.length).fill(null); PLATE_Q.set(pid, A); PLATE_NOW.set(pid, new Float64Array(10)); }   // [9] 는 '이 시대에 있는 판인가'
      _m4.set(m[0],m[1],m[2],0, m[3],m[4],m[5],0, m[6],m[7],m[8],0, 0,0,0,1);
      A[i] = new THREE.Quaternion().setFromRotationMatrix(_m4);
    }
  }
  PLATE_IDS = [...PLATE_Q.keys()];

  /* 선과 면이 같은 정점을 쓴다. 매 프레임 옮기는 건 점 6만 5천 개 한 벌뿐이고,
     무엇을 잇고 무엇을 채울지는 고정된 인덱스가 정한다. */
  PALEO_POS = new THREE.BufferAttribute(new Float32Array(N*3), 3);
  PALEO_POS.setUsage(THREE.DynamicDrawUsage);

  const lineIdx = [];
  const triIdx = [];
  for(const l of PALEO.lines)
    for(let k = 0; k < l.n-1; k++) if(!PALEO_BRK[l.o+k]) lineIdx.push(l.o+k, l.o+k+1);

  /* 채울 다각형을 모은다 — 같은 고리(g)·같은 판(p)에서 나온 조각들을 고리 순서대로
     이어 붙인 것이 그 판이 가진 땅 한 덩어리다. 조각을 따로 닫으면 인도 남해안과
     히말라야 앞자락이 서로 다른 다각형이 되어 인도가 채워지지 않는다. */
  const polys = [];
  const seg = (a, b) => {                       // 두 꼭짓점 사이 현의 길이
    const p1=a*3, p2=b*3;
    return Math.hypot(PALEO_XYZ[p1]-PALEO_XYZ[p2],
                      PALEO_XYZ[p1+1]-PALEO_XYZ[p2+1],
                      PALEO_XYZ[p1+2]-PALEO_XYZ[p2+2]);
  };
  for(let i = 0; i < PALEO.lines.length; ){
    const l = PALEO.lines[i], idx = [];
    let j = i, chord = 0, total = 0;
    while(j < PALEO.lines.length && PALEO.lines[j].p === l.p && PALEO.lines[j].g === l.g){
      const q = PALEO.lines[j];
      if(idx.length){ const d = seg(idx[idx.length-1], q.o); chord += d; total += d; }
      for(let k = 0; k < q.n; k++){
        if(k) total += seg(q.o+k-1, q.o+k);
        idx.push(q.o + k);
      }
      j++;
    }
    if(idx.length > 2){ const d = seg(idx[idx.length-1], idx[0]); chord += d; total += d; }
    polys.push(idx); idx.made = total > 0 ? chord/total : 1;
    i = j;
  }

  let filled = 0, gaveUp = 0, ptsAll = 0, ptsMiss = 0;
  const t0 = performance.now();
  for(const idx of polys){
    if(idx.length < 3) continue;
    ptsAll += idx.length;
    /* 해안선은 잰 것이고 현은 우리가 이은 것이다. 이은 길이가 둘레의 절반을 넘으면
       그 모양은 잰 것보다 지어낸 것이 많다 — 채우지 않고 선만 남긴다.

       판게아 시대 바다 위에 길고 뾰족한 쐐기들이 떠 있던 게 이것이었다. 이웃 판이
       그 시대에 살아 있을 때는 그 아래 가려 안 보이다가, 이웃이 사라지면 드러났다. */
    if(idx.made > 0.3){ gaveUp++; ptsMiss += idx.length; continue; }
    let tri = null;
    for(const sep of [0, 0.0019, 0.0063]){        // 원본 · 12km · 40km
      tri = ringTris(idx, sep);
      if(tri) break;
    }
    if(tri){ filled++; for(let i2=0;i2<tri.length;i2++) triIdx.push(tri[i2]); }
    else { gaveUp++; ptsMiss += idx.length; }
  }
  console.info(`옛 해안선: 땅 ${polys.length}덩어리 중 ${filled}개 채움 / ${gaveUp}개 못 채움 ` +
    `(못 채운 고리의 점 ${ptsMiss}개 = 전체의 ${(100*ptsMiss/ptsAll).toFixed(1)}%) · ` +
    `삼각형 ${triIdx.length/3}개 · ${Math.round(performance.now()-t0)}ms`);

  const geoLine = new THREE.BufferGeometry();
  geoLine.setAttribute('position', PALEO_POS);
  geoLine.setIndex(lineIdx);
  paleoLine = new THREE.LineSegments(geoLine, new THREE.LineBasicMaterial({
    color: 0xFFE0B0, transparent: true, opacity: 0, depthWrite: false }));
  paleoLine.renderOrder = 5;
  paleoLine.visible = false;
  earthGroup.add(paleoLine);

  /* 면은 깊이 검사를 끈다. 큰 삼각형은 구의 현이라 가운데가 표면 아래로 가라앉는데,
     깊이로 겨루면 그 부분이 지구 속에 묻혀 사라진다. 대신 뒷면을 잘라 뒤쪽 반구는
     그리지 않는다 — 감김을 위에서 반시계로 맞춰 둔 이유가 이것이다. */
  const geoFill = new THREE.BufferGeometry();
  geoFill.setAttribute('position', PALEO_POS);
  geoFill.setIndex(triIdx);
  paleoFill = new THREE.Mesh(geoFill, new THREE.MeshBasicMaterial({
    color: 0xA98A57, transparent: true, opacity: 0, depthWrite: false,
    depthTest: false, side: THREE.FrontSide }));
  paleoFill.renderOrder = 4.5;
  paleoFill.visible = false;
  earthGroup.add(paleoFill);
  geoFill.boundingSphere = new THREE.Sphere(new THREE.Vector3(), R*1.01);

  // 이름표 자리는 그 판 해안선의 평균점 — 따로 좌표를 두지 않는다
  const acc = {};
  for(const l of PALEO.lines){
    if(!PLATE_NAMES[l.p]) continue;
    const a = acc[l.p] || (acc[l.p] = [0,0,0]);
    for(const q of l.c){ a[0]+=q[0]; a[1]+=q[1]; a[2]++; }
  }
  const seen = new Set();
  for(const pid of Object.keys(acc)){
    const name = PLATE_NAMES[pid];
    if(seen.has(name)) continue;          // 8011 처럼 같은 대륙이 둘로 나뉜 경우
    seen.add(name);
    const a = acc[pid];
    const el = document.createElement('div');
    el.className = 'cn'; el.textContent = name; el.style.visibility = 'hidden';
    stage.appendChild(el);
    contMarks.push({ pid: +pid, el, lon: a[0]/a[2], lat: a[1]/a[2] });
  }

  // 경계상자는 한 번만. 해안선은 어느 시대에도 이 구를 벗어나지 않는다.
  geoLine.boundingSphere = new THREE.Sphere(new THREE.Vector3(), R*1.01);
  updatePlates();
  drawPaleo();
}

/* 그 시대에 판이 없으면 그 대륙은 그리지 않는다. 없는 땅을 만들지 않는다. */
/* ── 면 만들기 ────────────────────────────────────────────────
   선만 움직이면 땅이 아니라 땅의 그림자다. 해안선 고리 안을 삼각형으로 채운다.

   구 위의 다각형을 평면으로 옮겨 귀 자르기(ear clipping)로 삼각형을 낸다.
   투영은 **고리 중심의 반대편에서 쏘는 등각사영**이다 — 경위도 평면에 그대로
   펴면 날짜변경선을 걸친 고리와 극지방 고리(남극)가 뒤집히는데, 이 투영은
   그 둘을 특별대우 없이 옳게 편다.

   삼각형 목록은 한 번만 만든다. 판은 강체로 도니까 어느 시대에나 같은 목록이
   맞다 — 매 시대 다시 자를 이유가 없다.

   ⚠️ 스스로 교차하는 고리는 귀가 안 나온다. 그러면 그 고리는 **채우지 않는다**.
      억지로 채우면 있지도 않은 땅이 생긴다. 선은 그대로 그린다. */
function ringTris(src, minSep){
  /* src 는 이 다각형을 이루는 꼭짓점 번호들이다. 한 고리에서 같은 판이 가진
     꼭짓점만 고리 순서대로 모은 것 — 빠진 자리는 저절로 현으로 이어지고,
     그 현이 곧 판 경계다.

     너무 가까운 점을 걸러 낸다. minSep=0 이면 겹친 점만 버린다.
     ⚠️ 왜 성기게 다시 시도하나: 1km 해상도의 굽이진 해안은 제 몸을 스치며
        교차하는 일이 있고, 그러면 어떤 삼각분할기도 옳게 자르지 못한다.
        12km 로 성기게 하면 그 스침이 사라진다. 선은 원본 그대로 그리므로
        성겨지는 건 면의 가장자리뿐이다. */
  const P = PALEO_XYZ, loc = new Int32Array(src.length), sep2 = minSep*minSep;
  let n = 0;
  for(let k=0;k<src.length;k++){
    const b=src[k]*3;
    if(n>0){ const q=loc[n-1]*3;
      const dx=P[q]-P[b], dy=P[q+1]-P[b+1], dz=P[q+2]-P[b+2];
      if(dx*dx+dy*dy+dz*dz <= sep2) continue; }
    loc[n++] = src[k];
  }
  while(n>2){ const f=loc[0]*3, e=loc[n-1]*3;
    const dx=P[f]-P[e], dy=P[f+1]-P[e+1], dz=P[f+2]-P[e+2];
    if(dx*dx+dy*dy+dz*dz <= sep2) n--; else break; }
  if(n < 3) return null;

  // 고리 중심 — 그 반대편이 투영 기준점이 된다
  let cx=0, cy=0, cz=0;
  for(let k=0;k<n;k++){ const b=loc[k]*3; cx+=P[b]; cy+=P[b+1]; cz+=P[b+2]; }
  let L = Math.hypot(cx,cy,cz);
  if(L < 1e-6) return null;                    // 지구 전체에 흩어진 고리 — 채울 수 없다
  cx/=L; cy/=L; cz/=L;
  // 직교 기저 (u, v, c) — 오른손. 그래야 평면의 반시계가 곧 바깥에서 본 반시계다.
  const tx = Math.abs(cx) < 0.9 ? 1 : 0, ty = Math.abs(cx) < 0.9 ? 0 : 1;
  const d = tx*cx + ty*cy;
  let ux = tx - d*cx, uy = ty - d*cy, uz = -d*cz;
  L = Math.hypot(ux,uy,uz); ux/=L; uy/=L; uz/=L;
  const vx = cy*uz - cz*uy, vy = cz*ux - cx*uz, vz = cx*uy - cy*ux;

  const flat = new Float64Array(n*2);
  for(let k=0;k<n;k++){
    const b=loc[k]*3, px=P[b], py=P[b+1], pz=P[b+2];
    const den = 1 + (px*cx + py*cy + pz*cz);
    if(den < 0.15) return null;                // 반구를 넘게 퍼진 고리 — 투영이 터진다
    flat[k*2]   = (px*ux + py*uy + pz*uz)/den;
    flat[k*2+1] = (px*vx + py*vy + pz*vz)/den;
  }

  const tri = earcut(flat, null, 2);
  if(!tri.length) return null;

  /* 제대로 잘렸는지 넓이로 확인한다. 옳은 삼각분할은 조각의 넓이 합이 다각형
     넓이와 같고, deviation 이 그 차이를 넓이로 나눈 값이다.

     이 검사가 없을 때 판게아 시대 바다 위에 뾰족한 쐐기들이 떠 있었다.
     선은 몰라도 면은 다르다 — 면은 '여기가 땅이었다'는 말이다.
     확신이 없으면 채우지 않고 선만 남긴다. */
  if(deviation(flat, null, 2, tri) > 0.01) return null;

  /* 감김은 손대지 않는다. earcut 은 들어온 방향과 무관하게 바깥 고리를 제 기준으로
     한 방향으로 세워 놓고 자르므로, 나오는 삼각형의 감김은 늘 같다.
     여기 투영이 (u,v,c) 오른손 기저라 그 감김이 곧 '바깥에서 본 반시계' 이고,
     three 는 그것을 앞면으로 본다.

     입력 방향을 보고 뒤집었더니 절반이 뒷면이 되어 잘려 나갔다 — 인도가 그래서
     테두리만 남고 속이 비어 있었다. */
  const out = new Uint32Array(tri.length);
  for(let i=0;i<tri.length;i++) out[i] = loc[tri[i]];
  return out;
}

/* maNow(백만 년) 가 어느 두 프레임 사이인지, 그리고 얼마나 왔는지 */
function frameSpan(ma){
  const F = PALEO.frames, last = F.length-1;
  if(ma <= F[0].t) return [0, 0, 0];
  if(ma >= F[last].t) return [last, last, 0];
  let k = 0; while(k < last-1 && F[k+1].t < ma) k++;
  return [k, k+1, (ma - F[k].t) / (F[k+1].t - F[k].t)];
}

/* 모든 판의 지금 자세를 한 번에 구해 둔다. 해안선·이름표·화석이 같은 값을 본다. */
function updatePlates(){
  if(!PALEO) return;
  const [k0, k1, u] = frameSpan(maNow);
  for(const pid of PLATE_IDS){
    const A = PLATE_Q.get(pid), a = A[k0], b = A[k1], out = PLATE_NOW.get(pid);
    // 한쪽 시대에 없는 판은 그 구간에서 그리지 않는다. 없는 땅을 만들지 않는다.
    if(!a || !b){ out[9] = 0; continue; }
    _qa.copy(a); if(u > 0) _qa.slerp(b, u);
    _m4.makeRotationFromQuaternion(_qa);
    const e = _m4.elements;                    // three 는 열 우선, 우리 행렬은 행 우선
    out[0]=e[0]; out[1]=e[4]; out[2]=e[8];
    out[3]=e[1]; out[4]=e[5]; out[5]=e[9];
    out[6]=e[2]; out[7]=e[6]; out[8]=e[10];
    out[9] = 1;
  }
}
const plateNow = pid => { const m = PLATE_NOW.get(String(pid)); return (m && m[9]) ? m : null; };

/* 점 한 벌만 옮긴다. 무엇을 잇고 무엇을 채울지는 고정된 인덱스가 이미 정해 뒀다.
   그 시대에 없는 판은 점을 원점으로 모은다 — 선은 길이 0, 삼각형은 넓이 0 이 되어
   저절로 사라진다. 없는 땅을 그리지 않는 가장 싼 방법이다. */
function drawPaleo(){
  if(!PALEO_POS || !PALEO || !PALEO_XYZ) return;
  const arr = PALEO_POS.array, P = PALEO_XYZ, RR = R*1.006;
  let drawn = 0, skipped = 0;
  for(const l of PALEO.lines){
    const m = plateNow(l.p), n = l.n, o = l.o;
    if(!m){ arr.fill(0, o*3, (o+n)*3); skipped++; continue; }
    drawn++;
    const m0=m[0],m1=m[1],m2=m[2],m3=m[3],m4=m[4],m5=m[5],m6=m[6],m7=m[7],m8=m[8];
    for(let k = 0; k < n; k++){
      const b = (o+k)*3, x = P[b], y = P[b+1], z = P[b+2];
      // 지오센트릭(x=적도0도, y=적도90도, z=북극) → three(x, z, -y)
      arr[b]   =  (m0*x+m1*y+m2*z)*RR;
      arr[b+1] =  (m6*x+m7*y+m8*z)*RR;
      arr[b+2] = -(m3*x+m4*y+m5*z)*RR;
    }
  }
  PALEO_POS.needsUpdate = true;
  PALEO._drawn = drawn; PALEO._skipped = skipped;
}

function rotXYZ(lat, lon, m){
  const la = lat*Math.PI/180, lo = lon*Math.PI/180;
  const x = Math.cos(la)*Math.cos(lo), y = Math.cos(la)*Math.sin(lo), z = Math.sin(la);
  const X = m[0]*x + m[1]*y + m[2]*z, Y = m[3]*x + m[4]*y + m[5]*z, Z = m[6]*x + m[7]*y + m[8]*z;
  return { lat: Math.asin(Math.max(-1,Math.min(1,Z)))*180/Math.PI, lon: Math.atan2(Y,X)*180/Math.PI };
}
const fossilMarks = [];
let koreaRings = [];           // 한반도 해안선 (경도,위도) 고리들
let koreaLine = null;          // 회전해서 그리는 윤곽

async function loadPast(){
  FOSSILS = (await fetch('../data/korea-fossils.json').then(r=>r.json())).sites;

  // 한반도 윤곽 — 핀만 옮기고 땅은 두면 거짓말이 된다. 같이 옮긴다.
  try{
    const cr = await fetch('../data/country-reference.json').then(r=>r.json());
    for(const f of cr.features){
      if(f.code !== 'KR' && f.code !== 'KP') continue;
      const g = f.geometry;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
      for(const poly of polys){
        const ring = poly[0];
        if(ring && ring.length > 12) koreaRings.push(ring);   // 아주 작은 섬은 뺀다
      }
    }
  }catch(e){ console.warn('한반도 윤곽 로드 실패', e); }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array(koreaRings.reduce((n,r)=>n+r.length*2*3, 0)), 3));
  koreaLine = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0xFFC24B, transparent: true, opacity: 0, depthWrite: false }));
  koreaLine.renderOrder = 3;
  earthGroup.add(koreaLine);

  for(const site of FOSSILS){
    const el = document.createElement('div');
    el.className = 'pin';
    el.innerHTML = `<div class="dot"></div><div class="nm2">${site.short}</div>`;
    el.addEventListener('click', ()=> openCard(site));
    stage.appendChild(el);
    fossilMarks.push({ site, el });
  }
  placeFossils();
}

/* 시대 t 의 회전 행렬. 사이 값은 이웃 프레임에서 고르지 않고 가까운 쪽을 쓴다 —
   행렬을 선형 보간하면 회전이 아니게 되고, 그건 모델에 없는 값을 만드는 것이다. */
// 한반도는 판 601. 프레임이 아니라 '지금 이 순간' 의 자세를 준다.
function matrixAt(){ return { t: maNow, m: plateNow(601) }; }
function rotateLL(lat, lon, m){
  if(!m) return { lat, lon };
  const la = lat*Math.PI/180, lo = lon*Math.PI/180;
  const x = Math.cos(la)*Math.cos(lo), y = Math.cos(la)*Math.sin(lo), z = Math.sin(la);
  const M = m.m;
  const X = M[0]*x + M[1]*y + M[2]*z;
  const Y = M[3]*x + M[4]*y + M[5]*z;
  const Z = M[6]*x + M[7]*y + M[8]*z;
  return { lat: Math.asin(Math.max(-1,Math.min(1,Z)))*180/Math.PI,
           lon: Math.atan2(Y, X)*180/Math.PI };
}

function placeFossils(){
  const m = matrixAt();
  for(const f of fossilMarks){
    const p = rotateLL(f.site.lat, f.site.lon, m);
    f.pos = llToVec(p.lat, p.lon, R*1.015);
  }
  drawKoreaOutline(m);
}

/* 한반도 윤곽을 그 시대 자리에 그린다. 같은 회전 행렬을 모든 꼭짓점에 적용한다 —
   판이 강체로 움직이므로 이게 근사가 아니라 원본과 같은 계산이다. */
function drawKoreaOutline(m){
  if(!koreaLine) return;
  const arr = koreaLine.geometry.attributes.position.array;
  let i = 0;
  const put = (lat, lon) => {
    const v = llToVec(lat, lon, R*1.014);
    arr[i++] = v.x; arr[i++] = v.y; arr[i++] = v.z;
  };
  for(const ring of koreaRings){
    for(let k = 0; k < ring.length - 1; k++){
      const a = rotateLL(ring[k][1],   ring[k][0],   m);
      const b = rotateLL(ring[k+1][1], ring[k+1][0], m);
      // 경도 이음매를 건너뛰는 선분은 그리지 않는다 (지구를 가로지르는 줄이 생긴다)
      if(Math.abs(a.lon - b.lon) > 180){ i += 6; continue; }
      put(a.lat, a.lon); put(b.lat, b.lon);
    }
  }
  while(i < arr.length) arr[i++] = 0;
  koreaLine.geometry.attributes.position.needsUpdate = true;
  koreaLine.geometry.computeBoundingSphere();
}

/* 시대 표기. 0 은 "지금"이고, 나머지는 만 년이 아니라 아이가 셀 수 있는 말로. */
function whenLabel(ma){
  if(ma === 0) return '지금';
  if(ma < 100) return `${ma.toLocaleString()}만 년 전`.replace(/^(\d+)만/, (_,n)=>`${n*100}만`);
  return `${(ma/100).toFixed(ma%100?1:0)}억 년 전`;
}
function whenKo(ma){
  if(ma === 0) return KT.en ? 'Now' : '지금';
  if(KT.en) return ma >= 1000
    ? `${(ma/1000).toFixed(ma%1000?1:0)} billion years ago`
    : `${ma.toLocaleString()} million years ago`;
  const eok = Math.floor(ma/100), man = ma%100;
  if(eok && man) return `${eok}억 ${man*100}만 년 전`;
  if(eok) return `${eok}억 년 전`;
  return `${ma*100}만 년 전`;
}
/* 우리가 얼마나 아는지를 같이 적는다. 과거는 멀수록 흐려진다. */
function confidenceKo(ma){
  if(ma === 0) return '';
  if(ma <= 83)  return KT('바다 밑 자기 줄무늬로 위치가 잘 묶이는 구간');
  if(ma <= 200) return KT('위치가 대체로 잘 맞는 구간');
  return KT('이 시대는 동서 위치가 덜 확실합니다');
}

/* 슬라이더와 이야기는 '어디로 갈지' 만 정한다. 실제로 옮기는 건 시계(frame)다. */
function setTime(i){
  timeIdx = i;
  maTarget = PALEO ? PALEO.frames[Math.max(0, Math.min(PALEO.frames.length-1, i))].t : 0;
  refreshPast();
}

let _lastWhen = '', _lastEra = '';
function refreshPast(){
  updatePlates();
  drawPaleo();
  const ma = Math.round(maNow);
  const era = eraAt(ma);
  const eraEl = $('#era');
  const eraTxt = (era && paleoOn) ? `${era.ko}<small>${era.note}</small>` : '';
  if(eraTxt !== _lastEra){                      // 매 프레임 글자를 다시 붓지 않는다
    _lastEra = eraTxt;
    eraEl.innerHTML = eraTxt;
    eraEl.hidden = !eraTxt;
  }
  const when = whenKo(ma);
  if(when !== _lastWhen){
    _lastWhen = when;
    $('.tb-when').textContent = when;
    $('.tb-conf').textContent = confidenceKo(ma);
    $('#tb-note').textContent = ma === 0
      ? '한반도를 손으로 되감아 보세요'
      : `한반도가 지금과 다른 자리에 있어요`;
  }
  placeFossils();
  // 과거로 가면 오늘 날씨는 뜻이 없다 — 친구와 말풍선을 접는다
  // 화석 모드에서는 시대와 상관없이 오늘 날씨를 접어 둔다
  const fossilOn = $('#b-fossil').getAttribute('aria-pressed') === 'true';
  const hide = fossilOn || paleoOn || ma > 0;
  for(const m of markers) if(m.kind !== 'name') m.el.style.display = hide ? 'none' : '';
  clouds.visible = !hide && show.cloud;

  // 과거로 가면 오늘 지도는 물러나고 그 시대 한반도가 앞에 선다.
  // 오늘 땅을 그대로 두고 핀만 옮기면 "저기에 저 땅이 있었다"는 거짓말이 된다.
  // 과거로 가면 전지구 대륙을 늘 함께 그린다 — 어느 버튼으로 들어왔든 마찬가지다.
  // 한반도 윤곽만 띄우면 땅이 없는 지구에 선 하나가 떠다니는 그림이 된다.
  const inPast = (fossilOn || paleoOn) && ma > 0;
  if(paleoLine){
    paleoLine.visible = inPast || paleoOn;
    paleoLine.material.opacity = inPast ? 0.95 : (paleoOn ? 0.6 : 0);
  }
  if(paleoFill) paleoFill.visible = paleoLine ? paleoLine.visible : false;
  // 한반도는 과거에 조금 더 밝게 — 화석지가 붙어 있는 곳이라 눈이 갈 자리다
  if(koreaLine) koreaLine.material.opacity = fossilOn ? (ma > 0 ? 1 : 0.55) : 0;
  /* 오늘 지도를 물리는 정도. 이어서 흐르므로 켜고 끄지 않고 서서히 준다 —
     0 과 1 사이를 한 프레임에 건너뛰면 도착하는 순간 화면이 번쩍인다. */
  const back = (fossilOn || paleoOn) ? Math.min(1, maNow/4) : 0;
  earthMat.uniforms.pastFade.value = back;
  if(paleoLine && paleoLine.visible) paleoLine.material.opacity = 0.6 + 0.35*back;
  /* 면은 뒤로 갈수록 진해진다. 지금(0Ma)에는 그 시대 땅이 곧 오늘 땅이라
     덮어 봐야 오늘 지도를 가리기만 한다 — 물러난 만큼만 앞에 선다. */
  if(paleoFill && paleoFill.visible) paleoFill.material.opacity = 0.88*back;

  // 땅이 옮겨 가면 카메라도 따라간다. 화면 밖에서 벌어지면 아이가 놓친다.
  if(storyOn){ sayStory(); followStory(); }
  else if(fossilOn){
    const c = rotateLL(35.6, 127.6, matrixAt());
    yawTarget = yawFor(c.lon); pitchTarget = pitchFor(c.lat);
    following = true;
  }
}

function openCard(site){
  const c = $('#card');
  const conf = site.confidence === 'official'
    ? KT('국가유산청 지정 좌표')
    : `<span class="warn2">${KT('좌표가 지정구역 중심이 아닐 수 있음')}</span>`;
  c.innerHTML = `<button class="x" aria-label="닫기">×</button>
    <h2>${KT(site.short)}</h2>
    <div class="meta">${KT.en ? `Natural Monument No. ${site.nm}` : `천연기념물 ${site.nm}호`} · ${KT(site.name)}</div>
    <div class="kid">${KT(site.kid)}</div>
    <ul>${site.found.map(f=>`<li>${KT(f)}</li>`).join('')}</ul>
    <div class="rec">${KT(site.why)}<br>${KT.en ? 'about' : '약'} ${whenKo(site.ageMa)} · ${conf}</div>`;
  c.hidden = false;
  c.querySelector('.x').addEventListener('click', ()=>{ c.hidden = true; });
  for(const f of fossilMarks) f.el.classList.toggle('sel', f.site.id === site.id);
}

$('#timeslider').addEventListener('input', e => { stopStory(); setTime(+e.target.value); });

/* ── 안내된 장면: 인도가 올라와 박힌다 ──────────────────────────────
   구형 디스플레이 연구가 한목소리로 지목한 학습 변수가 '해설자의 존재'였다.
   자동 재생만으로는 학습이 잘 일어나지 않았다. 그래서 그냥 감기는 게 아니라
   장면마다 무엇을 보라고 적는다.

   데이터는 이미 있다 — 인도(판 501)는 1억 년 전 남위 37도, 지금 북위 21도.
   우리가 만드는 값이 아니라 판 회전이 그렇게 말한다.

   손을 대면 즉시 멈춘다. 조작을 뺏지 않는다는 규칙은 여기서도 같다. */
/* 말은 시각(Ma)에 건다. 흐름이 그 지점을 지날 때 저절로 바뀐다.
   ⚠️ 말 안에 연도를 적지 않는다 — 바로 아래에 '4000만 년 전' 이 큰 글씨로 떠 있는데
      말풍선이 '5000만 년 전' 이라고 하면 둘 중 하나는 거짓말이 된다.

   부딪힌 시각을 45Ma 로 잡은 건 우리 자료가 그렇게 말해서다. 인도가 5Ma 마다
   올라온 위도를 보면 55→50 은 6.8도인데 50→45 에서 3.3도로 반토막이 난다.
   갈 곳이 막힌 것이 회전값에 그대로 남아 있다. */
const STORY = [
  { ma: 100, say: '1억 년 전. 인도는 아직 남쪽 바다에 떠 있는 섬이에요.' },
  { ma:  80, say: '인도가 북쪽으로 올라오기 시작해요.' },
  { ma:  66, say: '아직 아시아와 멀리 떨어져 있어요.' },
  { ma:  50, say: '점점 빨라져요. 곧 부딪혀요.' },
  { ma:  45, say: '부딪혔어요! 갈 곳이 없어진 땅이 위로 솟아요.' },
  { ma:  20, say: '솟아오른 것이 히말라야예요. 지금도 조금씩 높아지고 있어요.' },
  { ma:   2, say: '지금이에요. 저 산맥이 그때 부딪혀 생긴 거예요.' },
];
/* 이야기 동안에는 지구를 물린다. 날씨 화면은 땅을 크게 보는 게 목적이라 3.4 부터
   시작하는데, 인도가 건너온 6,000km 를 그 배율로 담으면 화면에 바다밖에 안 남는다.
   1.5 면 짧은 변으로 ±42도 — 남위 37도의 인도와 북위 45도의 아시아가 함께 들어온다. */
const STORY_FILL = 1.5;
let storyFill = 0;           // 돌아올 자리
const STORY_FROM = 100;      // 어디서 시작하나 (Ma)
const STORY_SEC  = 16;       // 몇 초에 걸쳐 오나
const STORY_RATE = STORY_FROM / STORY_SEC;   // Ma/초 — 시간 축에 맞춘 일정 속도
let storyOn = false, storyEnd = null;

function stopStory(done){
  storyOn = false;
  if(storyEnd){ clearTimeout(storyEnd); storyEnd = null; }
  // 끝까지 본 경우에만 원래 배율로 돌린다. 손을 대서 멈춘 거면 그 자리를 뺏지 않는다.
  if(done && storyFill){ fill = storyFill; applyFill(); }
  storyFill = 0;
  $('#story').classList.remove('playing');
  $('#story').textContent = '▶ 인도가 아시아에 부딪히는 걸 보기';
}

// 지금 시각에 걸린 말 — 지나온 지점 중 가장 최근 것
function sayStory(){
  let st = null;
  for(const x of STORY) if(x.ma >= maNow) st = x;   // STORY 는 옛날→지금 순
  if(st && $('#story').textContent !== st.say) $('#story').textContent = st.say;
}

// 인도를 화면 가운데에 붙들어 둔다. 조금 북쪽을 보게 해서 아시아가 같이 들어오게.
function followStory(){
  const m = plateNow(501);
  if(!m) return;
  const g = rotXYZ(21.4, 79.4, m);
  yawTarget = yawFor(g.lon); pitchTarget = pitchFor(Math.min(38, g.lat + 9));
  following = true;
}

function playStory(){
  if(storyOn){ stopStory(); return; }
  if(!paleoOn) setPaleo(true);              // 대륙이 안 보이면 장면이 성립하지 않는다
  storyOn = true;
  $('#story').classList.add('playing');
  maNow = STORY_FROM; maTarget = 0;
  $('#timeslider').value = '0';
  storyFill = fill; fill = STORY_FILL; applyFill();
  refreshPast();
}
$('#story').addEventListener('click', playStory);
// 인자 없이 부른다 — 이벤트 객체가 done 자리에 들어가면 손댄 사람의 배율을 뺏는다
canvas.addEventListener('pointerdown', () => stopStory());

/* 옛 대륙은 더 이상 따로 켜는 겹이 아니다(2026-09-04 메뉴 폐지).
   자료와 판 회전은 그대로 둔다 — 공룡 발자국의 시간 슬라이더가 같은 것을 쓴다.
   레일에 버튼이 하나 줄고, 옛 해안선은 공룡을 볼 때 함께 켜진다. */
function setPaleo(on){
  paleoOn = on;
  if(paleoLine) paleoLine.visible = on;
  if(!on) stopStory();
  setTime(timeIdx);
}

$('#b-fossil').addEventListener('click', e => {

  e.currentTarget.setAttribute('aria-pressed', String(on));

  headLocked = on;
  $('#head h1').textContent = on ? '공룡은 어디에 있었을까?' : '지구야, 오늘 어때?';
  $('#head p').textContent  = on ? '우리나라 공룡 발자국 여덟 곳' : '지구를 돌려서 지금 날씨를 만나 보세요';

    $('#card').hidden = true;
    $('#timeslider').value = '0'; setTime(0);

    // 화석지는 한반도 남부에 몰려 있다. 여기서는 한반도만 화면에 채운다 —
    // 중국·일본까지 들어오면 여덟 곳이 한 덩어리로 뭉쳐 읽히지 않는다.
    goStop(3);
    yawTarget = yawFor(127.7); pitchTarget = pitchFor(35.9);
    following = true; yawV = pitchV = 0;
  }
  // 화석을 보는 동안 오늘 날씨는 물러난다. 두 시간대를 한 화면에 겹치지 않는다.
  clouds.visible = !on && show.cloud;
  for(const m of markers) if(m.kind !== 'name') m.el.style.display = on ? 'none' : '';
  for(const f of fossilMarks) f.el.style.display = on ? '' : 'none';
});

/* ── 실측 불러오기 (open-meteo 실황) ───────────────────────────
   격자 = 전지구 운량·강수. 도시 = 말풍선.
   값 생성 없음. 실패하면 그리지 않고 배지로 알린다. */
const CITIES = [
  ['서울',37.57,126.98], ['도쿄',35.68,139.69], ['베이징',39.90,116.41],
  ['마닐라',14.60,120.98], ['시드니',-33.87,151.21], ['뭄바이',19.08,72.88],
  ['카이로',30.04,31.24], ['런던',51.51,-0.13], ['모스크바',55.75,37.62],
  ['뉴욕',40.71,-74.01], ['리마',-12.05,-77.04], ['상파울루',-23.55,-46.63],
  ['케이프타운',-33.92,18.42], ['앵커리지',61.22,-149.90], ['롱이어비엔',78.22,15.65],
];

function gridPoints(){
  const pts = [];
  for(let lat=-70; lat<=80; lat+=15)
    for(let lon=-180; lon<180; lon+=20) pts.push({lat, lon});
  return pts;
}

const TTL = 10*60*1000;   // 같은 실황을 10분 안에 다시 부르지 않는다
async function omFetch(pts, fields){
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude='  + pts.map(p=>p.lat).join(',')
    + '&longitude=' + pts.map(p=>p.lon).join(',')
    + '&current='   + fields.join(',');
  const key = 'om:' + fields.join('|') + ':' + pts.length;
  try{
    const hit = JSON.parse(sessionStorage.getItem(key) || 'null');
    if(hit && Date.now()-hit.t < TTL && hit.u === url) return hit.d;
  }catch(e){}
  const r = await fetch(url);
  if(!r.ok) throw new Error('open-meteo ' + r.status);
  const j = await r.json();
  const d = Array.isArray(j) ? j : [j];
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), u:url, d})); }catch(e){}
  return d;
}

/* ⚠️ 2026-09-04. 카이로에 구름 얼굴이 떴는데 지구 그림에는 구름이 없었다.
   `code <= 3` 을 전부 구름으로 보냈던 게 원인이다 — WMO 에서 1은 '대체로 맑음',
   2는 '부분적으로 흐림'이고 3만 '흐림'이다. 말과 그림이 어긋나면 아이는 그림을 믿는다.
   그래서 구름 여부는 코드가 아니라 **지구에 깔린 것과 같은 양(전운량)** 으로 가른다. */
const WMO = (code, cover) => {
  if(code >= 95) return 'zap';
  if((code>=71&&code<=77)||code===85||code===86) return 'snow';
  if(code >= 51) return 'rain';
  if(cover != null) return cover >= 60 ? 'cloud' : 'sun';
  return code >= 3 ? 'cloud' : 'sun';
};
const SAY = { sun:'맑아요', cloud:'구름이 많아요', rain:'비가 와요', snow:'눈이 내려요', zap:'번개가 쳐요' };

/* ── 상단 문구 ───────────────────────────────────────────────────
   한 문장을 붙박아 두면 두 번째 방문부터 아무도 읽지 않는다. 돌려 쓰되
   하나는 **오늘 우리 동네의 실제 값**으로 말한다 — 화면에 깔린 것과 같은 자료다.
   ⚠️ 위치를 먼저 묻지 않는다. 부모가 고른 우리 동네를 쓴다. 아이 전용 화면에서
      위치 권한을 먼저 요구하지 않는다는 규칙 그대로다. '내 위치'를 눌러 허락하면
      그때부터 그 자리로 말한다. */
const HEAD_SAY = { sun:'해가 쨍쨍해요', cloud:'구름이 두둥실 떠 있어요', rain:'비가 내려요', snow:'눈이 펑펑 와요', zap:'번개가 쳐요' };
const HEAD_SAY_EN = { sun:'the sun is out', cloud:'clouds are drifting by', rain:"it's raining", snow:"it's snowing", zap:'there is lightning' };
const HEADLINES = [
  ['지구야, 오늘 어때?', '지구를 돌려서 지금 날씨를 만나 보세요'],
  ['지금 지구 반대편은 밤이에요', '어두운 쪽을 찾아서 돌려 보세요'],
  ['구름은 어디로 가고 있을까?', '하얀 구름을 눈으로 따라가 보세요'],
  ['오늘 지구는 어떤 얼굴일까?', '동그란 친구들을 하나씩 눌러 보세요'],
];
const HEADLINES_EN = [
  ['Earth, how are you today?', 'Spin the globe and meet the weather'],
  ['The other side of Earth is dark now', 'Turn it around and find the night'],
  ['Where are the clouds going?', 'Follow the white clouds with your eyes'],
  ['What face is Earth wearing today?', 'Tap the round friends one by one'],
];
let headLocked = false, headIdx = 0, homeSay = null;
function sayHome(place, cur){
  if(!cur) return;
  const kind = WMO(cur.weather_code, cur.cloud_cover), w = cur.wind_speed_10m;
  const wind = w == null ? '' : KT.en
    ? (w < 2 ? 'the air is still' : w < 6 ? 'a soft breeze' : 'the wind is strong')
    : (w < 2 ? '바람은 잔잔해요' : w < 6 ? '바람은 살랑살랑해요' : '바람이 세게 불어요');
  const deg = `${Math.round(cur.temperature_2m)}${KT.deg}`;
  homeSay = KT.en
    ? [`Today in ${KT(place)}, ${HEAD_SAY_EN[kind]}`, wind ? `${deg} · ${wind}` : deg]
    : [`오늘 ${place}은 ${HEAD_SAY[kind]}`, wind ? `${deg} · ${wind}` : deg];
}
function rollHead(){
  if(headLocked) return;
  const base = KT.en ? HEADLINES_EN : HEADLINES;
  const pool = homeSay ? [homeSay, ...base] : base;
  const [line, sub] = pool[headIdx++ % pool.length];
  $('#head h1').textContent = line;
  $('#head p').textContent  = sub;
}
setInterval(() => { if(!document.hidden) rollHead(); }, 9000);

async function loadLive(){
  // 구름(관측 영상)과 친구(격자 실황)는 출처가 다르다 — 하나가 죽어도 다른 하나는 살린다.
  let cloudMeta = null;
  try { cloudMeta = await loadObservedClouds(); }
  catch(e){ console.warn('관측 구름 실패', e); clouds.material.uniforms.ready.value = 0; }

  try{
    const grid = gridPoints();
    const [gRes, cRes] = await Promise.all([
      omFetch(grid,   ['cloud_cover','precipitation']),
      omFetch(CITIES.map(c=>({lat:c[1],lon:c[2]})), ['weather_code','temperature_2m','cloud_cover','wind_speed_10m']),
    ]);

    // 전지구 구름
    const pts = gRes.map((d,i)=>({
      lat: grid[i].lat, lon: grid[i].lon,
      cloud: d?.current?.cloud_cover ?? null,
      rain:  d?.current?.precipitation ?? 0,
    })).filter(p => p.cloud != null);


    // 격자에서 비가 실제로 오는 곳에 비 친구 — 위치는 격자 그대로
    pts.filter(p => p.rain >= 0.3)
       .sort((a,b)=>b.rain-a.rain).slice(0,14)
       .forEach(p => addMarker('rain', p.lat, p.lon, ART.rain, 'crt'));

    // 도시 말풍선 + 친구
    cRes.forEach((d,i)=>{
      const cur = d?.current; if(!cur) return;
      const [name, lat, lon] = CITIES[i];
      const kind = WMO(cur.weather_code, cur.cloud_cover);
      addMarker(kind, lat, lon, ART[kind], 'crt');
      if(i < 6) addMarker('bub', lat, lon,
        `<div class="box">${KT.en ? `${KT(name)} — ${KT(SAY[kind])}` : `${name} ${SAY[kind]}`}<b>${Math.round(cur.temperature_2m)}${KT.deg}</b></div>`, 'bub');
    });

    sayHome(CITIES[0][0], cRes[0]?.current);

    const t = new Date().toLocaleTimeString(KT.en ? 'en-GB' : 'ko-KR',{hour:'2-digit',minute:'2-digit'});
    // 결손과 메움을 숨기지 않는다 — 무엇을 보고 있는지가 화면에 적혀야 한다
    if(cloudMeta){
      const cz = String(cloudMeta.time).slice(11,16);
      // 지형(음영기복)은 켜고 끄는 겹이 아니라 지구 표면 자체다 — 그래서 늘 적는다
      const terr = reliefOn ? (KT.en ? ' · <b>Natural Earth</b> terrain' : ' · <b>Natural Earth</b> 지형') : '';
      let note = KT.en
        ? `Source: <b>NOAA GMGSI</b> global clouds <i>${cz}Z</i> · <b>Open-Meteo</b> weather <i>${t}</i>${terr}`
        : `출처: <b>NOAA GMGSI</b> 전지구 구름 <i>${cz}Z</i> · <b>Open-Meteo</b> 날씨 <i>${t}</i>${terr}`;
      if(cloudMeta.broken){
        const bits = [`${KT.en ? 'Source' : '출처'}: <b>NOAA GMGSI</b> <i>${cz}Z</i>`];
        if(cloudMeta.patched) bits.push(KT.en
          ? `${cloudMeta.patched} empty cells filled from <i>${String(cloudMeta.patchTime).slice(11,16)}Z</i>`
          : `빈 곳 ${cloudMeta.patched}칸은 <i>${String(cloudMeta.patchTime).slice(11,16)}Z</i> 자료로 메움`);
        if(cloudMeta.stillEmpty) bits.push(KT.en
          ? `${cloudMeta.stillEmpty} cells left blank — no observation`
          : `${cloudMeta.stillEmpty}칸은 관측이 없어 비움`);
        note = bits.join(' · ');
      }
      srcLive = note; paintSrc();
      srcNote.className = cloudMeta.broken ? 'warn' : '';
    } else {
      srcLive = KT.en
        ? `Source: <b>Open-Meteo</b> weather <i>${t}</i> · no cloud data`
        : `출처: <b>Open-Meteo</b> 날씨 <i>${t}</i> · 구름 자료 없음`;
      paintSrc();
      srcNote.className = 'warn';
    }
  }catch(err){
    console.error(err);
    srcNote.className = 'err';
    srcLive = '<b>날씨를 못 불러왔습니다</b> — 없는 값을 그리지 않습니다'; paintSrc();
    clouds.material.uniforms.ready.value = 0;   // 데이터가 없으면 그리지 않는다
  }
}

/* ── 마커 투영: 3D 좌표 → 화면 좌표 ─────────────────────────── */
const _v = new THREE.Vector3(), _c = new THREE.Vector3();
let creatureScale = 1;
function placeMarkers(w, h){
  camera.getWorldPosition(_c);
  const bubs = [], names = [];

  for(const m of markers){
    _v.copy(m.pos).applyMatrix4(earthGroup.matrixWorld);
    const toCam = _c.clone().sub(_v).normalize();
    const facing = _v.clone().normalize().dot(toCam);     // 뒤로 넘어가면 음수
    if(facing <= 0.06){ m.el.style.visibility = 'hidden'; continue; }
    const p = _v.clone().project(camera);
    if(p.z > 1){ m.el.style.visibility = 'hidden'; continue; }

    const X = (p.x*0.5+0.5)*w, Y = (-p.y*0.5+0.5)*h;
    const vis = (m.kind === 'bub')  ? true
              : (m.kind === 'rain' || m.kind === 'snow') ? show.rain
              : (m.kind === 'zap')  ? show.zap
              : show.cloud;
    const alpha = vis ? Math.min(1, (facing-0.06)/0.24) : 0;

    if(m.kind === 'bub' || m.kind === 'name'){
      (m.kind === 'bub' ? bubs : names).push({ m, X, Y, alpha });
      continue;
    }

    m.el.style.visibility = alpha > 0.02 ? 'visible' : 'hidden';
    m.el.style.opacity = alpha;
    m.el.style.transform =
      `translate(${X}px, ${Y}px) translate(-50%,-50%) scale(${creatureScale.toFixed(3)})`;
  }

  /* 말풍선은 한 번에 세 개까지만.
     아이에게 한 번에 모든 데이터를 보여주지 않는다 — 화면 가운데에 가까운 것부터 고르고,
     이미 놓인 풍선과 겹치면 건너뛴다. 위치를 옮기지는 않는다. */
  const cx = w/2, cy = h/2;
  bubs.sort((a,b)=> ((a.X-cx)**2 + (a.Y-cy)**2) - ((b.X-cx)**2 + (b.Y-cy)**2));
  const placed = [];
  for(const b of bubs){
    const r = b.m.el.firstElementChild?.getBoundingClientRect();
    const bw = r?.width || 130, bh = r?.height || 46;
    const clash = placed.some(q => Math.abs(q.X-b.X) < (q.bw+bw)/2 + 8
                                && Math.abs(q.Y-b.Y) < (q.bh+bh)/2 + 8);
    // 화면 밖으로 잘리는 풍선은 아예 띄우지 않는다 (반쯤 잘린 글자가 제일 나쁘다)
    const railW = w < 720 ? 66 : 84;                    // 왼쪽 레일이 차지하는 폭
    const inside = (b.X - bw/2) > railW && (b.X + bw/2) < w-14
                && (b.Y - bh - 30) > 56 && b.Y < h-96;
    const ok = !clash && inside && placed.length < 3 && b.alpha > 0.55;
    b.m.el.style.visibility = ok ? 'visible' : 'hidden';
    b.m.el.style.opacity = ok ? b.alpha : 0;
    if(ok){
      placed.push({ X:b.X, Y:b.Y, bw, bh });
      b.m.el.style.transform = `translate(${b.X}px, ${b.Y - 26*creatureScale}px) translate(-50%,-100%)`;
    }
  }

  // 화석 핀 — 지구 뒤로 넘어가면 숨긴다
  for(const f of fossilMarks){
    if(!f.pos || f.el.style.display === 'none'){ continue; }
    _v.copy(f.pos).applyMatrix4(earthGroup.matrixWorld);
    const toCam = _c.clone().sub(_v).normalize();
    const facing = _v.clone().normalize().dot(toCam);
    if(facing <= 0.06){ f.el.style.visibility = 'hidden'; continue; }
    const p = _v.clone().project(camera);
    f.el.style.visibility = 'visible';
    f.el.style.opacity = Math.min(1, (facing-0.06)/0.2);
    const X = (p.x*0.5+0.5)*w, Y = (-p.y*0.5+0.5)*h;
    f.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-100%)`;
    f.sx = X; f.sy = Y;
  }
  // 이름표가 겹치면 이름만 접는다. 점은 그대로 둔다 — 자리가 사실이기 때문이다.
  const pinLabels = [];
  for(const f of fossilMarks){
    const lab = f.el.querySelector('.nm2');
    if(!lab || f.el.style.visibility === 'hidden' || f.el.style.display === 'none') continue;
    const clash = pinLabels.some(q => Math.abs(q.x-f.sx) < 58 && Math.abs(q.y-f.sy) < 22);
    lab.style.visibility = clash ? 'hidden' : 'visible';
    if(!clash) pinLabels.push({x:f.sx, y:f.sy});
  }

  // 내 위치 표식
  if(hereMark && hereMark.pos){
    _v.copy(hereMark.pos).applyMatrix4(earthGroup.matrixWorld);
    const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
    if(facing <= 0.06){ hereMark.el.style.visibility='hidden'; }
    else {
      const q = _v.clone().project(camera);
      hereMark.el.style.visibility='visible';
      hereMark.el.style.opacity = Math.min(1,(facing-0.06)/0.2);
      hereMark.el.style.transform =
        `translate(${(q.x*0.5+0.5)*w}px, ${(-q.y*0.5+0.5)*h}px) translate(-50%,-100%)`;
    }
  }

  /* 기온 숫자 — 땅에 박아 둔다.
     ⚠️ 화면 격자에 두었더니 지구를 돌려도 숫자가 제자리에 남고 값만 바뀌었다.
        자리가 곧 뜻인 화면에서 그건 숫자가 어디 것인지를 지우는 일이다.
        그렇다고 고정 위경도 격자로 돌아가면 확대했을 때 점이 전부 화면 밖으로
        나간다(그래서 화면 격자로 옮겼던 것이다). 그래서 **간격만 배율에서 고른다** —
        숫자는 땅에 붙어 함께 돌고, 화면에서의 간격은 늘 비슷하게 유지된다. */
  if(tempShell.visible && tempMarks.length){
    const mid = screenToLatLon(w/2, h/2, w, h);
    let k = 0;
    if(mid){
      const project = (lat, lon) => {
        _v.copy(llToVec(lat, lon, R*1.004)).applyMatrix4(earthGroup.matrixWorld);
        const q = _v.clone().project(camera);
        return [(q.x*0.5+0.5)*w, (-q.y*0.5+0.5)*h];
      };
      // ⚠️ screenR 은 이 루프보다 뒤에서 갱신된다 — 처음엔 그걸 썼다가 초기값 300 이
      //    그대로 들어가 20°격자를 골랐고, 실제로는 320px 씩 벌어져 숫자가 여덟 개만 떴다.
      //    배율은 여기서 직접 잰다. 화면 한가운데에서 위도 1도가 몇 픽셀인지.
      const p0 = project(mid.lat, mid.lon), p1 = project(mid.lat + 1, mid.lon);
      const perDeg = Math.hypot(p1[0]-p0[0], p1[1]-p0[1]) || 1;
      const step = TN_GRID.find(s => s*perDeg >= TN_STEP) ?? TN_GRID[TN_GRID.length-1];
      const latC = Math.round(mid.lat/step)*step, lonC = Math.round(mid.lon/step)*step;
      const span = Math.min(Math.ceil(95/step), 40);
      for(let dy = -span; dy <= span && k < tempMarks.length; dy++){
        const lat = latC + dy*step;
        if(lat < -85 || lat > 85) continue;
        // 위로 갈수록 경도선이 모인다 — 간격을 벌리지 않으면 숫자가 극에서 뭉친다
        const lonStep = step * Math.max(1, Math.round(1/Math.max(.12, Math.cos(lat*Math.PI/180))));
        const wide = Math.min(Math.ceil(100/lonStep), 60);
        for(let dx = -wide; dx <= wide && k < tempMarks.length; dx++){
          const lon = ((lonC + dx*lonStep + 540) % 360) - 180;
          const [X, Y] = project(lat, lon);
          // 가장자리는 경도선이 겹쳐 보여 숫자가 서로 붙는다 — 테두리 한 겹은 버린다
          if(_v.clone().normalize().dot(_c.clone().sub(_v).normalize()) <= 0.30) continue;
          if(X < 84 || X > w-72 || Y < 92 || Y > h-160) continue;   // 머리말·날짜 막대 자리
          const c = tempAt(lat, lon);
          if(c == null) continue;
          const m = tempMarks[k++];
          m.el.textContent = `${Math.round(c)}°`;
          m.el.className = 'tn ' + (c < 5 ? 'cold' : c > 26 ? 'hot' : '');
          m.el.style.visibility = 'visible';
          m.el.style.opacity = 1;
          m.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
        }
      }
    }
    for(let i = k; i < tempMarks.length; i++) tempMarks[i].el.style.visibility = 'hidden';
  } else {
    for(const m of tempMarks) m.el.style.visibility='hidden';
  }

  // 충돌구 — 지름에 비례해 키우되 자리는 그대로
  if(craterOn){
    const crShown = [];
    for(const m of craterMarks){
      _v.copy(m.pos).applyMatrix4(earthGroup.matrixWorld);
      const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
      if(facing <= 0.06){ m.el.style.visibility='hidden'; continue; }
      const q = _v.clone().project(camera);
      const X=(q.x*0.5+0.5)*w, Y=(-q.y*0.5+0.5)*h;
      // 실제 지름에 비례하되 너무 작거나 크지 않게 — 아이가 누를 수 있어야 한다
      const px = Math.max(18, Math.min(74, Math.sqrt(m.c.km) * 4.2 * (screenR/300)));
      const ring = m.el.querySelector('.ring');
      ring.style.width = ring.style.height = px.toFixed(0) + 'px';
      m.el.style.visibility='visible';
      m.el.style.opacity = Math.min(1,(facing-0.06)/0.2);
      m.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
      const lab = m.el.querySelector('.t');
      const clash = crShown.some(o => Math.abs(o.x-X)<80 && Math.abs(o.y-Y)<24);
      lab.style.visibility = clash ? 'hidden' : 'visible';
      if(!clash) crShown.push({x:X, y:Y});
    }
  } else {
    for(const m of craterMarks) m.el.style.visibility='hidden';
  }

  // 강 이름과 댐
  if(waterOn){
    const rvShown = [];
    for(const r of riverMarks){
      if(!r.el) continue;
      _v.copy(r.pos).applyMatrix4(earthGroup.matrixWorld);
      const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
      if(facing <= 0.14){ r.el.style.visibility='hidden'; continue; }
      const q = _v.clone().project(camera);
      const X=(q.x*0.5+0.5)*w, Y=(-q.y*0.5+0.5)*h;
      const clash = rvShown.some(o => Math.abs(o.x-X)<86 && Math.abs(o.y-Y)<22);
      const ok = !clash && rvShown.length < 6 && X>78 && X<w-90 && Y>56 && Y<h-150;
      r.el.style.visibility = ok ? 'visible' : 'hidden';
      if(ok){ r.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
              r.el.style.opacity = Math.min(1, (facing-0.14)/0.25); rvShown.push({x:X,y:Y}); }
    }
    // 댐 이름이 겹치면 이름만 접는다. 표식은 남긴다 — 자리가 사실이기 때문이다.
    const dmShown = [];
    for(const m of damMarks){
      _v.copy(m.pos).applyMatrix4(earthGroup.matrixWorld);
      const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
      if(facing <= 0.06){ m.el.style.visibility='hidden'; continue; }
      const q = _v.clone().project(camera);
      const X=(q.x*0.5+0.5)*w, Y=(-q.y*0.5+0.5)*h;
      m.el.style.visibility='visible';
      m.el.style.opacity = Math.min(1,(facing-0.06)/0.2);
      m.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
      const lab = m.el.querySelector('.t');
      const clash = dmShown.some(o => Math.abs(o.x-X)<74 && Math.abs(o.y-Y)<20);
      lab.style.visibility = clash ? 'hidden' : 'visible';
      if(!clash) dmShown.push({x:X, y:Y});
    }
  } else {
    for(const r of riverMarks) if(r.el) r.el.style.visibility='hidden';
    for(const m of damMarks) m.el.style.visibility='hidden';
  }

  /* 해상 부이 — 2,400여 곳 중 지금 보이는 것만 풀에 배정한다.
     가까운 쪽(카메라를 정면으로 보는 쪽)부터 채우고 나머지는 그리지 않는다. */
  if(buoyOn && BUOYS && buoyMarks.length){
    const cand = [];
    for(const b of BUOYS){
      _v.copy(b.pos).applyMatrix4(earthGroup.matrixWorld);
      const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
      if(facing <= 0.20) continue;
      const q = _v.clone().project(camera);
      const X = (q.x*0.5+0.5)*w, Y = (-q.y*0.5+0.5)*h;
      if(X < 70 || X > w-70 || Y < 60 || Y > h-140) continue;
      cand.push({ b, X, Y, facing });
      if(cand.length > 900) break;         // 축소 상태에서 전부 훑지 않는다
    }
    cand.sort((a,z) => z.facing - a.facing);
    const placed = [];
    let k = 0;
    for(const c2 of cand){
      if(k >= buoyMarks.length) break;
      // 겹치면 건너뛴다 — 점이 뭉쳐 있으면 누를 수가 없다
      if(placed.some(o => Math.abs(o.X-c2.X) < 22 && Math.abs(o.Y-c2.Y) < 22)) continue;
      const m = buoyMarks[k++];
      m.b = c2.b;
      m.el.style.visibility = 'visible';
      m.el.style.opacity = Math.min(1, (c2.facing-0.20)/0.25);
      m.el.style.transform = `translate(${c2.X}px, ${c2.Y}px) translate(-50%,-50%)`;
      placed.push(c2);
    }
    for(let i = k; i < buoyMarks.length; i++){ buoyMarks[i].el.style.visibility = 'hidden'; buoyMarks[i].b = null; }
  } else if(buoyMarks.length){
    for(const m of buoyMarks) m.el.style.visibility = 'hidden';
  }

  // 지진 재생 — 시각을 흘리고, 점 크기 배율은 그리기 버퍼 높이를 따른다
  if(quakeOn && quakeMat){
    quakeMat.uniforms.uScale.value = renderer.domElement.height * 0.5;
    quakeStep(performance.now());
  }

  // 우주 쓰레기 — 자리 계산은 정본 레이어가 한다 (250ms 마다 스스로 걸러 낸다)
  if(junkOn && junk) junk.update(performance.now());

  // 위성 — 1초에 한 번 다시 풀고, 보이는 것만 그린다
  if(satOn && SATS && satMarks.length){
    stepSats(performance.now());
    const shown = [];
    let k = 0;
    for(const x of SATS){
      if(!x.ok || k >= satMarks.length) continue;
      _v.copy(x.pos).applyMatrix4(earthGroup.matrixWorld);
      if(_v.clone().normalize().dot(_c.clone().sub(_v).normalize()) <= 0.08) continue;
      const q = _v.clone().project(camera);
      const X = (q.x*0.5+0.5)*w, Y = (-q.y*0.5+0.5)*h;
      if(X < 60 || X > w-60 || Y < 56 || Y > h-140) continue;
      const m = satMarks[k++];
      m.s = x;
      m.el.style.visibility = 'visible';
      m.el.style.transform = 'translate(' + X + 'px, ' + Y + 'px) translate(-50%,-50%)';
      const lab = m.el.querySelector('.t');
      const clash = shown.some(o => Math.abs(o.X-X) < 96 && Math.abs(o.Y-Y) < 20);
      lab.textContent = clash ? '' : x.n.replace(/\s*\(.*\)$/, '');
      if(!clash) shown.push({X, Y});
    }
    for(let i = k; i < satMarks.length; i++){ satMarks[i].el.style.visibility = 'hidden'; satMarks[i].s = null; }
  } else if(satMarks.length){
    for(const m of satMarks) m.el.style.visibility = 'hidden';
  }

  // 대륙 이름 — 그 시대에 판이 있는 것만. 없으면 이름도 없다.
  const contShown = [];
  for(const t of contMarks){
    const m = paleoOn ? plateNow(t.pid) : null;
    if(!m){ t.el.style.visibility = 'hidden'; continue; }
    const g = rotXYZ(t.lat, t.lon, m);
    _v.copy(llToVec(g.lat, g.lon, R*1.03)).applyMatrix4(earthGroup.matrixWorld);
    const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
    if(facing <= 0.14){ t.el.style.visibility = 'hidden'; continue; }
    const q = _v.clone().project(camera);
    const X = (q.x*0.5+0.5)*w, Y = (-q.y*0.5+0.5)*h;
    const clash = contShown.some(o => Math.abs(o.x-X) < 92 && Math.abs(o.y-Y) < 26);
    const inView = X > 78 && X < w-16 && Y > 56 && Y < h-140;
    const ok = !clash && inView;
    t.el.style.visibility = ok ? 'visible' : 'hidden';
    if(ok){
      t.el.style.opacity = Math.min(1, 0.55 + (facing-0.14)*1.6);
      t.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
      contShown.push({x:X, y:Y});
    }
  }

  /* 산맥과 산 — 화면 가운데에 가까운 것부터.
     ⚠️ 시대를 되감으면 접는다. 히말라야는 5천만 년 전에 없었다 —
        옛 대륙 위에 오늘 산맥을 얹으면 나라 이름을 얹는 것과 똑같은 거짓말이다.
        5백만 년 전까지는 지금 산맥이 이미 제자리에 있었으므로 그때까진 둔다. */
  const mtShown = [];
  const mtOn = $('#b-mtn').getAttribute('aria-pressed') === 'true' && maNow <= 5;
  const mtCap = fill > 9 ? 8 : fill > 6 ? 7 : 6;
  if(mtnLine) mtnLine.visible = mtOn;      // 이름표만 접으면 선이 옛 대륙 위에 남는다
  for(const t of mtnMarks){
    if(!mtOn){ t.el.style.visibility = 'hidden'; continue; }
    _v.copy(t.pos).applyMatrix4(earthGroup.matrixWorld);
    const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
    if(facing <= 0.12){ t.el.style.visibility = 'hidden'; continue; }
    const q = _v.clone().project(camera);
    const X = (q.x*0.5+0.5)*w, Y = (-q.y*0.5+0.5)*h;
    const clash = mtShown.some(o => Math.abs(o.x-X) < 84 && Math.abs(o.y-Y) < 22);
    const hw = t.w/2 + 8;
    const inView = X-hw > 72 && X+hw < w-72 && Y > 56 && Y < h-96;
    const ok = !clash && inView && mtShown.length < mtCap;
    t.el.style.visibility = ok ? 'visible' : 'hidden';
    if(ok){
      t.el.style.opacity = Math.min(1, (facing-0.12)/0.25);
      t.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
      mtShown.push({x:X, y:Y});
    }
  }

  /* 산봉우리 — 화면에 몇 개 띄울지는 자리가 정하고, 누구를 띄울지는 z 가 정한다.
     z 는 원본의 min_zoom 으로 작을수록 이름난 산이다(에베레스트 4, 대부분 7 언저리).
     목록을 z 순으로 정렬해 두었으므로 앞에서부터 채우다 자리가 차면 멈춘다 —
     '이 배율에서는 z 몇까지' 같은 문턱을 우리가 따로 정하지 않는다. */
  const pkCap = fill > 9 ? 16 : fill > 6 ? 13 : 10;
  const pkShown = [];
  for(const t of peakMarks){
    if(!mtOn || pkShown.length >= pkCap){ t.el.style.visibility = 'hidden'; continue; }
    _v.copy(t.pos).applyMatrix4(earthGroup.matrixWorld);
    const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
    if(facing <= 0.12){ t.el.style.visibility = 'hidden'; continue; }
    const q2 = _v.clone().project(camera);
    const X = (q2.x*0.5+0.5)*w, Y = (-q2.y*0.5+0.5)*h;
    // 산맥 이름표와도 겹치지 않게 — 둘은 같은 겹이다
    /* 봉우리 이름은 세모 아래로 흐르므로 기준점보다 아래에 그려진다.
       그래서 산맥 이름과 겹치는지 볼 때 세로 여유를 더 크게 잡는다. */
    const clash = pkShown.some(o => Math.abs(o.x-X) < 78 && Math.abs(o.y-Y) < 36)
               || mtShown.some(o => Math.abs(o.x-X) < 78 && Math.abs(o.y-Y) < 38);
    // 좌우 레일 밑으로 들어가면 이름이 잘린다. 이름 폭을 세어 미리 뺀다.
    const hw = t.w/2 + 8;
    const inView = X-hw > 72 && X+hw < w-72 && Y > 60 && Y < h-96;
    const ok = !clash && inView;
    t.el.style.visibility = ok ? 'visible' : 'hidden';
    if(ok){
      t.el.style.opacity = Math.min(1, (facing-0.12)/0.25);
      t.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-5px)`;
      pkShown.push({x:X, y:Y});
    }
  }

  /* 과거를 보는 동안에는 오늘 것들을 접는다 — 오늘 좌표에 있는 이름과 자리다.
     어느 버튼으로 들어왔든 같다(전에 화석 경로에서 이게 빠져 '러시아·일본'이 떠 있었다). */
  const pastNow = paleoOn ||
    ($('#b-fossil').getAttribute('aria-pressed') === 'true' && maNow > 0);

  /* 바다거북과 철새 — 화면 가운데에 가까운 것부터.
     거북 이름표는 **추적이 끝난 자리**에 있다. 거기 산다는 뜻이 아니다. */
  const wildShown = [];
  function placeWild(marks, on, cap){
    let n = 0;
    for(const t of marks){
      if(!on || n >= cap){ t.el.style.visibility = 'hidden'; continue; }
      _v.copy(t.pos).applyMatrix4(earthGroup.matrixWorld);
      const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
      if(facing <= 0.12){ t.el.style.visibility = 'hidden'; continue; }
      const q3 = _v.clone().project(camera);
      const X = (q3.x*0.5+0.5)*w, Y = (-q3.y*0.5+0.5)*h;
      const hw = t.w/2 + 8;
      const clash = wildShown.some(o => Math.abs(o.x-X) < 76 && Math.abs(o.y-Y) < 34);
      const ok = !clash && X-hw > 72 && X+hw < w-72 && Y > 60 && Y < h-96;
      t.el.style.visibility = ok ? 'visible' : 'hidden';
      if(ok){
        t.el.style.opacity = Math.min(1, (facing-0.12)/0.25);
        t.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-5px)`;
        wildShown.push({x:X, y:Y}); n++;
      }
    }
  }
  placeWild(turtleMarks, turtleOn && !pastNow, fill > 6 ? 10 : 7);
  placeWild(birdMarks,   birdOn   && !pastNow, fill > 6 ? 12 : 9);
  if(turtleLine) turtleLine.visible = turtleOn && !pastNow;
  if(birdArc)  birdArc.visible  = birdOn && !pastNow;
  if(birdRing) birdRing.visible = birdOn && !pastNow;

  /* 나라 이름은 있는 줄 알 정도만. 화면 가운데에 가까운 것부터 다섯 개까지,
     말풍선·다른 이름과 겹치면 건너뛴다. 지구 전체에서는 더 적게. */
  if(pastNow){
    for(const n of names) n.m.el.style.visibility = 'hidden';
    return;
  }
  const nameCap = stop === 0 ? 7 : (stop >= 3 ? 3 : 9);
  names.sort((a,b)=> ((a.X-cx)**2 + (a.Y-cy)**2) - ((b.X-cx)**2 + (b.Y-cy)**2));
  const nameSpots = placed.slice();
  let shown = 0;
  for(const n of names){
    const nw = n.m.el.offsetWidth || 44, nh = n.m.el.offsetHeight || 18;
    const clash = nameSpots.some(q => Math.abs(q.X-n.X) < (q.bw+nw)/2 + 10
                                   && Math.abs(q.Y-n.Y) < (q.bh+nh)/2 + 10);
    const inView = n.X > 8 && n.X < w-8 && n.Y > 52 && n.Y < h-92;
    const ok = !clash && inView && shown < nameCap && n.alpha > 0.72;
    n.m.el.style.visibility = ok ? 'visible' : 'hidden';
    n.m.el.style.opacity = ok ? (0.38 + 0.36*n.alpha) : 0;   // 살짝만
    if(ok){
      shown++;
      nameSpots.push({ X:n.X, Y:n.Y, bw:nw, bh:nh });
      n.m.el.style.transform = `translate(${n.X}px, ${n.Y}px) translate(-50%,-50%)`;
    }
  }
}

/* ── 루프 ──────────────────────────────────────────────────── */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;

  // 관성 + 감쇠. 손을 떼도 부드럽게 멈춘다.
  yaw += yawV; pitch += pitchV;
  const damp = Math.pow(0.86, dt*60);
  yawV *= damp; pitchV *= damp;
  const maxStep = MAX_SPIN*dt;
  yawV = Math.max(-maxStep, Math.min(maxStep, yawV));
  pitch = Math.max(-1.40, Math.min(1.40, pitch));   // ±80° — 극을 볼 수 있게. 90°는 카메라가 뒤집힌다

  // 시대를 바꾼 직후에만 카메라가 한반도를 쫓아간다. 손을 대면 즉시 놓아준다.
  if(following){
    let d = yawTarget - yaw;
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    const k = Math.min(1, dt*3.2);
    yaw += d*k; pitch += (pitchTarget - pitch)*k;
    if(Math.abs(d) < 0.002 && Math.abs(pitchTarget - pitch) < 0.002) following = false;
  }

  /* 처음엔 지구가 스스로 돈다 — 자전과 같은 방향(끌 때 오른쪽으로 미는 쪽).
     ⚠️ 전에는 3.2초 쉬면 다시 돌기 시작했다. 아이가 보고 싶은 자리에 맞춰 놓고
        손을 떼면 화면이 그 자리를 도로 가져가 버렸다. 한 번 손이 닿으면 끝이다. */
  if(!dragging) idle += dt; else idle = 0;
  if(spinning && !reduceMotion) yaw += 0.028*dt;

  /* 시간을 옮긴다. 두 가지 속도가 필요하다.
       이야기 — 백만 년/초 를 고정한다. 화면에서 빨라 보이면 실제로 빨랐던 것이다.
       손 조작 — 어디서 끌든 1초쯤에 도착한다. 6억 년을 실제 속도로 보여줄 순 없다. */
  if(PALEO && maNow !== maTarget){
    const d = maTarget - maNow;
    if(storyOn){
      const v = STORY_RATE * dt;
      maNow = Math.abs(d) <= v ? maTarget : maNow + Math.sign(d)*v;
    } else {
      maNow += d * Math.min(1, dt*3.2);
      if(Math.abs(maTarget - maNow) < 0.02) maNow = maTarget;
    }
    refreshPast();
    if(storyOn && maNow === 0 && !storyEnd){
      // 부딪혀서 솟은 것을 마지막에 보여준다 — 버튼을 누르라고 시키지 않는다
      if($('#b-mtn').getAttribute('aria-pressed') !== 'true') $('#b-mtn').click();
      storyEnd = setTimeout(()=>stopStory(true), 3400);
    }
  }

  const ease = Math.min(1, dt*4.5);
  dist   += (distTarget - dist)   * ease;
  tanMin += (tanTarget - tanMin) * ease;
  setFov(tanMin);
  updateCoast();

  earthGroup.rotation.set(0,0,0);
  camera.position.set(
    dist*Math.cos(pitch)*Math.cos(yaw),
    dist*Math.sin(pitch),
    dist*Math.cos(pitch)*Math.sin(yaw)
  );
  camera.lookAt(0,0,0);

  const ss = subsolar(new Date());
  sunDir.copy(llToVec(ss.lat, ss.lon, 1)).applyQuaternion(
    new THREE.Quaternion().setFromRotationMatrix(camera.matrixWorldInverse)
  );
  earthMat.uniforms.sunDir.value = llToVec(ss.lat, ss.lon, 1);
  earthMat.uniforms.nightMix.value += ((show.night?1:0) - earthMat.uniforms.nightMix.value) * Math.min(1, dt*5);

  const w = innerWidth, h = innerHeight;
  screenR = (R/dist)/tanMin * (Math.min(w,h)/2);
  creatureScale = Math.max(0.34, Math.min(1.5, (2*screenR/8)/80));
  earthGroup.updateMatrixWorld();
  camera.updateMatrixWorld();
  placeMarkers(w, h);
  paperCharacters.update(performance.now(), h, !PALEO || maNow === 0);
  renderer.render(scene, camera);
  drawWind(dt, w, h);
  requestAnimationFrame(frame);
}

function resize(){
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h, false);
  // ⚠️ setFov 는 화각이 그대로면 아무것도 안 한다. 가로 화면끼리 크기만 바뀌면
  //    화각은 38 도 그대로라 여기서 직접 갱신하지 않으면 종횡비가 낡은 채 남는다.
  camera.aspect = w/h; camera.updateProjectionMatrix();
  const tanV0 = Math.tan(FOV0*Math.PI/360);
  tanBase = Math.min(tanV0, tanV0*camera.aspect);
  if(windCv.width !== w || windCv.height !== h){ windCv.width = w; windCv.height = h; }
  applyFill();
  tanMin = tanTarget; setFov(tanMin);   // 크기가 바뀔 때 화각은 부드럽게 할 것이 없다
}
addEventListener('resize', refit);

/* 셰이더가 카메라 공간 법선을 쓰므로 태양 방향도 카메라 공간으로 넘긴다 */
earthMat.onBeforeRender = function(){
  const ss = subsolar(new Date());
  const world = llToVec(ss.lat, ss.lon, 1);
  earthMat.uniforms.sunDir.value = world.clone()
    .transformDirection(camera.matrixWorldInverse);
};

/* 한 장을 지금 당장 그린다.
   rAF 는 창이 가려져 있으면 불리지 않는다 — 그것만 믿으면 지구가 없는 하늘이 남는다.
   화면이 다시 보이면 루프가 이어서 돈다. */
function drawOnce(){
  const w = innerWidth, h = innerHeight;
  yaw += 0; pitch += 0;
  /* 시간은 건너뛰되, 이야기가 흐르는 중이면 그대로 둔다.
     창 크기가 바뀌었다고 장면을 끝으로 보내면 아이는 아무것도 못 본다. */
  if(PALEO && maNow !== maTarget && !storyOn){ maNow = maTarget; refreshPast(); }
  // 따라가는 중이면 중간이 아니라 목적지를 그린다 — 한 장만 그리는 자리라 중간은 뜻이 없다
  if(following){ yaw = yawTarget; pitch = pitchTarget; yawV = pitchV = 0; }
  dist = distTarget; tanMin = tanTarget; setFov(tanMin);
  updateCoast();
  camera.position.set(
    dist*Math.cos(pitch)*Math.cos(yaw),
    dist*Math.sin(pitch),
    dist*Math.cos(pitch)*Math.sin(yaw)
  );
  camera.lookAt(0,0,0);
  screenR = (R/dist)/tanMin * (Math.min(w,h)/2);
  creatureScale = Math.max(0.34, Math.min(1.5, (2*screenR/8)/80));
  earthGroup.updateMatrixWorld();
  camera.updateMatrixWorld();
  placeMarkers(w, h);
  renderer.render(scene, camera);
  drawWind(1/60, w, h);
}

/* 뒤에 있는 탭이나 숨겨진 패널에서 열면 뷰포트가 0×0 으로 온다.
   그 상태로 계산한 카메라는 쓸 수 없으므로, 크기가 생기는 순간 다시 맞추고 한 장 그린다.
   resize 이벤트만 믿으면 안 된다 — 0×0 → 실제 크기 전환에서 안 오는 경우가 있다. */
function refit(){
  if(innerWidth < 2 || innerHeight < 2) return;   // 아직 크기가 없다
  resize();
  if(earthMat.uniforms.map.value) drawOnce();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refit(); });
if(window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);

(async function start(){
  resize();
  earthMat.uniforms.map.value = await buildEarthTexture();
  for(const c of COUNTRY_LABELS) addMarker('name', c.lat, c.lon, c.name, 'nm');
  loadPaleoEarth().then(()=> drawOnce())
                  .catch(e => { console.warn('옛 대륙 로드 실패', e); $('#b-fossil').disabled = true; });
  loadCraters().then(()=> drawOnce())
               .catch(e => { console.warn('충돌구 로드 실패', e); $('#b-crater').disabled = true; });
  loadQuakes().then(()=> drawOnce())
              .catch(e => { console.warn('지진 로드 실패', e); $('#b-quake').disabled = true; });
  loadWater().then(()=>{ for(const d of damMarks) d.el.style.display='none'; drawOnce(); })
             .catch(e => { console.warn('물 로드 실패', e); $('#b-water').disabled = true; });
  loadLeads().catch(e => console.warn('예보 로드 실패', e));
  loadWind().catch(e => { console.warn('바람 로드 실패', e); $('#b-wind').disabled = true; });
  loadMountains().then(()=>{ for(const t of mtnMarks) t.el.style.display='none';
                             for(const t of peakMarks) t.el.style.display='none'; drawOnce(); })
                .catch(e => { console.warn('산맥 로드 실패', e); $('#b-mtn').disabled = true; });
  loadPast().then(()=>{ for(const f of fossilMarks) f.el.style.display='none'; drawOnce(); })
            .catch(e => { console.warn('화석지 로드 실패', e); $('#b-fossil').disabled = true; });
  loadTurtles().then(()=>{ for(const m of turtleMarks) m.el.style.display='none'; drawOnce(); })
               .catch(e => { console.warn('바다거북 로드 실패', e); $('#b-turtle').disabled = true; });
  loadMigbird().then(()=>{ for(const m of birdMarks) m.el.style.display='none'; drawOnce(); })
               .catch(e => { console.warn('철새 로드 실패', e); $('#b-bird').disabled = true; });
  drawOnce();                       // 데이터를 기다리는 동안에도 지구는 이미 떠 있다
  requestAnimationFrame(frame);
  await loadLive();
  drawOnce();                       // 친구가 붙은 첫 장도 즉시 한 번
  setTimeout(()=> $('#hint').classList.add('gone'), 6000);
})();
</script>
<!-- 영어 치환 층. 한국어가 원본이고 영어를 그 위에 덮는다 (kids-i18n.js 머리말 참고). -->

<!-- 전환기 오른쪽 도구바. 세 지구가 같은 자리에서 같은 도구를 쓴다(PD 지시). -->
<script src="/js/app-bar.js" defer></script>
<script>
/* v3 키즈 도구바.
 *
 * ⚠️ **설정은 넣지 않는다.** 이 앱에는 지금 설정할 것이 하나도 없다 —
 *    언어 전환도, 소리도, 저장하는 값도 없다. 빈 설정 버튼을 만들면
 *    아이가 눌렀을 때 아무 일도 안 일어난다. 그건 없는 것보다 나쁘다.
 *    설정할 것이 생기면 그때 여기 한 줄 더한다.
 *
 * ⚠️ **로그인도 넣지 않는다.** 4~9세가 쓰는 화면이고, 지금은 로그인할 이유도 없다.
 *
 * 넣는 것은 하나 — "이게 뭐야". 왼쪽 단추들이 무엇을 보여주는지 아이 말로 적는다.
 */
(function () {
  var WHAT = [
    ['종이 친구', '관리자가 만든 그림책 속 친구들이야. 실제 동물이 관측된 위치를 뜻하지는 않아.'],
    ['구름', '지금 하늘에 있는 진짜 구름이야. 인공위성이 찍은 거란다.'],
    ['비', '지금 비가 오는 곳이야. 파랄수록 조금, 노랗고 빨가면 많이 와.'],
    ['번개', '천둥번개가 치는 곳이야.'],
    ['낮과 밤', '해가 비치는 쪽이 낮, 반대쪽이 밤이야. 지금 이 순간 그대로란다.'],
    ['기온', '어디가 덥고 어디가 추운지 색으로 보여줘.'],
    ['바람', '바람이 어느 쪽으로 부는지 보여줘.'],
    ['강·댐', '큰 강과 댐이 어디 있는지 보여줘.'],
    ['산맥', '땅에서 가장 높이 솟은 곳들이야.'],
    ['지진·판 경계', '땅이 흔들린 곳과, 땅덩어리가 만나는 금이야.'],
    ['충돌구', '아주 옛날에 운석이 떨어져 파인 자국이야.'],
    ['공룡 발자국', '공룡 화석이 나온 곳이야.'],
    ['옛 대륙', '아주 먼 옛날에는 대륙이 하나로 붙어 있었어. 그때 모습이야.'],
    ['내 위치', '네가 있는 곳으로 지구를 돌려줘.']
  ];
  function sheet() {
    var old = document.getElementById('kid-what');
    if (old) { old.remove(); return; }
    var d = document.createElement('div');
    d.id = 'kid-what';
    d.style.cssText = 'position:fixed;inset:0;z-index:9500;display:flex;align-items:center;'
      + 'justify-content:center;background:rgba(4,8,16,.72);backdrop-filter:blur(6px);'
      + 'font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;padding:18px';
    var rows = WHAT.map(function (w) {
      return '<div style="display:flex;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.10)">'
        + '<b style="min-width:104px;color:#fff;font-size:15px">' + w[0] + '</b>'
        + '<span style="color:#C7D6EA;font-size:15px;line-height:1.55">' + w[1] + '</span></div>';
    }).join('');
    d.innerHTML = '<div style="max-width:620px;max-height:82vh;overflow:auto;background:rgba(10,16,28,.96);'
      + 'border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:22px 24px;'
      + 'box-shadow:0 18px 60px rgba(0,0,0,.5)">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
      + '<b style="color:#fff;font-size:20px">이게 뭐야?</b>'
      + '<button id="kid-what-x" style="border:0;background:rgba(255,255,255,.10);color:#fff;'
      + 'width:34px;height:34px;border-radius:999px;font-size:18px;cursor:pointer">×</button></div>'
      + '<div style="color:#8FA4BD;font-size:13px;line-height:1.6;margin-bottom:8px">'
      + '왼쪽 단추를 누르면 지구가 그걸 보여줘. 전부 <b style="color:#C7D6EA">진짜로 지금 있는 일</b>이야 — '
      + '지어낸 그림이 아니란다.</div>'
      + rows + '</div>';
    d.addEventListener('click', function (e) {
      if (e.target === d || e.target.id === 'kid-what-x') d.remove();
    });
    document.body.appendChild(d);
  }
  function mount() {
    if (!window.earthusAppBar) { setTimeout(mount, 200); return; }
    window.earthusAppBar.set([
      { id: 'what', glyph: '?', label: '이게 뭐야', title: '왼쪽 단추가 뭘 보여주는지 알려줄게', onClick: sheet },
      /* 계정은 EARTHUS(v1)에만 있다. 여기서 만들지 않고 그 화면으로 보낸다 —
         로그인이 끝나면 back 으로 이 지구에 돌려보낸다. */
      { id: 'login', glyph: '○', label: '로그인', title: '로그인 / 계정',
        onClick: function () {
          location.href = '/?login=1&back=' + encodeURIComponent(location.pathname);
        } }
    ]);
  }
  mount();
})();
</script>
</body>
</html>
