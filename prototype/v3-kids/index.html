<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구야, 오늘 어때? — EARTHUS KIDS 샘플</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --kid:"Jua","Malgun Gothic",sans-serif;
  --ui:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --space-0:#050b1c;
  --space-1:#0d1a3a;
  --bubble:#ffffff;
  --bubble-ink:#16223a;
  --rail:rgba(255,255,255,.14);
  --sun:#FFC24B;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--space-0)}
body{
  font-family:var(--ui);color:#fff;
  -webkit-font-smoothing:antialiased;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#stage{position:fixed;inset:0}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#windcv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}

/* ── 하늘 배경 ── */
#sky{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 42%, #16305e 0%, #0c1a3c 42%, #050b1c 100%);
}
#stars{position:absolute;inset:0;pointer-events:none}

/* ── 머리글 ── */
#head{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none;z-index:6}
#head h1{font-family:var(--kid);font-size:clamp(26px,3.6vw,40px);margin:0;letter-spacing:.01em;
  text-shadow:0 2px 14px rgba(0,0,0,.55)}
#head p{margin:8px 0 0;font-size:clamp(12px,1.4vw,15px);opacity:.72;text-shadow:0 1px 10px rgba(0,0,0,.85),0 0 18px rgba(5,11,28,.8)}

/* ── 상태 배지 ── */
#badge{position:absolute;top:20px;right:20px;z-index:7;display:flex;gap:8px;align-items:center;
  font-size:11.5px;letter-spacing:.06em;background:rgba(6,14,32,.62);border:1px solid rgba(255,255,255,.16);
  padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px)}
#badge .dot{width:7px;height:7px;border-radius:50%;background:#5ce0a0;box-shadow:0 0 9px #5ce0a0}
#badge.warn .dot{background:#ffb020;box-shadow:0 0 9px #ffb020}
#badge.err .dot{background:#ff7a7a;box-shadow:0 0 9px #ff7a7a}

/* ── 왼쪽 레일 ── */
#rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);z-index:6;
  display:flex;flex-direction:column;gap:12px}
.railbtn{
  width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.10);backdrop-filter:blur(8px);
  display:grid;place-items:center;cursor:pointer;color:#fff;
  transition:transform .16s ease, background .16s ease;
}
.railbtn:hover{background:rgba(255,255,255,.2)}
.railbtn[aria-pressed="true"]{background:#fff;color:#123;border-color:#fff}
.railbtn:active{transform:scale(.93)}
.railbtn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.railbtn svg{width:28px;height:28px;display:block}

/* ── 아래 알약 내비 ── */
#nav{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;gap:6px;background:rgba(8,16,36,.66);border:1px solid rgba(255,255,255,.16);
  padding:7px;border-radius:999px;backdrop-filter:blur(10px)}
#nav button{
  font-family:var(--kid);font-size:17px;color:#fff;background:transparent;border:0;
  padding:10px 20px;border-radius:999px;cursor:pointer;min-height:44px;white-space:nowrap;
}
#nav button[aria-current="true"]{background:#fff;color:#132242}
#nav button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ── 우리 집 버튼 ── */
#home{position:absolute;right:20px;bottom:26px;z-index:6;
  width:64px;height:64px;border-radius:22px;border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);cursor:pointer;color:#fff;
  font-family:var(--kid);font-size:12px;display:grid;place-items:center;gap:2px;line-height:1.1}
#home:active{transform:scale(.94)}
#home:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#home span{font-size:22px}

/* ── 말풍선 ── */
.bub{
  position:absolute;z-index:5;transform:translate(-50%,-100%);
  pointer-events:none;will-change:transform,opacity;
}
.bub .box{
  font-family:var(--kid);font-size:15px;line-height:1.34;color:var(--bubble-ink);
  background:var(--bubble);border-radius:16px;padding:9px 14px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.32);position:relative;
}
.bub .box::after{
  content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--bubble);border-bottom:0;
}
.bub .box b{display:block;font-size:12px;opacity:.55;font-weight:400}

/* ── 산맥 이름 ── */
.mt{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--kid);font-size:12.5px;color:#FFE8C7;letter-spacing:.02em;white-space:nowrap;
  text-shadow:0 1px 3px rgba(40,22,6,.9),0 0 10px rgba(40,22,6,.7);will-change:transform,opacity}

/* ── 나라 이름 (살짝만) ── */
.nm{
  position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--kid);font-size:13px;color:#fff;letter-spacing:.02em;
  text-shadow:0 1px 3px rgba(8,22,16,.75),0 0 10px rgba(8,22,16,.5);
  will-change:transform,opacity;white-space:nowrap;
}

/* ── 날씨 친구 ── */
.crt{position:absolute;z-index:4;transform:translate(-50%,-50%);pointer-events:none;
  will-change:transform,opacity}
.crt svg{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
@keyframes bobb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flash{0%,88%,100%{opacity:.25}90%,96%{opacity:1}}
.crt .bob{animation:bobb 3.4s ease-in-out infinite}
.crt .zap{animation:flash 2.6s steps(1,end) infinite;transform-origin:center}

/* ── 화석 핀 ── */
.pin{position:absolute;z-index:5;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  will-change:transform,opacity}
.pin .dot{width:15px;height:15px;border-radius:50%;background:#FFC24B;border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5);margin:0 auto}
.pin .nm2{font-family:var(--kid);font-size:12.5px;color:#fff;white-space:nowrap;text-align:center;
  margin-top:3px;text-shadow:0 1px 4px rgba(4,10,24,.95),0 0 10px rgba(4,10,24,.8)}
.pin.sel .dot{background:#fff;transform:scale(1.25)}
.pin .dot{transition:transform .15s ease}

/* ── 화석 카드 ── */
#card{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:8;width:min(420px,calc(100% - 32px));
  background:rgba(10,18,38,.94);border:1px solid rgba(255,255,255,.2);border-radius:18px;
  padding:18px 20px 16px;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#card[hidden]{display:none!important}
#card h2{font-family:var(--kid);font-size:20px;margin:0 0 2px;color:#fff}
#card .meta{font-size:11.5px;color:#9fb4d6;letter-spacing:.02em;margin-bottom:10px}
#card .kid{font-family:var(--kid);font-size:16px;line-height:1.55;color:#FFE3A8;margin-bottom:10px}
#card ul{margin:0 0 10px;padding-left:17px;display:flex;flex-direction:column;gap:3px;
  font-size:13px;color:#dbe6f7;line-height:1.5}
#card .rec{font-size:12.5px;color:#9fb4d6;border-top:1px solid rgba(255,255,255,.14);
  padding-top:9px;line-height:1.55}
#card .warn2{color:#FFC24B}
#card button.x{position:absolute;top:10px;right:12px;background:none;border:0;color:#9fb4d6;
  font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;min-width:34px;min-height:34px}
#card button.x:focus-visible{outline:2px solid var(--sun);border-radius:6px}

/* ── 시간 손잡이 ── */
#timebar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:7;
  width:min(560px,calc(100% - 32px));background:rgba(8,16,36,.82);border:1px solid rgba(255,255,255,.18);
  border-radius:20px;padding:13px 20px 11px;backdrop-filter:blur(10px)}
#timebar[hidden]{display:none!important}
.tb-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.tb-when{font-family:var(--kid);font-size:20px;color:#fff}
.tb-conf{font-size:11px;color:#9fb4d6;text-align:right;line-height:1.4}
#timeslider{width:100%;accent-color:#FFC24B;height:30px;cursor:pointer}
#timeslider:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.tb-foot{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:#8ba2c4;margin-top:1px}
.tb-foot #tb-note{color:#c3d3ea;text-align:center}

/* ── 첫 안내 ── */
#hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:6;
  font-family:var(--kid);font-size:16px;background:rgba(8,16,36,.7);padding:10px 20px;
  border-radius:999px;border:1px solid rgba(255,255,255,.18);transition:opacity .5s}
#hint.gone{opacity:0}

@media (prefers-reduced-motion:reduce){
  .crt .bob,.crt .zap{animation:none}
}
@media (max-width:720px){
  #head{top:44px} #head h1{font-size:21px} #head p{display:none}
  #badge{top:8px;right:8px;left:auto;font-size:9.5px;padding:5px 9px;letter-spacing:.02em}
  #nav button{padding:9px 13px;font-size:15px}
  #nav{bottom:18px}
  #home{bottom:18px}
  #rail{left:10px;gap:9px}
  .railbtn{width:48px;height:48px;border-radius:15px}
  .railbtn svg{width:24px;height:24px}
  #home{width:56px;height:56px;right:12px}
  .bub .box{font-size:13.5px;padding:7px 11px}
  #timebar{bottom:84px;padding:10px 14px 9px}
  #card{bottom:150px}
  .tb-when{font-size:17px}
}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <canvas id="stars"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="windcv"></canvas>

  <div id="head">
    <h1>지구야, 오늘 어때?</h1>
    <p>지구를 돌려서 지금 날씨를 만나 보세요</p>
  </div>

  <div id="badge"><span class="dot"></span><span id="badgetxt">불러오는 중</span></div>

  <div id="rail" role="group" aria-label="지구에 켤 것">
    <button class="railbtn" id="b-cloud" aria-pressed="true" aria-label="구름 보기" title="구름">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 23h13a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 8.3 13 5 5 0 0 0 9 23Z"/></svg>
    </button>
    <button class="railbtn" id="b-rain" aria-pressed="true" aria-label="비 보기" title="비">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 19h13a5.3 5.3 0 0 0 .4-10.6A7.3 7.3 0 0 0 8.3 9 4.9 4.9 0 0 0 9 19Z"/>
        <path d="M12 24l-1.5 3.5M17 24l-1.5 3.5M22 24l-1.5 3.5"/></svg>
    </button>
    <button class="railbtn" id="b-zap" aria-pressed="true" aria-label="번개 보기" title="번개">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18h12a5 5 0 0 0 .4-10A7 7 0 0 0 8.4 8.6 4.7 4.7 0 0 0 9 18Z"/>
        <path d="M17 20l-4 5h4l-1.5 4.5"/></svg>
    </button>
    <button class="railbtn" id="b-wind" aria-pressed="false" aria-label="바람 보기" title="바람">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
        <path d="M3 11h14a4 4 0 1 0-4-4"/><path d="M3 17h20a4 4 0 1 1-4 4"/><path d="M3 23h11"/></svg>
    </button>
    <button class="railbtn" id="b-mtn" aria-pressed="false" aria-label="산맥 보기" title="산맥">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 25l7.5-12 5 7.5 3.5-5.5L26 25z"/><path d="M10.5 13l2.6 4.2"/>
        <path d="M19 15l-2.2 3.4"/></svg>
    </button>
    <button class="railbtn" id="b-fossil" aria-pressed="false" aria-label="공룡 발자국 보기" title="공룡 발자국">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 26c-2.2 0-4-1.5-4-3.6 0-2.6 2.4-3.4 2.4-5.6 0-1.6-1.2-2.3-1.2-4C10.2 10.5 12 9 14.3 9c2.4 0 4.2 1.6 4.2 3.9 0 2-1.4 2.7-1.4 4.4 0 2.3 2.6 2.9 2.6 5.5 0 2-1.9 3.2-4 3.2"/>
        <circle cx="11.4" cy="6.4" r="1.7"/><circle cx="16.6" cy="4.9" r="1.7"/><circle cx="21.2" cy="7.4" r="1.7"/></svg>
    </button>
    <button class="railbtn" id="b-night" aria-pressed="true" aria-label="낮과 밤 보기" title="낮과 밤">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="10"/><path d="M16 6a10 10 0 0 0 0 20"/><path d="M16 6v20"/></svg>
    </button>
  </div>

  <div id="nav" role="group" aria-label="화면 고르기">
    <button aria-current="true">오늘</button>
    <button>지구</button>
    <button>실험</button>
    <button>내 책</button>
  </div>

  <button id="home" aria-label="우리 집으로 돌아가기"><span>🏠</span>우리 집</button>

  <div id="timebar" hidden>
    <div class="tb-head">
      <span class="tb-when">지금</span>
      <span class="tb-conf"></span>
    </div>
    <input id="timeslider" type="range" min="0" max="21" step="1" value="0"
           aria-label="시간 되감기 — 오른쪽으로 갈수록 먼 옛날">
    <div class="tb-foot">
      <span>지금</span>
      <span id="tb-note">한반도를 손으로 되감아 보세요</span>
      <span>2억 5천만 년 전</span>
    </div>
  </div>

  <div id="card" hidden></div>
  <div id="hint">손가락으로 지구를 돌려 보세요</div>
</div>

<script type="module">
import * as THREE from '../vendor/three-r184.module.min.js';

/* ══════════════════════════════════════════════════════════════
   EARTHUS v3 KIDS — 샘플 1: 지금 지구에서
   원칙: 크기는 과장하되 위치와 존재는 사실.
        데이터가 없으면 친구도 나타나지 않는다.
   ══════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const stage = $('#stage');
const badge = $('#badge'), badgetxt = $('#badgetxt');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── 별 배경 (장식이며 실제 항성 카탈로그가 아님) ─────────────── */
(function stars(){
  const c = $('#stars'), x = c.getContext('2d');
  function draw(){
    const w = c.width = innerWidth, h = c.height = innerHeight;
    x.clearRect(0,0,w,h);
    for(let i=0;i<260;i++){
      const r = Math.random()*1.25+.25;
      x.globalAlpha = Math.random()*.55+.18;
      x.fillStyle = '#dfe9ff';
      x.beginPath(); x.arc(Math.random()*w, Math.random()*h, r, 0, 6.283); x.fill();
    }
    x.globalAlpha = 1;
  }
  draw(); addEventListener('resize', draw);
})();

/* ── 태양 위치: 실시간 천문 계산 (v2와 동일 규약) ──────────────── */
function subsolar(date){
  const d = date.getTime()/86400000 + 2440587.5 - 2451545.0;      // J2000 기준일
  const g = (357.529 + 0.98560028*d) * Math.PI/180;                 // 평균 근점이각
  const q = 280.459 + 0.98564736*d;                                 // 평균 황경
  const L = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * Math.PI/180;
  const e = (23.439 - 0.00000036*d) * Math.PI/180;                  // 황도 경사
  const dec = Math.asin(Math.sin(e)*Math.sin(L));                   // 적위
  const ra  = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L));     // 적경
  const gmst = (18.697374558 + 24.06570982441908*d) % 24;
  let lon = (ra*180/Math.PI) - gmst*15;
  lon = ((lon + 540) % 360) - 180;
  return { lat: dec*180/Math.PI, lon };
}
const llToVec = (lat, lon, r=1) => {
  const p = (90-lat)*Math.PI/180, t = (lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
};

/* ── 툰 지구 텍스처: 진짜 해안선을 평평한 색 두 단으로 ─────────── */
let COUNTRY_LABELS = [];      // {name, lat, lon}

// 이름을 붙일 나라. 다 붙이면 지구가 글자로 덮인다 — 화면당 몇 개만 보이게 할 것.
const LABEL_CODES = new Set([
  'KR','JP','CN','MN','TW','PH','VN','TH','ID','MY','IN','PK','KZ','RU',
  'AU','NZ','US','CA','MX','BR','AR','CL','PE','CO',
  'GB','FR','DE','ES','IT','PL','SE','NO','UA','TR','SA','IR','IQ',
  'EG','ZA','NG','ET','KE','DZ','MA','CD','TZ','SD','GL'
]);

// 정식 국호 대신 아이가 부르는 이름
const SHORT_NAME = {
  CN:'중국', RU:'러시아', US:'미국', GB:'영국', KR:'한국', KP:'북한',
  JP:'일본', IN:'인도', BR:'브라질', AU:'호주', NZ:'뉴질랜드',
  DE:'독일', FR:'프랑스', ES:'스페인', IT:'이탈리아', NL:'네덜란드',
  EG:'이집트', ZA:'남아공', SA:'사우디', AE:'아랍에미리트',
  MX:'멕시코', CA:'캐나다', AR:'아르헨티나', CL:'칠레', PE:'페루', CO:'콜롬비아',
  TR:'튀르키예', IR:'이란', IQ:'이라크', UA:'우크라이나', PL:'폴란드',
  SE:'스웨덴', NO:'노르웨이', KZ:'카자흐스탄', MN:'몽골', TW:'대만',
  PH:'필리핀', VN:'베트남', TH:'태국', ID:'인도네시아', MY:'말레이시아',
  PK:'파키스탄', NG:'나이지리아', ET:'에티오피아', KE:'케냐',
  DZ:'알제리', MA:'모로코', CD:'콩고', TZ:'탄자니아', SD:'수단', GL:'그린란드',
};

const polysOf = geo => geo.type === 'Polygon' ? [geo.coordinates]
                     : geo.type === 'MultiPolygon' ? geo.coordinates : [];

// 가장 큰 고리의 면적중심 — 이름표를 나라 한복판에 놓기 위해서다
function labelPoint(geo){
  let best = null, bestA = 0;
  for(const poly of polysOf(geo)){
    const ring = poly[0]; if(!ring || ring.length < 4) continue;
    let a = 0, cx = 0, cy = 0;
    for(let i=0;i<ring.length-1;i++){
      const [x1,y1] = ring[i], [x2,y2] = ring[i+1];
      const f = x1*y2 - x2*y1;
      a += f; cx += (x1+x2)*f; cy += (y1+y2)*f;
    }
    a *= 0.5;
    if(Math.abs(a) > Math.abs(bestA)){
      bestA = a;
      best = Math.abs(a) < 1e-9 ? [ring[0][0], ring[0][1]]
                                : [cx/(6*a), cy/(6*a)];
    }
  }
  return best && Math.abs(bestA) > 2 ? { lon: best[0], lat: best[1] } : null;
}

async function buildEarthTexture(){
  const W = 4096, H = 2048;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  // 바다 — 한 가지 다정한 파랑
  g.fillStyle = '#3E86D6'; g.fillRect(0,0,W,H);

  let feats = [];
  try {
    const r = await fetch('../data/country-reference.json');
    feats = (await r.json()).features || [];
  } catch(e){ console.warn('국가 폴리곤 로드 실패', e); }

  const px = (lon,lat) => [ (lon+180)/360*W, (90-lat)/180*H ];

  function trace(){
    for(const f of feats){
      for(const poly of polysOf(f.geometry)){
        for(const ring of poly){
          g.moveTo(...px(ring[0][0], ring[0][1]));
          for(let i=1;i<ring.length;i++) g.lineTo(...px(ring[i][0], ring[i][1]));
          g.closePath();
        }
      }
    }
  }

  // 땅 — 초록 한 단, 그 위에 살짝 밝은 안쪽 단 (툰 두 단)
  g.fillStyle = '#4E9E52'; g.beginPath(); trace(); g.fill('evenodd');
  g.globalAlpha = .5;
  g.fillStyle = '#69B45E'; g.beginPath(); trace(); g.fill('evenodd');
  g.globalAlpha = 1;

  // 국경선 — 살짝만. 있는 줄 알 정도지 읽으라고 그리는 게 아니다.
  g.strokeStyle = 'rgba(255,255,255,.34)';
  g.lineWidth = 2.4; g.lineJoin = 'round';
  g.beginPath(); trace(); g.stroke();

  // 해안선은 국경선보다 조금 더 또렷하게 — 땅의 윤곽이 먼저 읽혀야 한다
  g.strokeStyle = 'rgba(28,72,48,.30)';
  g.lineWidth = 3.2;
  g.beginPath(); trace(); g.stroke();

  // 극지 — 눈 색. 위도로만 칠하고 위치를 만들지 않는다.
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,   'rgba(243,249,255,1)');
  grad.addColorStop(.030,'rgba(243,249,255,1)');     // 극은 완전히 덮는다
  grad.addColorStop(.105,'rgba(243,249,255,0)');
  grad.addColorStop(.895,'rgba(243,249,255,0)');
  grad.addColorStop(.970,'rgba(243,249,255,1)');
  grad.addColorStop(1,   'rgba(243,249,255,1)');
  g.fillStyle = grad; g.fillRect(0,0,W,H);

  COUNTRY_LABELS = feats
    .filter(f => LABEL_CODES.has(f.code))
    .map(f => { const p = labelPoint(f.geometry);
                return p ? { name: SHORT_NAME[f.code] || f.nameKo || f.nameEn, ...p } : null; })
    .filter(Boolean);

  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

const earthGroup = new THREE.Group();
scene.add(earthGroup);

const R = 1;
const sunDir = new THREE.Vector3();

/* 툰 셰이딩: 낮/황혼/밤 세 단. 밴딩이 곧 화풍이다. */
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    map:      { value: null },
    sunDir:   { value: sunDir },
    nightMix: { value: 1 },
    pastFade: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv; varying vec3 vN;
    void main(){ vUv = uv; vN = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D map; uniform vec3 sunDir; uniform float nightMix; uniform float pastFade;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      vec3 base = texture2D(map, vUv).rgb;
      float d = dot(normalize(vN), normalize(sunDir));
      float band = d > 0.28 ? 1.0 : (d > -0.06 ? 0.62 : 0.30);
      band = mix(1.0, band, nightMix);
      vec3 night = mix(base, vec3(0.09,0.15,0.34), 0.72);
      vec3 col = mix(night, base, smoothstep(0.30, 1.0, band));
      col *= 0.72 + 0.28*band;
      float rim = pow(1.0 - abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 2.6);
      col += vec3(0.36,0.60,0.95) * rim * 0.5;
      // 과거를 볼 때 오늘 지도는 뒤로 물린다 — 지우지는 않는다. 어디가 지금인지는 알아야 한다.
      col = mix(col, vec3(0.10,0.16,0.28), pastFade * 0.82);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 80), earthMat);
earthGroup.add(earth);

/* 대기 — 바깥으로 부드럽게 번지는 파란 테두리 */
const glow = new THREE.Mesh(
  new THREE.SphereGeometry(R*1.055, 64, 40),
  new THREE.ShaderMaterial({
    transparent:true, side:THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec3 vN;
      void main(){ float i = pow(1.0-abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 3.0);
      gl_FragColor = vec4(0.42,0.68,1.0, i*0.85); }`
  })
);
earthGroup.add(glow);

/* ── 구름 껍질: NOAA GMGSI 관측 영상을 평평한 2D 로 계단화 ──────────
   전에는 손으로 그린 구름 도장을 격자마다 찍었다. 모양이 지어낸 것이었고
   가까이 가면 같은 그림이 반복돼 벽지처럼 보였다.
   지금은 정지궤도 위성 적외 합성 영상을 그대로 받아서, 밝기를 두 단으로
   끊어 평평하게 칠한다 — 모양은 진짜, 칠은 2D. */
const cloudTex = new THREE.Texture();
cloudTex.colorSpace = THREE.SRGBColorSpace;

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(R*1.012, 96, 60),
  new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{
      map:    { value: cloudTex },
      texel:  { value: new THREE.Vector2(1/3072, 1/1536) },
      ready:  { value: 0 },
    },
    vertexShader:`
      varying vec2 vUv;
      void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader:`
      uniform sampler2D map; uniform vec2 texel; uniform float ready;
      varying vec2 vUv;
      void main(){
        if(ready < 0.5) discard;

        // 이 합성 영상은 알파가 "구름이 얼마나 있나"이고 밝기는 "얼마나 흰가"다.
        // (사하라 = 알파 0, 적도 적운대 = 알파 246 을 직접 재서 확인했다.)
        // 적외 영상의 잔 알갱이를 이웃 평균으로 눌러 둥근 덩어리로 만든다.
        // 모양을 지어내는 게 아니라 해상도를 낮추는 것이다 — 구름은 제자리에 있다.
        float a = 0.0, l = 0.0;
        for(int i=-2;i<=2;i++){
          for(int j=-2;j<=2;j++){
            vec4 t = texture2D(map, vUv + vec2(float(i), float(j)) * texel * 2.4);
            a += t.a; l += t.r;
          }
        }
        a /= 25.0; l /= 25.0;

        // 구름이 없는 곳과 관측이 없는 곳은 그리지 않는다
        if(a < 0.10) discard;

        // 평평한 두 단. 가장자리는 계단이 안 보일 만큼만 부드럽게.
        float lo = smoothstep(0.11, 0.19, a);   // 구름이 있다
        float hi = smoothstep(0.46, 0.66, a);   // 두꺼운 구름
        float alpha = lo * (0.58 + 0.42*hi);
        vec3  col   = mix(vec3(0.79,0.85,0.94), vec3(1.0,1.0,1.0), max(hi, l*0.35));

        gl_FragColor = vec4(col, alpha);
      }
    `
  })
);
earthGroup.add(clouds);

/* 관측 구름 한 장을 받아 온다.
   S3 를 직접 부른다 — CloudFront 는 /clouds/* 말고는 CORS 헤더를 안 붙이고,
   로컬 개발에서는 같은 출처가 아니기 때문이다. */
const CLOUD_BASE = 'https://earthus-cache-kr.s3.us-east-2.amazonaws.com/clouds';

/* ── 지금까지 본 것 중 가장 성한 장을 기기 안에 쌓는다 ────────────────
   S3 의 global.png 는 갱신 때마다 덮어써져서 과거 프레임이 남지 않는다.
   그래서 브라우저가 직접 쌓는다.

   ⚠️ 처음엔 "결손이 하나도 없는 장"만 보관했는데, 원본 결손이 며칠 이어지면
   보관되는 장이 영영 없어 메울 재료가 생기지 않았다. 그래서 **칸 단위로 최선을
   누적**한다 — 이번에 성한 칸은 갱신하고, 이번에 빈 칸은 예전 것을 남긴다.
   서버로는 아무것도 보내지 않는다. */
const CLOUD_DB = 'earthus-v3-clouds';
function idbOpen(){
  return new Promise((ok, no) => {
    const rq = indexedDB.open(CLOUD_DB, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('frame');
    rq.onsuccess = () => ok(rq.result);
    rq.onerror = () => no(rq.error);
  });
}
async function lastGoodFrame(){
  try{
    const db = await idbOpen();
    return await new Promise((ok) => {
      const rq = db.transaction('frame').objectStore('frame').get('last');
      rq.onsuccess = () => ok(rq.result || null);
      rq.onerror = () => ok(null);
    });
  }catch(e){ return null; }
}
async function keepFrame(rec){
  try{
    const db = await idbOpen();
    db.transaction('frame', 'readwrite').objectStore('frame').put(rec, 'last');
  }catch(e){ /* 저장 못 해도 화면은 돌아간다 */ }
}

/* ── 깨진 칸 찾기 ────────────────────────────────────────────────
   위성 합성이 한 구역을 못 받으면 그 자리가 통째로 알파 255 로 채워져 나온다.
   진짜 구름과는 확실히 구별된다 — 직접 재 봤다(2026-09-03):
     깨진 자리   알파평균 255, 알파분산 0.0
     콩고 적운대 알파평균 129, 알파분산 9576
     사하라 맑음 알파평균 0,   알파분산 0.4
   구름은 늘 결이 있고 깨진 자리는 완전히 평평하다. 이 둘을 가르는 게 분산이다. */
const CELL = 64;
function findBrokenCells(data, W, H){
  const bad = [];
  for(let cy = 0; cy < H; cy += CELL){
    for(let cx = 0; cx < W; cx += CELL){
      let n = 0, sum = 0, sum2 = 0;
      for(let y = cy; y < Math.min(cy+CELL, H); y += 4){
        for(let x = cx; x < Math.min(cx+CELL, W); x += 4){
          const a = data[(y*W + x)*4 + 3];
          n++; sum += a; sum2 += a*a;
        }
      }
      if(!n) continue;
      const mean = sum/n, varc = sum2/n - mean*mean;
      if(mean > 250 && varc < 5) bad.push([cx, cy]);
    }
  }
  return bad;
}

async function loadObservedClouds(){
  const meta = await fetch(`${CLOUD_BASE}/meta.json`, { cache:'no-cache' })
    .then(r => { if(!r.ok) throw new Error(`meta ${r.status}`); return r.json(); });

  const blob = await fetch(`${CLOUD_BASE}/global.png?t=${encodeURIComponent(meta.time)}`)
    .then(r => { if(!r.ok) throw new Error(`png ${r.status}`); return r.blob(); });
  const bmp = await createImageBitmap(blob);

  // 위성이 극을 못 본다. 영상이 덮는 위도 띠에만 놓고 나머지는 비운다 —
  // 늘려 채우면 없는 관측을 만들어 내는 것이 된다.
  const north = meta.north ?? 72.715, south = meta.south ?? -72.737;
  const W = bmp.width, H = Math.round(W/2);
  const bandY = Math.round(((90-north)/180)*H);
  const bandH = Math.round(((north-south)/180)*H);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.clearRect(0,0,W,H);
  g.drawImage(bmp, 0, bandY, W, bandH);

  const img = g.getImageData(0, 0, W, H);
  const broken = findBrokenCells(img.data, W, H);

  let patched = 0, patchTime = null, stillEmpty = broken.length;
  if(broken.length){
    // 깨진 칸은 일단 지운다 — 쓰레기를 구름으로 그리지 않는다.
    for(const [cx, cy] of broken){
      for(let y = cy; y < Math.min(cy+CELL, H); y++){
        let o = (y*W + cx)*4 + 3;
        for(let x = cx; x < Math.min(cx+CELL, W); x++, o += 4) img.data[o] = 0;
      }
    }
    g.putImageData(img, 0, 0);

    // 그 자리만 예전에 성했던 자료에서 가져와 메운다.
    const prev = await lastGoodFrame();
    if(prev && prev.time !== meta.time){
      try{
        const pb = await createImageBitmap(prev.blob);      // 누적본은 이미 등장방형 전체다
        const pc = document.createElement('canvas'); pc.width = W; pc.height = H;
        const pg = pc.getContext('2d', { willReadFrequently: true });
        pg.drawImage(pb, 0, 0, W, H);
        const pd = pg.getImageData(0, 0, W, H).data;
        for(const [cx, cy] of broken){
          // 예전 자료의 그 칸도 비어 있으면 메울 게 없다 — 억지로 채우지 않는다
          let has = false;
          for(let y = cy; y < Math.min(cy+CELL, H) && !has; y += 4)
            for(let x = cx; x < Math.min(cx+CELL, W); x += 4)
              if(pd[(y*W + x)*4 + 3] > 8){ has = true; break; }
          if(!has) continue;
          const cw = Math.min(CELL, W-cx), ch2 = Math.min(CELL, H-cy);
          g.drawImage(pc, cx, cy, cw, ch2, cx, cy, cw, ch2);
          patched++;
        }
        stillEmpty = broken.length - patched;
        if(patched) patchTime = prev.time;
      }catch(e){ console.warn('예전 자료로 메우지 못했다', e); }
    }
  }

  // 지금 화면이 지금까지의 최선이다 — 통째로 누적본으로 갈아 둔다.
  cv.toBlob((b) => { if(b) keepFrame({ time: meta.time, blob: b }); }, 'image/png');

  cloudTex.image = cv;
  cloudTex.colorSpace = THREE.SRGBColorSpace;
  cloudTex.wrapS = THREE.RepeatWrapping;
  cloudTex.minFilter = THREE.LinearMipmapLinearFilter;
  cloudTex.magFilter = THREE.LinearFilter;
  cloudTex.anisotropy = 8;
  cloudTex.needsUpdate = true;
  clouds.material.uniforms.texel.value.set(1/W, 1/H);
  clouds.material.uniforms.ready.value = 1;

  return { ...meta, broken: broken.length, patched, patchTime, stillEmpty };
}

/* ── 카메라: 세 칸으로 잠근 줌 ────────────────────────────────── */
// 줌 단계 = 화면 짧은 변의 절반 대비 지구 반지름 비율. 기기가 달라도 같은 크기로 보인다.
const FILL = [0.80, 1.28, 1.80];    // 지구 전체 / 우리나라 / 우리 동네
let tanMin = 0.344, screenR = 300;  // 매 프레임 갱신
const distFor = f => R / (f * tanMin);
const STOPS = FILL;
let stop = 0, dist = 3.6, distTarget = 3.6;
// 지구가 화면 짧은 변의 절반에서 차지하는 비율. 세 칸이 정하던 범위를 그대로 위아래 한계로 쓴다.
let fill = FILL[0];
const FILL_MIN = FILL[0], FILL_MAX = FILL[FILL.length-1];
const clampFill = f => Math.max(FILL_MIN, Math.min(FILL_MAX, f));
function applyFill(){ distTarget = distFor(fill); }
const HOME = { lat: 36.5, lon: 127.9 };            // 부모가 고른 우리 동네 (GPS 아님)
const yawFor   = lon => -lon*Math.PI/180;
const pitchFor  = lat =>  lat*Math.PI/180;
let yaw = yawFor(HOME.lon), pitch = pitchFor(HOME.lat);
let yawTarget = yaw, pitchTarget = pitch, following = false;
let yawV = 0, pitchV = 0, dragging = false, lastX = 0, lastY = 0, idle = 0;
const MAX_SPIN = 1.05;                              // rad/s ≈ 60°/s — 초당 90도보다 보수적으로

function pointerDown(e){
  dragging = true; idle = 0; following = false; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture?.(e.pointerId);
  $('#hint').classList.add('gone');
}
function pointerMove(e){
  if(!dragging || touches.size >= 2) return;
  const k = 0.0052 * (dist/distFor(FILL[0]));
  yawV   += (e.clientX-lastX)*k;
  pitchV += (e.clientY-lastY)*k;
  lastX = e.clientX; lastY = e.clientY;
}
function pointerUp(){ dragging = false; }
/* 마우스 휠 — 세 칸이 정하던 범위 안에서만 연속으로 움직인다.
   자유 줌이면 아이가 지구 밖으로 나가거나 텍스처가 깨질 만큼 붙는다. */
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const step = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // 줄 단위로 오는 브라우저 보정
  fill = clampFill(fill * Math.exp(-step * 0.0012));
  applyFill();
  following = false;
  $('#hint').classList.add('gone');
}, { passive: false });

/* 두 손가락 핀치 — 있으면 좋지만 없어도 전부 되는 보조 수단.
   레일과 아래 칸 버튼으로 같은 일을 할 수 있다. */
const touches = new Map();
let pinchStart = 0, pinchFill = 0;
function pinchDist(){
  const [a, b] = [...touches.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}
canvas.addEventListener('pointerdown', (e) => {
  if(e.pointerType === 'touch'){
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(touches.size === 2){ pinchStart = pinchDist(); pinchFill = fill; dragging = false; }
  }
});
addEventListener('pointermove', (e) => {
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(touches.size === 2 && pinchStart > 0){
    fill = clampFill(pinchFill * (pinchDist() / pinchStart));
    applyFill();
    following = false;
  }
});
function dropTouch(e){
  if(touches.delete(e.pointerId) && touches.size < 2) pinchStart = 0;
}
addEventListener('pointerup', dropTouch);
addEventListener('pointercancel', dropTouch);

canvas.addEventListener('pointerdown', pointerDown);
addEventListener('pointermove', pointerMove);
addEventListener('pointerup', pointerUp);
addEventListener('pointercancel', pointerUp);

function goStop(i){
  stop = Math.max(0, Math.min(FILL.length-1, i));
  fill = FILL[stop];
  applyFill();
}
// 지금 배율이 세 칸 중 어디에 가장 가까운가 — 다음 칸 버튼이 늘 말이 되게
function nearestStop(){
  let best = 0, d = Infinity;
  FILL.forEach((f,i)=>{ const g = Math.abs(f - fill); if(g < d){ d = g; best = i; } });
  return best;
}

/* ══════════════════════════════════════════════════════════════
   바람 — 윈디식 흐름선
   격자에서 u·v 를 읽어 입자를 떠내려 보내고, 지나간 자리를 천천히 지워
   꼬리를 남긴다. 방향과 상대 세기는 실측 그대로다.

   ⚠️ 흐르는 속도만 과장한다. 실제 10m/s 는 1초에 0.0001도라 눈에 안 보인다.
      화면에 그렇다고 적는다 — 위치와 방향은 사실, 흐름 속도는 보이라고 키운 값.

   ⚠️ 격자 방향을 물리로 확인했다(2026-09-03): y=0 이 lat0(-80°)이고 북쪽으로
      올라간다. 소말리 제트(10N 60E, 9월 남서풍)가 이 해석에서만 u>0·v>0 로
      맞았다. 뒤집으면 바람이 통째로 거꾸로 흐른다.
   ══════════════════════════════════════════════════════════════ */
let WIND = null;
const windCv = $('#windcv'), windCtx = windCv.getContext('2d');
let particles = [], windOn = false;
const PARTICLES = 2600;
// 한 프레임의 이동은 픽셀 이하다. 꼬리는 그 점들이 여러 프레임 쌓여 생긴다 —
// 지우는 속도를 늦춰야 선으로 보인다. 크면 점만 찍히고 작으면 화면이 뿌옇게 찬다.
const TRAIL_FADE = 0.034;
// 흐름 속도 과장. 실제 10m/s 는 1초에 0.0001도라 프레임당 1픽셀도 못 간다.
// 물리 단위 대신 '초당 각도'로 잡는다 — 10m/s 가 초당 약 6도를 가게.
const DEG_PER_MS = 2.2;        // (도/초) / (m/s) — 10m/s 가 초당 22도

async function loadWind(){
  WIND = await fetch('https://earthus-cache-kr.s3.us-east-2.amazonaws.com/wind/global.json')
    .then(r => { if(!r.ok) throw new Error(`wind ${r.status}`); return r.json(); });
  seedParticles();
}

function seedParticles(){
  particles = [];
  for(let i = 0; i < PARTICLES; i++) particles.push(newParticle());
}
function newParticle(){
  // 면적에 고르게 뿌린다 — 위도로 균등하게 뿌리면 극에 몰린다
  return { lat: Math.asin(Math.random()*2 - 1) * 180/Math.PI,
           lon: Math.random()*360 - 180,
           age: Math.random()*90 | 0 };
}

/* 격자 겹선형 보간. 경도는 감아 돌고, 위도는 격자 밖이면 바람이 없다. */
function sampleWind(lat, lon){
  if(!WIND) return null;
  const { nx, ny, res, lat0, lon0, u, v } = WIND;
  const fy = (lat - lat0)/res, fx = (((lon - lon0) % 360) + 360) % 360 / res;
  if(fy < 0 || fy > ny-1) return null;
  const y0 = Math.floor(fy), x0 = Math.floor(fx);
  const ty = fy - y0, tx = fx - x0;
  const y1 = Math.min(y0+1, ny-1), x1 = (x0+1) % nx;
  const i00 = y0*nx + (x0 % nx), i10 = y0*nx + x1, i01 = y1*nx + (x0 % nx), i11 = y1*nx + x1;
  const lerp = (a,b,t) => a + (b-a)*t;
  return {
    u: lerp(lerp(u[i00], u[i10], tx), lerp(u[i01], u[i11], tx), ty),
    v: lerp(lerp(v[i00], v[i10], tx), lerp(v[i01], v[i11], tx), ty),
  };
}

/* 바람 색 — 느리면 연하고 빠르면 진하다. 색으로 세기를 읽게 한다. */
function windColor(sp){
  if(sp < 4)  return 'rgba(190,225,255,';
  if(sp < 9)  return 'rgba(150,240,220,';
  if(sp < 15) return 'rgba(255,236,150,';
  if(sp < 22) return 'rgba(255,178,110,';
  return            'rgba(255,140,170,';
}

const _wv = new THREE.Vector3();
function drawWind(dt, w, h){
  if(!windOn || !WIND) return;
  // 지나간 자리를 조금씩 지워 꼬리를 남긴다 (배경을 덮지 않고 지운다)
  windCtx.globalCompositeOperation = 'destination-out';
  windCtx.fillStyle = `rgba(0,0,0,${TRAIL_FADE})`;
  windCtx.fillRect(0, 0, w, h);
  windCtx.globalCompositeOperation = 'source-over';
  windCtx.lineWidth = 1.5;
  windCtx.lineCap = 'round';

  camera.getWorldPosition(_c);
  const step = Math.min(0.05, dt);

  for(const p of particles){
    const s = sampleWind(p.lat, p.lon);
    if(!s){ Object.assign(p, newParticle()); continue; }

    const lat0 = p.lat, lon0 = p.lon;
    const cosLat = Math.max(0.15, Math.cos(p.lat*Math.PI/180));
    p.lat += s.v * DEG_PER_MS * step;
    p.lon += s.u * DEG_PER_MS / cosLat * step;
    if(p.lon > 180) p.lon -= 360; else if(p.lon < -180) p.lon += 360;

    // 수명이 다하면 다시 뿌린다 — 안 그러면 수렴대에 다 모여 뭉친다
    if(++p.age > 170 || p.lat > 88 || p.lat < -88){ Object.assign(p, newParticle()); continue; }

    _wv.copy(llToVec(lat0, lon0, R*1.004)).applyMatrix4(earthGroup.matrixWorld);
    const face0 = _wv.clone().normalize().dot(_c.clone().sub(_wv).normalize());
    if(face0 <= 0.02) continue;                     // 지구 뒤는 그리지 않는다
    const a = _wv.clone().project(camera);
    _wv.copy(llToVec(p.lat, p.lon, R*1.004)).applyMatrix4(earthGroup.matrixWorld);
    const b = _wv.clone().project(camera);

    const x0 = (a.x*0.5+0.5)*w, y0v = (-a.y*0.5+0.5)*h;
    const x1 = (b.x*0.5+0.5)*w, y1v = (-b.y*0.5+0.5)*h;
    if(Math.abs(x1-x0) > w*0.3) continue;           // 경도 이음매를 건너뛴 선분

    const sp = Math.hypot(s.u, s.v);
    windCtx.strokeStyle = windColor(sp) + Math.min(1, 0.45 + face0*0.55).toFixed(2) + ')';
    windCtx.beginPath(); windCtx.moveTo(x0, y0v); windCtx.lineTo(x1, y1v); windCtx.stroke();
  }
}

$('#b-wind').addEventListener('click', e => {
  windOn = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(windOn));
  windCv.style.display = windOn ? '' : 'none';
  if(windOn) seedParticles();
  else windCtx.clearRect(0, 0, windCv.width, windCv.height);
});

/* ══════════════════════════════════════════════════════════════
   땅 — 세계 산맥
   손으로 그리지 않는다. Natural Earth 에 산맥 222개가 폴리곤으로 있고
   222개 전부 한국어 이름이 붙어 있다. 화면에 몇 개를 띄울지는 원본이 정한
   라벨 우선순위(pri)를 따른다 — 우리가 임의로 고르지 않는다.
   ══════════════════════════════════════════════════════════════ */
let MOUNTAINS = [];
let mtnLine = null;
const mtnMarks = [];

async function loadMountains(){
  const j = await fetch('../data/mountains.json').then(r=>r.json());
  MOUNTAINS = j.ranges;

  let segs = 0;
  for(const m of MOUNTAINS) for(const r of m.rings) segs += (r.length - 1);
  const pos = new Float32Array(segs * 2 * 3);
  let i = 0;
  for(const m of MOUNTAINS){
    for(const ring of m.rings){
      for(let k = 0; k < ring.length - 1; k++){
        // 경도 이음매를 건너뛰는 선분은 그리지 않는다 (지구를 가로지르는 줄이 생긴다)
        if(Math.abs(ring[k][0] - ring[k+1][0]) > 180){ i += 6; continue; }
        const a = llToVec(ring[k][1],   ring[k][0],   R*1.016);
        const b = llToVec(ring[k+1][1], ring[k+1][0], R*1.016);
        pos[i++]=a.x; pos[i++]=a.y; pos[i++]=a.z;
        pos[i++]=b.x; pos[i++]=b.y; pos[i++]=b.z;
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  mtnLine = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0xE0A25C, transparent: true, opacity: 0.95, depthWrite: false }));
  mtnLine.renderOrder = 4;
  mtnLine.visible = false;
  earthGroup.add(mtnLine);

  // 이름표는 큰 것부터 스물다섯 개만 준비한다. 화면에는 그중 몇 개만 뜬다.
  for(const m of MOUNTAINS.slice(0, 25)){
    const el = document.createElement('div');
    el.className = 'mt'; el.textContent = m.ko;
    el.style.visibility = 'hidden';
    stage.appendChild(el);
    mtnMarks.push({ m, el, pos: llToVec(m.at[1], m.at[0], R*1.02) });
  }
}

/* ══════════════════════════════════════════════════════════════
   과거 축 — 한국 공룡 화석지와 판 회전
   화석은 지금 좌표에서 나오지만, 그 공룡이 살던 시절엔 다른 자리였다.
   한반도(판 601)는 강체로 움직이므로 회전 행렬 하나면 전부 옮겨진다.
   ══════════════════════════════════════════════════════════════ */
let FOSSILS = [], PALEO = null, timeIdx = 0;
const fossilMarks = [];
let koreaRings = [];           // 한반도 해안선 (경도,위도) 고리들
let koreaLine = null;          // 회전해서 그리는 윤곽

async function loadPast(){
  const [fj, pj] = await Promise.all([
    fetch('../data/korea-fossils.json').then(r=>r.json()),
    fetch('../data/korea-paleo.json').then(r=>r.json()),
  ]);
  FOSSILS = fj.sites; PALEO = pj;
  $('#timeslider').max = String(PALEO.frames.length - 1);

  // 한반도 윤곽 — 핀만 옮기고 땅은 두면 거짓말이 된다. 같이 옮긴다.
  try{
    const cr = await fetch('../data/country-reference.json').then(r=>r.json());
    for(const f of cr.features){
      if(f.code !== 'KR' && f.code !== 'KP') continue;
      const g = f.geometry;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
      for(const poly of polys){
        const ring = poly[0];
        if(ring && ring.length > 12) koreaRings.push(ring);   // 아주 작은 섬은 뺀다
      }
    }
  }catch(e){ console.warn('한반도 윤곽 로드 실패', e); }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array(koreaRings.reduce((n,r)=>n+r.length*2*3, 0)), 3));
  koreaLine = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0xFFC24B, transparent: true, opacity: 0, depthWrite: false }));
  koreaLine.renderOrder = 3;
  earthGroup.add(koreaLine);

  for(const site of FOSSILS){
    const el = document.createElement('div');
    el.className = 'pin';
    el.innerHTML = `<div class="dot"></div><div class="nm2">${site.short}</div>`;
    el.addEventListener('click', ()=> openCard(site));
    stage.appendChild(el);
    fossilMarks.push({ site, el });
  }
  placeFossils();
}

/* 시대 t 의 회전 행렬. 사이 값은 이웃 프레임에서 고르지 않고 가까운 쪽을 쓴다 —
   행렬을 선형 보간하면 회전이 아니게 되고, 그건 모델에 없는 값을 만드는 것이다. */
function matrixAt(i){
  return PALEO ? PALEO.frames[Math.max(0, Math.min(PALEO.frames.length-1, i))] : null;
}
function rotateLL(lat, lon, m){
  if(!m) return { lat, lon };
  const la = lat*Math.PI/180, lo = lon*Math.PI/180;
  const x = Math.cos(la)*Math.cos(lo), y = Math.cos(la)*Math.sin(lo), z = Math.sin(la);
  const M = m.m;
  const X = M[0]*x + M[1]*y + M[2]*z;
  const Y = M[3]*x + M[4]*y + M[5]*z;
  const Z = M[6]*x + M[7]*y + M[8]*z;
  return { lat: Math.asin(Math.max(-1,Math.min(1,Z)))*180/Math.PI,
           lon: Math.atan2(Y, X)*180/Math.PI };
}

function placeFossils(){
  const m = matrixAt(timeIdx);
  for(const f of fossilMarks){
    const p = rotateLL(f.site.lat, f.site.lon, m);
    f.pos = llToVec(p.lat, p.lon, R*1.015);
  }
  drawKoreaOutline(m);
}

/* 한반도 윤곽을 그 시대 자리에 그린다. 같은 회전 행렬을 모든 꼭짓점에 적용한다 —
   판이 강체로 움직이므로 이게 근사가 아니라 원본과 같은 계산이다. */
function drawKoreaOutline(m){
  if(!koreaLine) return;
  const arr = koreaLine.geometry.attributes.position.array;
  let i = 0;
  const put = (lat, lon) => {
    const v = llToVec(lat, lon, R*1.014);
    arr[i++] = v.x; arr[i++] = v.y; arr[i++] = v.z;
  };
  for(const ring of koreaRings){
    for(let k = 0; k < ring.length - 1; k++){
      const a = rotateLL(ring[k][1],   ring[k][0],   m);
      const b = rotateLL(ring[k+1][1], ring[k+1][0], m);
      // 경도 이음매를 건너뛰는 선분은 그리지 않는다 (지구를 가로지르는 줄이 생긴다)
      if(Math.abs(a.lon - b.lon) > 180){ i += 6; continue; }
      put(a.lat, a.lon); put(b.lat, b.lon);
    }
  }
  while(i < arr.length) arr[i++] = 0;
  koreaLine.geometry.attributes.position.needsUpdate = true;
  koreaLine.geometry.computeBoundingSphere();
}

/* 시대 표기. 0 은 "지금"이고, 나머지는 만 년이 아니라 아이가 셀 수 있는 말로. */
function whenLabel(ma){
  if(ma === 0) return '지금';
  if(ma < 100) return `${ma.toLocaleString()}만 년 전`.replace(/^(\d+)만/, (_,n)=>`${n*100}만`);
  return `${(ma/100).toFixed(ma%100?1:0)}억 년 전`;
}
function whenKo(ma){
  if(ma === 0) return '지금';
  const eok = Math.floor(ma/100), man = ma%100;
  if(eok && man) return `${eok}억 ${man*100}만 년 전`;
  if(eok) return `${eok}억 년 전`;
  return `${ma*100}만 년 전`;
}
/* 우리가 얼마나 아는지를 같이 적는다. 과거는 멀수록 흐려진다. */
function confidenceKo(ma){
  if(ma === 0) return '';
  if(ma <= 83)  return '바다 밑 자기 줄무늬로 위치가 잘 묶이는 구간';
  if(ma <= 200) return '위치가 대체로 잘 맞는 구간';
  return '이 시대는 동서 위치가 덜 확실합니다';
}

function setTime(i){
  timeIdx = i;
  const fr = matrixAt(i);
  const ma = fr ? fr.t : 0;
  $('.tb-when').textContent = whenKo(ma);
  $('.tb-conf').textContent = confidenceKo(ma);
  $('#tb-note').textContent = ma === 0
    ? '한반도를 손으로 되감아 보세요'
    : `한반도가 지금과 다른 자리에 있어요`;
  placeFossils();
  // 과거로 가면 오늘 날씨는 뜻이 없다 — 친구와 말풍선을 접는다
  // 화석 모드에서는 시대와 상관없이 오늘 날씨를 접어 둔다
  const fossilOn = $('#b-fossil').getAttribute('aria-pressed') === 'true';
  const hide = fossilOn || ma > 0;
  for(const m of markers) if(m.kind !== 'name') m.el.style.display = hide ? 'none' : '';
  clouds.visible = !hide && show.cloud;

  // 과거로 가면 오늘 지도는 물러나고 그 시대 한반도가 앞에 선다.
  // 오늘 땅을 그대로 두고 핀만 옮기면 "저기에 저 땅이 있었다"는 거짓말이 된다.
  if(koreaLine) koreaLine.material.opacity = fossilOn ? (ma > 0 ? 0.95 : 0.55) : 0;
  earthMat.uniforms.pastFade.value = (fossilOn && ma > 0) ? 1 : 0;

  // 한반도가 옮겨 가면 카메라도 따라간다. 화면 밖으로 나가면 아이가 놓친다.
  if(fossilOn){
    const c = rotateLL(35.6, 127.6, fr);
    yawTarget = yawFor(c.lon); pitchTarget = pitchFor(c.lat);
    following = true;
  }
}

/* ── 실측 불러오기 (open-meteo 실황) ───────────────────────────
   격자 = 전지구 운량·강수. 도시 = 말풍선.
   값 생성 없음. 실패하면 그리지 않고 배지로 알린다. */
const CITIES = [
  ['서울',37.57,126.98], ['도쿄',35.68,139.69], ['베이징',39.90,116.41],
  ['마닐라',14.60,120.98], ['시드니',-33.87,151.21], ['뭄바이',19.08,72.88],
  ['카이로',30.04,31.24], ['런던',51.51,-0.13], ['모스크바',55.75,37.62],
  ['뉴욕',40.71,-74.01], ['리마',-12.05,-77.04], ['상파울루',-23.55,-46.63],
  ['케이프타운',-33.92,18.42], ['앵커리지',61.22,-149.90], ['롱이어비엔',78.22,15.65],
];

function gridPoints(){
  const pts = [];
  for(let lat=-70; lat<=80; lat+=15)
    for(let lon=-180; lon<180; lon+=20) pts.push({lat, lon});
  return pts;
}

const TTL = 10*60*1000;   // 같은 실황을 10분 안에 다시 부르지 않는다
async function omFetch(pts, fields){
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude='  + pts.map(p=>p.lat).join(',')
    + '&longitude=' + pts.map(p=>p.lon).join(',')
    + '&current='   + fields.join(',');
  const key = 'om:' + fields.join('|') + ':' + pts.length;
  try{
    const hit = JSON.parse(sessionStorage.getItem(key) || 'null');
    if(hit && Date.now()-hit.t < TTL && hit.u === url) return hit.d;
  }catch(e){}
  const r = await fetch(url);
  if(!r.ok) throw new Error('open-meteo ' + r.status);
  const j = await r.json();
  const d = Array.isArray(j) ? j : [j];
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), u:url, d})); }catch(e){}
  return d;
}

const WMO = code => {
  if(code === 0) return 'sun';
  if(code <= 3)  return 'cloud';
  if(code >= 95) return 'zap';
  if((code>=71&&code<=77)||code===85||code===86) return 'snow';
  if(code >= 51) return 'rain';
  return 'cloud';
};
const SAY = { sun:'맑아요', cloud:'구름이 많아요', rain:'비가 와요', snow:'눈이 내려요', zap:'번개가 쳐요' };

async function loadLive(){
  // 구름(관측 영상)과 친구(격자 실황)는 출처가 다르다 — 하나가 죽어도 다른 하나는 살린다.
  let cloudMeta = null;
  try { cloudMeta = await loadObservedClouds(); }
  catch(e){ console.warn('관측 구름 실패', e); clouds.material.uniforms.ready.value = 0; }

  try{
    const grid = gridPoints();
    const [gRes, cRes] = await Promise.all([
      omFetch(grid,   ['cloud_cover','precipitation']),
      omFetch(CITIES.map(c=>({lat:c[1],lon:c[2]})), ['weather_code','temperature_2m','cloud_cover']),
    ]);

    // 전지구 구름
    const pts = gRes.map((d,i)=>({
      lat: grid[i].lat, lon: grid[i].lon,
      cloud: d?.current?.cloud_cover ?? null,
      rain:  d?.current?.precipitation ?? 0,
    })).filter(p => p.cloud != null);


    // 격자에서 비가 실제로 오는 곳에 비 친구 — 위치는 격자 그대로
    pts.filter(p => p.rain >= 0.3)
       .sort((a,b)=>b.rain-a.rain).slice(0,14)
       .forEach(p => addMarker('rain', p.lat, p.lon, ART.rain, 'crt'));

    // 도시 말풍선 + 친구
    cRes.forEach((d,i)=>{
      const cur = d?.current; if(!cur) return;
      const [name, lat, lon] = CITIES[i];
      const kind = WMO(cur.weather_code);
      addMarker(kind, lat, lon, ART[kind], 'crt');
      if(i < 6) addMarker('bub', lat, lon,
        `<div class="box">${name} ${SAY[kind]}<b>${Math.round(cur.temperature_2m)}도</b></div>`, 'bub');
    });

    const t = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    // 결손과 메움을 숨기지 않는다 — 무엇을 보고 있는지가 화면에 적혀야 한다
    if(cloudMeta){
      const cz = String(cloudMeta.time).slice(11,16);
      let note = `실측 · 구름 NOAA GMGSI ${cz}Z · 날씨 open-meteo ${t}`;
      if(cloudMeta.broken){
        const parts = [`구름 ${cz}Z`];
        if(cloudMeta.patched) parts.push(`빈 곳 ${cloudMeta.patched}칸은 ${String(cloudMeta.patchTime).slice(11,16)}Z 자료`);
        if(cloudMeta.stillEmpty) parts.push(`${cloudMeta.stillEmpty}칸은 관측 없어 비움`);
        note = parts.join(' · ');
      }
      badgetxt.textContent = note;
      badge.className = cloudMeta.broken ? 'warn' : '';
    } else {
      badgetxt.textContent = `실측 · open-meteo ${t} · 구름 없음`;
      badge.className = 'warn';
    }
  }catch(err){
    console.error(err);
    badge.className = 'err';
    badgetxt.textContent = '날씨를 못 불러왔어요 — 친구를 그리지 않습니다';
    clouds.material.uniforms.ready.value = 0;   // 데이터가 없으면 그리지 않는다
  }
}

/* ── 마커 투영: 3D 좌표 → 화면 좌표 ─────────────────────────── */
const _v = new THREE.Vector3(), _c = new THREE.Vector3();
let creatureScale = 1;
function placeMarkers(w, h){
  camera.getWorldPosition(_c);
  const bubs = [], names = [];

  for(const m of markers){
    _v.copy(m.pos).applyMatrix4(earthGroup.matrixWorld);
    const toCam = _c.clone().sub(_v).normalize();
    const facing = _v.clone().normalize().dot(toCam);     // 뒤로 넘어가면 음수
    if(facing <= 0.06){ m.el.style.visibility = 'hidden'; continue; }
    const p = _v.clone().project(camera);
    if(p.z > 1){ m.el.style.visibility = 'hidden'; continue; }

    const X = (p.x*0.5+0.5)*w, Y = (-p.y*0.5+0.5)*h;
    const vis = (m.kind === 'bub')  ? true
              : (m.kind === 'rain' || m.kind === 'snow') ? show.rain
              : (m.kind === 'zap')  ? show.zap
              : show.cloud;
    const alpha = vis ? Math.min(1, (facing-0.06)/0.24) : 0;

    if(m.kind === 'bub' || m.kind === 'name'){
      (m.kind === 'bub' ? bubs : names).push({ m, X, Y, alpha });
      continue;
    }

    m.el.style.visibility = alpha > 0.02 ? 'visible' : 'hidden';
    m.el.style.opacity = alpha;
    m.el.style.transform =
      `translate(${X}px, ${Y}px) translate(-50%,-50%) scale(${creatureScale.toFixed(3)})`;
  }

  /* 말풍선은 한 번에 세 개까지만.
     아이에게 한 번에 모든 데이터를 보여주지 않는다 — 화면 가운데에 가까운 것부터 고르고,
     이미 놓인 풍선과 겹치면 건너뛴다. 위치를 옮기지는 않는다. */
  const cx = w/2, cy = h/2;
  bubs.sort((a,b)=> ((a.X-cx)**2 + (a.Y-cy)**2) - ((b.X-cx)**2 + (b.Y-cy)**2));
  const placed = [];
  for(const b of bubs){
    const r = b.m.el.firstElementChild?.getBoundingClientRect();
    const bw = r?.width || 130, bh = r?.height || 46;
    const clash = placed.some(q => Math.abs(q.X-b.X) < (q.bw+bw)/2 + 8
                                && Math.abs(q.Y-b.Y) < (q.bh+bh)/2 + 8);
    // 화면 밖으로 잘리는 풍선은 아예 띄우지 않는다 (반쯤 잘린 글자가 제일 나쁘다)
    const railW = w < 720 ? 66 : 84;                    // 왼쪽 레일이 차지하는 폭
    const inside = (b.X - bw/2) > railW && (b.X + bw/2) < w-14
                && (b.Y - bh - 30) > 56 && b.Y < h-96;
    const ok = !clash && inside && placed.length < 3 && b.alpha > 0.55;
    b.m.el.style.visibility = ok ? 'visible' : 'hidden';
    b.m.el.style.opacity = ok ? b.alpha : 0;
    if(ok){
      placed.push({ X:b.X, Y:b.Y, bw, bh });
      b.m.el.style.transform = `translate(${b.X}px, ${b.Y - 26*creatureScale}px) translate(-50%,-100%)`;
    }
  }

  // 화석 핀 — 지구 뒤로 넘어가면 숨긴다
  for(const f of fossilMarks){
    if(!f.pos || f.el.style.display === 'none'){ continue; }
    _v.copy(f.pos).applyMatrix4(earthGroup.matrixWorld);
    const toCam = _c.clone().sub(_v).normalize();
    const facing = _v.clone().normalize().dot(toCam);
    if(facing <= 0.06){ f.el.style.visibility = 'hidden'; continue; }
    const p = _v.clone().project(camera);
    f.el.style.visibility = 'visible';
    f.el.style.opacity = Math.min(1, (facing-0.06)/0.2);
    const X = (p.x*0.5+0.5)*w, Y = (-p.y*0.5+0.5)*h;
    f.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-100%)`;
    f.sx = X; f.sy = Y;
  }
  // 이름표가 겹치면 이름만 접는다. 점은 그대로 둔다 — 자리가 사실이기 때문이다.
  const pinLabels = [];
  for(const f of fossilMarks){
    const lab = f.el.querySelector('.nm2');
    if(!lab || f.el.style.visibility === 'hidden' || f.el.style.display === 'none') continue;
    const clash = pinLabels.some(q => Math.abs(q.x-f.sx) < 58 && Math.abs(q.y-f.sy) < 22);
    lab.style.visibility = clash ? 'hidden' : 'visible';
    if(!clash) pinLabels.push({x:f.sx, y:f.sy});
  }

  // 산맥 이름 — 화면 가운데에 가까운 것부터 다섯 개까지
  const mtShown = [];
  const mtOn = $('#b-mtn').getAttribute('aria-pressed') === 'true';
  for(const t of mtnMarks){
    if(!mtOn){ t.el.style.visibility = 'hidden'; continue; }
    _v.copy(t.pos).applyMatrix4(earthGroup.matrixWorld);
    const facing = _v.clone().normalize().dot(_c.clone().sub(_v).normalize());
    if(facing <= 0.12){ t.el.style.visibility = 'hidden'; continue; }
    const q = _v.clone().project(camera);
    const X = (q.x*0.5+0.5)*w, Y = (-q.y*0.5+0.5)*h;
    const clash = mtShown.some(o => Math.abs(o.x-X) < 84 && Math.abs(o.y-Y) < 22);
    const inView = X > 78 && X < w-16 && Y > 56 && Y < h-96;
    const ok = !clash && inView && mtShown.length < 5;
    t.el.style.visibility = ok ? 'visible' : 'hidden';
    if(ok){
      t.el.style.opacity = Math.min(1, (facing-0.12)/0.25);
      t.el.style.transform = `translate(${X}px, ${Y}px) translate(-50%,-50%)`;
      mtShown.push({x:X, y:Y});
    }
  }

  /* 나라 이름은 있는 줄 알 정도만. 화면 가운데에 가까운 것부터 다섯 개까지,
     말풍선·다른 이름과 겹치면 건너뛴다. 지구 전체에서는 더 적게. */
  const nameCap = stop === 0 ? 4 : 6;
  names.sort((a,b)=> ((a.X-cx)**2 + (a.Y-cy)**2) - ((b.X-cx)**2 + (b.Y-cy)**2));
  const nameSpots = placed.slice();
  let shown = 0;
  for(const n of names){
    const nw = n.m.el.offsetWidth || 44, nh = n.m.el.offsetHeight || 18;
    const clash = nameSpots.some(q => Math.abs(q.X-n.X) < (q.bw+nw)/2 + 10
                                   && Math.abs(q.Y-n.Y) < (q.bh+nh)/2 + 10);
    const inView = n.X > 8 && n.X < w-8 && n.Y > 52 && n.Y < h-92;
    const ok = !clash && inView && shown < nameCap && n.alpha > 0.72;
    n.m.el.style.visibility = ok ? 'visible' : 'hidden';
    n.m.el.style.opacity = ok ? (0.38 + 0.36*n.alpha) : 0;   // 살짝만
    if(ok){
      shown++;
      nameSpots.push({ X:n.X, Y:n.Y, bw:nw, bh:nh });
      n.m.el.style.transform = `translate(${n.X}px, ${n.Y}px) translate(-50%,-50%)`;
    }
  }
}

/* ── 루프 ──────────────────────────────────────────────────── */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;

  // 관성 + 감쇠. 손을 떼도 부드럽게 멈춘다.
  yaw += yawV; pitch += pitchV;
  const damp = Math.pow(0.86, dt*60);
  yawV *= damp; pitchV *= damp;
  const maxStep = MAX_SPIN*dt;
  yawV = Math.max(-maxStep, Math.min(maxStep, yawV));
  pitch = Math.max(-1.16, Math.min(1.16, pitch));

  // 시대를 바꾼 직후에만 카메라가 한반도를 쫓아간다. 손을 대면 즉시 놓아준다.
  if(following){
    let d = yawTarget - yaw;
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    const k = Math.min(1, dt*3.2);
    yaw += d*k; pitch += (pitchTarget - pitch)*k;
    if(Math.abs(d) < 0.002 && Math.abs(pitchTarget - pitch) < 0.002) following = false;
  }

  // 손을 대지 않을 때만 아주 느리게 돈다. 첫 터치에 멈춘다.
  if(!dragging) idle += dt; else idle = 0;
  if(idle > 3.2 && !reduceMotion) yaw += 0.028*dt;

  dist += (distTarget - dist) * Math.min(1, dt*4.5);

  earthGroup.rotation.set(0,0,0);
  camera.position.set(
    dist*Math.cos(pitch)*Math.cos(yaw),
    dist*Math.sin(pitch),
    dist*Math.cos(pitch)*Math.sin(yaw)
  );
  camera.lookAt(0,0,0);

  const ss = subsolar(new Date());
  sunDir.copy(llToVec(ss.lat, ss.lon, 1)).applyQuaternion(
    new THREE.Quaternion().setFromRotationMatrix(camera.matrixWorldInverse)
  );
  earthMat.uniforms.sunDir.value = llToVec(ss.lat, ss.lon, 1);
  earthMat.uniforms.nightMix.value += ((show.night?1:0) - earthMat.uniforms.nightMix.value) * Math.min(1, dt*5);

  const w = innerWidth, h = innerHeight;
  screenR = (R/dist)/tanMin * (Math.min(w,h)/2);
  creatureScale = Math.max(0.34, Math.min(1.5, (2*screenR/8)/80));
  earthGroup.updateMatrixWorld();
  camera.updateMatrixWorld();
  placeMarkers(w, h);
  renderer.render(scene, camera);
  drawWind(dt, w, h);
  requestAnimationFrame(frame);
}

function resize(){
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  const tanV = Math.tan(camera.fov*Math.PI/360);
  tanMin = Math.min(tanV, tanV*camera.aspect);
  if(windCv.width !== w || windCv.height !== h){ windCv.width = w; windCv.height = h; }
  applyFill();
}
addEventListener('resize', refit);

/* 셰이더가 카메라 공간 법선을 쓰므로 태양 방향도 카메라 공간으로 넘긴다 */
earthMat.onBeforeRender = function(){
  const ss = subsolar(new Date());
  const world = llToVec(ss.lat, ss.lon, 1);
  earthMat.uniforms.sunDir.value = world.clone()
    .transformDirection(camera.matrixWorldInverse);
};

/* 한 장을 지금 당장 그린다.
   rAF 는 창이 가려져 있으면 불리지 않는다 — 그것만 믿으면 지구가 없는 하늘이 남는다.
   화면이 다시 보이면 루프가 이어서 돈다. */
function drawOnce(){
  const w = innerWidth, h = innerHeight;
  yaw += 0; pitch += 0;
  dist = distTarget;
  camera.position.set(
    dist*Math.cos(pitch)*Math.cos(yaw),
    dist*Math.sin(pitch),
    dist*Math.cos(pitch)*Math.sin(yaw)
  );
  camera.lookAt(0,0,0);
  screenR = (R/dist)/tanMin * (Math.min(w,h)/2);
  creatureScale = Math.max(0.34, Math.min(1.5, (2*screenR/8)/80));
  earthGroup.updateMatrixWorld();
  camera.updateMatrixWorld();
  placeMarkers(w, h);
  renderer.render(scene, camera);
  drawWind(1/60, w, h);
}

/* 뒤에 있는 탭이나 숨겨진 패널에서 열면 뷰포트가 0×0 으로 온다.
   그 상태로 계산한 카메라는 쓸 수 없으므로, 크기가 생기는 순간 다시 맞추고 한 장 그린다.
   resize 이벤트만 믿으면 안 된다 — 0×0 → 실제 크기 전환에서 안 오는 경우가 있다. */
function refit(){
  if(innerWidth < 2 || innerHeight < 2) return;   // 아직 크기가 없다
  resize();
  if(earthMat.uniforms.map.value) drawOnce();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refit(); });
if(window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);

(async function start(){
  resize();
  earthMat.uniforms.map.value = await buildEarthTexture();
  for(const c of COUNTRY_LABELS) addMarker('name', c.lat, c.lon, c.name, 'nm');
  loadWind().catch(e => { console.warn('바람 로드 실패', e); $('#b-wind').disabled = true; });
  loadMountains().then(()=>{ for(const t of mtnMarks) t.el.style.display='none'; drawOnce(); })
                .catch(e => { console.warn('산맥 로드 실패', e); $('#b-mtn').disabled = true; });
  loadPast().then(()=>{ for(const f of fossilMarks) f.el.style.display='none'; drawOnce(); })
            .catch(e => { console.warn('화석지 로드 실패', e); $('#b-fossil').disabled = true; });
  drawOnce();                       // 데이터를 기다리는 동안에도 지구는 이미 떠 있다
  requestAnimationFrame(frame);
  await loadLive();
  drawOnce();                       // 친구가 붙은 첫 장도 즉시 한 번
  setTimeout(()=> $('#hint').classList.add('gone'), 6000);
})();
</script>
<script src="/js/earth-switch.js" defer></script>
</body>
</html>
