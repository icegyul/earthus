<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구야, 오늘 어때? — EARTHUS KIDS 샘플</title>
<script>/* 제목은 <head> 에서 정해진다 — 치환 층이 서기 전이라 여기서 바꾼다. */
  try{var _l=localStorage.getItem('earthus.lang')||localStorage.getItem('earthus.v2.lang');}catch(e){}
  if((_l==='en')||(!_l&&!/^ko/i.test(navigator.language||''))) document.title='Hey Earth, how are you today? — EARTHUS KIDS';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --kid:"Jua","Malgun Gothic",sans-serif;
  --ui:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --space-0:#050b1c;
  --space-1:#0d1a3a;
  --bubble:#ffffff;
  --bubble-ink:#16223a;
  --rail:rgba(255,255,255,.14);
  --sun:#FFC24B;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--space-0)}
body{
  font-family:var(--ui);color:#fff;
  -webkit-font-smoothing:antialiased;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#stage{position:fixed;inset:0}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#windcv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}

/* ── 하늘 배경 ── */
#sky{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 42%, #16305e 0%, #0c1a3c 42%, #050b1c 100%);
}
#stars{position:absolute;inset:0;pointer-events:none}

/* ── 머리글 ── */
#head{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none;z-index:6}
#head h1{font-family:var(--kid);font-size:clamp(26px,3.6vw,40px);margin:0;letter-spacing:.01em;
  text-shadow:0 2px 14px rgba(0,0,0,.55)}
#head p{margin:8px 0 0;font-size:clamp(12px,1.4vw,15px);opacity:.72;text-shadow:0 1px 10px rgba(0,0,0,.85),0 0 18px rgba(5,11,28,.8)}

/* ── 자료 출처 (v1 과 같은 자리·같은 규칙) ──
   좌하단 작은 글씨. 화면을 가리지 않되 무엇을 보고 있는지는 늘 적혀 있어야 한다.
   ⚠️ 큰 화면에서는 오히려 키운다 — 9px 는 폰에서 손에 든 거리 기준이고,
      멀리 두고 보는 화면에서는 아예 안 읽힌다. 출처는 읽히라고 있는 것이다. */
#srcNote{position:absolute;left:10px;bottom:10px;z-index:8;
  max-width:min(52vw,420px);pointer-events:none;
  font-size:9px;line-height:1.45;color:rgba(255,255,255,.46);
  text-shadow:0 1px 3px rgba(0,0,0,.85)}
#srcNote b{font-weight:500;color:rgba(255,255,255,.7)}
#srcNote i{font-style:normal;color:rgba(255,255,255,.32)}
#srcNote.warn b{color:#FFC24B}
#srcNote.err b{color:#FF9A9A}
@media (max-width:520px){ #srcNote{max-width:70vw;font-size:8.5px;bottom:8px;left:8px} }
@media (min-width:1600px){ #srcNote{font-size:12px;left:18px;bottom:16px;max-width:min(40vw,520px)} }

/* ── 레일 둘 — 왼쪽은 만나기(아이), 오른쪽은 읽기(어른) ──
   가르는 기준은 난이도가 아니라 읽는 방식이다. 왼쪽은 하나를 눌러 하나를
   만나고(캐릭터·핀), 오른쪽은 색면 전체를 한눈에 읽는다(색면·흐름선). */
.rail{position:absolute;top:50%;z-index:6;display:flex;flex-direction:column;
  gap:12px;align-items:center}
.rail-kid{left:18px;transform:translateY(-50%)}
.rail-pro{right:18px;transform:translateY(-58%)}
.railcap{font-family:var(--kid);font-size:11px;color:#9fb4d6;letter-spacing:.1em;
  margin-bottom:2px;text-shadow:0 1px 6px rgba(4,10,24,.9)}
.railbtn{
  width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.2);
  background:rgba(9,18,38,.46);backdrop-filter:blur(8px);
  display:grid;place-items:center;cursor:pointer;color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.30);
  transition:transform .16s ease, background .16s ease;
}
/* 확대해서 흰 구름이 화면을 채우면 흰 아이콘이 통째로 사라졌다.
   배경을 늘 어둡게 깔고 글리프에 그림자를 준다 — 우주에서도 구름 위에서도 읽힌다. */
.railbtn svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.railbtn[aria-pressed="true"] svg{filter:none}
.railcap{text-shadow:0 1px 3px rgba(0,0,0,.65)}
.railbtn:hover{background:rgba(255,255,255,.2)}
.railbtn[aria-pressed="true"]{background:#fff;color:#123;border-color:#fff}
.railbtn:active{transform:scale(.93)}
.railbtn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.railbtn svg{width:28px;height:28px;display:block}

/* ── 아래 알약 내비 ── */
#nav{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;gap:6px;background:rgba(8,16,36,.66);border:1px solid rgba(255,255,255,.16);
  padding:7px;border-radius:999px;backdrop-filter:blur(10px)}
#nav button{
  font-family:var(--kid);font-size:17px;color:#fff;background:transparent;border:0;
  padding:10px 20px;border-radius:999px;cursor:pointer;min-height:44px;white-space:nowrap;
}
#nav button[aria-current="true"]{background:#fff;color:#132242}
#nav button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ── 내 위치 버튼 ── */
#here{position:absolute;right:20px;bottom:98px;z-index:6;
  width:64px;height:64px;border-radius:22px;border:1px solid rgba(255,255,255,.24);
  background:rgba(9,18,38,.46);backdrop-filter:blur(8px);cursor:pointer;color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.30);text-shadow:0 1px 3px rgba(0,0,0,.6);
  font-family:var(--kid);font-size:12px;display:grid;place-items:center;gap:2px;line-height:1.1}
#here span{font-size:20px}
#here:active{transform:scale(.94)}
#here:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#here[disabled]{opacity:.5;cursor:default}
#here.on{background:#fff;color:#132242}
@media (max-width:720px){ #here{width:56px;height:56px;right:12px;bottom:84px} }

/* ── 우리 집 버튼 ── */
#home{position:absolute;right:20px;bottom:26px;z-index:6;
  width:64px;height:64px;border-radius:22px;border:1px solid rgba(255,255,255,.24);
  background:rgba(9,18,38,.46);backdrop-filter:blur(8px);cursor:pointer;color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.30);text-shadow:0 1px 3px rgba(0,0,0,.6);
  font-family:var(--kid);font-size:12px;display:grid;place-items:center;gap:2px;line-height:1.1}
#home:active{transform:scale(.94)}
#home:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#home span{font-size:22px}

/* ── 말풍선 ── */
.bub{
  position:absolute;z-index:5;transform:translate(-50%,-100%);
  pointer-events:none;will-change:transform,opacity;
}
.bub .box{
  font-family:var(--kid);font-size:15px;line-height:1.34;color:var(--bubble-ink);
  background:var(--bubble);border-radius:16px;padding:9px 14px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.32);position:relative;
}
.bub .box::after{
  content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--bubble);border-bottom:0;
}
.bub .box b{display:block;font-size:12px;opacity:.55;font-weight:400}

/* ── 지진 재생 막대 ── */
#quakebar{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:7;
  display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:18px;
  background:rgba(8,16,36,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);
  max-width:min(560px,92vw);width:max-content}
#quakebar[hidden]{display:none!important}
#quakeplay{border:0;border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap;
  background:#FFC24B;color:#20160a;font-family:var(--kid);font-size:13px}
#quakeplay:focus-visible{outline:3px solid #fff;outline-offset:2px}
.qb-line{flex:1;min-width:120px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.qb-line i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFDE9B,#FF7A5C);border-radius:3px}
#quakewhen{font-family:var(--kid);font-size:13px;color:#FFE9BE;min-width:74px;text-align:right}
@media (max-width:720px){ #quakebar{bottom:150px;padding:8px 12px;gap:8px} #quakewhen{font-size:11px;min-width:62px}
  #card.with-bar{bottom:216px} }

/* ── 위성 표식 ── */
.st{position:absolute;left:0;top:0;z-index:5;cursor:pointer;pointer-events:auto;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.st .b{width:9px;height:9px;border-radius:2px;background:#FFD98A;
  border:1.5px solid rgba(20,14,4,.8);box-shadow:0 0 8px rgba(255,217,138,.8);flex:none}
.st .t{font-size:10px;color:#FFE9BE;text-shadow:0 1px 3px rgba(0,0,0,.85);font-weight:600}
.st:hover .b{transform:scale(1.3)}

/* ── 해상 부이 표식 ── */
.by{position:absolute;left:0;top:0;z-index:5;cursor:pointer;pointer-events:auto;
  width:22px;height:22px;margin:-11px 0 0 -11px;display:grid;place-items:center}
.by .b{width:11px;height:11px;border-radius:50%;background:#7FE3F2;
  border:2px solid rgba(6,22,34,.85);box-shadow:0 0 0 2px rgba(127,227,242,.28)}
.by:hover .b{transform:scale(1.25)}
#card img.shot{width:100%;border-radius:12px;margin:10px 0 4px;display:block;background:#0b1a24}

/* ── 기온 숫자 — 윈디의 핵심은 색이 아니라 숫자다 ── */
.tn{position:absolute;z-index:4;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--ui);font-size:12px;font-weight:600;color:#fff;letter-spacing:-.01em;
  white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.75);
  will-change:transform,opacity;font-variant-numeric:tabular-nums}
.tn.cold{color:#DDF0FF}
.tn.hot{color:#FFF2DC}

/* ── 충돌구 — 작게 말고 크게 ── */
.cr{position:absolute;z-index:5;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  will-change:transform,opacity;display:flex;flex-direction:column;align-items:center}
.cr .ring{border:3px solid #C9A6F0;border-radius:50%;background:rgba(120,80,190,.22);
  box-shadow:0 0 0 2px rgba(10,6,20,.5),0 3px 12px rgba(0,0,0,.5)}
.cr .ring::after{content:'';display:block;width:34%;height:34%;margin:33%;border-radius:50%;
  background:rgba(201,166,240,.65)}
.cr .t{font-family:var(--kid);font-size:12px;color:#EBDBFF;margin-top:3px;white-space:nowrap;
  text-shadow:0 1px 3px rgba(10,6,20,.95)}

/* ── 강 이름 · 댐 ── */
.rv{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--kid);font-size:12.5px;color:#BFE9FF;white-space:nowrap;
  text-shadow:0 1px 3px rgba(2,18,32,.95),0 0 10px rgba(2,18,32,.8);will-change:transform,opacity}
.dm{position:absolute;z-index:5;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  will-change:transform,opacity}
.dm .b{width:13px;height:13px;border-radius:3px;background:#7FD4F0;border:2px solid #fff;
  box-shadow:0 2px 7px rgba(0,0,0,.5)}
.dm .t{font-family:var(--kid);font-size:11.5px;color:#DFF4FF;text-align:center;margin-top:3px;
  white-space:nowrap;text-shadow:0 1px 3px rgba(2,18,32,.95)}

/* ── 대륙 이름 (옛 대륙) ── */
.cn{position:absolute;z-index:4;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--kid);font-size:17px;color:#FFF0D2;letter-spacing:.03em;white-space:nowrap;
  padding:2px 9px;border-radius:999px;background:rgba(28,16,4,.42);
  text-shadow:0 1px 4px rgba(24,14,2,1),0 0 16px rgba(24,14,2,.9);will-change:transform,opacity}

/* ── 안내된 장면 버튼 ── */
#story{font-family:var(--kid);font-size:14px;color:#0E1726;background:#FFC24B;border:0;
  border-radius:999px;padding:8px 16px;cursor:pointer;margin-bottom:8px;align-self:flex-start;
  box-shadow:0 3px 12px rgba(255,194,75,.28)}
#story:hover{background:#FFD173}
#story:focus-visible{outline:3px solid #fff;outline-offset:2px}
#story[disabled]{opacity:.55;cursor:default}
#story.playing{background:rgba(255,255,255,.16);color:#fff}

/* ── 시대 이름 (시간 손잡이 위) ── */
.era{font-family:var(--kid);font-size:15px;color:#FFC24B;margin-bottom:2px;line-height:1.3}
.era small{display:block;font-family:var(--ui);font-size:11px;color:#9fb4d6;letter-spacing:.01em;margin-top:2px}

/* ── 산맥 이름 ── */
.mt{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--kid);font-size:12.5px;color:#FFE8C7;letter-spacing:.02em;white-space:nowrap;
  text-shadow:0 1px 3px rgba(40,22,6,.9),0 0 10px rgba(40,22,6,.7);will-change:transform,opacity}

/* ── 산봉우리 (세모 + 이름 + 높이) ── */
/* 세모가 봉우리 자리에 오게 위쪽을 기준으로 붙인다. 이름은 그 아래로 흐른다. */
.pk{position:absolute;z-index:3;pointer-events:none;text-align:center;
  font-family:var(--kid);font-size:11px;color:#FFF0D8;letter-spacing:.01em;white-space:nowrap;
  text-shadow:0 1px 3px rgba(40,22,6,.92),0 0 10px rgba(40,22,6,.7);will-change:transform,opacity}
.pk b{display:block;font-size:9px;line-height:1;color:#FFD9A0;font-weight:400}
.pk i{display:block;font-style:normal;font-family:var(--ui);font-size:9.5px;
  color:rgba(255,232,199,.72);margin-top:1px}
@media (max-width:520px){ .pk{font-size:10px} .pk i{font-size:9px} }

/* ── 바다거북 · 철새 ── */
.tt,.bd{position:absolute;z-index:3;pointer-events:none;text-align:center;
  font-family:var(--kid);font-size:11px;letter-spacing:.01em;white-space:nowrap;
  text-shadow:0 1px 3px rgba(6,20,30,.92),0 0 10px rgba(6,20,30,.7);will-change:transform,opacity}
.tt{color:#D9FFF0}
.bd{color:#DCF3FF}
.tt b,.bd b{display:block;font-size:13px;line-height:1;font-weight:400}
.bd b{font-size:11px;color:#7FD6FF}
.bd.home b{font-size:13px}
.bd i{display:block;font-style:normal;font-family:var(--ui);font-size:9px;
  color:rgba(220,243,255,.6);margin-top:1px}
@media (max-width:520px){ .tt,.bd{font-size:10px} }

/* ── 나라 이름 (살짝만) ── */
.nm{
  position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--kid);font-size:13px;color:#fff;letter-spacing:.02em;
  text-shadow:0 1px 3px rgba(8,22,16,.75),0 0 10px rgba(8,22,16,.5);
  will-change:transform,opacity;white-space:nowrap;
}

/* ── 날씨 친구 ── */
.crt{position:absolute;z-index:4;transform:translate(-50%,-50%);pointer-events:none;
  will-change:transform,opacity}
.crt svg{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
@keyframes bobb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flash{0%,88%,100%{opacity:.25}90%,96%{opacity:1}}
.crt .bob{animation:bobb 3.4s ease-in-out infinite}
.crt .zap{animation:flash 2.6s steps(1,end) infinite;transform-origin:center}

/* ── 화석 핀 ── */
.pin{position:absolute;z-index:5;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  will-change:transform,opacity}
.pin .dot{width:15px;height:15px;border-radius:50%;background:#FFC24B;border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5);margin:0 auto}
.pin .nm2{font-family:var(--kid);font-size:12.5px;color:#fff;white-space:nowrap;text-align:center;
  margin-top:3px;text-shadow:0 1px 4px rgba(4,10,24,.95),0 0 10px rgba(4,10,24,.8)}
.pin.sel .dot{background:#fff;transform:scale(1.25)}
.pin .dot{transition:transform .15s ease}

/* ── 화석 카드 ── */
#card{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:8;width:min(420px,calc(100% - 32px));
  background:rgba(10,18,38,.94);border:1px solid rgba(255,255,255,.2);border-radius:18px;
  padding:18px 20px 16px;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#card[hidden]{display:none!important}
/* ⚠️ 지진 재생 막대와 카드가 겹쳐 ▶ 를 누를 수가 없었다(카드 z-index 가 위였다).
      막대가 떠 있는 동안에는 카드를 그만큼 올린다. */
  #card.with-bar{bottom:170px}
#card h2{font-family:var(--kid);font-size:20px;margin:0 0 2px;color:#fff}
#card .meta{font-size:11.5px;color:#9fb4d6;letter-spacing:.02em;margin-bottom:10px}
#card .kid{font-family:var(--kid);font-size:16px;line-height:1.55;color:#FFE3A8;margin-bottom:10px}
#card ul{margin:0 0 10px;padding-left:17px;display:flex;flex-direction:column;gap:3px;
  font-size:13px;color:#dbe6f7;line-height:1.5}
#card .rec{font-size:12.5px;color:#9fb4d6;border-top:1px solid rgba(255,255,255,.14);
  padding-top:9px;line-height:1.55}
#card .warn2{color:#FFC24B}
#card button.x{position:absolute;top:10px;right:12px;background:none;border:0;color:#9fb4d6;
  font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;min-width:34px;min-height:34px}
#card button.x:focus-visible{outline:2px solid var(--sun);border-radius:6px}

/* ── 시간 손잡이 ── */
#timebar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:7;
  width:min(560px,calc(100% - 32px));background:rgba(8,16,36,.82);border:1px solid rgba(255,255,255,.18);
  border-radius:20px;padding:13px 20px 11px;backdrop-filter:blur(10px)}
#timebar[hidden]{display:none!important}
.tb-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.tb-when{font-family:var(--kid);font-size:20px;color:#fff}
.tb-conf{font-size:11px;color:#9fb4d6;text-align:right;line-height:1.4}
#timeslider{width:100%;accent-color:#FFC24B;height:30px;cursor:pointer}
#timeslider:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.tb-foot{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:#8ba2c4;margin-top:1px}
.tb-foot #tb-note{color:#c3d3ea;text-align:center}

/* ── 하단 날짜 막대 ── */
#daybar{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);
  background:rgba(8,16,36,.78);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:6px 12px 6px 14px;backdrop-filter:blur(10px)}
#daybar[hidden]{display:none!important}
#daybar .dl{font-family:var(--kid);font-size:12px;color:#9fb4d6;white-space:nowrap}
.days{display:flex;gap:3px;overflow-x:auto}

<script type="module">
// 템플릿 안의 문구는 치환 층이 못 잡는다(글자 마디가 합쳐진 뒤에 생기기 때문). 여기서 부른다.
const KT = (x) => (window.KIDS_I18N ? window.KIDS_I18N.t(x) : x);
KT.en = !!(window.KIDS_I18N && window.KIDS_I18N.lang === 'en');
KT.deg = KT.en ? '°' : '도';
// 만/억은 영어에 없는 자릿수다. 숫자를 그대로 두고 단위만 바꾸면 틀린 값이 된다.
const KAGO = (ma) => {  // ma = 백만 년
  if(!KT.en){
    // ⚠️ 1 Ma = 100만 년이다. 여기가 *1000 이라 0.05Ma(5만 년)를 '50만 년'으로 적었고,
    //    그 한 건만 문자열을 바꿔치기해 가리고 있었다(`.replace('약 50만','약 5만')`).
    //    합천(5만 년)을 넣으면서 드러났다 — 다른 값이 오면 전부 열 배로 틀린다.
    if(ma < 1) return `약 ${Math.round(ma*100)}만 년 전`;
    if(ma < 100) return `약 ${Math.round(ma)}00만 년 전`;
    const eok = Math.floor(ma/100), man = Math.round(ma%100);
    return man ? `약 ${eok}억 ${man}00만 년 전` : `약 ${eok}억 년 전`;
  }
  if(ma < 1) return `about ${Math.round(ma*1000)},000 years ago`;
  if(ma < 1000) return `about ${Math.round(ma)} million years ago`;
  return `about ${(ma/1000).toFixed(ma%1000?1:0)} billion years ago`;
};

import * as THREE from '../vendor/three-r184.module.min.js';
import { createCharacterGlobe } from './character-globe.js';
// 해안선 고리를 삼각형으로 자른다. 스스로 교차하는 고리까지 다루는 표준 구현이다(ISC).
import earcut, { deviation } from '../vendor/earcut.module.js';

/* ══════════════════════════════════════════════════════════════
   EARTHUS v3 KIDS — 샘플 1: 지금 지구에서
   원칙: 크기는 과장하되 위치와 존재는 사실.
        데이터가 없으면 친구도 나타나지 않는다.
   ══════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const stage = $('#stage');
const srcNote = $('#srcNote'), badgetxt = $('#badgetxt');
/* 출처 줄은 두 조각이다 — 늘 있는 실황(구름·날씨·지형)과, 켜져 있는 겹이 더하는 것.
   바다거북은 이용조건이 **출처표시**를 요구하므로 카드만으로는 부족하다.
   켜져 있는 동안 좌하단에도 계속 적혀 있어야 한다. */
let srcLive = '';
let tempFieldOn = false;      // paintSrc 가 tempShell 보다 먼저 도는 구간이 있다
function paintSrc(){
  /* 기관명만 쓴다. 괄호 안 시스템 이름까지 넣으면 줄이 세 줄이 되어 아래 메뉴를
     덮는다 — 전체 출처는 카드에 그대로 적혀 있다. */
  const org = t => String(t||'').split(' (')[0];
  const add = [];
  if(typeof turtleOn !== 'undefined' && turtleOn && TURTLES)
    add.push(`<b>${org(TURTLES.source)}</b> 바다거북 <i>지나간 경로</i>`);
  if(typeof birdOn !== 'undefined' && birdOn && MIGBIRD)
    add.push(`<b>${org(MIGBIRD.source)}</b> 철새`);
  // 이어 붙인 자리를 숨기지 않는다 — 구름 결손을 적는 규칙과 같다
  if(gridBridged && tempFieldOn)
    add.push(KT.en ? `${gridBridged} grid cells bridged from the rows above and below`
                   : `격자 ${gridBridged}칸은 위아래 줄에서 이어 붙임`);
  badgetxt.innerHTML = srcLive + (add.length ? ' · ' + add.join(' · ') : '');
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── 별 배경 (장식이며 실제 항성 카탈로그가 아님) ─────────────── */
(function stars(){
  const c = $('#stars'), x = c.getContext('2d');
  function draw(){
    const w = c.width = innerWidth, h = c.height = innerHeight;
    x.clearRect(0,0,w,h);
    for(let i=0;i<260;i++){
      const r = Math.random()*1.25+.25;
      x.globalAlpha = Math.random()*.55+.18;
      x.fillStyle = '#dfe9ff';
      x.beginPath(); x.arc(Math.random()*w, Math.random()*h, r, 0, 6.283); x.fill();
    }
    x.globalAlpha = 1;
  }
  draw(); addEventListener('resize', draw);
})();

/* ── 태양 위치: 실시간 천문 계산 (v2와 동일 규약) ──────────────── */
function subsolar(date){
  const d = date.getTime()/86400000 + 2440587.5 - 2451545.0;      // J2000 기준일
  const g = (357.529 + 0.98560028*d) * Math.PI/180;                 // 평균 근점이각
  const q = 280.459 + 0.98564736*d;                                 // 평균 황경
  const L = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * Math.PI/180;
  const e = (23.439 - 0.00000036*d) * Math.PI/180;                  // 황도 경사
  const dec = Math.asin(Math.sin(e)*Math.sin(L));                   // 적위
  const ra  = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L));     // 적경
  const gmst = (18.697374558 + 24.06570982441908*d) % 24;
  let lon = (ra*180/Math.PI) - gmst*15;
  lon = ((lon + 540) % 360) - 180;
  return { lat: dec*180/Math.PI, lon };
}
const llToVec = (lat, lon, r=1) => {
  const p = (90-lat)*Math.PI/180, t = (lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
};

/* ── 툰 지구 텍스처: 진짜 해안선을 평평한 색 두 단으로 ─────────── */
let COUNTRY_LABELS = [];      // {name, lat, lon}
let reliefOn = false;         // 음영기복을 실제로 입혔는가 (출처 표기에 쓴다)

// 이름을 붙일 나라. 다 붙이면 지구가 글자로 덮인다 — 화면당 몇 개만 보이게 할 것.
const LABEL_CODES = new Set([
  'KR','JP','CN','MN','TW','PH','VN','TH','ID','MY','IN','PK','KZ','RU',
  'AU','NZ','US','CA','MX','BR','AR','CL','PE','CO',
  'GB','FR','DE','ES','IT','PL','SE','NO','UA','TR','SA','IR','IQ',
  'EG','ZA','NG','ET','KE','DZ','MA','CD','TZ','SD','GL'
]);

// 정식 국호 대신 아이가 부르는 이름
const SHORT_NAME = {
  CN:'중국', RU:'러시아', US:'미국', GB:'영국', KR:'한국', KP:'북한',
  JP:'일본', IN:'인도', BR:'브라질', AU:'호주', NZ:'뉴질랜드',
  DE:'독일', FR:'프랑스', ES:'스페인', IT:'이탈리아', NL:'네덜란드',
  EG:'이집트', ZA:'남아공', SA:'사우디', AE:'아랍에미리트',
  MX:'멕시코', CA:'캐나다', AR:'아르헨티나', CL:'칠레', PE:'페루', CO:'콜롬비아',
  TR:'튀르키예', IR:'이란', IQ:'이라크', UA:'우크라이나', PL:'폴란드',
  SE:'스웨덴', NO:'노르웨이', KZ:'카자흐스탄', MN:'몽골', TW:'대만',
  PH:'필리핀', VN:'베트남', TH:'태국', ID:'인도네시아', MY:'말레이시아',
  PK:'파키스탄', NG:'나이지리아', ET:'에티오피아', KE:'케냐',
  DZ:'알제리', MA:'모로코', CD:'콩고', TZ:'탄자니아', SD:'수단', GL:'그린란드',
};

const polysOf = geo => geo.type === 'Polygon' ? [geo.coordinates]
                     : geo.type === 'MultiPolygon' ? geo.coordinates : [];

// 가장 큰 고리의 면적중심 — 이름표를 나라 한복판에 놓기 위해서다
function labelPoint(geo){
  let best = null, bestA = 0;
  for(const poly of polysOf(geo)){
    const ring = poly[0]; if(!ring || ring.length < 4) continue;
    let a = 0, cx = 0, cy = 0;
    for(let i=0;i<ring.length-1;i++){
      const [x1,y1] = ring[i], [x2,y2] = ring[i+1];
      const f = x1*y2 - x2*y1;
      a += f; cx += (x1+x2)*f; cy += (y1+y2)*f;
    }
    a *= 0.5;
    if(Math.abs(a) > Math.abs(bestA)){
      bestA = a;
      best = Math.abs(a) < 1e-9 ? [ring[0][0], ring[0][1]]
                                : [cx/(6*a), cy/(6*a)];
    }
  }
  return best && Math.abs(bestA) > 2 ? { lon: best[0], lat: best[1] } : null;
}

let COAST_FEATS = null;     // 해안선을 색면 위에 다시 그리려고 들고 있는다

async function buildEarthTexture(){
  /* 텍스처가 곧 선명도의 천장이다. 가장 깊은 배율에서 화면은 도(度)당 39화소를
     쓰는데 4096 폭은 도당 11화소뿐이라 3.4배로 늘어나며 산이 뭉갰다.
     5400 이면 도당 15화소 — 그래도 모자라지만 눈에 띄게 낫다.

     ⚠️ 더 못 올리는 이유는 메모리다. RGBA 라 5400×2700 이 캔버스 58MB,
        GPU 사본까지 130MB 쯤 된다. 8192 로 가면 300MB 를 넘어 낡은 태블릿이
        죽는다. 기기가 작다고 하면 4096 으로 물러선다 — 흐린 지구가
        안 뜨는 지구보다 낫다. */
  const big = (navigator.deviceMemory || 4) >= 4;
  const W = big ? 5400 : 4096, H = W/2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  // 바다 — 한 가지 다정한 파랑
  g.fillStyle = '#3E86D6'; g.fillRect(0,0,W,H);

  let feats = [];
  try {
    const r = await fetch('../data/country-reference.json');
    feats = (await r.json()).features || [];
  } catch(e){ console.warn('국가 폴리곤 로드 실패', e); }
  COAST_FEATS = feats;

  const px = (lon,lat) => [ (lon+180)/360*W, (90-lat)/180*H ];

  function trace(){
    for(const f of feats){
      for(const poly of polysOf(f.geometry)){
        for(const ring of poly){
          g.moveTo(...px(ring[0][0], ring[0][1]));
          for(let i=1;i<ring.length;i++) g.lineTo(...px(ring[i][0], ring[i][1]));
          g.closePath();
        }
      }
    }
  }

  // 땅 — 초록 한 단, 그 위에 살짝 밝은 안쪽 단 (툰 두 단)
  g.fillStyle = '#4E9E52'; g.beginPath(); trace(); g.fill('evenodd');
  g.globalAlpha = .5;
  g.fillStyle = '#69B45E'; g.beginPath(); trace(); g.fill('evenodd');
  g.globalAlpha = 1;

  /* 땅에 그늘을 넣는다 — 이걸 넣기 전 v3 의 땅은 초록 한 판이었다.
     히말라야도 안데스도 로키도 없이 평지였고, 산맥 겹은 켜기 전에는 안 보였다.

     오버레이는 중간 회색(128)을 기준으로 아래는 어둡게 위는 밝게 한다. 그늘만
     곱하면 해가 드는 비탈이 살지 않는다. 자료 쪽에서 바다를 정확히 128 로
     맞춰 두었으므로 바다에서는 아무 일도 일어나지 않는다 — 가리개가 필요 없다.

     못 받으면 그냥 넘어간다. 그늘이 없는 지구는 심심하지만 틀리지는 않다. */
  try {
    const relief = await new Promise((ok, no) => {
      const im = new Image();
      im.onload = () => ok(im); im.onerror = no;
      im.src = '../data/relief-5400.webp';
    });
    g.imageSmoothingQuality = 'high';
    g.globalCompositeOperation = 'overlay';
    g.drawImage(relief, 0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
    reliefOn = true;
  } catch(e){ console.warn('음영기복 로드 실패 — 평평한 땅으로 간다', e); }

  // 국경선 — 살짝만. 있는 줄 알 정도지 읽으라고 그리는 게 아니다.
  g.strokeStyle = 'rgba(255,255,255,.34)';
  g.lineWidth = 2.4; g.lineJoin = 'round';
  g.beginPath(); trace(); g.stroke();

  // 해안선은 국경선보다 조금 더 또렷하게 — 땅의 윤곽이 먼저 읽혀야 한다
  g.strokeStyle = 'rgba(28,72,48,.30)';
  g.lineWidth = 3.2;
  g.beginPath(); trace(); g.stroke();

  // 극지 — 눈 색. 위도로만 칠하고 위치를 만들지 않는다.
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,   'rgba(243,249,255,1)');
  grad.addColorStop(.030,'rgba(243,249,255,1)');     // 극은 완전히 덮는다
  grad.addColorStop(.105,'rgba(243,249,255,0)');
  grad.addColorStop(.895,'rgba(243,249,255,0)');
  grad.addColorStop(.970,'rgba(243,249,255,1)');
  grad.addColorStop(1,   'rgba(243,249,255,1)');
  g.fillStyle = grad; g.fillRect(0,0,W,H);

  // 색면을 깔면 텍스처의 해안선이 묻힌다. 윈디처럼 색 위에 다시 긋는다.
  {
    let segs = 0;
    for(const f of feats) for(const poly of polysOf(f.geometry)) segs += poly[0].length - 1;
    const arr = new Float32Array(segs*2*3);
    let i = 0;
    for(const f of feats){
      for(const poly of polysOf(f.geometry)){
        const ring = poly[0];
        for(let k = 0; k < ring.length-1; k++){
          if(Math.abs(ring[k][0] - ring[k+1][0]) > 180){ i += 6; continue; }
          const a = llToVec(ring[k][1], ring[k][0], R*1.0055);
          const b = llToVec(ring[k+1][1], ring[k+1][0], R*1.0055);
          arr[i++]=a.x; arr[i++]=a.y; arr[i++]=a.z;
          arr[i++]=b.x; arr[i++]=b.y; arr[i++]=b.z;
        }
      }
    }
    const g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    coastLine = new THREE.LineSegments(g2, new THREE.LineBasicMaterial({
      color: 0x14202C, transparent: true, opacity: 0, depthWrite: false }));
    coastLine.renderOrder = 2;
    earthGroup.add(coastLine);
  }

  COUNTRY_LABELS = feats
    .filter(f => LABEL_CODES.has(f.code))
    .map(f => { const p = labelPoint(f.geometry);
                return p ? { name: SHORT_NAME[f.code] || f.nameKo || f.nameEn, ...p } : null; })
    .filter(Boolean);

  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ── 렌더러 ────────────────────────────────────────────────── */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(FOV0, 1, NEAR, 100);

const earthGroup = new THREE.Group();
scene.add(earthGroup);

const R = 1;
// Paper characters use the existing frame; creating a second loop would waste mobile power.
const paperCharacters = createCharacterGlobe({ group: earthGroup, camera, focus: ({ lat, lon }) => {
  const p = llToVec(lat, lon);
  yawTarget = Math.atan2(p.z, p.x); pitchTarget = Math.asin(p.y); following = true;
  distTarget = Math.max(1.25, Math.min(distTarget, 1.7));
}});
addEventListener('pagehide', event => { if (!event.persisted) paperCharacters.dispose(); });
const sunDir = new THREE.Vector3();

/* 툰 셰이딩: 낮/황혼/밤 세 단. 밴딩이 곧 화풍이다. */
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    map:      { value: null },
    sunDir:   { value: sunDir },
    nightMix: { value: 1 },
    pastFade: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv; varying vec3 vN;
    void main(){ vUv = uv; vN = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D map; uniform vec3 sunDir; uniform float nightMix; uniform float pastFade;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      vec3 base = texture2D(map, vUv).rgb;
      float d = dot(normalize(vN), normalize(sunDir));
      float band = d > 0.28 ? 1.0 : (d > -0.06 ? 0.62 : 0.30);
      band = mix(1.0, band, nightMix);
      vec3 night = mix(base, vec3(0.09,0.15,0.34), 0.72);
      vec3 col = mix(night, base, smoothstep(0.30, 1.0, band));
      col *= 0.72 + 0.28*band;
      float rim = pow(1.0 - abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 2.6);
      col += vec3(0.36,0.60,0.95) * rim * 0.5;
      // 과거를 볼 때 오늘 지도는 뒤로 물린다 — 지우지는 않는다. 어디가 지금인지는 알아야 한다.
      col = mix(col, vec3(0.13,0.19,0.31), pastFade * 0.66);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
let coastLine = null;
const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 80), earthMat);
earthGroup.add(earth);

/* 대기 — 바깥으로 부드럽게 번지는 파란 테두리 */
const glow = new THREE.Mesh(
  new THREE.SphereGeometry(R*1.055, 64, 40),
  new THREE.ShaderMaterial({
    transparent:true, side:THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec3 vN;
      void main(){ float i = pow(1.0-abs(dot(normalize(vN), vec3(0.0,0.0,1.0))), 3.0);
      gl_FragColor = vec4(0.42,0.68,1.0, i*0.85); }`
  })
);

/* ── 구름 껍질: NOAA GMGSI 관측 영상을 평평한 2D 로 계단화 ──────────
   전에는 손으로 그린 구름 도장을 격자마다 찍었다. 모양이 지어낸 것이었고
   가까이 가면 같은 그림이 반복돼 벽지처럼 보였다.
   지금은 정지궤도 위성 적외 합성 영상을 그대로 받아서, 밝기를 두 단으로
   끊어 평평하게 칠한다 — 모양은 진짜, 칠은 2D. */
const cloudTex = new THREE.Texture();
cloudTex.colorSpace = THREE.SRGBColorSpace;

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(R*1.012, 96, 60),
  new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{
      map:    { value: cloudTex },
      texel:  { value: new THREE.Vector2(1/3072, 1/1536) },
      ready:  { value: 0 },
    },
    vertexShader:`
      varying vec2 vUv;
      void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader:`
      uniform sampler2D map; uniform vec2 texel; uniform float ready;
      varying vec2 vUv;
      void main(){
        if(ready < 0.5) discard;

        // 이 합성 영상은 알파가 "구름이 얼마나 있나"이고 밝기는 "얼마나 흰가"다.
        // (사하라 = 알파 0, 적도 적운대 = 알파 246 을 직접 재서 확인했다.)
        // 적외 영상의 잔 알갱이를 이웃 평균으로 눌러 둥근 덩어리로 만든다.
        // 모양을 지어내는 게 아니라 해상도를 낮추는 것이다 — 구름은 제자리에 있다.
        float a = 0.0, l = 0.0;
        for(int i=-2;i<=2;i++){
          for(int j=-2;j<=2;j++){
            vec4 t = texture2D(map, vUv + vec2(float(i), float(j)) * texel * 2.4);
            a += t.a; l += t.r;
          }
        }
        a /= 25.0; l /= 25.0;

        // 구름이 없는 곳과 관측이 없는 곳은 그리지 않는다
        if(a < 0.10) discard;

        // 평평한 두 단. 가장자리는 계단이 안 보일 만큼만 부드럽게.
        float lo = smoothstep(0.11, 0.19, a);   // 구름이 있다
        float hi = smoothstep(0.46, 0.66, a);   // 두꺼운 구름
        float alpha = lo * (0.58 + 0.42*hi);
        vec3  col   = mix(vec3(0.79,0.85,0.94), vec3(1.0,1.0,1.0), max(hi, l*0.35));

        gl_FragColor = vec4(col, alpha);
      }
    `
  })
);
earthGroup.add(clouds);

/* 관측 구름 한 장을 받아 온다.
   S3 를 직접 부른다 — CloudFront 는 /clouds/* 말고는 CORS 헤더를 안 붙이고,
   로컬 개발에서는 같은 출처가 아니기 때문이다. */
const CLOUD_BASE = 'https://earthus-cache-kr.s3.us-east-2.amazonaws.com/clouds';

/* ── 지금까지 본 것 중 가장 성한 장을 기기 안에 쌓는다 ────────────────
   S3 의 global.png 는 갱신 때마다 덮어써져서 과거 프레임이 남지 않는다.
   그래서 브라우저가 직접 쌓는다.

   ⚠️ 처음엔 "결손이 하나도 없는 장"만 보관했는데, 원본 결손이 며칠 이어지면
   보관되는 장이 영영 없어 메울 재료가 생기지 않았다. 그래서 **칸 단위로 최선을
   누적**한다 — 이번에 성한 칸은 갱신하고, 이번에 빈 칸은 예전 것을 남긴다.
   서버로는 아무것도 보내지 않는다. */
const CLOUD_DB = 'earthus-v3-clouds';
function idbOpen(){
  return new Promise((ok, no) => {
    const rq = indexedDB.open(CLOUD_DB, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('frame');
    rq.onsuccess = () => ok(rq.result);
    rq.onerror = () => no(rq.error);
  });
}
async function lastGoodFrame(){
  try{
    const db = await idbOpen();
    return await new Promise((ok) => {
      const rq = db.transaction('frame').objectStore('frame').get('last');
      rq.onsuccess = () => ok(rq.result || null);
      rq.onerror = () => ok(null);
    });
  }catch(e){ return null; }
}
async function keepFrame(rec){
  try{
    const db = await idbOpen();
    db.transaction('frame', 'readwrite').objectStore('frame').put(rec, 'last');
  }catch(e){ /* 저장 못 해도 화면은 돌아간다 */ }
}

/* ── 깨진 칸 찾기 ────────────────────────────────────────────────
   위성 합성이 한 구역을 못 받으면 그 자리가 통째로 알파 255 로 채워져 나온다.
   진짜 구름과는 확실히 구별된다 — 직접 재 봤다(2026-09-03):
     깨진 자리   알파평균 255, 알파분산 0.0
     콩고 적운대 알파평균 129, 알파분산 9576
     사하라 맑음 알파평균 0,   알파분산 0.4
   구름은 늘 결이 있고 깨진 자리는 완전히 평평하다. 이 둘을 가르는 게 분산이다. */
const CELL = 64;
function findBrokenCells(data, W, H){
  const bad = [];
  for(let cy = 0; cy < H; cy += CELL){
    for(let cx = 0; cx < W; cx += CELL){
      let n = 0, sum = 0, sum2 = 0;
      for(let y = cy; y < Math.min(cy+CELL, H); y += 4){
        for(let x = cx; x < Math.min(cx+CELL, W); x += 4){
          const a = data[(y*W + x)*4 + 3];
          n++; sum += a; sum2 += a*a;
        }
      }
      if(!n) continue;
      const mean = sum/n, varc = sum2/n - mean*mean;
      if(mean > 250 && varc < 5) bad.push([cx, cy]);
    }
  }
  return bad;
}

async function loadObservedClouds(){
  const meta = await fetch(`${CLOUD_BASE}/meta.json`, { cache:'no-cache' })
    .then(r => { if(!r.ok) throw new Error(`meta ${r.status}`); return r.json(); });

  const blob = await fetch(`${CLOUD_BASE}/global.png?t=${encodeURIComponent(meta.time)}`)
    .then(r => { if(!r.ok) throw new Error(`png ${r.status}`); return r.blob(); });
  const bmp = await createImageBitmap(blob);

  // 위성이 극을 못 본다. 영상이 덮는 위도 띠에만 놓고 나머지는 비운다 —
  // 늘려 채우면 없는 관측을 만들어 내는 것이 된다.
  const north = meta.north ?? 72.715, south = meta.south ?? -72.737;
  const W = bmp.width, H = Math.round(W/2);
  const bandY = Math.round(((90-north)/180)*H);
  const bandH = Math.round(((north-south)/180)*H);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.clearRect(0,0,W,H);
  g.drawImage(bmp, 0, bandY, W, bandH);

  const img = g.getImageData(0, 0, W, H);
  const broken = findBrokenCells(img.data, W, H);

  let patched = 0, patchTime = null, stillEmpty = broken.length;
  if(broken.length){
    // 깨진 칸은 일단 지운다 — 쓰레기를 구름으로 그리지 않는다.
    for(const [cx, cy] of broken){
      for(let y = cy; y < Math.min(cy+CELL, H); y++){
        let o = (y*W + cx)*4 + 3;
        for(let x = cx; x < Math.min(cx+CELL, W); x++, o += 4) img.data[o] = 0;
      }
    }
    g.putImageData(img, 0, 0);

    // 그 자리만 예전에 성했던 자료에서 가져와 메운다.
    const prev = await lastGoodFrame();
    if(prev && prev.time !== meta.time){
      try{
        const pb = await createImageBitmap(prev.blob);      // 누적본은 이미 등장방형 전체다
        const pc = document.createElement('canvas'); pc.width = W; pc.height = H;
        const pg = pc.getContext('2d', { willReadFrequently: true });
        pg.drawImage(pb, 0, 0, W, H);
        const pd = pg.getImageData(0, 0, W, H).data;
        for(const [cx, cy] of broken){
          // 예전 자료의 그 칸도 비어 있으면 메울 게 없다 — 억지로 채우지 않는다
          let has = false;
          for(let y = cy; y < Math.min(cy+CELL, H) && !has; y += 4)
            for(let x = cx; x < Math.min(cx+CELL, W); x += 4)
              if(pd[(y*W + x)*4 + 3] > 8){ has = true; break; }
          if(!has) continue;
          const cw = Math.min(CELL, W-cx), ch2 = Math.min(CELL, H-cy);
          g.drawImage(pc, cx, cy, cw, ch2, cx, cy, cw, ch2);
          patched++;
        }
        stillEmpty = broken.length - patched;
        if(patched) patchTime = prev.time;
      }catch(e){ console.warn('예전 자료로 메우지 못했다', e); }
    }
  }

  // 지금 화면이 지금까지의 최선이다 — 통째로 누적본으로 갈아 둔다.
  cv.toBlob((b) => { if(b) keepFrame({ time: meta.time, blob: b }); }, 'image/png');

  cloudTex.image = cv;
  cloudTex.colorSpace = THREE.SRGBColorSpace;
  cloudTex.wrapS = THREE.RepeatWrapping;
  cloudTex.minFilter = THREE.LinearMipmapLinearFilter;
  cloudTex.magFilter = THREE.LinearFilter;
  cloudTex.anisotropy = 8;
  cloudTex.needsUpdate = true;
  clouds.material.uniforms.texel.value.set(1/W, 1/H);
  clouds.material.uniforms.ready.value = 1;

  return { ...meta, broken: broken.length, patched, patchTime, stillEmpty };
}

/* ── 카메라: 세 칸으로 잠근 줌 ────────────────────────────────── */
// 줌 단계 = 화면 짧은 변의 절반 대비 지구 반지름 비율. 기기가 달라도 같은 크기로 보인다.
// 윈디는 지도가 화면을 넘겨 채운다. 지구 가장자리를 보여주는 게 목적이 아니라
// 땅을 크게 보여주는 게 목적이다. 처음 값(0.80)의 4배 이상으로 잡는다.
const FILL = [3.4, 5.2, 7.6, 12.0];   // 넓게 / 나라 / 동네 / 한반도만
let tanMin = 0.344, tanTarget = 0.344, tanBase = 0.344, screenR = 300;  // 매 프레임 갱신

/* ⚠️ 다가가는 것만으로는 이 배율이 안 나온다.
   구를 밖에서 보는 카메라가 낼 수 있는 배율에는 천장이 있다(1/tanMin). 그 위를
   요구하면 카메라가 지구 안으로 들어가므로 예전 코드는 R*1.045 로 붙잡아 뒀는데,
   그러면 지구 앞면이 near 평면(0.1)보다 가까워져 통째로 잘렸다 — 하단 '지구' 를
   누르면 줌인하다 화면이 비던 게 이것이고, 7.6 과 12.0 두 칸이 같은 그림이었다.

   그래서 윈디가 평면 지도로 하는 일을 구에서는 렌즈로 한다.
   먼저 다가가고(D_MIN 까지), 더는 못 다가가면 화각을 좁힌다. */
const D_MIN = R * 1.5;               // 카메라가 더 붙지 않는 거리
if(D_MIN - R <= NEAR) throw new Error('카메라 최소 거리가 near 평면보다 가깝다 — 지구가 잘린다');

let stop = 0, dist = 3.6, distTarget = 3.6;
/* 지구가 화면 짧은 변의 절반에서 차지하는 비율.
   ⚠️ 손으로 줄이는 한계를 칸 목록과 묶어 두었더니 **줌 아웃이 아예 안 됐다.**
      칸의 첫 값(3.4)이 곧 하한이라, 가장 넓게 봐도 지구가 화면을 넘겼다 —
      지구본인데 지구 전체를 볼 수 없었다.
      칸은 '자주 쓰는 자리'고 손은 그것보다 넓게도 갈 수 있어야 한다.
      0.8 이면 짧은 변에 여백을 두고 지구가 통째로 들어온다. */
let fill = FILL[0];
const FILL_MIN = 0.8, FILL_MAX = FILL[FILL.length-1];
const clampFill = f => Math.max(FILL_MIN, Math.min(FILL_MAX, f));
function applyFill(){
  const d = R / (fill * tanBase);
  if(d >= D_MIN){ distTarget = d;     tanTarget = tanBase; }        // 다가간다
  else          { distTarget = D_MIN; tanTarget = R / (fill * D_MIN); }  // 화각을 좁힌다
}
/* 칠해 둔 해안선은 확대하면 뭉갠다(텍스처 4096×2048 을 화면 16000px 로 늘린다).
   가까이 갈수록 벡터 해안선을 겹쳐 가장자리를 세운다 — 윈디가 해안선을 또렷하게
   보여주는 게 이것이다. 기온 겹을 켰을 때 늘 켜지던 것과 둘 중 진한 쪽을 쓴다.
   과거를 볼 때는 켜지 않는다 — 오늘 해안선을 또렷하게 세우면 그 시대 땅과 겹쳐
   "그때 거기가 저 모양이었다"는 거짓말이 된다. */
let coastBase = 0;
function updateCoast(){
  if(!coastLine) return;
  const t = Math.min(1, Math.max(0, (fill - FILL[0]) / (FILL[2] - FILL[0])));
  coastLine.material.opacity = Math.max(coastBase, t * 0.8)
                             * (1 - earthMat.uniforms.pastFade.value);
}
// 화각은 tanMin 이 정한다 — 세로가 짧은 화면이든 가로가 짧은 화면이든 같은 배율이 되게.
function setFov(t){
  const tanV = t / Math.min(1, camera.aspect);
  const f = 2*Math.atan(tanV)*180/Math.PI;
  if(Math.abs(f - camera.fov) > 1e-4){ camera.fov = f; camera.updateProjectionMatrix(); }
}
/* 화면이 비었을 때 "카메라 탓인가 자료 탓인가"를 밖에서 물어볼 수 있게 열어 둔다.
   이 함정에 여러 번 빠졌다 — 숨은 패널은 뷰포트가 0×0 으로 오고, 그때 잰 수치는 못 믿는다. */
window.__v3 = (ma) => {
  if(ma !== undefined){ maNow = maTarget = ma; refreshPast(); }   // 숨은 창에서는 rAF 가 안 돈다
  return ({ fill, stop, dist, distTarget, tanMin, tanTarget, tanBase, screenR, fov: camera.fov,
                       ma: maNow, maTarget, storyOn, fillMesh: paleoFill, yaw, pitch, yawV, pitchV, dragging, following,
                       india: (()=>{ const m = plateNow(501); return m ? rotXYZ(21.4, 79.4, m) : null; })(),
                       near: camera.near, 여유: dist - R, w: innerWidth, h: innerHeight });
};
const HOME = { lat: 36.5, lon: 127.9 };            // 부모가 고른 우리 동네 (GPS 아님)
const yawFor   = lon => -lon*Math.PI/180;
const pitchFor  = lat =>  lat*Math.PI/180;
let yaw = yawFor(HOME.lon), pitch = pitchFor(HOME.lat);
let yawTarget = yaw, pitchTarget = pitch, following = false;
let yawV = 0, pitchV = 0, dragging = false, lastX = 0, lastY = 0, idle = 0;
let spinning = true;      // 열면 지구가 스스로 돈다. 손이 닿는 순간 끝난다.
let lastDY = 0, lastDP = 0;                         // 놓을 때 이어서 미끄러질 만큼
const MAX_SPIN = 1.05;                              // rad/s ≈ 60°/s — 손을 뗀 뒤에만 걸린다

function pointerDown(e){
  spinning = false;
  dragging = true; idle = 0; following = false; lastX = e.clientX; lastY = e.clientY;
  // 포인터가 이미 놓인 뒤면 던진다. 잡는 데 실패해도 끄는 건 계속돼야 한다.
  try { canvas.setPointerCapture?.(e.pointerId); } catch(_){}
  $('#hint').classList.add('gone');
}
/* 손가락(마우스) 밑의 점이 따라온다.
   화면에서 지구 반지름이 screenR 픽셀이므로 1픽셀이 곧 1/screenR 라디안이다 —
   배율이 달라져도 저절로 맞고, 배율마다 계수를 손볼 일이 없다.

   ⚠️ 전에는 각도가 아니라 **속도**에 더하고 있었다. 루프가 `yaw += yawV` 로
      한 프레임에 그 값을 통째로 쓰는데 감쇠가 프레임당 0.86 이라, 끌고 있는
      동안 속도가 1/(1-0.86) ≈ 7배로 눌어붙었다. 한 번 움직일 때 이미 3.3배
      빨랐으니 합쳐서 손가락보다 스무 배 넘게 돌았다.
      지구를 키워도 빠른 채였던 건 계수만 배율로 나누고 이 쌓임을 그대로 뒀기 때문이다. */
function pointerMove(e){
  if(!dragging || touches.size >= 2) return;
  const k = 1/Math.max(80, screenR);
  lastDY = (e.clientX-lastX)*k;
  lastDP = (e.clientY-lastY)*k;
  yaw += lastDY; pitch += lastDP;
  yawV = pitchV = 0;                 // 끄는 동안에는 관성이 없다. 손이 곧 진실이다.
  lastX = e.clientX; lastY = e.clientY;
}
// 놓으면 마지막 움직임의 절반만큼 미끄러지다 감쇠로 선다
function pointerUp(){
  if(dragging){ yawV = lastDY*0.5; pitchV = lastDP*0.5; }
  dragging = false; lastDY = lastDP = 0;
}
/* 마우스 휠 — 세 칸이 정하던 범위 안에서만 연속으로 움직인다.
   자유 줌이면 아이가 지구 밖으로 나가거나 텍스처가 깨질 만큼 붙는다. */
canvas.addEventListener('wheel', (e) => {
  spinning = false;
  e.preventDefault();
  const step = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // 줄 단위로 오는 브라우저 보정
  fill = clampFill(fill * Math.exp(-step * 0.0012));
  applyFill();
  following = false;
  $('#hint').classList.add('gone');
}, { passive: false });

/* 두 손가락 핀치 — 있으면 좋지만 없어도 전부 되는 보조 수단.
   레일과 아래 칸 버튼으로 같은 일을 할 수 있다. */
const touches = new Map();
let pinchStart = 0, pinchFill = 0;
function pinchDist(){
  const [a, b] = [...touches.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}
canvas.addEventListener('pointerdown', (e) => {
  if(e.pointerType === 'touch'){
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(touches.size === 2){ pinchStart = pinchDist(); pinchFill = fill; dragging = false; }
  }
});
addEventListener('pointermove', (e) => {
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(touches.size === 2 && pinchStart > 0){
    fill = clampFill(pinchFill * (pinchDist() / pinchStart));
    applyFill();
    following = false;
  }
});
function dropTouch(e){
  if(touches.delete(e.pointerId) && touches.size < 2) pinchStart = 0;
}
addEventListener('pointerup', dropTouch);
addEventListener('pointercancel', dropTouch);

canvas.addEventListener('pointerdown', pointerDown);
addEventListener('pointermove', pointerMove);
addEventListener('pointerup', pointerUp);
addEventListener('pointercancel', pointerUp);

function goStop(i){
  stop = Math.max(0, Math.min(FILL.length-1, i));
  fill = FILL[stop];
  applyFill();
}
// 지금 배율이 세 칸 중 어디에 가장 가까운가 — 다음 칸 버튼이 늘 말이 되게
function nearestStop(){
  let best = 0, d = Infinity;
  FILL.forEach((f,i)=>{ const g = Math.abs(f - fill); if(g < d){ d = g; best = i; } });
  return best;
}
$('#home').addEventListener('click', ()=>{
  goStop(0);
  yaw = yawFor(HOME.lon);
  pitch = pitchFor(HOME.lat);
  yawV = pitchV = 0;
});
// 지구를 두 번 누르면 한 칸 들어간다 (핀치 없이도 전부 된다)
canvas.addEventListener('dblclick', ()=> goStop(nearestStop()+1));
$('#nav').children[1].addEventListener('click', ()=>{
  // 칸보다 넓게 나가 있으면 '넓게'로 돌아온다 — 거기서 한 칸 더 들어가면 건너뛴다
  const n = fill < FILL[0]*0.95 ? 0 : nearestStop()+1;
  goStop(n >= FILL.length ? 0 : n);
});

/* ── 레일 토글 ────────────────────────────────────────────── */
const show = { cloud:true, rain:true, zap:true, night:true };
/* 구름·비·번개는 아이에게 세 가지가 아니라 '오늘 하늘' 하나다. 버튼 하나로 묶는다. */
$('#b-weather').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  show.cloud = show.rain = show.zap = on;
  clouds.visible = show.cloud;
  drawOnce();
});
for(const [id,key] of [['#b-night','night']]){
  $(id).addEventListener('click', e=>{
    show[key] = !show[key];
    e.currentTarget.setAttribute('aria-pressed', String(show[key]));
    if(key === 'cloud') clouds.visible = show.cloud;
  });
}

/* ── 날씨 친구 ─────────────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════════
   쿵 — 운석이 남긴 자국
   "작게 하지 말고 크게" — 표식 크기를 실제 지름에 비례시키되 최소·최대를
   둔다. 배린저는 1.2km 라 점만 하고 브레데포르트는 160km 라 크다.
   ⚠️ 크기는 화면에서 키우되 자리는 손대지 않는다.
   ══════════════════════════════════════════════════════════════ */
let CRATERS = null, craterOn = false;
const craterMarks = [];

async function loadCraters(){
  CRATERS = await fetch('../data/craters.json').then(r=>r.json());
  // 충돌구는 자료가 영어 이름을 들고 있다. 사전에 옮겨 적지 않고 그대로 넘긴다.
  if(window.KIDS_I18N) window.KIDS_I18N.add(Object.fromEntries(CRATERS.items.map(c=>[c.ko, c.en])));
  for(const c of CRATERS.items){
    const el = document.createElement('div');
    el.className = 'cr';
    el.innerHTML = `<div class="ring"></div><div class="t">${c.ko}</div>`;
    el.style.visibility = 'hidden'; el.style.display = 'none';
    el.addEventListener('click', ()=> openCrater(c));
    stage.appendChild(el);
    craterMarks.push({ c, el, pos: llToVec(c.lat, c.lon, R*1.016) });

}

const craterAgeKo = (ma) => KAGO(ma);

function openCrater(c){
  const card = $('#card');

    <h2>${KT.en ? c.en : c.ko}</h2>

    ${c.kid ? `<div class="kid">${c.kid}</div>` : ''}

/* ══════════════════════════════════════════════════════════════
   불 — 지진 25년과 판 경계
   가르치지 않고 보게 만든다. 하루치 지진은 흩어진 점이지만 25년을 쌓으면
   줄이 생긴다. 그 줄이 판 경계다 — 지질학자가 그린 선을 그 위에 겹치면
   "정말 같은 자리인가"를 아이가 눈으로 확인한다.

   자료는 v2 가 이미 가진 것을 그대로 쓴다. USGS ComCat 2001년~ 규모 4.5 이상
   18만 건이 5.7바이트/건으로 눌려 있고(zlib), 판 경계는 Bird(2003) PB2002 다.
   ══════════════════════════════════════════════════════════════ */
let quakeOn = false, quakePts = null, plateLine = null, QUAKE_HEAD = null, quakeMat = null;
let quakePlaying = false, quakeDay = 0, quakeT0 = 0;
const QUAKE_SECONDS = 42;        // 25년을 42초에 흘려보낸다

async function inflateBin(buf){
  const st = new Response(buf).body.pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

async function loadQuakes(){
  const base = '../v2-three/quakes';
  const [head, bin, plates] = await Promise.all([
    fetch(`${base}/quakes.json`).then(r=>r.json()),
    fetch(`${base}/quakes.bin`).then(r=>r.arrayBuffer()),
    fetch(`${base}/plates.json`).then(r=>r.json()),
  ]);
  QUAKE_HEAD = head;

  const raw = await inflateBin(bin);
  const n = head.count;
  const dv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
  const pos = new Float32Array(n*3);
  const col = new Float32Array(n*3);

  // 배열 5개가 차례로 들어 있다 — 순서를 틀리면 지진이 엉뚱한 자리에 찍힌다
  let o = 0;
  const lon = new Float32Array(n), lat = new Float32Array(n), mag = new Float32Array(n);
  const day = new Float32Array(n);
  for(let i=0;i<n;i++, o+=2) lon[i] = dv.getInt16(o, true)/181;
  for(let i=0;i<n;i++, o+=2) lat[i] = dv.getInt16(o, true)/362;
  o += n*2;                                   // 깊이는 이 화면에서 쓰지 않는다
  for(let i=0;i<n;i++, o+=1) mag[i] = raw[o]/20 + 4.0;
  // ⚠️ 날짜가 이미 파일 안에 있었다(기준일로부터 일수). 여기서 건너뛰고 있었고,
  //    그래서 25년이 한 장에 눌려 있었다. 읽어 두면 시간을 흘려보낼 수 있다.
  for(let i=0;i<n;i++, o+=2) day[i] = dv.getUint16(o, true);

  for(let i=0;i<n;i++){
    const v = llToVec(lat[i], lon[i], R*1.004);
    pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z;
    // 큰 지진일수록 붉다. 색만이 아니라 밝기도 함께 오른다.
    const u = Math.min(1, (mag[i]-4.5)/3.0);
    col[i*3]   = 1.0;
    col[i*3+1] = 0.86 - u*0.62;
    col[i*3+2] = 0.45 - u*0.32;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aDay', new THREE.BufferAttribute(day, 1));
  /* 재생을 하려면 점마다 "그날이 지났는가"를 물어야 한다. 18만 개를 CPU 에서
     매 프레임 훑을 수는 없으니 GPU 에 묻는다 — uNow 하나만 바꾸면 된다.
     uNow < 0 이면 전부 켠다(재생 전의 원래 화면). */
  quakeMat = new THREE.ShaderMaterial({
    uniforms: { uNow: { value: -1 }, uFlash: { value: 46 }, uScale: { value: 450 }, uSize: { value: 0.0075 } },
    transparent: true, depthWrite: false, vertexColors: true,
    vertexShader: `
      attribute float aDay;
      uniform float uNow, uFlash, uScale, uSize;
      varying vec3 vC; varying float vA;
      void main(){
        vC = color;
        float all = step(uNow, -0.5);                 // uNow < 0 → 전부 보이기
        float past = step(aDay, uNow);
        float d = max(uNow - aDay, 0.0);
        float flash = clamp(1.0 - d/uFlash, 0.0, 1.0);
        flash *= flash;                                // 짧고 세게 번쩍인다
        vA = max(all * 0.55, past * (0.16 + 0.84*flash));
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = uSize * (1.0 + 4.5*flash*(1.0-all)) * (uScale / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vC; varying float vA;
      void main(){
        if(vA < 0.02) discard;
        vec2 q = gl_PointCoord - 0.5;
        float r = dot(q,q);
        if(r > 0.25) discard;
        gl_FragColor = vec4(vC, vA * smoothstep(0.25, 0.05, r));
      }`,
  });
  quakePts = new THREE.Points(g, quakeMat);
  quakePts.visible = false;
  earthGroup.add(quakePts);

  // 판 경계 — 지질학자가 그린 선
  const co = plates.coords;
  let segs = 0;
  for(const line of co) segs += (line.length/2 - 1);
  const ppos = new Float32Array(segs*2*3);
  let k = 0;
  for(const line of co){
    for(let i=0;i<line.length-2;i+=2){
      if(Math.abs(line[i]-line[i+2]) > 180){ k += 6; continue; }
      const a = llToVec(line[i+1], line[i], R*1.009);
      const b = llToVec(line[i+3], line[i+2], R*1.009);
      ppos[k++]=a.x; ppos[k++]=a.y; ppos[k++]=a.z;
      ppos[k++]=b.x; ppos[k++]=b.y; ppos[k++]=b.z;
    }
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
  plateLine = new THREE.LineSegments(pg, new THREE.LineBasicMaterial({
    color: 0x7FE0FF, transparent: true, opacity: 0.75, depthWrite: false }));
  plateLine.renderOrder = 4;
  plateLine.visible = false;
  earthGroup.add(plateLine);
}

/* 25년을 흘려보낸다. 하루치는 흩어진 점이지만 시간을 흘리면 같은 자리가
   되풀이해서 번쩍이고, 그 되풀이가 판 경계를 그린다 — 말로 하지 않고 보여 준다. */
function quakeStop(){
  quakePlaying = false;
  $('#quakeplay').textContent = '▶ 25년을 흘려보기';
  if(quakeMat) quakeMat.uniforms.uNow.value = -1;
  $('#quakefill').style.width = '0%';
  $('#quakewhen').textContent = QUAKE_HEAD ? `${QUAKE_HEAD.epoch.slice(0,4)}년부터 지금까지` : '';
}
function quakeStart(){
  if(!QUAKE_HEAD || !quakeMat) return;
  quakePlaying = true; quakeDay = 0; quakeT0 = performance.now();
  $('#quakeplay').textContent = '■ 멈추기';
  $('#card').hidden = true;
}
function quakeStep(now){
  if(!quakePlaying || !QUAKE_HEAD || !quakeMat) return;
  const days = QUAKE_HEAD.days;
  quakeDay = (now - quakeT0) / 1000 / QUAKE_SECONDS * days;
  if(quakeDay >= days){ quakeStop(); return; }
  quakeMat.uniforms.uNow.value = quakeDay;
  $('#quakefill').style.width = (quakeDay / days * 100).toFixed(1) + '%';
  const d = new Date(QUAKE_HEAD.epoch + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + Math.floor(quakeDay));
  $('#quakewhen').textContent = `${d.getUTCFullYear()}년 ${d.getUTCMonth()+1}월`;
}
$('#quakeplay').addEventListener('click', () => { quakePlaying ? quakeStop() : quakeStart(); });

$('#b-quake').addEventListener('click', e => {
  quakeOn = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(quakeOn));
  if(quakePts) quakePts.visible = quakeOn;
  if(plateLine) plateLine.visible = quakeOn;
  $('#quakebar').hidden = !(quakeOn && QUAKE_HEAD);
  $('#card').classList.toggle('with-bar', quakeOn && !!QUAKE_HEAD);
  if(!quakeOn) quakeStop(); else quakeStop();
  const c = $('#card');
  if(quakeOn && QUAKE_HEAD){
    c.innerHTML = `<button class="x" aria-label="닫기">×</button>
      <h2>${KT.en ? `Earthquakes since ${QUAKE_HEAD.epoch.slice(0,4)}` : `지진 ${QUAKE_HEAD.epoch.slice(0,4)}년부터 지금까지`}</h2>
      <div class="meta">USGS · ${KT.en ? `${QUAKE_HEAD.count.toLocaleString()} quakes of magnitude ${QUAKE_HEAD.minMagnitude}+` : `규모 ${QUAKE_HEAD.minMagnitude} 이상 ${QUAKE_HEAD.count.toLocaleString()}건`}</div>
      <div class="kid">점 하나가 지진 한 번이에요. 하루만 보면 흩어져 있는데, 25년을 쌓으면 줄이 보여요.</div>
      <div class="rec">그 줄이 <b>판 경계</b>예요. 하늘색 선은 지질학자가 그린 판 경계고, 붉은 점이 그 위에 겹칩니다.<br>판 경계 Bird(2003) PB2002 · ODC-BY</div>`;
    c.hidden = false;
    c.querySelector('.x').addEventListener('click', ()=>{ c.hidden = true; });
  } else if(!quakeOn) c.hidden = true;
});

/* ══════════════════════════════════════════════════════════════
   물 — 큰 강과 큰 댐
   강은 Natural Earth 1:50m(퍼블릭 도메인). 원본에 한국어 이름이 없어
   큰 강 209줄만 손으로 붙였다 — 나머지는 선만 그리고 이름을 띄우지 않는다.
   영어 이름을 아이 화면에 올리지 않기 위해서다.
   댐은 4만 개 중 손으로 고른 18개. 전지구 화면에서 4만 점은 뜻이 없다.
   ══════════════════════════════════════════════════════════════ */
let WATER = null, waterOn = false, riverLine = null;
const riverMarks = [], damMarks = [];

async function loadWater(){
  WATER = await fetch('../data/water.json').then(r=>r.json());

  let segs = 0;
  for(const l of WATER.rivers.lines) segs += (l.c.length - 1);
  const pos = new Float32Array(segs*2*3);
  let i = 0;
  for(const l of WATER.rivers.lines){
    for(let k = 0; k < l.c.length-1; k++){
      if(Math.abs(l.c[k][0] - l.c[k+1][0]) > 180){ i += 6; continue; }
      const a = llToVec(l.c[k][1], l.c[k][0], R*1.005);
      const b = llToVec(l.c[k+1][1], l.c[k+1][0], R*1.005);
      pos[i++]=a.x; pos[i++]=a.y; pos[i++]=a.z;
      pos[i++]=b.x; pos[i++]=b.y; pos[i++]=b.z;
    }
    if(l.n){
      const mid = l.c[Math.floor(l.c.length/2)];
      riverMarks.push({ n: l.n, lon: mid[0], lat: mid[1] });
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  riverLine = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0x6EC8F0, transparent: true, opacity: 0.9, depthWrite: false }));
  riverLine.renderOrder = 3;
  riverLine.visible = false;
  earthGroup.add(riverLine);

  // 강 이름표는 큰 것만 — 209줄 다 띄우면 지구가 글자로 덮인다
  const seen = new Set();
  for(const r of riverMarks){
    if(seen.has(r.n)) continue;
    seen.add(r.n);
    const el = document.createElement('div');
    el.className = 'rv'; el.textContent = r.n; el.style.visibility = 'hidden';
    stage.appendChild(el);
    r.el = el; r.pos = llToVec(r.lat, r.lon, R*1.012);
  }

  for(const d of WATER.dams.items){
    const el = document.createElement('div');
    el.className = 'dm';
    el.innerHTML = `<div class="b"></div><div class="t">${d.n}</div>`;
    el.style.visibility = 'hidden';
    el.addEventListener('click', ()=> openDam(d));
    stage.appendChild(el);
    damMarks.push({ d, el, pos: llToVec(d.lat, d.lon, R*1.014) });
  }
}

/* ══════════════════════════════════════════════════════════════
   해상 부이 — 바다 위에 실제로 떠서 지금 재고 있는 것들
   v1 이 쓰는 같은 자료(NOAA NDBC + OSMC/GTS, 2,400여 곳)를 그대로 읽는다.
   ⚠️ 표식을 DOM 으로 2,400개 만들면 화면이 죽는다. 기온 숫자와 같은 방법 —
      **풀을 돌려 쓴다.** 카메라를 향한 것 중 가까운 순으로 최대 100개만 자리에 놓는다.
   ⚠️ 자료는 668KB 라 첫 화면에서 받지 않는다. 버튼을 눌렀을 때 한 번 받는다.
   ══════════════════════════════════════════════════════════════ */
const BUOY_URL = 'https://earthus-cache-kr.s3.us-east-2.amazonaws.com/ocean/buoys.json';
const BUOY_POOL = 100;
let BUOYS = null, buoyOn = false, buoyLoading = false;
const buoyMarks = [];
function makeBuoyMarks(){
  if(buoyMarks.length) return;
  for(let i = 0; i < BUOY_POOL; i++){
    const el = document.createElement('div');
    el.className = 'by'; el.style.visibility = 'hidden';
    el.innerHTML = '<div class="b"></div>';
    el.addEventListener('click', () => { const b = buoyMarks[i].b; if(b) openBuoy(b); });
    stage.appendChild(el);
    buoyMarks.push({ el, b: null });
  }
}
async function loadBuoys(){
  if(BUOYS || buoyLoading) return;
  buoyLoading = true;
  try{
    const j = await fetch(BUOY_URL, { cache: 'no-cache' }).then(r => { if(!r.ok) throw new Error('buoys ' + r.status); return r.json(); });
    BUOYS = (j.buoys || []).filter(b => Number.isFinite(b.lat) && Number.isFinite(b.lon))
      .map(b => ({ ...b, pos: llToVec(b.lat, b.lon, R*1.008) }));
    buoySrc = { generated: j.generated, source: j.source, count: BUOYS.length };
  } finally { buoyLoading = false; }
}
let buoySrc = null;
const seaWord = h => h == null ? null : h < 0.5 ? '아주 잔잔해요' : h < 1.25 ? '잔잔해요' : h < 2.5 ? '물결이 있어요' : h < 4 ? '파도가 높아요' : '파도가 아주 높아요';
function openBuoy(b){
  const c = $('#card'), m = b.meta || {};
  const rows = [];
  if(b.wvht != null) rows.push(`파도 높이 ${b.wvht.toFixed(1)} m · ${seaWord(b.wvht)}`);
  if(b.dpd  != null) rows.push(`파도 사이 ${b.dpd.toFixed(1)}초`);
  if(b.wtmp != null) rows.push(`바닷물 ${b.wtmp.toFixed(1)}${KT.deg}`);
  if(b.atmp != null) rows.push(`공기 ${b.atmp.toFixed(1)}${KT.deg}`);
  if(b.wspd != null) rows.push(`바람 ${(b.wspd*3.6).toFixed(0)} km/h`);
  if(b.pres != null) rows.push(`기압 ${b.pres.toFixed(0)} hPa`);
  const when = b.time ? String(b.time).slice(11,16) + 'Z' : null;
  /* ⚠️ 카메라 사진은 그 부이가 **방금 찍은 진짜 바다**다. 없는 부이는 자리를 비운다 —
        다른 부이 사진을 대신 넣지 않는다. */
  const cam = m.cam ? `<img class="shot" alt="${KT(m.name || b.id)} 부이가 찍은 바다"
      src="https://www.ndbc.noaa.gov/buoycam.php?station=${encodeURIComponent(b.id)}"
      loading="lazy" onerror="this.remove()">` : '';
  c.innerHTML = `<button class="x" aria-label="닫기">×</button>
    <h2>${KT(m.name || ('부이 ' + b.id))}</h2>
    <div class="meta">${KT(m.type || '해상 관측 부이')} · NDBC ${b.id}${when ? ' · ' + when : ''}</div>
    ${cam}
    <div class="kid">바다 한가운데 떠서 파도와 물 온도를 재는 친구예요.${m.cam ? ' 사진은 이 부이가 방금 찍은 바다예요.' : ''}</div>
    ${rows.length ? `<ul>${rows.map(r => `<li>${r}</li>`).join('')}</ul>` : '<div class="rec">지금은 값이 들어오지 않았어요.</div>'}
    <div class="rec">${KT(m.ownerKo || m.ownerEn || '')}${m.ownerKo || m.ownerEn ? ' · ' : ''}출처 NOAA NDBC · OSMC</div>`;
  c.hidden = false;
  c.querySelector('.x').addEventListener('click', ()=>{ c.hidden = true; });
}
$('#b-buoy').addEventListener('click', async e => {
  const btn = e.currentTarget;
  buoyOn = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', String(buoyOn));
  if(!buoyOn){ for(const m of buoyMarks) m.el.style.visibility = 'hidden'; $('#card').hidden = true; return; }
  makeBuoyMarks();
  if(!BUOYS){
    btn.disabled = true;
    try { await loadBuoys(); }
    catch(err){ console.warn('부이 로드 실패', err); buoyOn = false; btn.setAttribute('aria-pressed','false'); }
    finally { btn.disabled = false; }
  }
  drawOnce();
});

/* ══════════════════════════════════════════════════════════════
   위성 — 지금 지구를 도는 것들
   v1 과 같은 자료(CelesTrak OMM 을 하루 한 번 조인해 둔 카탈로그)와 같은 계산
   (satellite.js SGP4 — vendor 에 이미 있고 이미 배포되어 있다)을 쓴다.
   ⚠️ 카탈로그에 16,513개가 있지만 스타링크만 11,088개다. 전부 그리면 지구가
      점으로 덮이고 아이 화면에서 뜻이 없다. **우주정거장 22 + 기상위성 73** 만 쓴다 —
      이 화면이 보여 주는 구름을 실제로 찍는 것들이라 설명이 성립한다.
   ⚠️ 위치는 프레임마다 풀지 않는다. 1초에 한 번만 푼다.
   ══════════════════════════════════════════════════════════════ */
const SAT_URL = 'https://earthus-cache-kr.s3.us-east-2.amazonaws.com/celestrak/catalog.json.gz';
const SAT_GROUPS = ['stations', 'weather'];
let SATS = null, satOn = false, satLoading = false, satLast = 0, satLib = null;
const satMarks = [];
async function loadSats(){
  if(SATS || satLoading) return;
  satLoading = true;
  try{
    if(!satLib){
      await import('../vendor/satellite-6.0.2.min.js');
      satLib = globalThis.satellite;
      if(!satLib) throw new Error('satellite.js 전역이 없다');
    }
    const buf = await fetch(SAT_URL).then(r => { if(!r.ok) throw new Error('sat ' + r.status); return r.arrayBuffer(); });
    const head = new Uint8Array(buf, 0, 2);
    // S3 가 Content-Encoding 을 붙여 주면 이미 풀려서 온다. 아니면 여기서 푼다.
    const text = (head[0] === 0x1f && head[1] === 0x8b)
      ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
      : new TextDecoder().decode(buf);
    const cat = JSON.parse(text), seen = new Set(), out = [];
    for(const g of SAT_GROUPS){
      for(const row of (cat.groups?.[g] || [])){
        if(seen.has(row.id)) continue;
        seen.add(row.id);
        const a = row.o;
        if(!Array.isArray(a)) continue;
        const rec = satLib.json2satrec({
          OBJECT_NAME: row.n, OBJECT_ID: row.oid, NORAD_CAT_ID: Number(row.id),
          EPOCH: a[0], MEAN_MOTION: a[1], ECCENTRICITY: a[2], INCLINATION: a[3],
          RA_OF_ASC_NODE: a[4], ARG_OF_PERICENTER: a[5], MEAN_ANOMALY: a[6],
          EPHEMERIS_TYPE: a[7], CLASSIFICATION_TYPE: a[8], ELEMENT_SET_NO: a[9],
          REV_AT_EPOCH: a[10], BSTAR: a[11], MEAN_MOTION_DOT: a[12], MEAN_MOTION_DDOT: a[13],
        });
        if(!rec || rec.error !== 0) continue;
        out.push({ n: row.n, id: row.id, own: row.ownKo || row.own, ld: row.ld,
                   ops: row.opsKo, group: g, rec, lat: 0, lon: 0, alt: 0, ok: false, pos: null });
      }
    }
    SATS = out;
  } finally { satLoading = false; }
}
function stepSats(now){
  if(!SATS || !satLib || now - satLast < 1000) return;
  satLast = now;
  const t = new Date(), gmst = satLib.gstime(t);
  for(const x of SATS){
    x.ok = false;
    try{
      const pv = satLib.propagate(x.rec, t);
      if(!pv || !pv.position) continue;
      const gd = satLib.eciToGeodetic(pv.position, gmst);
      x.lat = satLib.degreesLat(gd.latitude);
      x.lon = satLib.degreesLong(gd.longitude);
      x.alt = gd.height;
      if(!Number.isFinite(x.lat) || !Number.isFinite(x.lon) || !Number.isFinite(x.alt)) continue;
      // 높이를 그대로 반지름에 더하면 정지위성이 화면 밖으로 나간다. 눌러서 담는다.

      x.ok = true;
    }catch(_){}
  }
}

   ⚠️ 고도를 그대로 반지름에 더하면 높은 것이 화면 밖으로 나간다. 위성과 똑같이

   ══════════════════════════════════════════════════════════════ */
let junk = null, junkOn = false;
async function ensureJunk(){
  if(junk) return junk;
  const { AetherusThreeLayer } = await import('../js/aetherus/layer-three.js');
  junk = new AetherusThreeLayer(THREE, earthGroup, {
    // 아이 화면이다 — 어른 지구(13)보다 조금 크게. 실측으로 9는 폰에서 안 보였다.
    pointSize: 15,
    project: ([X, Y, Z]) => {
      // ECEF(km) → 위도·경도·고도 → 이 지구의 좌표계 (위성과 같은 눌러담기)
      const r = Math.hypot(X, Y, Z);
      const lat = Math.asin(Z / r) * 180 / Math.PI;
      const lon = Math.atan2(Y, X) * 180 / Math.PI;
      const altKm = r - 6371;
      const v = llToVec(lat, lon, R * (1 + Math.min(0.16, Math.max(altKm, 0) / 42000)));
      return [v.x, v.y, v.z];
    },
  });
  // v2 의 window.__earthusAeth 와 같은 자리 — 개발 중 좌표·개수를 밖에서 확인한다
  window.__earthusJunk = junk;
  return junk;
}

/* ══════════════════════════════════════════════════════════════
   기온 색면 — 윈디가 2D 위에 까는 그 색
   자료는 새로 받지 않는다. 바람 파일에 기온(t)이 같이 들어 있다(-70.5~36.2℃).
   격자를 캔버스에 겹선형으로 펴서 텍스처로 얹는다.

   색은 밝기가 한 방향으로 오르내리게 짰다 — 색만으로 못 읽는 사람도
   진하기로 읽을 수 있어야 한다. 위험을 빨강 하나로만 말하지 않는 규칙과 같다.
   ══════════════════════════════════════════════════════════════ */
const tempCv = document.createElement('canvas');
tempCv.width = 2048; tempCv.height = 1024;
const tempTex = new THREE.CanvasTexture(tempCv);
tempTex.colorSpace = THREE.SRGBColorSpace;
tempTex.wrapS = THREE.RepeatWrapping;
const tempShell = new THREE.Mesh(
  new THREE.SphereGeometry(R*1.002, 96, 60),
  new THREE.MeshBasicMaterial({ map: tempTex, transparent: true, opacity: 0.62, depthWrite: false })
);
tempShell.renderOrder = 1;
tempShell.visible = false;
earthGroup.add(tempShell);

/* 기온 색 계단. 추운 쪽은 어둡고 더운 쪽은 밝다 — 밝기가 곧 값이다. */
const TEMP_STOPS = [
  [-40, 26, 22, 68], [-25, 40, 52,130], [-10, 46,108,180], [  0, 70,158,190],
  [  8,105,190,150], [ 16,190,208,110], [ 24,244,196, 84], [ 30,246,140, 66],
  [ 38,232, 82, 96], [ 46,246,158,196],
];
function tempColor(c){
  if(c <= TEMP_STOPS[0][0]) return TEMP_STOPS[0].slice(1);
  for(let i = 1; i < TEMP_STOPS.length; i++){
    const a = TEMP_STOPS[i-1], b = TEMP_STOPS[i];
    if(c <= b[0]){
      const u = (c - a[0]) / (b[0] - a[0]);
      return [a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u, a[3]+(b[3]-a[3])*u];
    }
  }
  return TEMP_STOPS[TEMP_STOPS.length-1].slice(1);
}

/* ⚠️ 2026-09-04. 지구 한가운데에 색이 안 칠해지는 띠가 돌고 있었다.
   자료를 열어 보니 위도 +5° 한 줄이 72칸 전부 비어 있었다(0°에 24칸, +10°에 4칸 추가).
   비어 있는 자리가 정확히 **연속된 100칸** — 공급자가 100지점씩 묶어 받아오는데
   (aws/wind-grid/handler.py:60 BATCH=100) 그 묶음 하나가 통째로 실패한 것이다.
   바람(u·v)은 멀쩡하고 Open-Meteo 에서 오는 값만 전부 같은 자리를 잃었다.

   색면은 네 모서리 중 하나만 없어도 그 픽셀을 건너뛴다. 그래서 한 줄이 비면
   10도짜리 빈 띠가 지구를 한 바퀴 돈다 — 한 줄의 사고가 지구 전체를 지운다.
   격자 사이를 잇는 것과 같은 방식으로 위아래 유효한 줄에서 이어 붙인다.
   두 줄(10°)까지만 잇는다. 그보다 넓으면 진짜 구멍이므로 비워 둔다 —
   자료가 없으면 안 그린다는 규칙은 그대로다. */
const GRID_BRIDGE = 2;
let gridBridged = 0;            // 격자 위 '자리' 수. 변수마다 더하면 같은 구멍을 스물세 번 센다.
function bridgeGaps(src, nx, ny, count){
  if(!Array.isArray(src) || src.length !== nx*ny) return src;
  let out = null, filled = 0;
  for(let x = 0; x < nx; x++){
    for(let y = 0; y < ny; y++){
      if(src[y*nx + x] != null) continue;
      let up = -1, dn = -1;
      for(let k = 1; k <= GRID_BRIDGE && y-k >= 0; k++) if(src[(y-k)*nx + x] != null){ up = y-k; break; }
      for(let k = 1; k <= GRID_BRIDGE && y+k < ny; k++) if(src[(y+k)*nx + x] != null){ dn = y+k; break; }
      if(up < 0 || dn < 0) continue;
      // 원본에서만 읽는다 — 이어 붙인 값에 또 이어 붙이면 없는 자료가 번진다.
      if(!out) out = src.slice();
      const a = src[up*nx + x], b = src[dn*nx + x];
      out[y*nx + x] = a + (b - a) * (y - up) / (dn - up);
      filled++;
    }
  }
  if(count) gridBridged = Math.max(gridBridged, filled);
  return out || src;
}
let bridgedWind = false, bridgedLeads = false;
function bridgeLoaded(){
  if(!WIND) return;
  const { nx, ny } = WIND;
  if(!bridgedWind){
    for(const k of ['t','rh','mslp','rain','cld','vis','soil','tmax','tmin']) WIND[k] = bridgeGaps(WIND[k], nx, ny, k === 't');
    bridgedWind = true;
  }
  if(LEADS && !bridgedLeads){
    for(const k of ['tmax','tmin'])
      if(Array.isArray(LEADS[k])) LEADS[k] = LEADS[k].map(a => bridgeGaps(a, nx, ny));
    bridgedLeads = true;
  }
  if(gridBridged) paintSrc();
}

let LEADS = null, dayIdx = 0;    // 0 = 지금(관측 기반 실황), 1..7 = D+1..D+7 예보

/* 같은 5° 격자에 D+1~D+7 일별 최고기온이 들어 있다. 예보이므로 화면에
   '예보'라고 적는다 — 실황과 예보를 같은 색으로 칠하되 말은 다르게 한다. */
async function loadLeads(){
  LEADS = await fetch('https://earthus-cache-kr.s3.us-east-2.amazonaws.com/wind/forecast-leads.json')
    .then(r => { if(!r.ok) throw new Error(`leads ${r.status}`); return r.json(); });
  bridgeLoaded();
  const box = $('#days');
  box.innerHTML = '';
  const mk = (label, sub, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<b>${label}</b>${sub ? `<small>${sub}</small>` : ''}`;
    if(i === 0) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => setDay(i));
    box.appendChild(b);
  };
  mk('지금', '실황', 0);
  const base = new Date();
  LEADS.leads.forEach((d, k) => {
    const dt = new Date(base.getTime() + d*86400000);
    mk(`${dt.getMonth()+1}/${dt.getDate()}`,
      (KT.en ? ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] : ['일','월','화','수','목','금','토'])[dt.getDay()], k+1);
  });
}

function setDay(i){
  dayIdx = i;
  [...$('#days').children].forEach((b, k) =>
    k === i ? b.setAttribute('aria-current','true') : b.removeAttribute('aria-current'));
  if(paintTemp()) tempTex.needsUpdate = true;
  if(typeof drawOnce === 'function') drawOnce();
  const l = $('#tempkey .lead');
  if(l) l.textContent = i === 0 ? KT('실황') : (KT.en ? `Forecast D+${LEADS.leads[i-1]}` : `예보 D+${LEADS.leads[i-1]}`);
}

function paintTemp(){
  const src = dayIdx === 0 ? (WIND && WIND.t) : (LEADS && LEADS.tmax[dayIdx-1]);
  if(!src || !WIND) return false;
  const { nx, ny, res, lat0, lon0 } = WIND;
  const t = src;
  const W = tempCv.width, H = tempCv.height;
  const g = tempCv.getContext('2d');
  const img = g.createImageData(W, H);
  const d = img.data;
  for(let y = 0; y < H; y++){
    const lat = 90 - (y + 0.5) / H * 180;
    const fy = (lat - lat0) / res;
    // 격자 밖(극)은 관측이 없다 — 늘려 채우지 않고 비운다
    if(fy < 0 || fy > ny - 1){ continue; }
    const y0 = Math.floor(fy), y1 = Math.min(y0 + 1, ny - 1), ty = fy - y0;
    for(let x = 0; x < W; x++){
      const lon = -180 + (x + 0.5) / W * 360;
      const fx = ((((lon - lon0) % 360) + 360) % 360) / res;
      const x0 = Math.floor(fx) % nx, x1 = (x0 + 1) % nx, tx = fx - Math.floor(fx);
      const v00 = t[y0*nx + x0], v10 = t[y0*nx + x1];
      const v01 = t[y1*nx + x0], v11 = t[y1*nx + x1];
      if(v00 == null || v10 == null || v01 == null || v11 == null) continue;
      // 5도 격자를 곧이곧대로 겹선형으로 펴면 격자 모서리가 각지게 보인다.
      // 스무드스텝으로 가중치만 부드럽게 한다 — 값을 만들지 않고 사이를 잇는 방식만 바꾼다.
      const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty);
      const c = (v00 + (v10 - v00)*sx) * (1 - sy) + (v01 + (v11 - v01)*sx) * sy;
      const [r, gg, b] = tempColor(c);
      const o = (y*W + x) * 4;
      d[o] = r; d[o+1] = gg; d[o+2] = b; d[o+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  tempTex.needsUpdate = true;
  return true;
}

/* 화면에 기온 숫자를 뿌린다. 윈디는 색만 깔지 않고 곳곳에 도(°)를 찍는다 —
   색을 눈금과 대조하지 않아도 바로 읽히는 게 그 차이다.
   격자에서 읽은 값이므로 도시 관측값이 아니라 그 자리의 격자값이다. */
/* ⚠️ 처음엔 고정 위경도 격자(10°×15°)에 숫자를 뒀는데, 지구를 키우니 그 점들이
   전부 화면 밖으로 나가 숫자가 하나도 안 보였다(50개 중 0개 통과).
   그래서 반대로 간다 — **화면 격자에서 지구로 역투영**한다. 배율이 얼마든
   화면에는 늘 같은 간격으로 숫자가 놓인다. 윈디가 하는 방식이다. */
const tempMarks = [];
const TN_STEP = 88;                     // 화면에서 숫자 사이 간격(px) — 이 값에 가장 가깝게 격자를 고른다
const TN_GRID = [1, 2, 5, 10, 15, 20, 30, 45];   // 고를 수 있는 위경도 간격(도)
function makeTempMarks(){
  if(tempMarks.length) return;
  for(let i = 0; i < 90; i++){          // 넉넉히 만들어 두고 쓸 만큼만 쓴다
    const el = document.createElement('div');
    el.className = 'tn'; el.style.visibility = 'hidden';
    stage.appendChild(el);
    tempMarks.push({ el });
  }
}

/* 화면 한 점을 지구 표면으로 쏜다. 맞으면 그 자리의 위경도를 돌려준다. */
const _ray = new THREE.Vector3(), _org = new THREE.Vector3();
function screenToLatLon(X, Y, w, h){
  _ray.set((X/w)*2 - 1, -(Y/h)*2 + 1, 0.5).unproject(camera);
  camera.getWorldPosition(_org);
  _ray.sub(_org).normalize();
  const b = 2 * _org.dot(_ray), c = _org.lengthSq() - 1;
  const disc = b*b - 4*c;
  if(disc < 0) return null;                        // 지구를 빗나갔다 (우주)
  const t = (-b - Math.sqrt(disc)) / 2;
  if(t < 0) return null;
  const hx = _org.x + _ray.x*t, hy = _org.y + _ray.y*t, hz = _org.z + _ray.z*t;
  // llToVec 의 역: x=-sin(p)cos(t), y=cos(p), z=sin(p)sin(t)
  const lat = 90 - Math.acos(Math.max(-1, Math.min(1, hy)))*180/Math.PI;
  const lon = Math.atan2(hz, -hx)*180/Math.PI - 180;
  return { lat, lon: ((lon + 540) % 360) - 180 };
}

/* 격자에서 그 자리의 기온을 읽는다 (색면과 같은 값·같은 자료) */
function tempAt(lat, lon){
  const src = dayIdx === 0 ? (WIND && WIND.t) : (LEADS && LEADS.tmax[dayIdx-1]);
  if(!src || !WIND) return null;
  const { nx, ny, res, lat0, lon0 } = WIND;
  const fy = (lat - lat0)/res, fx = ((((lon - lon0) % 360) + 360) % 360)/res;
  if(fy < 0 || fy > ny-1) return null;
  const y0 = Math.floor(fy), y1 = Math.min(y0+1, ny-1), ty = fy - y0;
  const x0 = Math.floor(fx) % nx, x1 = (x0+1) % nx, tx = fx - Math.floor(fx);
  const a = src[y0*nx+x0], b = src[y0*nx+x1], c = src[y1*nx+x0], d = src[y1*nx+x1];
  if(a == null || b == null || c == null || d == null) return null;
  return (a + (b-a)*tx)*(1-ty) + (c + (d-c)*tx)*ty;
}

/* ── 내 위치 ────────────────────────────────────────────────────
