version: '1.0'
engines:
- id: E01
  name: Source Ingestion & Raw Artifact Engine
  domain: FOUNDATION
  purpose: 공식/계약/공개 우주 데이터를 공급자별 정책을 지키며 수집하고 원문을 불변 저장한 뒤 정규화 파이프라인으로 전달한다.
  inputs:
  - provider selector
  - credentials reference
  - poll policy
  - source request metadata
  outputs:
  - RawArtifact
  - IngestionRun
  - NormalizedCandidateBatch
  deps: []
  storage:
  - data_source
  - ingestion_run
  - raw_artifact
  api:
  - /internal/providers/health
  - /internal/ingestion/runs
  tests:
  - duplicate raw hash dedupe
  - 429/backoff policy
  - partial parse quarantine
  - secret redaction
  - source outage stale behavior
  hooks:
  - E03 provenance
  - E06 snapshot
  - E38 orchestration
  ui:
  - 관리자 Provider Health
  - 일반 UI에는 OK/STALE/PARTIAL/UNAVAILABLE만 노출
  non_goals:
  - provider 응답을 곧바로 제품 상태로 간주하지 않음
  - API key를 로그/DB 평문으로 저장하지 않음
  intelligence_connection:
    mode: EVIDENCE_PROVIDER
    produces_intelligence_signal: true
    may_seed_event_candidate: false
    may_drive_event_revision: false
    may_affect_confidence: true
    may_affect_uncertainty: true
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: 원문·수집 상태를 Evidence로 제공. HTTP/parse 성공 자체가 Event가 아님.
- id: E02
  name: Canonical Object Identity Engine
  domain: FOUNDATION
  purpose: NORAD/COSPAR/provider alias를 단일 canonical object로 연결하고 행성·탐사선·발사체·로켓단·위성·파편까지 V2 공통 객체 식별체계를 유지한다.
  inputs:
  - provider object record
  - catalog_id
  - cospar_id
  - source alias
  - mission relation hints
  outputs:
  - CanonicalObject
  - ObjectAlias
  - IdentityConflict
  deps:
  - E01
  storage:
  - space_object
  - space_object_alias
  - identity_conflict
  api:
  - /v1/objects
  - /v1/objects/{id}
  tests:
  - 6+ digit catalog ID
  - same catalog renamed alias
  - COSPAR conflict quarantine
  - unknown origin not inferred
  - mission-created object handover
  hooks:
  - E07 knowledge graph
  - E19 mission handover
  - E25 genealogy
  ui:
  - Object Detail identity
  - 검색/필터
  non_goals:
  - 이름 유사도만으로 자동 merge 금지
  - OWNER/ORIGIN/SOURCE 혼합 금지
  intelligence_connection:
    mode: CONTEXT_ONLY
    produces_intelligence_signal: false
    may_seed_event_candidate: false
    may_drive_event_revision: false
    may_affect_confidence: false
    may_affect_uncertainty: false
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: canonical identity/alias context. 이름·ID 자체로 사건/신뢰도 판단 금지.
- id: E03
  name: Evidence & Provenance Engine
  domain: FOUNDATION
  purpose: 모든 관측·공식정보·파생계산·AI 신호·시뮬레이션 결과가 어디서, 언제, 어떤 버전으로 생성되었는지 증명 가능한 계보를 만든다.
  inputs:
  - raw artifact refs
  - engine result metadata
  - model/config version
  - license/access policy
  outputs:
  - EvidenceRecord
  - ProvenanceBundle
  - SourceGrade
  deps:
  - E01
  storage:
  - evidence
  - provenance_link
  - source_grade_registry
  api:
  - /v1/evidence/{id}
  - /v1/provenance/{id}
  tests:
  - missing source rejects intelligence promotion
  - hash chain reproducibility
  - source-grade separation
  - license policy propagation
  hooks:
  - E39 evidence fusion
  - E43 confidence
  - L06 claim validator
  ui:
  - Source drawer
  - Evidence badge
  - Data age
  non_goals:
  - 출처 없는 숫자를 제품 Intelligence로 승격하지 않음
  intelligence_connection:
    mode: EVIDENCE_PROVIDER
    produces_intelligence_signal: true
    may_seed_event_candidate: false
    may_drive_event_revision: false
    may_affect_confidence: true
    may_affect_uncertainty: true
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: provenance/source grade가 E39/E43의 근거가 되지만 독립 Event 생성 금지.
- id: E04
  name: Universal Space Time Engine
  domain: FOUNDATION
  purpose: Aetherus 전체에서 PAST/NOW/FUTURE를 단일 UTC 중심 시간축으로 관리하고 기록 시점, 관측 시점, 계산 시점, 시뮬레이션 시점을 구분한다.
  inputs:
  - UTC aware timestamps
  - time scale metadata
  - user local timezone
  - replay/scenario cursor
  outputs:
  - CanonicalTimeContext
  - TimelineCursor
  - TimeWindow
  deps: []
  storage:
  - time_context_manifest
  - timeline_bookmark
  api:
  - /v1/time/now
  - /v1/time/resolve
  tests:
  - naive datetime rejection
  - UTC/local roundtrip
  - replay deterministic cursor
  - future model vs archived state separation
  hooks:
  - E06 snapshot
  - E18 mission timeline
  - E41 events
  - E42 revisions
  ui:
  - Universal Time Bar
  - NOW reset
  - mission replay
  - scenario time comparison
  non_goals:
  - UTC/TAI/UT1 무표기 혼용 금지
  intelligence_connection:
    mode: CONTEXT_ONLY
    produces_intelligence_signal: false
    may_seed_event_candidate: false
    may_drive_event_revision: false
    may_affect_confidence: false
    may_affect_uncertainty: false
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: 시간축/epoch/replay context만 제공. 과학 중요도 판단 금지.
- id: E05
  name: Coordinate & Reference Frame Engine
  domain: FOUNDATION
  purpose: TEME/ITRF/GCRF/ICRF/heliocentric 등 서로 다른 좌표계를 명시적으로 변환하여 지구궤도부터 태양계까지 하나의 시각 경험으로 연결한다.
  inputs:
  - state vector
  - frame
  - time system
  - EOP/kernel version
  outputs:
  - TransformedState
  - GeodeticPosition
  - FrameProvenance
  deps:
  - E04
  storage:
  - frame_transform_manifest
  api:
  - /internal/frames/transform
  tests:
  - frame roundtrip tolerance
  - unsupported frame fail
  - EOP stale downgrade
  - solar/earth frame consistency fixture
  hooks:
  - E08 ephemeris
  - E20 orbit
  - E34 multiscale scene
  ui:
  - 좌표표시는 Research mode에서만 상세
  non_goals:
  - frame 미상 데이터를 임의 추정해 정밀 위치로 표시하지 않음
  intelligence_connection:
    mode: CONTEXT_ONLY
    produces_intelligence_signal: false
    may_seed_event_candidate: false
    may_drive_event_revision: false
    may_affect_confidence: false
    may_affect_uncertainty: true
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: 좌표/프레임 변환 context. 변환 품질은 uncertainty 입력이 될 수 있으나 사건 생성 금지.
- id: E06
  name: Digital State / Snapshot / Version Engine
  domain: FOUNDATION
  purpose: 특정 시각의 현실·모델·재구성·시나리오 상태를 불변 Snapshot으로 저장하고 새 데이터가 들어와도 과거 상태를 덮어쓰지 않는다.
  inputs:
  - canonical objects
  - evidence refs
  - engine outputs
  - time context
  outputs:
  - DigitalState
  - SnapshotManifest
  - VersionLineage
  deps:
  - E02
  - E03
  - E04
  storage:
  - digital_state
  - snapshot_manifest
  - state_version
  api:
  - /v1/states/{id}
  - /v1/snapshots/{id}
  tests:
  - append-only state
  - same input deterministic hash
  - archived vs reconstructed label
  - baseline snapshot immutability
  hooks:
  - E41 event
  - E42 revision
  - E31 benefit
  - E07 archive
  ui:
  - ARCHIVED STATE / RECONSTRUCTED STATE / NOW 표기
  non_goals:
  - 현재 데이터로 과거를 재계산한 값을 당시 실제 기록처럼 표시하지 않음
  intelligence_connection:
    mode: CONTEXT_ONLY
    produces_intelligence_signal: false
    may_seed_event_candidate: false
    may_drive_event_revision: true
    may_affect_confidence: true
    may_affect_uncertainty: true
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: snapshot/version lineage가 Revision 비교의 기준. 자체로 Event를 생성하지 않음.
- id: E07
