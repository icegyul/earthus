  domain: FOUNDATION
  purpose: Mission→Vehicle→Stage→Payload→Space Object→Orbit→Event→Evidence의 관계와 장기 이력을 연결하여 Aetherus의 우주 역사 그래프와
    Archive를 만든다.
  inputs:
  - canonical objects
  - mission records
  - event links
  - genealogy
  - snapshots
  outputs:
  - TypedRelation
  - ObjectLifeHistory
  - ArchiveIndex
  deps:
  - E02
  - E06
  storage:
  - object_relation
  - archive_index
  - collection_manifest
  api:
  - /v1/graph/{id}
  - /v1/archive/search
  tests:
  - typed relation source required
  - mission-to-object lineage
  - time-consistent traversal
  - unknown relation uncertainty
  hooks:
  - E19 mission handover
  - E25 genealogy
  - L04 context composer
