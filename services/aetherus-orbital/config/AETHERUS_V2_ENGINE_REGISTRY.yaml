    may_seed_event_candidate: false
    may_drive_event_revision: false
    may_affect_confidence: true
    may_affect_uncertainty: false
    may_be_invoked_by_intelligence: false
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: Mission/Object/Event 관계 context. 관계 provenance는 설명 근거가 될 수 있음.
- id: E08
  name: Solar System Ephemeris Engine
  domain: SPACE
  purpose: 태양·행성·달·선택 천체/탐사선의 현재/과거/미래 위치를 검증된 천문 ephemeris 소스로 계산해 Solar System Digital State를 제공한다.
  inputs:
  - ephemeris provider data
  - kernel/version
  - time range
  - target observer
  outputs:
  - CelestialState
  - EphemerisSeries
  - EphemerisProvenance
  deps:
  - E03
  - E04
  - E05
  storage:
  - celestial_object
  - celestial_ephemeris_cache
  api:
  - /v1/space/ephemeris
  - /v1/space/objects/{id}
