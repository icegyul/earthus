  name: Importance / Why-It-Matters / Attribution & Decision Intelligence Engine
  domain: INTELLIGENCE
  purpose: Event의 절대값·변화율·신뢰도·최근성·관련성·영향을 종합해 지금 볼 가치와 이유를 구조화하고, Scenario 결과의 Attribution/Decision Comparison을
    생성한다.
  inputs:
  - event revision
  - confidence/uncertainty
  - risk/mission/space context
  - scenario/benefit results
  - user relevance optional
  outputs:
  - ImportanceAssessment
  - WhyItMattersPacket
  - AttributionResult
  - DecisionComparison
  deps:
  - E31
  - E33
  - E43
  storage:
  - importance_assessment
  - attribution_result
  - decision_comparison
  api:
  - /v1/intelligence/important-now
  - /v1/intelligence/events/{id}/why
  - /v1/intelligence/scenarios/{id}/attribution
  tests:
  - importance reasons traceable
  - change rate can outrank static magnitude under policy
  - decision shows new risk
  - scenario assumptions surfaced
  - no single-option recommendation without policy
  hooks:
  - L04-L08
  - P04 alerts
  - all main UI
  ui:
  - WHY IT MATTERS
  - WHAT IF?
  - COMPARE
  - SPACE NOW
  non_goals:
  - 법적/운영상 자동 명령·공식 제거추천·확정 인과 증명으로 승격하지 않음
  intelligence_connection:
    mode: INTELLIGENCE_CORE
    produces_intelligence_signal: true
    may_seed_event_candidate: false
    may_drive_event_revision: true
    may_affect_confidence: true
    may_affect_uncertainty: true
    may_be_invoked_by_intelligence: true
    consumes_intelligence_for_presentation: false
    requires_signal_gate: false
    may_change_scientific_result_from_subscription_or_ui: false
    boundary_note: Importance/Why-it-matters/Attribution/Decision을 구조화. command/법적 결론 금지.
llm_modules:
- id: L01
  name: LLM Gateway
  purpose: OpenAI/Claude/Gemini/enterprise/local 등 모델 공급자를 교체 가능하게 추상화하고 Aetherus 지식의 source of truth를 모델 자체에 두지
    않는다.
- id: L02
  name: Model Router
  purpose: 질문 난이도·비용·지연·구독 등급에 따라 template/fast/standard/reasoning 경로를 선택한다.
- id: L03
  name: Tool Orchestrator
  purpose: LLM이 Aetherus API/Intelligence tool을 호출하도록 하되 과학 계산은 엔진에 위임하고 tool permission을 capability로 제어한다.
- id: L04
  name: Context Composer
  purpose: 질문과 현재 Universe State에 필요한 Event/Revision/Evidence만 최소 컨텍스트로 조립한다.
- id: L05
  name: Explanation Agent
  purpose: 같은 Intelligence Packet을 일반/애호가/연구자/운영자 수준별 설명으로 변환한다.
- id: L06
  name: Claim & Citation Validator
  purpose: LLM 문장의 핵심 주장마다 Evidence/ValidationState/AllowedClaim을 검사하고 근거 없는 위험·수치·확정 표현을 제거한다.
- id: L07
  name: Personal / Workspace Context
  purpose: Follow, Control Room, Collection, alert preference, role/capability를 질의 문맥에 제한적으로 연결한다.
- id: L08
  name: Briefing & Report Generator
  purpose: Daily Space Brief, Mission Brief, Event Report, Research/Scenario Report를 구조화된 Intelligence만으로 생성한다.
platform_services:
- id: S01
  name: API Gateway / Auth / Request Envelope
  purpose: request_id/generated_at/data_status/provenance/warnings 공통 envelope, auth, rate limit.
- id: S02
  name: Subscription Capability Service
  purpose: Free/Plus/Pro/Control/Operations/Removal의 capability 기반 권한; 코드 전역 plan 조건문 금지.
- id: S03
  name: Workspace / Widget / Control Room Service
  purpose: Personal/Team Control Room, adaptive widget layout, workspace templates.
- id: S04
  name: Follow / Alert Service
  purpose: Object/Mission/Event/Shell follow와 Revision/Confidence/Window 변화 기반 Intelligence alert.
- id: S05
  name: Search / Discovery Service
  purpose: object/mission/event/archive 통합 검색, canonical ID/alias 지원.
- id: S06
  name: Media / Live Stream Resolver
  purpose: 공식 영상/이미지/라이선스/stream embed metadata를 과학 상태와 분리 관리.
- id: S07
  name: Research Dataset / Benchmark Service
  purpose: versioned dataset, Parquet/CSV/JSON, hash/license manifest, benchmark reproducibility.
- id: S08
  name: Operations / Tenant / Audit Service
  purpose: private fleet, tenant isolation, audit, advisory-only operations.
- id: S09
  name: Job Queue / Scheduler
  purpose: ingest/propagate/screen/scenario/replay/report async jobs, idempotency, retries.
- id: S10
  name: Observability / Evidence Manifest
  purpose: metrics/logs/traces + phase evidence JSON. UI가 보이는 것과 제품 DONE을 분리.
- id: S11
  name: Security / License / Data Governance
  purpose: secret manager, provider terms, private ephemeris, retention, license access policy.
- id: S12
  name: Deployment / Backup / DR
  purpose: dev compose, staging, prod orchestration, backup restore, incident runbook.
