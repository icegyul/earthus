# AETHERUS Orbital — 로컬 개발 인프라 (ORB-P0)
# 출처: 823 codex/aetherus-v2-v06-integration @ 7ac0357 docker-compose.yml 기반.
# api 서비스는 코드 이식 전까지 제외 — 인프라(PostGIS·Redis)만 기동한다.
# 자격증명은 로컬 개발 전용이며 프로덕션에서 재사용하지 않는다.
services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: aetherus-postgres
    environment:
      POSTGRES_DB: aetherus
      POSTGRES_USER: aetherus
      POSTGRES_PASSWORD: aetherus_dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aetherus

  redis:
    image: redis:7-alpine
    container_name: aetherus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aetherus

  # 지시서 P0: S3 호환 객체 스토리지 (로컬은 MinIO 허용).
  # 로컬 파일시스템을 프로덕션 객체 스토리지로 취급하는 것은 금지 지름길이므로,
  # 어댑터가 실제 S3 계약을 상대로 검증될 수 있게 띄운다.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: aetherus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aetherus
      MINIO_ROOT_PASSWORD: aetherus_dev_password
    # 9000/9001 은 개발 머신에서 다른 도구가 흔히 선점한다(실측: 127.0.0.1:9000 을
    # 다른 프로세스가 이미 리슨 중이라 컨테이너 매핑이 가려졌다). 충돌이 적은
    # 9010/9011 로 노출하고, 기본 엔드포인트도 여기에 맞춘다.
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aetherus

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  aetherus:
    driver: bridge
