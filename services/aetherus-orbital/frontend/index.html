<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Aetherus — Orbital Observatory</title>
  <meta name="description" content="Aetherus Orbital Environment explore view. Every rendered position is propagated server-side from stored GP orbit solutions." />
  <link rel="stylesheet" href="/ui/css/aetherus.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2367e8f9' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%2367e8f9' stroke-width='1' opacity='.7'/%3E%3C/svg%3E" />
  <script type="importmap">
    {
      "imports": {
        "three": "/ui/vendor/three.module.js",
        "three/addons/": "/ui/vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app" class="app">
    <canvas id="scene" class="scene" aria-label="3D orbital scene. Rendered positions are propagated server-side from stored orbit solutions." role="img"></canvas>
    <div id="vignette" class="vignette" aria-hidden="true"></div>

    <header class="topbar" role="banner">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="currentColor" stroke-width="1" opacity=".65"/>
          <circle cx="27" cy="12" r="1.6" fill="currentColor"/>
        </svg>
        <div class="brand__text">
          <span class="brand__name">AETHERUS</span>
          <span class="brand__sub">Orbital Observatory · Explore</span>
        </div>
      </div>
      <div class="topbar__center">
        <div id="coverage" class="coverage" role="status"></div>
      </div>
      <div class="topbar__right">
        <div class="search">
          <label class="search__label" for="search-input">Search catalog</label>
          <input id="search-input" class="search__input" type="search" autocomplete="off"
                 placeholder="catalog ID or name" aria-describedby="search-hint" />
          <span id="search-hint" class="visually-hidden">Filters the ingested object list. Only objects present in the Aetherus catalog appear.</span>
        </div>
      </div>
    </header>

    <aside id="list-panel" class="list-panel" aria-label="Ingested object catalog">
      <div class="list-panel__head">
        <h2 class="list-panel__title">Catalog</h2>
        <span id="list-count" class="list-panel__count"></span>
      </div>
      <ul id="object-list" class="object-list" role="listbox" aria-label="Objects with stored orbit solutions"></ul>
      <p class="list-panel__note">Only objects ingested from CelesTrak / Space-Track appear here. No synthetic catalog is generated.</p>
    </aside>

    <section id="detail-panel" class="detail-panel" hidden aria-label="Object detail">
      <button id="detail-close" class="detail-panel__close" aria-label="Close object detail">✕</button>
      <div id="detail-body" class="detail-panel__body"></div>
    </section>

    <footer class="hud" role="contentinfo">
      <div id="legend" class="legend"></div>
      <div id="lod-indicator" class="lod-indicator" aria-live="polite"></div>
      <div id="time-control" class="time-control" hidden>
        <label class="time-control__label" for="time-slider">Orbit time cursor <span id="time-readout" class="time-control__readout"></span></label>
        <input id="time-slider" class="time-control__slider" type="range" min="0" max="0" step="1" value="0"
               aria-label="Move along the selected object's API-derived orbit line" />
      </div>
    </footer>

    <div id="state-overlay" class="state-overlay" role="alert" aria-live="assertive"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript>
    <div class="noscript">Aetherus Explore requires JavaScript. All rendered positions come from the
      <code>GET /api/v1/catalog/snapshot</code> and <code>GET /api/v1/objects/{id}/ephemeris</code> API endpoints.</div>
  </noscript>
  <script type="module" src="/ui/js/main.js"></script>
</body>
</html>
