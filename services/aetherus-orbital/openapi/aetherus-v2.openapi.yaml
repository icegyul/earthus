components:
  schemas:
    AssistantToolRequest:
      properties:
        tool_name:
          type: string
          title: Tool Name
        args:
          type: object
          title: Args
        allow_scientific_tool:
          type: boolean
          title: Allow Scientific Tool
          default: false
      type: object
      required:
      - tool_name
      title: AssistantToolRequest
    CandidateRankingRequest:
      properties:
        protected_active:
          type: boolean
          title: Protected Active
          default: true
        candidates:
          items:
            type: object
          type: array
          title: Candidates
        primary_state:
          anyOf:
          - type: object
          - type: 'null'
          title: Primary State
        encounter_states:
          items:
            type: object
          type: array
          title: Encounter States
        horizon_s:
          type: number
          maximum: 604800.0
          exclusiveMinimum: 0.0
          title: Horizon S
          default: 3600.0
        step_s:
          type: number
          maximum: 3600.0
          exclusiveMinimum: 0.0
          title: Step S
          default: 30.0
        risk_threshold_km:
          type: number
          maximum: 1000.0
          exclusiveMinimum: 0.0
          title: Risk Threshold Km
          default: 5.0
      type: object
      required:
      - candidates
      title: CandidateRankingRequest
    CitizenObservationRequest:
      properties:
        object_id:
          type: string
          title: Object Id
        observed_at:
          type: string
          format: date-time
          title: Observed At
        value:
          type: number
          title: Value
        license_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: License Policy
        expected_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Expected Min
        expected_max:
          anyOf:
          - type: number
          - type: 'null'
          title: Expected Max
      type: object
      required:
      - object_id
      - observed_at
      - value
      title: CitizenObservationRequest
    FragmentationRequest:
      properties:
        kind:
          type: string
          title: Kind
        target_object_ids:
          items:
            type: string
          type: array
          title: Target Object Ids
        protected_object_ids:
          items:
            type: string
          type: array
          title: Protected Object Ids
        parameters:
          type: object
          title: Parameters
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        fragment_count:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Fragment Count
          default: 20
        parent_state:
          type: object
          title: Parent State
        encounter_states:
          items:
            type: object
          type: array
          title: Encounter States
        horizon_s:
          type: number
          maximum: 604800.0
          exclusiveMinimum: 0.0
          title: Horizon S
          default: 3600.0
        step_s:
          type: number
          maximum: 3600.0
          exclusiveMinimum: 0.0
          title: Step S
          default: 30.0
        affected_distance_km:
          type: number
          maximum: 1000.0
          exclusiveMinimum: 0.0
          title: Affected Distance Km
          default: 5.0
      type: object
      required:
      - kind
      - target_object_ids
      - parent_state
      title: FragmentationRequest
    FrameTransformRequest:
      properties:
        position_km:
          prefixItems:
          - type: number
          - type: number
          - type: number
          type: array
          maxItems: 3
          minItems: 3
          title: Position Km
        velocity_km_s:
          prefixItems:
          - type: number
          - type: number
          - type: number
          type: array
          maxItems: 3
          minItems: 3
          title: Velocity Km S
          default:
          - 0.0
          - 0.0
          - 0.0
        frame:
          type: string
          title: Frame
        epoch_utc:
          type: string
          format: date-time
          title: Epoch Utc
        to_frame:
          type: string
          title: To Frame
      type: object
      required:
      - position_km
      - frame
      - epoch_utc
      - to_frame
      title: FrameTransformRequest
    GenealogyWriteRequest:
      properties:
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        origin:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin
        event_time_utc:
          type: string
          format: date-time
          title: Event Time Utc
        evidence_id:
          type: string
          title: Evidence Id
        known:
          type: boolean
          title: Known
          default: true
      type: object
      required:
      - event_time_utc
      - evidence_id
      title: GenealogyWriteRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ObservationPlanRequest:
      properties:
        candidates:
          items:
            type: object
          type: array
          title: Candidates
        mount_rate_limit_deg_s:
          type: number
          title: Mount Rate Limit Deg S
          default: 5.0
        object_state:
          anyOf:
          - type: object
          - type: 'null'
          title: Object State
        station:
          anyOf:
          - type: object
          - type: 'null'
          title: Station
        start_utc:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Utc
        end_utc:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Utc
        step_s:
          type: number
          maximum: 300.0
          exclusiveMinimum: 0.0
          title: Step S
          default: 30.0
        minimum_elevation_deg:
          type: number
          exclusiveMaximum: 90.0
          minimum: -5.0
          title: Minimum Elevation Deg
          default: 10.0
      type: object
      title: ObservationPlanRequest
    OperationJobRequest:
      properties:
        operation:
          type: string
          title: Operation
        payload:
          type: object
          title: Payload
        idempotency_key:
          type: string
          title: Idempotency Key
        run_now:
          type: boolean
          title: Run Now
          default: true
        max_attempts:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Max Attempts
          default: 3
      type: object
      required:
      - operation
      - idempotency_key
      title: OperationJobRequest
    PersonalContextUpdate:
      properties:
        context:
          type: object
          title: Context
      type: object
      title: PersonalContextUpdate
    PhotometryRequest:
      properties:
        times_s:
          items:
            type: number
          type: array
          title: Times S
        magnitudes:
          items:
            type: number
          type: array
          title: Magnitudes
        min_period_s:
          type: number
          title: Min Period S
          default: 1.0
        max_period_s:
          type: number
          title: Max Period S
