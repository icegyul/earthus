[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath =
    .
    packages/domain
    packages/intelligence
    packages/foundation
    packages/space
    packages/control
    packages/orbit
    packages/visual
    packages/llm
    packages/platform
    packages/providers
    packages/product
    packages/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    live_provider: makes a policy-controlled request to a real external provider
    e2e: drives a real browser against the running stack (requires playwright)
