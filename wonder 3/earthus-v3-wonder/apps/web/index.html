<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a0f19">
  <meta name="description" content="EARTHUS V3 WONDER — 아이의 손길로 지구가 살아나는 2.5D Paper Wonder Earth. PHASE 1 Paper Earth.">
  <title>EARTHUS WONDER · 종이 지구</title>
  <!-- 서비스워커 없음. 첫 화면은 지구 자료만 받는다(Master Directive §19). 캐릭터·랜드마크는 지역에 들어갈 때만.
       첫 그림을 앞당기려고 지구에 꼭 필요한 셋만 미리 받는다(모듈 그래프가 풀리기 전에 시작). -->
  <link rel="modulepreload" href="../../packages/shared/vendor/three/three-r184.module.min.js">
  <link rel="modulepreload" href="../../packages/shared/vendor/three/three.core.min.js">
  <link rel="preload" as="fetch" type="application/json" crossorigin href="../../content/geo/country-reference.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./earth.css">
</head>
<body>
  <div class="space" aria-hidden="true"></div>
  <main id="world" class="world" aria-label="EARTHUS WONDER 종이 지구">
    <canvas id="globe" tabindex="0" aria-label="종이 지구 — 끌어서 돌리고, 두 손가락으로 당겨 가까이 보고, 톡 누르면 그 지역으로 갑니다"></canvas>
  </main>

  <!-- Wonder Environment: 지역에 들어가면 종이가 펼쳐지는 층. 닫히면 숨김. -->
  <div id="env" class="env" hidden aria-label="지역 환경"></div>

  <header class="topbar">
    <div class="brand"><strong>EARTHUS</strong><span>WONDER</span></div>
    <nav class="crumbs" aria-label="어디에 있나">
      <button id="btnEarth" class="crumb crumb-earth" type="button" aria-label="지구로 돌아가기" hidden>🌍 지구</button>
      <span id="regionChip" class="crumb crumb-region" hidden></span>
      <button id="btnFart" class="crumb crumb-fart" type="button" hidden title="이 친구만 할 수 있는 장난">뿡</button>
    </nav>
    <div class="phase" id="phase">PHASE 1 · Paper Earth</div>
  </header>

  <div class="zoom" role="group" aria-label="가까이 · 멀리">
    <button id="btnZoomIn" type="button" aria-label="가까이">＋</button>
    <div id="zoomDots" class="zoom-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <button id="btnZoomOut" type="button" aria-label="멀리">－</button>
  </div>

  <p id="hint" class="hint" aria-live="polite">지구를 돌려 보고, 궁금한 곳을 톡 눌러 보세요</p>

  <footer class="foot">
    <label class="rm-label"><input type="checkbox" id="rm"> 움직임 줄이기</label>
    <span class="src">지도 자료: Made with Natural Earth (public domain)</span>
    <a class="devlink" href="./stage/">무대 (PHASE 0)</a>
  </footer>

  <pre id="log" class="log" aria-label="상태 기록"></pre>

  <script type="module" src="./src/earth-main.mjs"></script>
</body>
</html>
